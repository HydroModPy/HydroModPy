mesh_path = "C:\\codes\\HydroModPy-GH\\out\\sih_sloping_substratum_10deg_20260414\\validation\\investigate_slopi_62f9eb2d8a\\sloping_substratu_de581b6b00_92e37133\\mesh_bundle\\mesh_2d.msh"
bundle_dir = "C:\\codes\\HydroModPy-GH\\out\\sih_sloping_substratum_10deg_20260414\\validation\\investigate_slopi_62f9eb2d8a\\sloping_substratu_de581b6b00_92e37133\\mesh_bundle"
