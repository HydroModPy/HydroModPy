[simulation]
name = "LU hillslope drainage val"
description = "Synthetic steady-state unconfined flow with fixed heads, linear topography, and uniform top drainage."
run_id = "hillslope_surface_rch_20_modflownwt"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_hillslope_surface_rch_20"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "30.0 m"
nx = 40
ny = 3

[geographic.synthetic.topography]
kind = "linear"
base_elevation = 5.0
right_to_left_amplitude = 5.0

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "20.0 m"

[flow]
flow_regime = "steady"
active_sinks_sources = ["recharge"]
active_bc = ["east_side", "drainage"]
param_list = ["K"]

[flow.param]

[flow.param.K]

[flow.param.K.field]
id = "K"
kind = "homogeneous"

[flow.param.K.field_homogeneous]
value = "2e-05 m/s"

[flow.ic]
type = "custom"
value = "6.000000 m"

[flow.bc]

[flow.bc.dirichlet]

[flow.bc.dirichlet.east_side]
type = "dirichlet"
value = "5.062500 m"

[flow.bc.cauchy]

[flow.bc.cauchy.drainage]
application_domain = "top"
type = "cauchy"
value = "1e-05 m2/s"

[flow.sinks_sources]

[flow.sinks_sources.recharge]
first_clim = "mean"

[modflownwt]

[modflownwt.sgrid]

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 40
ny = 3
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false

[data]
types = ["recharge"]
inference_mode = "warn"

[data.recharge]

[[data.recharge.sources]]
source = "synthetic"
values = [2.0]
runoff_ratio = 0.0
