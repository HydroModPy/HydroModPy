# HydroModPy environment file for conda users
# Usage:
#     conda env create -f environment.yml
#     conda activate hydromodpy

name: hydromodpy
channels:
    #- conda-forge
    - defaults
dependencies:
    # Obvious
    - python=3.8.10
    - ipykernel
    - pip
    - pip:
        - hydroeval
        - geopy
        - pyproj
        - contextily
        - colormap #pip install easydev may be necessary
        - matplotlib-scalebar
        - whitebox
        - xarray-simlab # Required for FastScape, and called 'xsimlab' in the code
        - flopy
        - deepdish
        - vedo
        - fastscape
    # Main processing libraries
    #- numpy
    - gdal    
    # H5 files
    - pytables
    - netCDF4
    # Data reading/writing and conversion
    - pandas
    - geopandas 
    # rtree failled the import of geopandas: 'conda install pygeos --channel conda-forge' and 'pip uninstall rtree'
    - imageio=2.9.0
    - rasterio # 
    - pyshp # corresponds to 'shapefile' library in the code
    - selenium
    
    # Post-processing
    - matplotlib
 

    # Viewing notebooks
    - jupyter
    - jupyterlab
    - spyder
    
    
