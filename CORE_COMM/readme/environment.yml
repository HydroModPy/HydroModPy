# HydroModPy environment file for conda users
# Usage:
#     conda env create -f environment.yml
#     conda activate hydromodpy

name: hydromodpy
channels:
    - conda-forge
    - defaults
dependencies:
    # Obvious
    - python=3.8

    # Main processing libraries
    - numpy
    - whitebox
    - gdal
    - flopy
    - fastscape
    - xarray-simlab # Required for FastScape, and called 'xsimlab' in the code

    #H5 files
    - pytables
    - deepdish
    - netCDF4

    # Data reading/writing and conversion
    - pandas
    - geopandas #rtree failled the import of geopandas: 'conda install pygeos --channel conda-forge' and 'pip uninstall rtree'
    - imageio
    - rasterio
    - pyshp # corresponds to 'shapefile' library in the code
    - selenium
    
    # Post-processing
    - matplotlib
    - hydroeval

    # Viewing notebooks
    - jupyter
    - jupyterlab
    - spyder