[chronicle]
# Synthetic forcing and "true" reservoir parameters.
n_days = 365
start_year = 2000
target_annual_precip_mm = 800.0
precip_seed = 42
runoff_coeff = 0.15
losses_mm_day = 1.5
losses_months = [4, 5, 6, 7, 8, 9]
capacity_mm_true = 10.0
k_per_day_true = 0.04
s0_mm = 0.0
error_fraction = 0.05
error_seed = 12345

[calibration]
# Objective metric: "nse", "nse_log", or "kge"
objective_metric = "kge"
# Method: "grid_search", "random_search", "nelder_mead", "simplex", or "da_mh_gp"
global_method = "da_mh_gp"

[bounds]
# Bounds for calibrated parameters C [mm] and k [1/day].
C = [5.0, 15.0]
k = [0.02, 0.06]

[calibration_method.grid_search]
n_per_dim = [80, 80]
log_scale_indices = []

[calibration_method.random_search]
n_samples = 3000
seed = 2026
log_scale_indices = []

[calibration_method.nelder_mead]
max_iter = 1200

[calibration_method.simplex]
max_iter = 1500
xtol = 1.0e-10
ftol = 1.0e-10

[calibration_method.da_mh_gp]
n_init = 80
n_samples = 4000
burn_in = 800
thin = 4
proposal_scale = [0.5, 0.005]
sigma_noise = 0.02
prior_mean = [10.0, 0.04]
prior_std = [3.0, 0.02]
retrain_interval = 20
full_mh_prob = 0.05

[output]
output_dir = "outputs"
show_plot = true
# Optional fixed figure name:
# figure_name = "reservoir_calibration.png"
