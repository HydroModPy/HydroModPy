# ----------------------------------------------------------------------
# Initialization configuration for watershed project structure.
# ----------------------------------------------------------------------

[initializing]
# Name of the watershed/catchment (used as folder name).
# Type: string | REQUIRED
catch_name = "01S_short"

# Root output directory where all results will be stored.
# Type: string | REQUIRED
out_dir_path = "../results"

# Path to the input data folder (observations, climate, GIS layers, etc.).
# Type: string | REQUIRED
data_path = "data/"


# ----------------------------------------------------------------------
# Geographic configuration for watershed delineation.
# ----------------------------------------------------------------------

[geographic]
# Catchment definition mode.
# 'dem' = model domain from a raster DEM (from_dem required).
# 'txt' = model domain from an XYZ text file (from_dem, cell_size required).
# 'from_outlet_coord' = watershed from outlet coordinates (dem_path, x_outlet, y_outlet, snap_dist, buff_percent required).
# 'from_polyg_shp' = watershed from a polygon shapefile (dem_path, from_shp, buff_percent required).
# Type: Literal['dem', 'txt', 'from_outlet_coord', 'from_polyg_shp'] | one of: "dem", "txt", "from_outlet_coord", "from_polyg_shp" | REQUIRED
catch_def = "from_outlet_coord"

# Path to the regional DEM raster used for flow analysis.
# Required for 'xy' and 'shp' modes.
# Type: Union[str, NoneType] | Optional
dem_path = "data/regional dem.tif"

# Path to the DEM raster ('dem' mode) or XYZ text file ('txt' mode) that defines the model domain directly.
# Type: Union[str, NoneType] | Optional
# from_dem =

# Grid cell size in metres used to rasterise the XYZ point cloud.
# Required for 'txt' mode.
# Type: Union[float, NoneType] | Optional
# cell_size =

# X coordinate of the watershed outlet in the projected CRS.
# Required for 'xy' mode.
# Type: Union[float, NoneType] | Optional
x_outlet = 327816.965

# Y coordinate of the watershed outlet in the projected CRS.
# Required for 'xy' mode.
# Type: Union[float, NoneType] | Optional
y_outlet = 6777886.670

# Maximum snapping distance (m) used to move the outlet point to the nearest stream cell.
# Required for 'xy' mode.
# Type: Union[int, NoneType] | Optional
snap_dist = 150

# Buffer added around the watershed polygon, expressed as a percentage of sqrt(area [km²]).
# Required for 'xy' and 'shp' modes.
# Type: Union[float, NoneType] | Optional
buff_percent = 10.0

# Path to the watershed polygon shapefile.
# Required for 'shp' mode.
# Type: Union[str, NoneType] | Optional
# from_shp =

# Target projected CRS for all outputs (e.g.
# 'EPSG:2154').
# Optional: if not set, the CRS is derived from the input DEM.
# Applies to all modes.
# Type: Union[str, NoneType] | Optional
crs_project = "EPSG:2154"

# DEM depression correction method used for flow analysis.
# 'breach' (recommended) preserves natural flow paths.
# 'fill' raises sinks to the level of their pour point.
# Type: Literal['breach', 'fill'] | one of: "breach", "fill" | Default: "breach"
dem_correc_type = "breach"

# Path to a raster representing the aquifer bottom elevation.
# Must share the same grid as the model domain.
# Type: Union[str, NoneType] | Optional
# bottom_path =

# Folder containing pre-computed regional flow rasters (region_fill.tif, region_direc.tif, region_acc.tif, region_down.tif).
# When set, rasters are loaded from this folder instead of being recomputed.
# Type: Union[str, NoneType] | Optional
# reg_fold =
