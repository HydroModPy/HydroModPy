# ----------------------------------------------------------------------
# Flow-process configuration.
# ----------------------------------------------------------------------

[flow]
# Ordered list of flow-parameter identifiers used to build runtime parameters (for example ['K', 'Ss', 'Sy']).
# Type: list[str] | REQUIRED
param_list = []

# Mapping of flow-parameter identifiers to resolved FieldParamConfig payloads.
# Type: dict[str, dict] | REQUIRED
param = {}

# Mapping of flow boundary-condition payloads parsed from [flow.bc].
# Supported sections are: [flow.bc.dirichlet.<id>] with <id> in ocean, stream, north_side, south_side, east_side, west_side; [flow.bc.cauchy.drainage]; [flow.bc.robin.drainage]; and generic [flow.bc.<custom_id>] payloads.
# Common required key: value (numeric or '<value> <unit>').
# Dirichlet keys may omit application_domain when <id> implies it (for example west_side -> 'west side').
# Drainage (cauchy/robin) requires application_domain explicitly.
# Supported application_domain values are: top, north side, south side, east side, west side.
# Default units: m for dirichlet, m2/s for cauchy/robin.
# Type: dict[str, object] | REQUIRED
bc = {}

# Explicitly activated sink/source names for this flow run.
# Allowed values: 'recharge', 'wells'.
# An empty list means no sink/source package is assembled by the solver.
# Type: list[str] | REQUIRED
active_sinks_sources = []

# Explicitly activated boundary-condition ids for this flow run.
# Allowed values: 'ocean', 'stream', 'north_side', 'south_side', 'east_side', 'west_side', 'drainage'.
# An empty list means no boundary-condition package is assembled by the solver.
# Type: list[str] | REQUIRED
active_bc = []

# Global flow simulation regime used by solvers consuming [flow] (steady or transient).
# Type: Literal['steady', 'transient'] | one of: "steady", "transient" | Default: "transient"
flow_regime = "transient"


# Validated flow initial-condition structure parsed from [flow.ic].
# Stored as FlowInitialConditions(h=FlowInitialCondition).

# Hydraulic-head initial condition payload.

[flow.ic.h]
# id of the initial condition (ex: h0, etc.).
# Type: string | REQUIRED
id = ""

# Initial hydraulic-head value.
# Required when type='custom'.
# Type: float (optional) | Optional
value = 0.0

# Description of the initial condition.
# Type: string | Default: ""
description = ""

# Units of the initial condition.
# Type: string | Default: ""
units = ""

# Type of initial condition ('top', 'bottom', or 'custom').
# 'top' means a full aquifer, 'bottom' means an empty aquifer.
# Type: Literal['top', 'bottom', 'custom'] | one of: "top", "bottom", "custom" | Default: "custom"
type = "custom"


# Typed sinks/sources payload (for example pumping wells).

[flow.sinks_sources]
# Mapping of well ids to typed well payloads.
# Type: dict[str, FlowWellConfig] | REQUIRED
wells = {}


# Diffuse recharge (and optional EVT) configuration.
# None = zero recharge for all periods.

[flow.sinks_sources.recharge]
# Recharge payload: scalar, list (one per stress period), mapping {kper: value}, or runtime series.
# Type: Any | Default: 0.0
values = 0.0

# Optional raw data source for heterogeneous (2D per-cell) recharge.
# When set, the solver adapter discretizes FieldRecords onto the MODFLOW grid instead of using the scalar 'values' field.
# Expected: LoadResult with FieldRecords.
# Type: Any | Optional
heterogeneous_source = ""

# Period-0 policy when values is a sequence: 'mean' (series average), 'first' (first element), or a numeric scalar.
# Type: UnionType[str, float] | Default: "mean"
first_clim = "mean"

# Units of recharge values (informational only).
# Type: string | Default: "m/s"
units = "m/s"

# Route negative recharge to the EVT package and clip RCH to 0.
# Ignored for mapping payloads.
# Type: bool | Default: true
negative_to_evt = true

# How to interpret spatial data: 'auto' (points→homogeneous, fields→heterogeneous), 'homogeneous' (force spatial averaging), 'heterogeneous' (force per-cell discretization, including point-to-grid interpolation when stations have coordinates).
# Type: string | Default: "auto"
spatial_mode = "auto"

# Spatial interpolation method for gridded/point data onto the MODFLOW grid.
# Options: 'nearest', 'linear', 'idw'.
# Type: string | Default: "nearest"
interpolation_method = "nearest"


# ----------------------------------------------------------------------
# Transport-process configuration.
# ----------------------------------------------------------------------

[transport]
# Ordered list of sink/source identifiers that are explicitly activated for this process.
# An empty list means no sink/source is active.
# Concrete process configs (e.g.
# FlowConfig) validate the allowed values.
# Type: list[str] | REQUIRED
active_sinks_sources = []

# Ordered list of boundary-condition identifiers that are explicitly activated for this process.
# An empty list means no boundary-condition package is assembled.
# Concrete process configs (e.g.
