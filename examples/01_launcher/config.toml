sconc_input = 0.0

# Longitudinal dispersivity [L].
# Type: float | Default: 0.0
disp_long = 0.0

# Horizontal transverse dispersivity ratio.
# Type: float | Default: 0.0
disp_transh = 0.0

# Vertical transverse dispersivity ratio.
