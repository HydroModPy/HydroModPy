solver_engine = "modflownwt"


# ----------------------------------------------------------------------
# Expert-level MODFLOW configuration organized by concern.
# ----------------------------------------------------------------------

# MODFLOW runtime package options (NWT/DIS/BAS/UPW/EVT/OC/WEL/LMT).

[modflownwt.runtime]
# MODFLOW executable/version identifier passed to FloPy.
# Type: string | Default: "mfnwt"
mf_version = "mfnwt"

# Fortran unit number used for the MODFLOW list file.
# Type: int | Default: 2
mf_listunit = 2

# Enable verbose FloPy logging for model setup.
# Type: bool | Default: false
mf_verbose = false

# Head closure criterion for the NWT nonlinear solver.
# Type: float | Default: 0.0001
nwt_headtol = 0.0001

# Flux closure criterion for the NWT nonlinear solver.
# Type: float | Default: 500.0
nwt_fluxtol = 500.0

# Maximum outer nonlinear iterations in the NWT solver.
# Type: int | Default: 5000
nwt_maxiterout = 5000

# NWT wetting/thickness factor controlling nonlinear updates.
# Type: float | Default: 1e-05
nwt_thickfact = 1e-05

# Linear solver choice for NWT (see MODFLOW-NWT documentation).
# Type: int | Default: 1
nwt_linmeth = 1

# NWT print flag controlling iteration diagnostics in listing outputs.
# Type: int | Default: 1
nwt_iprnwt = 1

# NWT option for averaging saturated thickness at the cell bottom.
# Type: int | Default: 1
nwt_ibotav = 1

# NWT nonlinear option keyword (for example SIMPLE or COMPLEX).
# Type: string | Default: "COMPLEX"
nwt_options = "COMPLEX"

# If true, continue NWT iterations on partially converged stress periods.
# Type: bool | Default: false
nwt_continue = false

# NWT backtracking activation flag.
# Type: int | Default: 0
nwt_backflag = 0

# NWT backtracking stopping tolerance.
# Type: float | Default: 1e-10
nwt_stoptol = 1e-10

# DIS time unit code used by MODFLOW (ITMUNI).
# Type: int | Default: 0
dis_itmuni = 0

# BAS no-flow head sentinel value (HNOFLO).
# Type: float | Default: -9999.0
bas_hnoflo = -9999.0

# UPW dry-cell head output flag (IPHDRY).
# Type: int | Default: 1
upw_iphdry = 1

# UPW dry-cell head value (HDRY).
# Type: float | Default: -100.0
upw_hdry = -100.0

# UPW flag controlling VKA interpretation per layer (LAYVKA).
# Type: int | Default: 1
upw_layvka = 1

# EVT option code that defines how ET extinction depth is applied (NEVTOP).
# Type: int | Default: 3
evt_nevtop = 3

# EVT integer array selector used when NEVTOP requires layer indices (IEVT).
# Type: int | Default: 1
evt_ievt = 1

# EVT cell-by-cell budget output flag (IPAKCB).
# Type: int | Default: 1
evt_ipakcb = 1

# Enable compact budget format in OC outputs.
# Type: bool | Default: true
oc_compact = true

# WEL cell-by-cell budget output flag (IPAKCB).
# Type: int | Default: 1
wel_ipakcb = 1

# LMT output filename used to couple MODFLOW to MT3DMS.
# Type: string | Default: "mt3d_link.ftl"
lmt_output_file_name = "mt3d_link.ftl"

# LMT package filename extension.
# Type: string | Default: "lmt8"
lmt_extension = "lmt8"

# LMT file format (typically 'formatted' or 'unformatted').
# Type: string | Default: "unformatted"
lmt_output_format = "unformatted"


# Process-specific package controls (currently UPW/EVT knobs).

[modflownwt.process_specific]
# Vertical hydraulic conductivity control passed to the UPW package (VKA).
# Type: float | Default: 1.0
vka = 1.0

# Extinction depth [L] used by the EVT package (EXDP).
# Type: float | Default: 1.0
exdp = 1.0


# Optional spatial-grid payload split into `[...sgrid.planar]` and `[...sgrid.vertical]`.

# Planar discretization of the solver grid.

[modflownwt.sgrid.planar]
# Planar solver-grid mode: keep the native domain support or resample to an explicit (ny, nx) target shape.
# Type: Literal['keep_native', 'resample_to_shape'] | one of: "keep_native", "resample_to_shape" | Default: "keep_native"
mode = "keep_native"

# Target number of columns when planar mode is 'resample_to_shape'.
# Type: int (optional) | >= 1 | Optional
nx = 1

# Target number of rows when planar mode is 'resample_to_shape'.
# Type: int (optional) | >= 1 | Optional
ny = 1

# Resampling rule applied when planar mode is 'resample_to_shape'.
# Type: Literal['bilinear', 'average', 'nearest'] | one of: "bilinear", "average", "nearest" | Default: "bilinear"
resampling = "bilinear"


# Vertical layering of the solver grid.

[modflownwt.sgrid.vertical]
# Vertical-layering strategy.
# Type: Literal['constant', 'decay', 'list'] | one of: "constant", "decay", "list" | Default: "constant"
genmtd_lay = "constant"

# Number of layers (required for constant/decay, ignored for list).
# Type: int (optional) | Default: 1
nlay = 1

# Decay exponent (>1) for decay layering.
# Type: float (optional) | Optional
lay_decay = 0.0

# Explicit layer fractions when genmtd_lay='list' (must sum to 1).
# Type: list (optional) | Optional
lay_proportions = []

# No-data sentinel value.
# Type: float | Default: -9999.0
nodata = -9999.0


# Optional temporal discretization payload as one validated `TMeshConfigModel` model.
# In launcher mode, stress periods are driven by [simulation.time]; this section is mirrored for compatibility and mainly keeps `firstpersteady`.

[modflownwt.tgrid]
# Time unit used to interpret lenper values.
# In launcher mode stress periods come from [simulation.time], so this field is mirrored only for compatibility.
# Type: string | Default: "d"
itmuni = "d"

# Flow regime used to derive the steady/transient stress-period flags.
# In launcher mode this field is generally derived from [flow].flow_regime.
# Type: Literal['steady', 'transient'] | one of: "steady", "transient" | Default: "transient"
flow_regime = "transient"

# Temporal generation method.
# In launcher mode stress periods come from [simulation.time], so this field is mirrored only for compatibility.
# Type: Literal['synthetic_regular', 'from_chron'] | one of: "synthetic_regular", "from_chron" | Default: "synthetic_regular"
genmtd = "synthetic_regular"

# Stress-period count.
# In launcher mode this is mirrored from [simulation.time] and is not the authoritative source.
# Type: int | Default: 1
nper = 1

# Stress-period length(s) interpreted with itmuni.
# Scalar means one regular step length repeated nper times; list means one explicit value per stress period.
# In launcher mode this is mirrored from [simulation.time] and is not the authoritative source.
# Type: UnionType[float, int, list, list, NoneType] | Default: 1
lenper = 1

# Chronicle file path used when genmtd='from_chron'.
# In launcher mode this field is generally not used.
# Type: string (optional) | Optional
chron_path = ""

# Type: string | Default: "%Y-%m-%d %H:%M:%S"
chron_dateformat = "%Y-%m-%d %H:%M:%S"

# Type: string | Default: "	"
chron_colsep = "	"

# Type: string | Default: "Date"
chron_time_col = "Date"

# Lower datetime bound used by the temporal mesh.
# In launcher mode this field is mirrored from [simulation.time] and is not the authoritative source.
# Type: Any (optional) | Optional
start_datetime = ""

# Upper datetime bound used by the temporal mesh.
# In launcher mode this field is mirrored from [simulation.time] and is not the authoritative source.
# Type: Any (optional) | Optional
end_datetime = ""

# Type: bool | Default: true
firstpersteady = true

# Time-step multiplier per stress period (scalar or list).
# In launcher mode this field is currently forced to 1.0 and generally not intended for manual editing.
# Type: UnionType[int, float, list, list] | Default: 1
tsmult = 1

# Number of time steps per stress period (scalar or list).
# In launcher mode this field is currently forced to 1 and generally not intended for manual editing.
# Type: UnionType[int, list] | Default: 1
ntsp = 1

# Type: float | Default: -9999.0
temporal_nodata = -9999.0


