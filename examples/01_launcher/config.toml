# Constant aquifer thickness (m) applied below topography.
# Type: float | > 0.0 | Default: 50.0
thickness = 50.0


# ----------------------------------------------------------------------
# Top-level configuration for data-manager families.
# ----------------------------------------------------------------------

[data]
# Ordered list of data-manager types explicitly requested in [data].
# The launcher may append inferred types deduced from other sections (for example domain.zone_ids, flow.active_bc).
# Allowed values: 'etp', 'geology', 'humidity', 'hydrography', 'hydrometry', 'intermittency', 'oceanic', 'piezometry', 'precipitation', 'radiation', 'recharge', 'runoff', 'soil_moisture', 'temperature', 'water_quality', 'wind'.
# Type: list[str] | REQUIRED
types = []

# Policy applied when the planner infers types not explicitly listed in data.types.
# 'warn': keep inferred types and continue even if data.<type> is missing.
# 'strict': raise when an inferred type has no explicit data.<type> section (except geology, which can use its default typed config).
# Type: Literal['warn', 'strict'] | one of: "warn", "strict" | Default: "warn"
inference_mode = "warn"

# Reserved configuration mapping for hydrography data-manager.
# Type: dict (optional) | Optional
