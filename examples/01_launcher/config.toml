diffu_coeff = 0.0

# Reaction order for MT3DMS: None, 0, or 1.
# Type: int (optional) | Optional
# react_order =

# Decay rate value (can be overridden at runtime).
# Type: float | Default: 0.0
rate_decay = 0.0

# Enable concentration plotting outputs.
