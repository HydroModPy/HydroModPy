# ======================================================================
# HydroModPy Configuration
# Profile: expert | Modules: workspace, geographic, domain, data, flow, modflow
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Workspace configuration for watershed project structure.
# ----------------------------------------------------------------------

[workspace]
# Name of the watershed/catchment (used as folder name).
# Type: string | REQUIRED
catch_name = "example12"

# Root output directory where all results will be stored.
# Type: string | REQUIRED
out_dir_path = "../results"

# Path to the input data folder (observations, climate, GIS layers, etc.).
# Type: string | REQUIRED
data_path = "data/"


# ----------------------------------------------------------------------
# Geographic configuration for watershed delineation.
# ----------------------------------------------------------------------

[geographic]
# Catchment definition mode.
# 'txt' = model domain from an XYZ text file (dem_init_path, cell_size required).
# 'from_outlet_coord' = watershed from outlet coordinates (dem_init_path, x_outlet, y_outlet, snap_dist, buff_area required).
# 'from_polyg_shp' = watershed from a polygon shapefile (dem_init_path, polyg_shp_path, buff_area required).
# Type: Literal['dem', 'txt', 'from_outlet_coord', 'from_polyg_shp'] | one of: "dem", "txt", "from_outlet_coord", "from_polyg_shp" | REQUIRED
catch_def = "from_outlet_coord"

# Path to the DEM raster used as input.
# For 'dem' and 'txt' modes: defines the model domain directly.
# For 'from_outlet_coord' and 'from_polyg_shp' modes: regional DEM used for flow analysis.
# Type: Union[str, NoneType] | Optional
dem_init_path = "../../data/Brittany/dem/regional dem.tif"

# Grid cell size in metres used to rasterise the XYZ point cloud.
# Required for 'txt' mode.
# Type: Union[float, NoneType] | > 0 | Optional
# cell_size = 0.0

# X coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: Union[float, NoneType] | Optional
x_outlet = 265611.933

# Y coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: Union[float, NoneType] | Optional
y_outlet = 6784182.776

# Maximum snapping distance (m) to move the outlet to the nearest stream cell.
# Required for 'from_outlet_coord' mode.
# Type: Union[int, NoneType] | > 0 | Optional
snap_dist = 50

# Buffer around the watershed polygon as a percentage of sqrt(area [km²]).
# Required for 'from_outlet_coord' and 'from_polyg_shp' modes.
# Type: Union[float, NoneType] | > 0 | Optional
buff_area = 20.0

# Path to the watershed polygon shapefile.
# Required for 'from_polyg_shp' mode.
# Type: Union[str, NoneType] | Optional
# polyg_shp_path = ""

# Target projected CRS for all outputs (e.g.
# 'EPSG:2154').
# If not set, derived from the input DEM.
# Type: Union[str, NoneType] | Optional
crs_project = "EPSG:2154"

# DEM depression correction method.
# 'breach' (recommended) preserves natural flow paths.
# 'fill' raises sinks to their pour point.
# Type: Literal['breach', 'fill'] | one of: "breach", "fill" | Default: "breach"
dem_correc_type = "breach"

# Path to a raster representing the aquifer bottom elevation.
# Must share the same grid as the model domain.
# Type: Union[str, NoneType] | Optional
# bottom_path = ""

# Folder with pre-computed regional flow rasters.
# When set, rasters are loaded instead of recomputed.
# Type: Union[str, NoneType] | Optional
# reg_fold =


# ----------------------------------------------------------------------
# Domain configuration.
# ----------------------------------------------------------------------

[domain]
# Ordered list of zone identifiers loaded in the domain.
# Supporte
#d values currently include: 'geology'.
# Type: list[str] | Default: []
zone_ids = ["geology"]


# ----------------------------------------------------------------------
# Domain vertical model configuration.
# ----------------------------------------------------------------------

[domain.depth_model]
# Depth-model type selector.
# Use 'constant_thickness' to define bottom as top-thickness.
# Type: Literal['constant_thickness', 'flat_substratum'] | one of: "constant_thickness", "flat_substratum" | Default: "constant_thickness"
type = "constant_thickness"

# Constant aquifer thickness (m) applied below topography.
# Used when type="constant_thickness".
# Type: float | > 0.0 | Default: 50.0
thickness = 50.0

# Flat substratum elevation (m) applied over the full domain.
# Used when type="flat_substratum".
# Must be strictly below topography on all DEM cells.
# Type: float | Default: 0.0
# substratum_elevation = 0.0


# ----------------------------------------------------------------------
# Data managers configuration.
# ----------------------------------------------------------------------

[data]
# Ordered list of active data-manager types.
# Allowed values: "geology", "hydrography", "hydrometry",
# "intermittency", "oceanic", "piezometry".
types = ["geology"]


# ----------------------------------------------------------------------
# Geology configuration (nested under [data.geology]).
# ----------------------------------------------------------------------

[data.geology]
# Identifier of the geology spatial field.
# Type: string | Default: "field_geology"
id = "field_geology"

# Path to the geology data directory.
# Type: path | Default: "data/France/geology"
geo_path = "../../data/France/geology"

# Geology shapefile name inside `geo_path`.
# Type: string | Default: "GEO1M.shp"
types_obs = "GEO1M.shp"

# Attribute field used to encode geology classes.
# Type: string | Default: "CODE_LEG"
fields_obs = "CODE_LEG"

# Sub-sampling density passed to geology_field.on_mesh(...).
# Higher values improve interface resolution but increase runtime.
# Type: int | >= 2 | Default: 8
cell_samples_per_axis = 8

# Optional land/sea activation flag used by the legacy geology workflow.
# Set to true to enable sea-specific processing.
# Type: bool (optional) | Optional
# landsea =


# ----------------------------------------------------------------------
# Hydrometry configuration (new StationSet-based)
#
# Notes for local mode:
# - station loading needs station CSV files in source.local_data_dir
# - mask loading requires local reference tables:
#   stations_info.csv (preferred) or metadata.csv with WGS84 coordinates
#
# from the Hub'Eau API, replacing the old shapefile-based Hydrometry class.
# ----------------------------------------------------------------------

[hydrometry_stations]
variable = "QmnJ"
display = false
# Optional date filter (comment out to load all available data):
# date_start = "2019-01-01"
# date_end = "2025-12-31"

[hydrometry_stations.source]
# "api" fetches from Hub'Eau; "local" reads previously exported CSVs
mode = "api"
# Used when source.mode = "local":
# local_data_dir = "hydrometry_exports"

[hydrometry_stations.selection]
# "mask" = select stations inside a geographic boundary (watershed shapefile)
# "stations" = explicit list of station IDs
mode = "mask"

# Used when selection.mode = "stations"
# station_ids = ["J736422001"]

# Used when selection.mode = "mask"
# mask_path = "will be dynamically set from Geographic class"

[hydrometry_stations.output]
# Export loaded data again after loading (filtered subset):
enabled = true
path = "C:/Users/EMB/HydroModPy/examples/results/example12/results_stable/hydrometry"
# "lite" -> station CSVs only
# "full" -> station CSVs + metadata/stations_info/sites_info/missing_data_summary
export_mode = "lite"


# ----------------------------------------------------------------------
# Flow configuration
# ----------------------------------------------------------------------

# Structure identique a field_param_config:
# - [flow.param.<id>.field]
# - [flow.param.<id>.field_homogeneous] ou [flow.param.<id>.field_heterogeneous]
# - [flow.param.<id>.field_vertical_profile] (optionnel)
#
# Descriptions (Pydantic):
# - field.id: identifiant du parametre (ex: K, Sy, Ss).
# - field.kind: type de champ ("homogeneous" ou "heterogeneous").
# - field.unit: unite des valeurs de parametre (ex: "m/s", "-", "m-1").
# - field_homogeneous.value: valeur scalaire de surface.
# - field_heterogeneous.values_source: "inline" ou "csv".
# - field_heterogeneous.values: mapping cle->valeur (si values_source="inline").
# - field_heterogeneous.values_csv_file: chemin CSV (si values_source="csv").
# - field_heterogeneous.csv_key_column: colonne CSV des cles de zone.
# - field_heterogeneous.csv_value_column: colonne CSV des valeurs numeriques.
# - field_heterogeneous.field_spatial_id: id du champ spatial de correspondance.
# - field_vertical_profile.mode: "none" | "exponential" | "tabulated".
# - field_vertical_profile.characteristic_depth: profondeur caracteristique
#   pour exp(-depth/characteristic_depth) en mode exponential.
# - field_vertical_profile.min_factor: facteur plancher optionnel en mode
#   exponential (factor = max(exp(-depth/characteristic_depth), min_factor)).
# - field_vertical_profile.depths/factors/interpolation:
#   profile tabule (mode tabulated), interpolation "linear" ou "step".

# ----------------------------------------------------------------------
# K
# ----------------------------------------------------------------------

[flow.param.K.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
id = "K"
# Field type selector. Allowed values: 'homogeneous' or 'heterogeneous'.
kind = "homogeneous"
# Unit of parameter values. Typical examples: "m/s" (K), "-" (Sy), "m-1" (Ss).
unit = "m/s"

[flow.param.K.field_homogeneous]
# Scalar surface value used when kind='homogeneous'.
value = 4.32

[flow.param.K.field_heterogeneous]
# Source for heterogeneous values. Use 'inline' for TOML mapping or 'csv' for external table.
# values_source = "csv"
# Inline key/value mapping used when values_source='inline'.
# values = { granite = 10.0, micaschists = 2.0 }
# Path to CSV mapping file used when values_source='csv'. Relative paths are resolved from TOML directory.
# Full France correspondence table used by GeologyField demo:
# one entry per GEO1M class (plus SEA), columns: zone_key, K_value, geology_name.
# WARNING: dummy/demo dataset only (not a calibrated/authoritative hydrogeologic reference).
# values_csv_file = "../../data/France/geology/geology_K_dummy_demo.csv"
# CSV column name containing zone/material keys.
# csv_key_column = "zone_key"
# CSV column name containing numeric parameter values.
# csv_value_column = "K_value"
# Identifier of the spatial field used to map heterogeneous values.
# field_spatial_id = "field_geology"

[flow.param.K.field_vertical_profile]
# Depth dependency mode shared over the full domain.
mode = "exponential"
# Characteristic depth for exponential mode (factor = exp(-depth/characteristic_depth)).
characteristic_depth = 15.0
# Optional minimum factor floor for exponential mode:
# factor = max(exp(-depth/characteristic_depth), min_factor)
min_factor = 2e-4
# Depth nodes for tabulated mode (first value must be 0).
# depths = [0.0, 10.0, 30.0]
# Multiplicative factors aligned with depths (first value must be 1 at depth 0).
# factors = [1.0, 0.8, 0.5]
# Interpolation strategy for tabulated mode: "linear" or "step".
# interpolation = "linear"

# ----------------------------------------------------------------------
# Sy
# ----------------------------------------------------------------------

[flow.param.Sy.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
id = "Sy"
# Field type selector. Allowed values: 'homogeneous' or 'heterogeneous'.
kind = "homogeneous"
# Unit of parameter values. Typical examples: "m/s" (K), "-" (Sy), "m-1" (Ss).
unit = "-"

[flow.param.Sy.field_homogeneous]
# Scalar surface value used when kind='homogeneous'.
value = 0.02

[flow.param.Sy.field_heterogeneous]
# Source for heterogeneous values. Use 'inline' for TOML mapping or 'csv' for external table.
# values_source = "inline"
# Inline key/value mapping used when values_source='inline'.
# values = { zone1 = 0.15, zone2 = 0.08 }
# Path to CSV mapping file used when values_source='csv'. Relative paths are resolved from TOML directory.
# values_csv_file = "s_values.csv"
# CSV column name containing zone/material keys.
# csv_key_column = "zone_key"
# CSV column name containing numeric parameter values.
# csv_value_column = "value"
# Identifier of the spatial field used to map heterogeneous values.
# field_spatial_id = "field_square"

[flow.param.Sy.field_vertical_profile]
# Depth dependency mode shared over the full domain.
mode = "exponential"
# Characteristic depth for exponential mode (factor = exp(-depth/characteristic_depth)).
characteristic_depth = 30
# Optional minimum factor floor for exponential mode:
# factor = max(exp(-depth/characteristic_depth), min_factor)
min_factor = 5e-2
# Depth nodes for tabulated mode (first value must be 0).
# depths = [0.0, 10.0, 30.0]
# Multiplicative factors aligned with depths (first value must be 1 at depth 0).
# factors = [1.0, 0.8, 0.5]
# Interpolation strategy for tabulated mode: "linear" or "step".
# interpolation = "linear"

# ----------------------------------------------------------------------
# Ss
# ----------------------------------------------------------------------

[flow.param.Ss.field]
# Parameter identifier used in outputs and logs (for example 'K', 'Sy').
id = "Ss"
# Field type selector. Allowed values: 'homogeneous' or 'heterogeneous'.
kind = "homogeneous"
# Unit of parameter values. Typical examples: "m/s" (K), "-" (Sy), "m-1" (Ss).
unit = "m-1"

[flow.param.Ss.field_homogeneous]
# Scalar surface value used when kind='homogeneous'.
value = 1e-10

[flow.param.Ss.field_heterogeneous]
# Source for heterogeneous values. Use 'inline' for TOML mapping or 'csv' for external table.
# values_source = "inline"
# Inline key/value mapping used when values_source='inline'.
# values = { zone1 = 1e-10, zone2 = 5e-11 }
# Path to CSV mapping file used when values_source='csv'. Relative paths are resolved from TOML directory.
# values_csv_file = "ss_values.csv"
# CSV column name containing zone/material keys.
# csv_key_column = "zone_key"
# CSV column name containing numeric parameter values.
# csv_value_column = "value"
# Identifier of the spatial field used to map heterogeneous values.
# field_spatial_id = "field_square"

[flow.param.Ss.field_vertical_profile]
# Depth dependency mode shared over the full domain.
mode = "none"
# Characteristic depth for exponential mode (factor = exp(-depth/characteristic_depth)).
# characteristic_depth = 30.0
# Optional minimum factor floor for exponential mode:
# factor = max(exp(-depth/characteristic_depth), min_factor)
# min_factor = 1e-3
# Depth nodes for tabulated mode (first value must be 0).
# depths = [0.0, 10.0, 30.0]
# Multiplicative factors aligned with depths (first value must be 1 at depth 0).
# factors = [1.0, 0.8, 0.5]
# Interpolation strategy for tabulated mode: "linear" or "step".
# interpolation = "linear"


# ----------------------------------------------------------------------
# Flow initial conditions
# ----------------------------------------------------------------------

[flow.ic.h]
# Initial-condition type: "top", "bot" or "custom".
type = "top"
# Initial groundwater head value if type="custom".
value = 1.0
# Unit of initial head.
unit = "m"
# Optional human-readable description.
description = "Initial groundwater head"


# ----------------------------------------------------------------------
# Flow boundary conditions (Cauchy/Dirichlet/Neumann)
# ----------------------------------------------------------------------
# Supported [flow.bc.dirichlet] keys:
#   ocean, stream, north_boundary, south_boundary, east_boundary, west_boundary
# Note: no top_boundary key.

[flow.bc.cauchy.drainage]
# Domain of application on the model domain boundaries/surfaces.
# Allowed values: "top", "north side", "west side", "east side", "south side".
application_domain = "top"
# Boundary-condition type.
type = "cauchy"
# Conductance value for drainage (Cauchy condition). 
# if value = 0, conductance is related to hydraulic conductivity 
value = 0
# Unit of conductance.
unit = "m2/s"
# Optional flag to use data-derived values instead of fixed value.
data_value = false

[flow.bc.dirichlet.ocean]
application_domain = "top"
#Boundary-condition type.
type = "dirichlet"
# Head value for Dirichlet condition.
value = 1.0
# Unit of hydraulic head.
unit = "m"
# Optional flag to use data values (e.g. from oceanic) instead of a fixed value.
data_value = true

