# ----------------------------------------------------------------------
# MODFLOW expert configuration
# ----------------------------------------------------------------------

[modflow.runtime]
# MODFLOW executable/version identifier passed to FloPy.
mf_version = "mfnwt"
# Fortran unit number used for the MODFLOW list file.
mf_listunit = 2
# Enable verbose FloPy logging for model setup.
mf_verbose = false

# Head closure criterion for the NWT nonlinear solver.
nwt_headtol = 1e-4
# Flux closure criterion for the NWT nonlinear solver.
nwt_fluxtol = 500.0
# Maximum outer nonlinear iterations in the NWT solver.
nwt_maxiterout = 5000
# NWT wetting/thickness factor controlling nonlinear updates.
nwt_thickfact = 1e-5
# Linear solver choice for NWT.
nwt_linmeth = 1
# NWT print flag controlling iteration diagnostics in listing outputs.
nwt_iprnwt = 1
# NWT option for averaging saturated thickness at the cell bottom.
nwt_ibotav = 1
# NWT nonlinear option keyword.
nwt_options = "COMPLEX"
# If true, continue NWT iterations on partially converged stress periods.
nwt_continue = false
# NWT backtracking activation flag.
nwt_backflag = 0
# NWT backtracking stopping tolerance.
nwt_stoptol = 1e-10

# DIS time unit code used by MODFLOW (ITMUNI).
dis_itmuni = 0

# BAS no-flow head sentinel value (HNOFLO).
bas_hnoflo = -9999.0

# UPW dry-cell head output flag (IPHDRY).
upw_iphdry = 1
# UPW dry-cell head value (HDRY).
upw_hdry = -100.0
# UPW flag controlling VKA interpretation per layer (LAYVKA).
upw_layvka = 1

# EVT option code that defines how ET extinction depth is applied (NEVTOP).
evt_nevtop = 3
# EVT integer array selector used when NEVTOP requires layer indices (IEVT).
evt_ievt = 1
# EVT cell-by-cell budget output flag (IPAKCB).
evt_ipakcb = 1

# Enable compact budget format in OC outputs.
oc_compact = true

# WEL cell-by-cell budget output flag (IPAKCB).
wel_ipakcb = 1

# LMT output filename used to couple MODFLOW to MT3DMS.
lmt_output_file_name = "mt3d_link.ftl"
# LMT package filename extension.
lmt_extension = "lmt8"
# LMT file format.
lmt_output_format = "unformatted"

[modflow.process_specific]
# Vertical hydraulic conductivity control passed to the UPW package (VKA).
vka = 1.0
# Extinction depth used by the EVT package (EXDP).
exdp = 1.0

[modflow.sgrid]
# Length unit label propagated to FloPy (for example 'm').
lenuni = "m"
# Vertical-layering method.
genmtd_lay = "decay"
# Number of model layers for constant/decay layering.
nlay = 10
# Decay exponent (>1) for progressively thicker layers with depth.
lay_decay = 1.2
# No-data sentinel value used to mask invalid raster cells.
nodata = -9999.0

[modflow.tgrid]
# Time unit label propagated to FloPy (for example 'd').
itmuni = "days"
# Temporal simulation mode ("steady" or "transient").
sim_state = "transient"
# Temporal mesh generation method ("synthetic_regular" or "from_chron").
genmtd = "synthetic_regular"
# Number of stress periods.
nper = 12
# Length of each stress period when genmtd = "synthetic_regular".
lenper = 30.0
# Chronicle file path used when genmtd = "from_chron".
chron_path = "data/recharge_chronicle.tsv"
# Datetime format used to parse the chronicle time column.
chron_dateformat = "%Y-%m-%d %H:%M:%S"
# Column separator used in the chronicle file.
chron_colsep = "\t"
# Time-column name in the chronicle file.
chron_time_col = "Date"
# Optional explicit start datetime (leave commented to keep default None).
start_datetime = "2003-01-01 00:00:00"
# Optional explicit end datetime (leave commented to keep default None).
end_datetime = "2020-12-31 00:00:00"
# Keep first stress period in steady state when relevant.
firstpersteady = true
# Time-step multiplier per period (scalar or list).
tsmult = 1.0
# Number of time steps per period (scalar or list).
ntsp = 1
# No-data sentinel used for temporal arrays.
temporal_nodata = -9999.0
