# ----------------------------------------------------------------------
# Launcher-managed postprocess workflows.
# This section replaces legacy project-specific postprocess scripts.
# ----------------------------------------------------------------------
[postprocess]
# Master switch for launcher-managed postprocess after process-family runs.
# Keep false to disable optional postprocess tasks.
enabled = true

[postprocess.flow]
# Enable postprocess tasks after the flow process family.
enabled = true
# Run MatchingStreams diagnostics after flow outputs are produced.
matching_streams = true
# Run display.flow suite (guarded by [display] options).
display = true

[postprocess.flow.timeseries]
# Export flow timeseries after flow postprocess.
enabled = true
# Export datetimes when available.
datetime_format = true
# Also export subbasin-level timeseries.
subbasin_results = true

[postprocess.flow.netcdf]
# Export flow NetCDF files from _postprocess/*.npy.
enabled = false
# Export datetimes when available.
datetime_format = true

[postprocess.flow.intermittency]
# Intermittency aggregation levels.
yearly = false
monthly = true
weekly = false
daily = false

[postprocess.transport]
# Enable postprocess tasks after the transport process family.
enabled = true
# Run display.particles suite when Modpath outputs exist.
display_particles = true
# Run display.transport suite when concentration outputs exist.
display_transport = true

[postprocess.transport.timeseries]
# Export transport timeseries after transport postprocess.
enabled = true
# Historical suffix used by example12 launcher outputs.
suffix_name = "s1"
# Export datetimes when available.
datetime_format = true
# Also export subbasin-level timeseries.
subbasin_results = true
# Additional transport indicators.
residence_times = true
concentration_seepage = true
mass_accumulated = true

[postprocess.transport.netcdf]
# Export transport NetCDF files (flow + transport variables).
enabled = false
# Export datetimes when available.
datetime_format = true
# Additional transport indicators.
residence_times = true
concentration_seepage = true
mass_accumulated = true

[postprocess.transport.intermittency]
# Intermittency aggregation levels.
yearly = false
monthly = true
weekly = false
daily = false

# ----------------------------------------------------------------------
# Display configuration for reusable plotting options.
# This section is validated by hydromodpy.display.options.DisplayConfig
# and consumed by launcher postprocess display suites.
# ----------------------------------------------------------------------
[display]
# Master switch for all optional plotting features.
enabled = true
# Show interactive figures/windows when rendering is enabled.
show = true
# Save figures/animations to disk when rendering is enabled.
save = true
# Output resolution used when saving raster figures.
dpi = 300
# If true, honor HYDROMODPY_NO_DISPLAY=1 by forcing show=false in headless runs.
respect_env_no_display = true

[display.flow]
# Master switch for the flow plotting group.
enabled = true
# Render the flow cross-section plot.
cross_section = true
# Render the streamflow comparison plot.
streamflow = true
# Render the piezometry plot.
piezometry = true

[display.particles]
# Master switch for the particle plotting group.
enabled = true
# Render particle pathlines.
pathlines = true

[display.transport]
# Master switch for the transport plotting group.
enabled = true
# Render concentration plots.
concentration = true
# Export concentration GIF animation.
gif = true
# Export browser-friendly web animation for concentration outputs.
web_animation = true
