# Reduced MODFLOW-NWT / MODPATH / MT3DMS regression config.
# This normal-tier case stays shorter than config_extensive.toml while keeping
# the legacy solver family used by the extensive baseline.
[simulation]
name = "Example 12 launcher normal 3 months"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-03-31 00:00:00"
step_value = "30 day"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modpath", "mt3dms"]

[workspace]
catch_name = "example12"
out_dir_path = "../results"
data_path = "../../examples_legacy/example12/data/"

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "../../data/Brittany/dem/regional dem.tif"
x_outlet = 265611.933
y_outlet = 6784182.776
snap_dist = "50 m"
buff_area = "20%"
crs_project = "EPSG:2154"

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "50.0 m"

[data]
types = ["hydrography"]

[data.hydrography]
types_obs = ["botopage2024_naizin_streams_perennial-intermittent"]
fields_obs = ["FID"]

[data.oceanic]
msl_source = "local"
msl_local_csv = "data/oceanic/sealevel_shom_152_20030101_20030130_H.csv"
msl_use_simulation_time_window = true

[flow]
flow_regime = "transient"
active_sinks_sources = ["recharge", "wells"]
active_bc = ["ocean", "drainage"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
kind = "homogeneous"

[flow.param.K.field_homogeneous]
value = "5e-5 m/s"

[flow.param.K.field_vertical_profile]
mode = "exponential"
characteristic_depth = "15.0 m"
min_factor = 2e-4

[flow.param.Ss.field]
kind = "homogeneous"

[flow.param.Ss.field_homogeneous]
value = "1e-10 m-1"

[flow.param.Sy.field]
kind = "homogeneous"

[flow.param.Sy.field_homogeneous]
value = "0.02 -"

[flow.param.Sy.field_vertical_profile]
mode = "exponential"
characteristic_depth = "30.0 m"
min_factor = 5e-2

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "0.0 m2/s"

[flow.bc.dirichlet.ocean]
value = "1.0 m"
data_value = true

[flow.sinks_sources.wells.W1]
location_mode = "absolute_xy"
x = 265611.933
y = 6784182.776
units = "m3/day"

[flow.sinks_sources.wells.W1.forcing]
mode = "csv"
path_file = "data/wells/normal_wells_2003.csv"
date_column = "date"
date_format = "%Y-%m-%d"
value_column = "W1_m3_day"
aggregate = "mean"

[flow.sinks_sources.wells.W2]
location_mode = "relative_xy"
x_rel = 0.33
y_rel = 0.33
units = "m3/day"

[flow.sinks_sources.wells.W2.forcing]
mode = "csv"
path_file = "data/wells/normal_wells_2003.csv"
date_column = "date"
date_format = "%Y-%m-%d"
value_column = "W2_m3_day"
aggregate = "mean"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[recharge_chronicle]
mode = "synthetic_generated"

[recharge_chronicle.synthetic_generated]
generator = "seasonal_step"
generation_step = "30 day"
units = "mm/day"
runoff_ratio = 0.1

[recharge_chronicle.synthetic_generated.seasonal_step]
wet_months = [1, 2, 3, 4, 11, 12]
wet_value = "2.0 mm/day"
dry_value = "0.0 mm/day"

[transport.modpath.parameters]
zone_partic = "seepage_clip"
track_dir = "backward"

[transport.mt3dms.parameters]
spc_name = "NO3"
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[modflownwt.runtime]
dis_itmuni = 1

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 60
ny = 60

[modflownwt.sgrid.vertical]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2

[postprocess]
enabled = true

[display]
show = false

