# Same launcher simulation as config_normal_nwt.toml, reduced to active/effective inputs.

[simulation]
name = "Example 12 launcher normal 3 months"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-03-31 00:00:00"
step_value = "30 day"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modpath", "mt3dms"]

[workspace]
catch_name = "example12"
out_dir_path = "../results"
data_path = "../../examples_legacy/example12/data/"

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "../../data/Brittany/dem/regional dem.tif"
x_outlet = 265611.933
y_outlet = 6784182.776
snap_dist = "50 m"
buff_area = "20%"
crs_project = "EPSG:2154"

[domain]
support_mode = "none"

[data]
types = ["hydrography", "hydrometry"]
inference_mode = "warn"

[data.hydrography]
types_obs = ["botopage2024_naizin_streams_perennial-intermittent"]
fields_obs = ["FID"]

[data.oceanic]
msl_source = "local"
msl_local_csv = "data/oceanic/sealevel_shom_152_20030101_20030130_H.csv"
msl_use_simulation_time_window = true

[data.hydrometry]
use_simulation_time_window = true

[data.hydrometry.selection]
mode = "mask"

[data.hydrometry.output]
enabled = true

[flow]
flow_regime = "transient"
active_sinks_sources = ["recharge", "wells"]
active_bc = ["ocean", "drainage"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
kind = "homogeneous"

[flow.param.K.field_homogeneous]
value = "5e-5 m/s"

[flow.param.K.field_vertical_profile]
mode = "exponential"
characteristic_depth = "15.0 m"
min_factor = 2e-4

[flow.param.Ss.field]
kind = "homogeneous"

[flow.param.Ss.field_homogeneous]
value = "1e-10 m-1"

[flow.param.Sy.field]
kind = "homogeneous"

[flow.param.Sy.field_homogeneous]
value = "0.02 -"

[flow.param.Sy.field_vertical_profile]
mode = "exponential"
characteristic_depth = "30.0 m"
min_factor = 5e-2

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "0.0 m2/s"

[flow.bc.dirichlet.ocean]
value = "1.0 m"
data_value = true

[flow.sinks_sources.wells.W1]
cell = [0, 39, 39]
flux = [-200.0, -1000.0, -100.0]
units = "m3/day"

[flow.sinks_sources.wells.W2]
cell = [0, 20, 20]
flux = [0.0, -1000.0, 0.0]
units = "m3/day"

[flow.sinks_sources.recharge]

[recharge_chronicle]
mode = "synthetic_generated"

[recharge_chronicle.synthetic_generated]
generator = "seasonal_step"
generation_step = "30 day"
units = "mm/day"
runoff_ratio = 0.1

[recharge_chronicle.synthetic_generated.seasonal_step]
wet_months = [1, 2]
wet_value = "2.0 mm/day"
dry_value = "0.0 mm/day"

[transport.modpath.parameters]
zone_partic = "seepage_clip"
track_dir = "backward"

[transport.mt3dms.parameters]
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[modflownwt.sgrid.planar]
mode = "shape"
nx = 60
ny = 60
resampling = "bilinear"

[modflownwt.sgrid.vertical]
lenuni = "m"
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2
nodata = -9999.0
