[mesh_distribution]
# Example pointed at the bundled catchment example when `mesh/` lives next to
# `examples/mesh_viewer/` and `mesh_examples/` inside a standalone project.
bundle_dir = "../../mesh_examples/mesh_catchment_full_mnt_2km2_strahler3_target100km2_outlet_5/results_stable/mesh/gmsh/mesh_catchment_outlet_5_bundle"

# Optional output PNG written next to the example bundle.
figure_output_path = "../../mesh_examples/mesh_catchment_full_mnt_2km2_strahler3_target100km2_outlet_5/results_stable/mesh/gmsh/distribution_mesh_overview.png"

# Optional JSON summary written next to the example bundle.
summary_output_path = "../../mesh_examples/mesh_catchment_full_mnt_2km2_strahler3_target100km2_outlet_5/results_stable/mesh/gmsh/distribution_mesh_overview.json"

# Open or not an interactive matplotlib window at the end of the run.
show_window = true

[mesh_distribution.plot]
color_field = "geology_key"
color_map = "tab20"
figure_size = [16.0, 8.0]
dpi = 170
title = "Mesh structure and geology"
show_topography_panel = true
topography_field = "z_top_mean"
topography_cmap = "terrain"
topography_title = "Topography overview"
show_mesh_edges = true
mesh_edge_color = "0.30"
mesh_edge_linewidth = 0.65
show_boundaries = true
show_geology_interfaces = true
show_river_edges = true
annotate_cell_ids = false
