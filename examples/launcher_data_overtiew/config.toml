# ======================================================================
# HydroModPy Configuration (data-only example)
# launcher_data_overtiew: setup + domain + data loading, without process execution.
# ======================================================================

[workspace]
catch_name = "launcher_data_overtiew"
out_dir_path = "~/HydroModPy_outputs"
data_path = "data/"

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "data/regional dem.tif"
x_outlet = 127348.427
y_outlet = 6835802.564
snap_dist = "150 m"
buff_area = "20%"
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[domain]
zone_ids = ["geology"]

[domain.depth_model]
type = "constant_thickness"
thickness = "50.0 m"

[data]
types = ["geology", "hydrography", "hydrometry", "intermittency", "oceanic"]
inference_mode = "strict"

[data.geology]
id = "field_geology"
geo_path = "../../data/France/geology"
types_obs = "GEO1M.shp"
fields_obs = "CODE_LEG"
cell_samples_per_axis = 8

[data.hydrography]
[[data.hydrography.sources]]
source = "custom"
path = "data/regional stream network.shp"
rasterize_field = "FID"

[data.hydrometry]
date_start = "2019-01-01"
date_end = "2025-12-31"

[[data.hydrometry.sources]]
source = "hubeau"
product = "QmnJ"
extent = "watershed"
require_observations = true

[data.intermittency]
intermittency_path = "data/"
file_name = "regional onde stations.shp"

[data.oceanic]
date_start = "2003-01-01"
date_end = "2003-01-30"

[[data.oceanic.sources]]
source = "shom"
nearest = true
