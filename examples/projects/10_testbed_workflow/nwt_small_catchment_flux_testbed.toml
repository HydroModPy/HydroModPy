workflow = "testbed"

[testbed]
id = "nwt_small_catchment_flux"
subject = "flow"
purpose = "regional_site_flux_diagnostic"
base_config = "base_armorican_nwt_flux_transient.toml"
output_root = "outputs/nwt_small_catchment_flux"
execute = true
continue_on_error = true

[testbed.runner]
type = "simulation"
no_display = false

[[testbed.variant]]
id = "site_01"
label = "Site 01"
axis = "site"

[testbed.variant.overlay.workspace]
project_root = "outputs/nwt_small_catchment_flux/site_01_workspace"
root = "../.."

[testbed.variant.overlay.simulation]
name = "nwt_flux_site_01"
run_id = "nwt_flux_site_01"
description = "MODFLOW-NWT transient flux diagnostic on numbered Armorican outlet 01."
on_collision = "replace"

[testbed.variant.overlay.geographic]
x_outlet = 131189.100
y_outlet = 6833784.400

[testbed.variant.overlay.display]
output_dir = "outputs/nwt_small_catchment_flux/site_01_workspace/figures"

