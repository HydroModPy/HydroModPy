workflow = "testbed"

[testbed]
id = "mesh_resolution_testbed"
subject = "mesh"
purpose = "robustness"
base_config = "../06_vire_selune/run_vire_mf6_irregular.toml"
output_root = "outputs/mesh_resolution_testbed"
execute = false

[testbed.runner]
type = "mesh_catchment"

[[testbed.variant]]
id = "coarse"
axis = "resolution"

[testbed.variant.overlay.workspace]
project_root = "outputs/mesh_resolution_testbed/coarse_workspace"

[testbed.variant.overlay.mesh_catchment.zone_meshing]
global_size = 3500.0
min_size = 1800.0
max_size = 5200.0

[[testbed.variant]]
id = "reference"
axis = "resolution"

[testbed.variant.overlay.workspace]
project_root = "outputs/mesh_resolution_testbed/reference_workspace"

[testbed.variant.overlay.mesh_catchment.zone_meshing]
global_size = 2500.0
min_size = 1200.0
max_size = 4000.0

[[testbed.variant]]
id = "fine"
axis = "resolution"

[testbed.variant.overlay.workspace]
project_root = "outputs/mesh_resolution_testbed/fine_workspace"

[testbed.variant.overlay.mesh_catchment.zone_meshing]
global_size = 1600.0
min_size = 700.0
max_size = 2800.0

[[testbed.metric]]
name = "n_cells"

[[testbed.metric]]
name = "n_points"
