workflow = "simulation"

[workspace]
project_root = "outputs/nwt_small_catchment_flux/base_workspace"
root = "../.."
data_dir = "outputs/nwt_small_catchment_flux/data_cache"

[geographic]
source_mode = "standard"
catch_def = "from_outlet_coord"
dem_init_path = "../../data/dem/DEM_armorican_massif.tif"
x_outlet = 127348.427
y_outlet = 6835802.564
snap_dist = "150 m"
buff_area = "10%"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
reuse_existing_outputs = false

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 0.5
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "30.0 m"

[data]
project_crs = "EPSG:2154"
types = ["dem", "hydrography", "recharge"]
inference_mode = "warn"

[[data.dem.sources]]
source = "custom"
path = "../../data/dem/DEM_armorican_massif.tif"

[[data.hydrography.sources]]
source = "custom"
path = "../../data/hydrography/regional_stream_network.shp"
rasterize_field = "FID"

[data.recharge]
date_start = "2000-01-01"
date_end = "2002-12-31"

[[data.recharge.sources]]
source = "synthetic"
freq = "MS"
start_date = "2000-01-01"
periods = 36
values = [
  0.05, 0.05, 0.08, 0.15, 0.25, 0.35,
  0.65, 1.20, 2.20, 3.20, 4.00, 3.40,
  2.40, 1.40, 0.70, 0.30, 0.12, 0.05,
  0.02, 0.02, 0.02, 0.05, 0.10, 0.25,
  0.70, 1.80, 4.00, 5.00, 4.20, 2.00,
  0.80, 0.25, 0.08, 0.05, 0.05, 0.05,
]
runoff_ratio = 0.0

[flow]
flow_regime = "transient"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"

[flow.param.K.field_homogeneous]
value = "5e-5 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = "1e-5 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = "0.05 -"

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
id = "drainage"
type = "cauchy"
application_domain = "top"
description = "Cauchy drainage on the aquifer top face."
value = "0.0 m2/s"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[simulation]
name = "nwt_flux_armorican_base"
description = "Regional MODFLOW-NWT transient flux testbed base with synthetic monthly recharge."
on_collision = "replace"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[simulation.results]
keep_solver_files = false

[simulation.results.derived]
outflow_drain = true
accumulation_flux = true
watertable_depth = true
watertable_elevation = true

[simulation.results.budget]
spatial_fields = true

[display]
enabled = true
show = false
save = true
output_dir = "outputs/nwt_small_catchment_flux/base_workspace/figures"
figures = [
  "watershed_id_card",
  "piezometric_map",
  "water_budget",
]

[modflownwt.runtime]
mf_version = "mfnwt"
mf_verbose = false
nwt_options = "COMPLEX"
nwt_headtol = 1e-4
nwt_fluxtol = 500.0
nwt_maxiterout = 5000
nwt_continue = false
dis_itmuni = 4
evt_ipakcb = 1
wel_ipakcb = 1
oc_compact = true

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 80
ny = 80
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1
