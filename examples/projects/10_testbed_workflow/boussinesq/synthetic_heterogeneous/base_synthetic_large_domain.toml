base_config = "base_synthetic_patchy_mf6_bouss_transient.toml"
[workflow]
mode = "simulation"

[simulation]
name = "synthetic_patchy_large_domain_mf6_bouss_shared_case"
description = "Synthetic patchy 2D case on a larger square domain with rescaled geology for MF6 versus Boussinesq comparison."

[geographic.synthetic]
case_id = "synthetic_patchy_2d_large_domain"

[geographic.synthetic.grid]
length_x = "10050.0 m"
length_y = "10050.0 m"
nx = 100
ny = 100

[geographic.synthetic.topography]
right_to_left_amplitude = 40.0

[flow]
runtime_max_iterations = 1200
runtime_tol_residual_inf = 1.0e-2

[[data.geology.sources]]
source = "custom"
path = "synthetic_geology_zones_large.geojson"
code_field = "ZONE"

[mesh]
cell_size = 750.0
transition_distance = 900.0
