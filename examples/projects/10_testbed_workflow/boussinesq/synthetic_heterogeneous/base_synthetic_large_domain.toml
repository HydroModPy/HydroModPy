base_config = "base_synthetic_patchy_mf6_bouss_transient.toml"
workflow = "simulation"

[simulation]
name = "synthetic_patchy_large_domain_mf6_bouss_shared_case"
description = "Synthetic patchy 2D case on a larger square domain with rescaled geology for MF6 versus Boussinesq comparison."

[geographic.synthetic]
case_id = "synthetic_patchy_2d_large_domain"

[geographic.synthetic.grid]
length_x = "10050.0 m"
length_y = "10050.0 m"
nx = 100
ny = 100

[geographic.synthetic.topography]
right_to_left_amplitude = 40.0

[[data.geology.sources]]
source = "custom"
path = "synthetic_geology_zones_large.geojson"
code_field = "ZONE"

[mesh_catchment.geology.source]
path = "synthetic_geology_zones_large.geojson"
kind = "vector"
code_field = "ZONE"
reference_raster_path = "../../../../data/dem/conceptual_dem.tif"

[mesh_catchment.watershed_boundary]
boundary_refinement_distance = 600.0

[mesh_catchment.watershed_boundary.smoothing]
distance = 150.0

[mesh_catchment.watershed_boundary.outside_coarsening]
transition_distance = 900.0
grid_resolution = 900.0

[mesh_catchment.zone_meshing]
global_size = 750.0
min_size = 300.0
max_size = 1300.0
interface_size = 360.0
interface_distance = 900.0
interface_sampling = 96

[mesh_catchment.zone_meshing.refinement_policy.hotspot]
radius = 900.0
short_segment_length = 360.0
min_gap = 240.0
