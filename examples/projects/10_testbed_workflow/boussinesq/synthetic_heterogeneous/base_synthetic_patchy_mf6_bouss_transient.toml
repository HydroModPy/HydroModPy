[workflow]
mode = "simulation"

[workspace]
root = "../../../.."
data_dir = "../../outputs/boussinesq_synthetic_heterogeneous/data_cache"

[simulation]
name = "synthetic_patchy_mf6_bouss_shared_case"
description = "Shared synthetic patchy 2D recharge-response case for MF6 versus Boussinesq comparison."

[simulation.time]
start_datetime = "2020-09-01"
end_datetime = "2023-08-31"
step_value = "1 month"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[simulation.results]
keep_solver_files = false

[geographic]
source_mode = "synthetic"
reuse_existing_outputs = false

[geographic.synthetic]
case_id = "synthetic_patchy_2d"

[geographic.synthetic.grid]
length_x = "5025.0 m"
length_y = "5025.0 m"
nx = 67
ny = 67
xmin = 140024.9124
ymin = 6844483.9302
crs = "EPSG:2154"

[geographic.synthetic.topography]
kind = "linear"
base_elevation = 20.0
right_to_left_amplitude = 20.0

[domain]
[domain.supports.field_geology]
kind = "geology"

[domain.depth_model]
kind = "constant_thickness"
thickness = "80.0 m"

[data]
types = ["geology", "recharge"]
inference_mode = "warn"

[data.geology]
id = "field_geology"
cell_samples_per_axis = 8

[[data.geology.sources]]
source = "custom"
path = "synthetic_geology_zones.geojson"
code_field = "ZONE"

[data.recharge]
date_start = "2020-09-01"
date_end = "2023-08-31"

[[data.recharge.sources]]
source = "synthetic"
freq = "MS"
start_date = "2020-09-01"
periods = 36
values = [
  0.05, 0.15, 0.60, 1.40, 2.40, 2.80, 1.80, 0.80, 0.25, 0.05, 0.00, 0.02,
  0.02, 0.05, 0.20, 0.70, 1.50, 2.20, 1.00, 0.25, 0.05, 0.00, 0.00, 0.01,
  0.05, 0.20, 0.90, 2.20, 3.50, 2.70, 1.30, 0.45, 0.10, 0.02, 0.00, 0.03,
]
runoff_ratio = 0.0

[flow]
flow_regime = "transient"
runtime_backend = "petsc"
surface_interaction_model = "ts_vi_obstacle"
ts_vi_steps_per_period = 4
ts_vi_adapt = false
ts_vi_type = "beuler"
ts_vi_snes_type = "vinewtonrsls"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
param_list = ["K", "Ss", "Sy"]
runtime_max_iterations = 320
runtime_tol_residual_inf = 1.0e-6
runtime_tol_state_update_inf = 1.0e-8

[flow.param.K.field]
id = "K"
kind = "heterogeneous"
unit = "m/s"
values_source = "inline"
values = { west_low_k = "1e-5 m/s", central_high_k = "8e-5 m/s", east_medium_k = "3e-5 m/s" }
field_spatial_id = "field_geology"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"
value = "1e-5 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "heterogeneous"
unit = "-"
values_source = "inline"
values = { west_low_k = "0.04 -", central_high_k = "0.08 -", east_medium_k = "0.06 -" }
field_spatial_id = "field_geology"

[flow.ic]
type = "steady_state"
source = "mean_recharge"
recharge_statistic = "time_mean"
boundary_condition_policy = "first_period"

[flow.bc.drainage]
kind = "cauchy"
application_domain = "top"
description = "Synthetic top drainage without imposed lateral head."
value = "0.2 m2/s"

[flow.sinks_sources.recharge]
first_clim = "first"
negative_to_evt = true

[mesh]
engine = "voronoi"
cell_size = 450.0
outside_factor = 2.0
transition_distance = 450.0

[mesh.families]
rivers = "none"
watershed_boundary = "face"

[display]
enabled = false

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 1
lay_decay = 1.2
