base_config = "base_synthetic_patchy_mf6_bouss_transient.toml"
[workflow]
mode = "simulation"

[simulation]
name = "synthetic_patchy_small_domain_mf6_bouss_shared_case"
description = "Synthetic patchy 2D case on a smaller square domain with rescaled geology for MF6 versus Boussinesq comparison."

[geographic.synthetic]
case_id = "synthetic_patchy_2d_small_domain"

[geographic.synthetic.grid]
length_x = "2512.5 m"
length_y = "2512.5 m"
nx = 45
ny = 45

[geographic.synthetic.topography]
right_to_left_amplitude = 10.0

[[data.geology.sources]]
source = "custom"
path = "synthetic_geology_zones_small.geojson"
code_field = "ZONE"

[mesh]
cell_size = 300.0
transition_distance = 225.0
