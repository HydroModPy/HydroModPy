base_config = "base_nancon_physics.toml"
workflow = "simulation"

[workspace]
project_root = "outputs/nancon_network_physical_benchmark/workspaces/mf6_regular_120_drain_high"
root = "outputs/nancon_network_physical_benchmark/workspaces/mf6_regular_120_drain_high"

[simulation]
name = "nancon_network_physical_benchmark__mf6_regular_120_drain_high"
run_id = "nancon_network_physical_benchmark__mf6_regular_120_drain_high"
description = "MODFLOW 6 regular 120x120 Nancon benchmark with high top drainage conductance."
on_collision = "replace"

[flow.bc.cauchy.drainage]
value = "1.0e-3 m2/s"

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid.planar]
mode = "resample_to_shape"
nx = 120
ny = 120
resampling = "nearest"

[modflow6.sgrid.vertical]
nlay = 1

[modflow6.tgrid]
firstpersteady = false
