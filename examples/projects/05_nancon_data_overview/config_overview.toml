# Data provider: 'custom' for user CSV files, 'sim2' for SIM2 EDR API.
# Type: Literal['custom', 'sim2'] | one of: "custom", "sim2" | REQUIRED
source = "sim2"

# Radiation components: 'atmospheric' (DLI_Q) and/or 'visible' (SSI_Q).
# Type: list[Literal] | Default: ["atmospheric", "visible"]
# components = ["atmospheric", "visible"]

# Directory containing location file and chronicle CSVs.
# Type: path (optional) | Optional
# path = ""

# SHP/GPKG/GeoJSON/TIF mask to spatially filter stations or clip grid.
# Type: path (optional) | Optional
# mask_path = ""

# Explicit station ids (custom source).
# Type: list (optional) | Optional
# station_ids = []

# Enable bbox-based data retrieval using the project extent.
# Type: Literal (optional) | Optional
extent = "watershed"


# Soil moisture configuration (soil moisture index).

[data.soil_moisture]
# Project start date (ISO format, e.g.
# '2019-01-01').
# Type: string (optional) | Optional
# date_start = ""

# Project end date (ISO format, e.g.
# '2025-12-31').
# Type: string (optional) | Optional
# date_end = ""


# At least one data source.
[[data.soil_moisture.sources]]
# Data provider: 'custom' for user CSV files, 'sim2' for SIM2 EDR API.
# Type: Literal['custom', 'sim2'] | one of: "custom", "sim2" | REQUIRED
source = "sim2"

# Directory containing location file and chronicle CSVs.
# Type: path (optional) | Optional
# path = ""

# SHP/GPKG/GeoJSON/TIF mask to spatially filter stations or clip grid.
# Type: path (optional) | Optional
# mask_path = ""

# Explicit station ids (custom source).
# Type: list (optional) | Optional
# station_ids = []

# Enable bbox-based data retrieval using the project extent.
# Type: Literal (optional) | Optional
extent = "watershed"


# ----------------------------------------------------------------------
# Overview report settings (watershed identity card).
# ----------------------------------------------------------------------

[overview]
# Watershed name displayed on report panels.
# Defaults to workspace catch_name.
# Type: string | Default: ""
name = "Canut"

# Global start date (YYYY-MM-DD).
# Injected into data sections without explicit dates.
# Type: string (optional) | Optional
date_start = "2000-01-01"

# Global end date (YYYY-MM-DD).
# Injected into data sections without explicit dates.
# Type: string (optional) | Optional
date_end = "2025-12-31"


# Toggle individual report panels.

[overview.panels]
# DEM elevation map with stations overlay.
# Type: bool | Default: true
map_dem = true

# Geology lithology map.
# Type: bool | Default: true
map_geology = true

# River network map with Strahler orders.
# Type: bool | Default: true
map_hydrography = true

# Key watershed metrics card.
# Type: bool | Default: true
stats_card = true

# Observed discharge time series.
# Type: bool | Default: true
timeseries_discharge = true

# Observed piezometric levels time series.
# Type: bool | Default: true
timeseries_piezometry = true

# Mean monthly precipitation and ETP bars.
# Type: bool | Default: true
climatic_summary = true

# Table listing all stations (type, id, coordinates, period).
# Type: bool | Default: true
station_inventory = true
