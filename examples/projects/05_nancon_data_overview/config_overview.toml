    "geology",
    "hydrography",
    "hydrometry",
    "piezometry",
    "intermittency",
    "precipitation",
    "etp",
    "temperature",
    "recharge",
    "runoff",
    "wind",
    "humidity",
    "radiation",
    "soil_moisture",
