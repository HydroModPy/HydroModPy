# ======================================================================
# Ex02 — Advanced custom: unit conversion + constant stations.
# Hydrometry: CANUT01 (m3/s), CANUT_LS (L/s -> m3/s), CONST01 (constant)
# Piezometry: PIEZO01 (m), PIEZO_CM (cm -> m), PIEZO_CONST (constant)
# Water quality: WQ_NO3 (mg/L), WQ_UGL (ug/L -> mg/L), WQ_CONST (constant)
# ======================================================================
# Generated from Pydantic config export.


# ----------------------------------------------------------------------
# Top-level hydrometry configuration (list of sources).
# ----------------------------------------------------------------------

[hydrometry]
# Project start date (ISO format, e.g.
# '2019-01-01').
# Type: string (optional) | Optional
date_start = "1990-01-01"

# Project end date (ISO format, e.g.
# '2025-12-31').
# Type: string (optional) | Optional
date_end = "1990-12-31"


# At least one data source.
[[hydrometry.sources]]
# Data provider: 'custom' for user files, 'hubeau' for Hub'Eau API.
# Type: Literal['custom', 'hubeau'] | one of: "custom", "hubeau" | REQUIRED
source = "custom"

# Directory containing location file and chronicle CSVs.
# Type: path (optional) | Optional
path = "../../data/hydrometry"

# Explicit list of station ids to load.
# Type: list (optional) | Optional
station_ids = ["CANUT01", "CANUT_LS", "CONST01"]


# ----------------------------------------------------------------------
# Top-level piezometry configuration.
# ----------------------------------------------------------------------

