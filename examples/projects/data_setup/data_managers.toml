# ======================================================================
# HydroModPy -- data_managers config -- Canut catchment
# Workspace: examples/HydroModPy_Setup
# 
# Custom data : ../data/hydrometry/, ../data/piezometry/, ../data/water_quality/
# API cache :   ../data/<variable>/
# Spatial mask : ../data/masks/canut_bbox.geojson
