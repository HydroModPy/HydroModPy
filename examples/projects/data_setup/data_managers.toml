date_end = ""


# At least one data source.
[[piezometry.sources]]
# Data provider.
# Type: Literal['custom', 'hubeau'] | one of: "custom", "hubeau" | REQUIRED
source = "custom"

# Directory containing location file and chronicle CSVs.
