# Example 02: a conceptual relief, and the main features of HydroModPy on it.
#
# The domain is the whole DEM, 5 km by 5 km at 75 m, with no download. Steady
# state, a recharge that changes from cell to cell, an aquifer whose base
# mirrors the relief under sea level, ten layers, K in three bands of depth,
# seepage at the ground surface, and particles. MODFLOW 6 solves the flow and
# its PRT tracks the particles.
#
#   hmp run project.toml

[site]
name = "conceptual"

[workflow]
mode = "simulation"

[simulation]
name = "conceptual_example_02"
description = "Conceptual relief, steady state, recharge per cell, ten layers, K by depth, particle tracking."

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
kind = "transport"
solvers = ["modflow6_prt"]

# The domain is the DEM itself: each cell with an elevation is a cell of the
# model, and the others stay outside.
[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
kind = "dem"

# The base of the aquifer is the relief turned upside down under sea level,
# base = -top, so the aquifer is twice as thick as the ground is high, from
# 80 m under the valleys to 190 m under the hills. Ten layers, each one 1.2
# times thicker than the one above it.
[domain.depth_model]
kind = "raster_substratum"

[domain.layers]
genmtd_lay = "decay"
nlay = 10
lay_decay = 1.2

[data]
types = ["dem", "substratum", "recharge"]

[[data.dem.sources]]
source = "file"
path = "workspace:conceptual_dem.tif"

# The elevation of the base, -top in each cell.
[[data.substratum.sources]]
source = "file"
path = "workspace:conceptual_base.tif"

# One value per cell, drawn at random between 0 and 100 mm per month, 1.67
# mm/day on average.
[[data.recharge.sources]]
source = "file"
path = "workspace:recharge_conceptual.tif"
source_unit = "mm/day"

[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]

# Three bands of depth: 1e-5 m/s in the first 30 m, 1e-7 m/s down to 100 m,
# then 1e-8 m/s. Each layer takes the band of its base.
[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.K.field_vertical_profile]
kind = "tabulated"
interpolation = "step"
depths = [0.0, 30.0, 100.0]
factors = [1.0, 0.01, 0.001]
depth_at = "base"

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.1

# Every cell drains at the ground surface. The conductance follows K,
# C = K * cell area / 1 m.
[flow.bc.drainage]

[flow.sinks_sources.recharge]

# One particle in each cell, carried by the flow until it leaves the aquifer.
# The porosity is Sy.
[transport.modflow6_prt]
release_zone = "domain"
porosity = 0.1
release_times = [0.0]
stop_time = "10000 years"

# The figures land in runs/conceptual_example_02/figures/. Each one that
# applies and fails stops the run, so a broken figure cannot go unseen.
[display]
on_error = "raise"

[[display.figure]]
variable = "topography"
overlays = ["mesh", "outline"]

[[display.figure]]
variable = "recharge"
overlays = ["outline"]

# K from west to east through the middle of the relief.
[[display.figure]]
variable = "hydraulic_conductivity"
type = "section"
name = "conductivity_west_east"
line = [[140025.0, 6846996.0], [145050.0, 6846996.0]]
scale = "log"

[[display.figure]]
variable = "watertable_elevation"
overlays = ["outline"]

[[display.figure]]
variable = "watertable_depth"
overlays = ["seepage", "outline"]
limits = [0.0, 10.0]
line = [[140025.0, 6846996.0], [145050.0, 6846996.0]]

[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "section_west_east"
line = [[140025.0, 6846996.0], [145050.0, 6846996.0]]

# The seepage per unit area, then the flow it accumulates downstream.
[[display.figure]]
variable = "outflow_drain"
overlays = ["outline"]
limits = [0.0, 20.0]

[[display.figure]]
variable = "drain_accumulation_flux"
scale = "log"
overlays = ["outline"]

[[display.figure]]
preset = "particle_tracks"

[[display.figure]]
preset = "particle_tracks"
name = "particle_tracks_over_travel_time"
variable = "travel_time_to_exit"

[[display.figure]]
preset = "residence_time_distribution"

# What lands in runs/conceptual_example_02/exports/, ready for QGIS or a spreadsheet.

# The domain: GeoPackage.
[[export]]
variable = "watershed"

# The water table, its depth, the seepage cells and the drain flow: one GeoTIFF each.
[[export]]
variable = ["watertable_elevation", "watertable_depth", "seepage_mask", "outflow_drain"]
time = "first"

# The water budget: CSV.
[[export]]
variable = "budget"

# The particle tracks, one line per particle with its travel time in years: GeoPackage.
[[export]]
variable = "pathlines"
