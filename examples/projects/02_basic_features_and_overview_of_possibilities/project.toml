# HydroModPy - example 02: basic features and overview of possibilities
#
# A small conceptual DEM delineated from its outlet and solved steady with
# MODFLOW 6. Entirely offline, it exercises the standard figure set in under a
# second. run_manual.py sweeps the recharge to show the domain respond.
#
#   hmp run examples/projects/02_basic_features_and_overview_of_possibilities/project.toml

[workflow]
mode = "simulation"

[workspace]
project_root = "."


[simulation]
name = "conceptual_dem_mf6"
description = "Conceptual DEM domain, steady MODFLOW 6, full standard figure set."
if_exists = "replace"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
type = "transport"
solvers = ["modflow6_prt"]


[geographic]
crs_project = "EPSG:2154"

# Delineating from the lowest cell masks the DEM nodata border, which the
# direct catch_def = "dem" mode does not.
[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "conceptual_dem.tif"
x_outlet = 142687.4
y_outlet = 6849096.4
snap_dist = "150 m"
buff_area = "10%"


# An absolute base well under sea level, so the aquifer is thick under the highs
# and thin under the lows, the way the legacy example mirrored the topography.
[domain.depth_model]
kind = "flat_substratum"
substratum_elevation = "-78.0 m"


[data]
types = ["dem", "recharge"]

[[data.dem.sources]]
source = "custom"
path = "conceptual_dem.tif"

# mm/day. run_manual.py sweeps this for the dry / normal / wet cases.
[[data.recharge.sources]]
source = "synthetic"
values = [1.5]
runoff_ratio = 0.0


[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

# Two conductivity bands, not a decay: the weathered first 30 m conduct, the
# bedrock under them is a hundred times tighter.
[flow.param.K.field_vertical_profile]
mode = "tabulated"
interpolation = "step"
depths = [0.0, 30.0]
factors = [1.0, 0.01]

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.1

[flow.bc.drainage]
kind = "cauchy"


[transport.modflow6prt.parameters]
release_zone = "domain"
porosity = 0.1
max_particles = 250
release_times_days = [0.0]
track_time_step_days = 365.0
stop_time_days = 3650000.0


[modflow6.runtime]
mf6_ims_complexity = "MODERATE"

# Ten layers thickening with depth.
[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 10
lay_decay = 1.2


[display]
on_error = "raise"
figures = [
    "mesh_map",
    "recharge_map",
    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "accumulation_map",
    "particle_tracks",
    "residence_time_distribution",
    "cross_section",
    "parameter_section",
    "water_budget",
    "mass_balance_error",
]
