# The figures land in runs/hillslope_example_07/figures/. Each one that applies and fails
# stops the run, so a broken figure cannot go unseen. The line of a section runs along the
# one row of cells, from the stream at x = 0 to the closed edge at x = 1000 m.

[display]
on_error = "raise"

# Day 30, the last day of the pulse: the water table is at the ground over the eastern half
# and the aquifer drains there through the ground surface.
[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "section_end_of_pulse"
time = 30
line = [[0.0, 10.0], [1000.0, 10.0]]

# The last day, 970 days into the recession.
[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "section_end"
line = [[0.0, 10.0], [1000.0, 10.0]]

[[display.figure]]
preset = "water_budget"

# The closure error of the solver at each period, in percent.
[[display.figure]]
variable = "mass_balance.percent_error"
type = "series"

# What lands in runs/hillslope_example_07/exports/, ready for QGIS or a spreadsheet.

# The water budget: CSV.
[[export]]
variable = "budget"

# The water table at the end of the pulse and at the end of the run: GeoTIFF.
[[export]]
variable = ["watertable_elevation", "seepage_mask"]
time = ["2000-01-31", "last"]
