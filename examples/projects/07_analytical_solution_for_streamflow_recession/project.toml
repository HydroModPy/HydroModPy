# Example 07: a hillslope that drains by recession, set against a closed-form solution.
#
# A flat hillslope, 1000 m long and one 20 m cell wide, over a flat substratum, with a stream
# on its west edge. A 30-day pulse of recharge fills it, then 970 days without recharge
# empty it through the stream. The discharge of the falling limb is compared in the Python
# script with the late-time solution of the non-linear Boussinesq equation. MODFLOW 6 solves
# the flow.
#
#   hmp run project.toml

[workflow]
mode = "simulation"

[simulation]
name = "hillslope_example_07"
description = "Synthetic 1D hillslope, one pulse of recharge then a recession, transient."

# One stress period per day for 1000 days. The first one is steady, under the mean recharge.
[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-09-26"
step_value = "1 day"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

# No data file and no catchment: the domain is built, 1000 m by 20 m in 50 cells of 20 m,
# on one row. The ground is flat at 100 m.
[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "hillslope_1d"

[geographic.synthetic.grid]
length_x = "1000.0 m"
length_y = "20.0 m"
nx = 50
ny = 1

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 100.0

# The base of the aquifer is flat at 0 m, so the aquifer is 100 m thick. It is one layer, the
# depth-integrated aquifer of the Boussinesq solution. A stack of layers could not hold the
# stream: MODFLOW 6 refuses a fixed head below the bottom of a cell, and the stream head of
# 0 m lies below the bottom of every layer but the lowest.
[domain.depth_model]
kind = "flat_substratum"
substratum_elevation = "0.0 m"

[domain.layers]
nlay = 1

[flow]
flow_regime = "transient"
first_period_steady = true
param_list = ["K", "Sy", "Ss"]

# 0.33 m/day, ten times the 33 mm/day of the pulse.
[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 3.819444e-6

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# The stream is a fixed head of 0 m on the west edge, level with the base of the aquifer. The
# other edges are closed.
[flow.bc.west_side]
kind = "dirichlet"
value = "0.0 m"

# The water that reaches the ground drains there. The conductance follows K,
# C = K * cell area / 1 m.
[flow.bc.drainage]

# One value per day, ten per line. The first 30 days receive 33 mm/day and the 970 days
# after receive nothing. The steady first period takes the mean of the series, 0.99 mm/day.
[flow.sinks_sources.recharge]
units = "mm/day"
first_clim = "mean"
values = [
  33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0,
  33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0,
  33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0, 33.0,
