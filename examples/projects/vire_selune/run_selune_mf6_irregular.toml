base_config = "project_simulation.toml"

[workspace]
project_root = "outputs/selune_mf6_irregular"

[simulation]
name = "selune_mf6_irregular_demo"

[simulation.time]
start_datetime = "2020-01-01 00:00:00"
end_datetime = "2020-12-31 00:00:00"
step_value = "1 month"
coverage_policy = "warn"

[geographic]
x_outlet = 379541.3716
y_outlet = 6845659.878
buff_area = "20%"

[flow]
active_bc = []

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[mesh_catchment]
constraints_mode = "rivers_only"
output_layout = "flat"
figures_enabled = false
figure_dpi = 220
figure_regional_dpi = 180

[mesh_catchment.watershed_boundary]
enabled = true
boundary_refinement_distance = 500.0

[mesh_catchment.watershed_boundary.smoothing]
enabled = true
distance = 200.0
river_buffer_distance = 100.0
outer_bias_distance = 10.0

[mesh_catchment.watershed_boundary.outside_coarsening]
enabled = true
size_factor = 2.0
transition_distance = 680.0
grid_resolution = 680.0

[mesh_catchment.zone_meshing]
global_size = 1800.0
min_size = 900.0
max_size = 3000.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 800.0
interface_distance = 1400.0
interface_sampling = 96

[mesh_catchment.zone_meshing.refinement_policy]
enabled = true
mode = "grid_local_budget"

[mesh_catchment.zone_meshing.refinement_policy.grid]
neighborhood_rings = 1
enable_exact_gap_check = false
max_exact_gap_candidates = 128

[mesh_catchment.zone_meshing.refinement_policy.hotspot]
radius = 1400.0
max_curve_count = 180
max_family_count = 2
min_gap = 200.0
max_node_degree = 4
short_segment_length = 400.0
max_short_segment_count = 12

[mesh_catchment.zone_meshing.refinement_policy.families.river]
enabled = true
priority = 300

[mesh_catchment.zone_meshing.refinement_policy.families.watershed_boundary]
enabled = true
priority = 100

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false

[modflow6.tgrid]
firstpersteady = true

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 1
lay_decay = 1.2
