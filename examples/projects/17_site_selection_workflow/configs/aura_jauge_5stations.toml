# Purpose:
# Preview run for a small fixed set of Hub'Eau flow stations in
# Auvergne-Rhone-Alpes. The workflow loads the listed stations, uses their
# outlets as candidate basin outlets, and delineates catchments from the BD ALTI
# DEM.
# Expected result: quick HTML report plus selected/rejected tables and spatial
# layers for checking station evidence, basin contours, and geology warnings.

[workflow]
# Workflow entry point for `hmp run`.
# `site_selection` dispatches to the site-selection workflow.
mode = "site_selection"

[site_selection]
# Stable campaign id copied into manifests, decision tables, and downstream
# hand-off files.
selection_id = "aura_jauge_5stations_v1"
# Output directory for manifests, tables, spatial layers, reports, and optional
# intermediates.
output_root = "../outputs/aura_jauge_5stations_v1"

[site_selection.input]
# Execution path for this run.
# hydrometry loads stations from [hydrometry], uses station outlets as candidates,
# and infers the gauged_downstream_station selection profile.
mode = "hydrometry"

[site_selection.territory]
# Territory resolver mode.
mode = "admin_regions"
# Country code used by administrative territory modes.
country = "FR"
# Administrative regions used when mode='admin_regions'.
regions = ["Auvergne-Rhone-Alpes"]

[site_selection.dem]
# Data cache policy.
cache_policy = "use_cache_else_download"
# Margin around the DEM used for flow directions and basin contours, in kilometres.
delineation_buffer_km = 20.0
# Source used to build the DEM extent for flow direction, accumulation,
# outlet snapping, and basin delineation.
# 'selection_territory' loads the full configured territory and is safer when
# upstream basins may extend far from outlets.
# 'candidate_outlets_bbox' loads only the candidate/station outlet bounding box,
# expanded by delineation_buffer_km; faster for previews, but the buffer must
# cover the upstream area needed for delineation.
delineation_dem_extent_source = "selection_territory"
# DEM used as the HTML review-map background.
review_map_dem_background = "delineation_dem"

[site_selection.hydrology]
# DEM conditioning strategy forwarded to existing flow products.
hydrologic_conditioning = "fill"
# Contributing-area threshold used to extract the stream network.
network_threshold_area_km2 = 1.0

[site_selection.outlets]
# Maximum distance in metres for the final DEM snap used for basin delineation.
dem_snap_max_distance_m = 1000

[site_selection.criteria.observations.flow_station]
# How gauging-station suitability affects the final decision.
mode = "hard_reject"
# Minimum required discharge-record length in years.
min_record_years = 5.0
# Maximum allowed distance between the gauging station and final basin outlet.
max_station_to_outlet_distance_km = 1.0
# Require the gauging station to be inside the basin or at the outlet.
require_station_inside_or_at_outlet = true

[site_selection.criteria.observations.station_influence]
# How station influence metadata affects the final decision.
mode = "hard_reject"
# How missing or unknown station influence metadata is handled.
unknown_policy = "neutral"

[site_selection.criteria.influence]
# How anthropic influence evidence affects the final decision.
mode = "hard_reject"
# Reject sites when evidence reports a major upstream dam.
reject_major_dam_upstream = true
# Reject sites when evidence reports a major upstream withdrawal.
reject_major_withdrawal_upstream = true
# Reject sites when evidence reports a major regulated reach.
reject_major_regulated_reach = true

[site_selection.criteria.geology]
# How geology evidence affects the final decision.
mode = "warning"
# Prefer or highlight basins with more diverse geology classes.
prefer_diversity = true

[report.html]
# Build the static site-selection HTML review report at the end of the run.
profile = "site_selection"
build_at_end = true

[hydrometry]
# Start date of the data extraction window (ISO format, e.g. '2019-01-01').
date_start = "2015-01-01"
# End date of the data extraction window (ISO format, e.g. '2025-12-31').
date_end = "2024-12-31"

[[hydrometry.sources]]
# Data provider: 'custom' for user files, 'hubeau' for Hub'Eau API.
source = "hubeau"
# Hub'Eau variable code (e.g. 'QmnJ', 'QmM', 'HmnJ').
product = "QmnJ"
# Explicit station identifiers to load from the selected provider.
station_ids = [
  "K003002010",
  "K004551001",
  "K010002010",
  "K013401001",
  "K021401001",
]
# Only keep stations that have observations in the period.
require_observations = true

[data]
# Ordered list of data-manager types explicitly requested in [data]. The launcher may append
# inferred types deduced from other sections (for example domain.zone_ids, flow.active_bc).
# Allowed values: 'dem', 'etp', 'geology', 'humidity', 'hydrography', 'hydrometry',
# 'intermittency', 'oceanic', 'piezometry', 'precipitation', 'radiation', 'recharge',
# 'runoff', 'soil_moisture', 'temperature', 'water_quality', 'wind'.
types = ["dem"]

[[data.dem.sources]]
# Discriminator tag selecting the IGN Geoplateforme DEM provider.
source = "ign_geoplateforme_dem"
# IGN DEM product assembled by the data manager. Only BD ALTI 25 m is currently exposed as an
# assembled raster source; use the download_dem_fr helper to inspect raw RGE ALTI archives.
dataset = "bd-alti"
# Requested DEM resolution in metres. Defaults are resolved by the manager from the selected
# dataset.
resolution_m = 25.0
