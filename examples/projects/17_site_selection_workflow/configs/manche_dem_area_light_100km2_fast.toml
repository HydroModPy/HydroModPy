[workflow]
mode = "site_selection"

[site_selection]
selection_id = "manche_dem_area_light_100km2_fast_v1"
output_root = "../outputs/manche_dem_area_light_100km2_fast_v1"

[site_selection.input]
mode = "dem_area_light"
region_id = "Manche"

[site_selection.strategy]
principle = "criteria_crossing"
profile = "area_only"
primary_axes = ["area"]
observation_role = "report_only"
geology_role = "report_only"

[site_selection.territory]
mode = "admin_departments"
country = "FR"
departments = ["050"]

[site_selection.dem]
source = "data"
resolution_m = 25.0
cache_policy = "use_cache_else_download"
request_extent = "territory"
map_background_extent = "territory"

[site_selection.hydrology]
method = "dem_only"
flow_algorithm = "d8"
hydrologic_conditioning = "fill"
network_threshold_area_km2 = 1.0

[site_selection.dem_area_light]
target_area_km2 = 100.0
min_area_km2 = 75.0
max_area_km2 = 125.0
n_basins = 10
max_candidates_before_delineation = 30

[site_selection.criteria.area]
mode = "hard_reject"
hard_min_area_km2 = 75.0
hard_max_area_km2 = 125.0

[site_selection.output]
write_report_html = true
write_geopackage = false

[data]
types = ["dem"]

[[data.dem.sources]]
source = "ign_geoplateforme_dem"
dataset = "bd-alti"
resolution_m = 25.0
file_format = "ASC"
departments = ["050"]
