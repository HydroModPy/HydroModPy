[workflow]
mode = "site_selection"

[site_selection]
selection_id = "normandie_dem_area_light_100km2_v1"
output_root = "../outputs/normandie_dem_area_light_100km2_v1"

[site_selection.input]
mode = "dem_area_light"
region_id = "Normandie"

[site_selection.territory]
mode = "admin_regions"
country = "FR"
regions = ["Normandie"]

[site_selection.dem]
source = "data"
resolution_m = 25.0
cache_policy = "use_cache_else_download"
request_extent = "territory"
map_background_extent = "territory"

[site_selection.hydrology]
method = "dem_only"
flow_algorithm = "d8"
hydrologic_conditioning = "fill"
network_threshold_area_km2 = 1.0

[site_selection.dem_area_light]
target_area_km2 = 100.0
min_area_km2 = 75.0
max_area_km2 = 125.0
n_basins = 50

[site_selection.output]
write_report_html = true
write_geopackage = true

[data]
types = ["dem"]

[[data.dem.sources]]
source = "ign_geoplateforme_dem"
dataset = "bd-alti"
resolution_m = 25.0
file_format = "ASC"
regions = ["Normandie"]
