[workflow]
mode = "site_selection"

[site_selection]
selection_id = "bretagne_generated_candidates_dem_v1"
output_root = "../outputs/bretagne_generated_candidates_dem_v1"

[site_selection.input]
mode = "generated_candidates"
region_id = "Bretagne"

[site_selection.strategy]
principle = "criteria_crossing"
primary_axes = ["area"]

[site_selection.territory]
mode = "admin_regions"
country = "FR"
regions = ["Bretagne"]

# The BD ALTI 25 m tile over the region, fetched once then read from the data
# cache. It used to name the cached file by path, which no checkout ships.
[site_selection.dem]
source = "data"
resolution_m = 25.0
cache_policy = "use_cache_else_download"
request_extent = "territory"
map_background_extent = "delineation"

[site_selection.hydrology]
method = "dem_only"
flow_algorithm = "d8"
hydrologic_conditioning = "fill"
network_threshold_area_km2 = 5.0

[site_selection.outlets]
candidate_mode = "network_sampling"
max_generated_candidates = 12
max_rejected_candidate_audit_records = 200
max_generated_network_cells = 25000
min_distance_between_outlets_km = 3.0
snap_strategy = "dem_accumulation"
snap_dist_m = 150
reference_network_source = "custom"
reference_network_path = "../outputs/bretagne_hydrometry_50_500_small_bdtopage_rerun_v1/reference_network/bdtopage_reference_network.gpkg"
reference_network_max_distance_m = 300.0

[site_selection.spatial_selection]
allow_nested_basins = true
max_pairwise_basin_overlap_fraction = 0.20
overlap_mode = "warning"

[site_selection.criteria]
ruleset = "bretagne_generated_candidates_dem_v1"
warning = ["area_range", "basin_overlap"]
soft_score = ["area"]
report_only = ["reference_network"]

[site_selection.criteria.area]
mode = "warning"

[[site_selection.criteria.area.ranges]]
range_id = "bretagne_50_500"
label = "Bretagne 50-500 km2"
min_area_km2 = 50.0
max_area_km2 = 500.0

[site_selection.output]
write_report_html = true
