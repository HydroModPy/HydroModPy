# HydroModPy - example 01: simplified example presented in the paper
#
# Canut catchment (Brittany), steady MODFLOW 6 over five layers thickening with
# depth, conductivity and storage decaying exponentially with depth, followed by
# particle tracking.
#
#   hmp run examples/projects/01_simplified_example_presented_in_the_paper/project.toml

[workflow]
mode = "simulation"

[workspace]
project_root = "."


[simulation]
name = "canut_paper_mf6"
description = "Canut catchment, steady MODFLOW 6, depth-decaying five-layer aquifer with particle tracking."
if_exists = "replace"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
type = "transport"
solvers = ["modflow6_prt"]


[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "DEM_armorican_massif.tif"
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
buff_area = "10%"

[geographic.river_network]
enabled = true
threshold_area_km2 = 0.5


[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"


[data]
types = ["dem", "recharge"]

[[data.dem.sources]]
source = "custom"
path = "DEM_armorican_massif.tif"

# 350 mm/year over the catchment.
[[data.recharge.sources]]
source = "synthetic"
values = [0.96]
runoff_ratio = 0.0


[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 2e-5

# Fractured aquifer: the weathered zone conducts, the deep bedrock does not.
# exp(-depth / 20 m) is about half the surface value at 14 m depth.
[flow.param.K.field_vertical_profile]
mode = "exponential"
characteristic_depth = "20.0 m"
min_factor = 1e-3

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

[flow.param.Sy.field_vertical_profile]
mode = "exponential"
characteristic_depth = "20.0 m"
min_factor = 1e-2

[flow.bc.drainage]
kind = "cauchy"


[transport.modflow6prt.parameters]
release_zone = "domain_nonriver"
porosity = 0.01
max_particles = 300
release_times_days = [0.0]
track_time_step_days = 30.0
stop_time_days = 36500.0


[modflow6.runtime]
mf6_ims_complexity = "MODERATE"

# Five layers thickening with depth.
[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 5
lay_decay = 1.5


[display]
on_error = "raise"
figures = [
    "watershed_id_card",
    "mesh_map",
    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "particle_tracks",
    "residence_time_distribution",
    "cross_section",
    "parameter_section",
    "simulated_active_network",
    "water_budget",
]

# The paper section runs west to east through the catchment.
[display.overrides.cross_section]
orientation = "we"

[display.overrides.parameter_section]
orientation = "we"
