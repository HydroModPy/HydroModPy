# HydroModPy - example 01: simplified example presented in the paper
#
# Canut catchment (Brittany), steady MODFLOW 6 over five layers thickening with
# depth, conductivity and storage decaying exponentially with depth, followed by
# particle tracking.
#
#   hmp run examples/projects/01_simplified_example_presented_in_the_paper/project.toml

[site]
name = "canut"

[workflow]
mode = "simulation"

[simulation]
name = "canut_paper_mf6"
description = "Canut catchment, steady MODFLOW 6, depth-decaying five-layer aquifer with particle tracking."

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
kind = "transport"
solvers = ["modflow6_prt"]


[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
kind = "from_outlet_coord"
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
buff_area = "10%"

[geographic.river_network]
enabled = true
threshold_area_km2 = 0.5


[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"


[domain.layers]
genmtd_lay = "decay"
nlay = 5
lay_decay = 1.5


[data]
types = ["dem", "recharge"]

[[data.dem.sources]]
source = "file"
path = "../../data/dem/DEM_armorican_massif.tif"

# 350 mm/year over the catchment.
[[data.recharge.sources]]
source = "synthetic"
values = [0.96]


[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 2e-5

# Fractured aquifer: the weathered zone conducts, the deep bedrock does not.
# exp(-depth / 20 m) is about half the surface value at 14 m depth.
[flow.param.K.field_vertical_profile]
kind = "exponential"
characteristic_depth = "20.0 m"
min_factor = 1e-3

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

[flow.param.Sy.field_vertical_profile]
kind = "exponential"
characteristic_depth = "20.0 m"
min_factor = 1e-2

[flow.bc.drainage]
kind = "drain"


[flow.sinks_sources.recharge]
[transport.modflow6prt.parameters]
release_zone = "domain_nonriver"
porosity = 0.01
max_particles = 300
track_time_step = 30.0
stop_time = 36500.0
release_times = [0.0]


[modflow6.runtime]
mf6_ims_complexity = "MODERATE"

# Five layers thickening with depth.
[display]
on_error = "raise"
[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
variable = "topography"
overlays = ["mesh", "outline", "outlet"]

[[display.figure]]
variable = "watertable_elevation"

[[display.figure]]
variable = "watertable_depth"

[[display.figure]]
variable = "seepage_mask"

[[display.figure]]
preset = "particle_tracks"

[[display.figure]]
preset = "residence_time_distribution"

# The paper section runs west to east through the catchment.
[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "cross_section"
# orientation = "we" has no equivalent: the line runs from the outlet

[[display.figure]]
variable = "hydraulic_conductivity"
type = "section"
# orientation = "we" has no equivalent: the line runs from the outlet

[[display.figure]]
variable = "simulated_active_network"

[[display.figure]]
preset = "water_budget"
