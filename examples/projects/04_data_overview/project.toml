# A data overview built from nothing but an outlet coordinate. Every layer is
# fetched from a public French service, the DEM included: no file ships with
# this example. Needs network access; no service asks for a key.
#
#   hmp run examples/projects/04_data_overview/project.toml

[workflow]
mode = "overview"

[workspace]
project_root = "."

[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
catch_def = "from_outlet_coord"
x_outlet = 389285.910
y_outlet = 6816518.749
snap_dist = "150 m"
# The buffered domain covers 20 % more area than the catchment.
buff_area = "20%"

[data]
types = [
    "dem",
    "geology",
    "hydrography",
    "hydrometry",
    "piezometry",
    "intermittency",
    "water_quality",
    "precipitation",
    "etp",
]

# IGN BD ALTI 25 m, assembled from the department archives around the outlet.
# No dem_init_path: the catchment is delineated on this download.
[[data.dem.sources]]
source = "ign_geoplateforme_dem"

# BRGM 1:50 000 departmental map. At 1:1 000 000 a catchment this size holds
# one or two polygons.
[[data.geology.sources]]
source = "brgm_50k"

# BD TOPAGE, the Sandre reference network, asked over the delineated watershed.
[[data.hydrography.sources]]
source = "bdtopage"

# Hub'Eau daily mean discharge at the gauges inside the watershed.
[[data.hydrometry.sources]]
source = "hubeau"
product = "QmnJ"

# Hub'Eau groundwater levels. No piezometer lies inside the catchment; this one,
# at Louvigné-du-Désert 11 km north, is the nearest still recording.
[[data.piezometry.sources]]
source = "hubeau"
product = "level"
station_ids = ["02478X0156/PZ"]

# Hub'Eau ONDE flow-state observations.
[[data.intermittency.sources]]
source = "hubeau"

# Hub'Eau river quality. A parameter is named as Hub'Eau labels it.
[[data.water_quality.sources]]
source = "hubeau"
site_type = "river"
parameters = ["Nitrates", "Température de l'Eau", "Conductivité à 25°C"]

# Meteo-France SIM2 reanalysis, 8 km grid. Both feed the climatic summary panel.
[[data.precipitation.sources]]
source = "sim2"

[[data.etp.sources]]
source = "sim2"

[[data.recharge.sources]]
source = "sim2"

# Every [data.<type>] section above inherits this window.
[overview]
name = "Nançon"
date_start = "2019-01-01"
date_end = "2025-12-31"
