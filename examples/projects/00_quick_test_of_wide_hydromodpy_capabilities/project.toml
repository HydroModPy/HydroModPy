# HydroModPy - example 00: quick test of wide HydroModPy capabilities
#
# Aber catchment (Brittany), monthly transient 2017 on a 50 m aquifer, two
# pumping wells, hillslope drainage and forward particle tracking, MODFLOW 6.
#
#   hmp run examples/projects/00_quick_test_of_wide_hydromodpy_capabilities/project.toml

[workflow]
mode = "simulation"

[workspace]
project_root = "."


[simulation]
name = "aber_transient_mf6"
description = "Aber catchment, monthly transient 2017, MODFLOW 6, two pumping wells and particle tracking."
if_exists = "replace"

[simulation.time]
start_datetime = "2017-01-01"
end_datetime = "2017-12-31"
step_value = "1 month"
# Daily solver steps inside each monthly stress period; output stays monthly.
substeps_per_period = 30

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
type = "transport"
solvers = ["modflow6_prt"]


[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "regional_dem_aber.tif"
x_outlet = 150727.164
y_outlet = 6858066.520
snap_dist = "100 m"
buff_area = "10%"


[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"


[data]
types = ["dem", "hydrography", "recharge"]

[[data.dem.sources]]
source = "custom"
path = "regional_dem_aber.tif"

[[data.hydrography.sources]]
source = "custom"
path = "regional_stream_network.shp"
rasterize_field = "FID"

[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["00"]


[flow]
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge", "wells"]
active_bc = ["drainage"]
# Warm the heads up on the mean recharge before the transient year starts.
first_period_steady = true

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

[flow.bc.drainage]
kind = "cauchy"

# Two wells addressed by cell index [layer, row, column], monthly rates in
# m3/day. Both sit on column 28, the column the cross-section follows.
[flow.sinks_sources.wells.W1]
units = "m3/day"

[flow.sinks_sources.wells.W1.location]
kind = "cell"
cell = [0, 8, 28]

[flow.sinks_sources.wells.W1.forcing]
kind = "csv"
path_file = "wells_custom_00_20170101_20171231_M.csv"
value_column = "W1_m3_day"

[flow.sinks_sources.wells.W2]
units = "m3/day"

[flow.sinks_sources.wells.W2.location]
kind = "cell"
cell = [0, 16, 28]

[flow.sinks_sources.wells.W2.forcing]
kind = "csv"
path_file = "wells_custom_00_20170101_20171231_M.csv"
value_column = "W2_m3_day"


# Particles released over the domain, off the river cells, so the tracks show
# which recharge feeds the seepage areas.
[transport.modflow6prt.parameters]
release_zone = "domain_nonriver"
porosity = 0.01
max_particles = 300
release_times_days = [0.0]
track_time_step_days = 30.0
# Long enough for the slowest particle to reach a seepage cell: stopping the
# clock earlier piles the survivors on the last bin and tilts the
# residence-time distribution.
stop_time_days = 36500.0


[modflow6.runtime]
mf6_ims_complexity = "MODERATE"


[display]
# An example must not silently degrade: a figure that applies but fails is an
# error here, where the default only warns.
on_error = "raise"
figures = [
    "watershed_id_card",
    "mesh_map",
    "recharge_map",
    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "flow_persistence_map",
    "flow_intermittence_map",
    "particle_tracks",
    "residence_time_distribution",
    "cross_section",
    "flux_timeseries",
    "water_budget",
]

# The first period, January, is the one the two wells pump hardest in.
[display.overrides.watertable_depth_map]
timestep = 0
overlays = ["watershed", "seepage", "particles", "wells", "outlet"]

# South-to-north section through the two pumping wells, same period.
[display.overrides.cross_section]
timestep = 0
orientation = "sn"
through = [152687.5, 6857800.0]

[display.overrides.flux_timeseries]
units = "mm/period"
