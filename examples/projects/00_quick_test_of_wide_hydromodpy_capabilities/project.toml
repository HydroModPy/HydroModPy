# Example 00: a quick tour of HydroModPy on the Aber catchment (Finistere).
#
# One year 2017 in monthly stress periods, a 50 m aquifer under a 75 m DEM,
# seepage at the ground surface, two pumping wells, and particles that show
# where the seepage water comes from. MODFLOW 6 solves the flow and its PRT
# tracks the particles.
#
#   hmp run project.toml

[site]
name = "aber"

[workflow]
mode = "simulation"

[simulation]
name = "aber_example_00"
description = "Aber catchment, monthly transient 2017, two pumping wells, particle tracking."

# Twelve monthly stress periods, one time step each.
[simulation.time]
start_datetime = "2017-01-01"
end_datetime = "2017-12-31"
step_value = "1 month"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
kind = "transport"
solvers = ["modflow6_prt"]

# The catchment is cut out of a regional 75 m DEM, upstream of the outlet,
# after the depressions of the DEM are breached. The domain is the box around
# the catchment widened by 10 % of the square root of its area: 28 x 35 cells.
[geographic]
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[geographic.catchment]
kind = "from_outlet_coord"
x_outlet = 150727.164
y_outlet = 6858066.520
snap_dist = "100 m"
buff_area = "10% of sqrt(area)"

# One layer, 50 m thick under the ground surface.
[domain.depth_model]
kind = "constant_thickness"
thickness = "50 m"

[data]
types = ["dem", "hydrography"]

[[data.dem.sources]]
source = "file"
path = "workspace:regional_dem_aber.tif"

# The mapped streams, drawn on the figures and exported. The model does not
# read them.
[[data.hydrography.sources]]
source = "file"
path = "workspace:regional_stream_network.shp"

[flow]
flow_regime = "transient"
# January is solved in steady state, so the year starts from a water table in
# balance with the mean recharge.
first_period_steady = true
param_list = ["K", "Sy", "Ss"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# Every cell drains at the ground surface. The conductance follows K,
# C = K * cell area / 1 m.
[flow.bc.drainage]

# 10, 60, 40, 20, 10, 5, 4, 20, 10, 1, 0 and 0 mm per month, divided by 30
# days. The steady January takes 0.5 mm/day, the plain mean of the twelve
# months. The default "mean" weights each month by its length and gives
# 0.49 mm/day.
[flow.sinks_sources.recharge]
units = "mm/day"
values = [
  0.33, 2.0, 1.33, 0.67, 0.33, 0.17,
  0.13, 0.67, 0.33, 0.03, 0.0, 0.0,
]
first_clim = 0.5

# Two wells 600 m apart on the same north-south line, one rate per month.
[flow.sinks_sources.wells.W1]
units = "m3/day"
location = { kind = "absolute_xy", x = 152700.0, y = 6858225.0, layer = 0 }
flux = [-200, 0, -100, 0, 0, 0, 0, 0, 0, 0, 0, 0]

[flow.sinks_sources.wells.W2]
units = "m3/day"
location = { kind = "absolute_xy", x = 152700.0, y = 6857625.0, layer = 0 }
flux = [-500, 0, 0, -500, 0, 0, -500, 0, 0, 0, 0, 0]

# One particle in each cell of the box at the start of January, carried by the
# flow until it leaves the aquifer, most of them in a seepage cell. The
# porosity is Sy.
[transport.modflow6_prt]
release_zone = "domain"
porosity = 0.01 # default is Sy
release_times = [0.0] # one release at the start (the default), each value is one more release, so monthly needs twelve values
stop_time = "100 years"

# The figures land in runs/aber_example_00/figures/. Each one that applies and
# fails stops the run, so a broken figure cannot go unseen.
[display]
on_error = "raise"

[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
variable = "topography"
overlays = ["mesh", "outline", "network", "outlet"]

# January, the month the two wells pump the most. The seepage cells are black, the
# pathlines show the water that feeds them, and the dashed line is the section below.
[[display.figure]]
variable = "watertable_depth"
time = "2017-01-15"
overlays = ["seepage", "pathlines", "outline"]
line = [[152700.0, 6858862.5], [152700.0, 6856762.5]]
limits = [0.0, 10.0]

[[display.figure]]
variable = "seepage_mask"
time = "2017-01-15"
overlays = ["outline", "network"]

# North to south through the two wells.
[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "section_through_wells"
time = "2017-01-15"
line = [[152700.0, 6858862.5], [152700.0, 6856762.5]]

# The share of the year each cell seeps.
[[display.figure]]
variable = "simulated_active_network"
reduce = "frequency"
overlays = ["outline", "network"]

[[display.figure]]
preset = "particle_tracks"

# The same pathlines over a map: how long the water still travels before it leaves,
# then the water-table depth of January.
[[display.figure]]
preset = "particle_tracks"
name = "particle_tracks_over_travel_time"
variable = "travel_time_to_exit"

[[display.figure]]
preset = "particle_tracks"
name = "particle_tracks_over_depth"
variable = "watertable_depth"
time = "2017-01-15"

[[display.figure]]
preset = "residence_time_distribution"

# What enters and leaves the catchment each month.
[[display.figure]]
preset = "water_budget"

# What lands in runs/aber_example_00/exports/, ready for QGIS or a spreadsheet.
# A block says what and when, and the format follows the data.

# The catchment, its box and the mapped streams: GeoPackage.
[[export]]
variable = ["watershed", "watershed_box_buff", "hydrographic_network_reference"]

# The DEM of the model: GeoTIFF.
[[export]]
variable = "watershed_dem"

# The water table and the seepage cells in January: one GeoTIFF each.
[[export]]
variable = ["head", "watertable_depth", "seepage_mask"]
time = "2017-01-15"

# The twelve months of the water table in one NetCDF file.
[[export]]
variable = ["head", "watertable_depth", "seepage_mask"]
file = "watertable_2017.nc"

# The discharge at the outlet, month by month: CSV.
[[export]]
variable = "discharge"

# The water budget of every month, for the catchment and for the whole box: CSV.
[[export]]
variable = "budget"

# The particle tracks, one line per particle with its travel time in years: GeoPackage.
[[export]]
variable = "pathlines"
