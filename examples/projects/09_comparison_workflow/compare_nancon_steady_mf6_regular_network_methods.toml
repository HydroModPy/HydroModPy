workflow = "comparison"

[comparison]
comparison_id = "nancon_steady_mf6_regular_network_methods"
base_simulation_config = "base_nancon_steady_hydrography_structured.toml"
output_root = "outputs/nancon_steady_mf6_regular_network_methods"
reference_simulation = "mf6_disv_ref"
continue_on_error = true

[comparison.execution]
backend = "subprocess_hmp_run"
max_parallel_runs = 1
run_simulations = true
keep_generated_configs = true
timeout_seconds = 2400

[comparison.audit]
mode = "strict_same_case"
on_mismatch = "warn"

[comparison.fine_raster]
enabled = true
resolution = 250.0
extent_mode = "intersection"
interpolation = "linear"
write_geotiff = false

[[comparison.simulation]]
id = "mf6_disv_ref"
label = "MODFLOW 6 DISV Nancon steady reference, river-constrained mesh"
solver = "modflow6"
mesh_label = "Nancon river-constrained triangular mesh"
mesh_mode = "mesh_input"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_disv"
root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_disv"

[comparison.simulation.overlay.mesh_input]
bundle_dir = "outputs/nancon_transient_seasonal_hydrography/workspace_mf6/mesh/mesh_catchment_bundle"

[comparison.simulation.overlay.modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[comparison.simulation.overlay.modflow6.process_specific]
vka = 1.0

[comparison.simulation.overlay.modflow6.tgrid]
firstpersteady = true

[comparison.simulation.overlay.modflow6.sgrid.vertical]
nlay = 1

[[comparison.simulation]]
id = "mf6_structured_120"
label = "MODFLOW 6 structured 120x120 Nancon steady candidate"
solver = "modflow6"
mesh_label = "Nancon structured grid 120x120"
mesh_mode = "structured"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_structured_120"
root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_structured_120"

[comparison.simulation.overlay.modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[comparison.simulation.overlay.modflow6.process_specific]
vka = 1.0

[comparison.simulation.overlay.modflow6.sgrid.planar]
mode = "resample_to_shape"
nx = 120
ny = 120
resampling = "nearest"

[comparison.simulation.overlay.modflow6.sgrid.vertical]
nlay = 1

[comparison.simulation.overlay.modflow6.tgrid]
firstpersteady = true

[[comparison.simulation]]
id = "mf6_structured_180"
label = "MODFLOW 6 structured 180x180 Nancon steady candidate"
solver = "modflow6"
mesh_label = "Nancon structured grid 180x180"
mesh_mode = "structured"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_structured_180"
root = "outputs/nancon_steady_mf6_regular_network_methods/workspace_mf6_structured_180"

[comparison.simulation.overlay.modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[comparison.simulation.overlay.modflow6.process_specific]
vka = 1.0

[comparison.simulation.overlay.modflow6.sgrid.planar]
mode = "resample_to_shape"
nx = 180
ny = 180
resampling = "nearest"

[comparison.simulation.overlay.modflow6.sgrid.vertical]
nlay = 1

[comparison.simulation.overlay.modflow6.tgrid]
firstpersteady = true

[[comparison.observable]]
name = "head_map_last"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[comparison.observable]]
name = "watertable_depth_map_last"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"

[[comparison.observable]]
name = "seepage_map_last"
variable = "seepage_areas"
support = "map"
time = "last"
unit = "-"

[[comparison.observable]]
name = "outflow_drain_map_last"
variable = "outflow_drain"
support = "map"
time = "last"
unit = "m/day"

[[comparison.observable]]
name = "active_network_flux_map_last"
variable = "accumulation_flux"
support = "map"
time = "last"
unit = "m/day"
