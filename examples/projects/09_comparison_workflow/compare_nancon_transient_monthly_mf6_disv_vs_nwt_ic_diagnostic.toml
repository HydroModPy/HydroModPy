
[workflow]
mode = "comparison"

[comparison]
comparison_id = "nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic"
base_simulation_config = "base_nancon_transient_monthly_hydrography_mesh_input_ic10m.toml"
output_root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic"
reference_simulation = "mf6_disv_ref"
continue_on_error = true

[comparison.execution]
backend = "subprocess_hmp_run"
max_parallel_runs = 1
run_simulations = true
keep_generated_configs = true
timeout_seconds = 2400

[comparison.audit]
mode = "strict_same_case"
on_mismatch = "warn"

[comparison.fine_raster]
enabled = true
resolution = 250.0
extent_mode = "intersection"
interpolation = "linear"
write_geotiff = false

[[comparison.simulation]]
id = "mf6_disv_ref"
label = "MODFLOW 6 DISV Nancon monthly transient diagnostic, IC top minus 10 m"
solver = "modflow6"
mesh_label = "nancon_river_constrained_triangular_mesh"
mesh_mode = "mesh_input"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_mf6_disv"
root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_mf6_disv"

[comparison.simulation.overlay.modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[comparison.simulation.overlay.modflow6.process_specific]
vka = 1.0

[comparison.simulation.overlay.modflow6.tgrid]
firstpersteady = false

[comparison.simulation.overlay.modflow6.sgrid.vertical]
nlay = 1

[[comparison.simulation]]
id = "nwt_structured_120"
label = "MODFLOW-NWT structured 120x120 Nancon monthly transient diagnostic, IC top minus 10 m"
solver = "modflownwt"
mesh_label = "nancon_structured_grid_120x120"
mesh_mode = "structured"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_nwt_120"
root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_nwt_120"

[comparison.simulation.overlay.modflownwt.runtime]

[comparison.simulation.overlay.modflownwt.runtime.nwt]
version = "mfnwt"
verbose = false
headtol = 1e-4
fluxtol = 500.0
maxiterout = 5000
options = "COMPLEX"
continue_run = false

[comparison.simulation.overlay.modflownwt.runtime.dis]
itmuni = 4

[comparison.simulation.overlay.modflownwt.runtime.bas]
hnoflo = -9999.0

[comparison.simulation.overlay.modflownwt.runtime.upw]
iphdry = 1
hdry = -100.0
layvka = 1

[comparison.simulation.overlay.modflownwt.runtime.evt]
nevtop = 3
ievt = 1
ipakcb = 1

[comparison.simulation.overlay.modflownwt.runtime.oc]
compact = true

[comparison.simulation.overlay.modflownwt.runtime.wel]
ipakcb = 1
[comparison.simulation.overlay.modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 120
ny = 120
resampling = "nearest"

[comparison.simulation.overlay.modflownwt.sgrid.vertical]
nlay = 1

[comparison.simulation.overlay.modflownwt.tgrid]
firstpersteady = false

[[comparison.simulation]]
id = "nwt_structured_180"
label = "MODFLOW-NWT structured 180x180 Nancon monthly transient diagnostic, IC top minus 10 m"
solver = "modflownwt"
mesh_label = "nancon_structured_grid_180x180"
mesh_mode = "structured"

[comparison.simulation.overlay.workspace]
project_root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_nwt_180"
root = "outputs/nancon_transient_monthly_mf6_disv_vs_nwt_ic_diagnostic/workspace_nwt_180"

[comparison.simulation.overlay.modflownwt.runtime]

[comparison.simulation.overlay.modflownwt.runtime.nwt]
version = "mfnwt"
verbose = false
headtol = 1e-4
fluxtol = 500.0
maxiterout = 5000
options = "COMPLEX"
continue_run = false

[comparison.simulation.overlay.modflownwt.runtime.dis]
itmuni = 4

[comparison.simulation.overlay.modflownwt.runtime.bas]
hnoflo = -9999.0

[comparison.simulation.overlay.modflownwt.runtime.upw]
iphdry = 1
hdry = -100.0
layvka = 1

[comparison.simulation.overlay.modflownwt.runtime.evt]
nevtop = 3
ievt = 1
ipakcb = 1

[comparison.simulation.overlay.modflownwt.runtime.oc]
compact = true

[comparison.simulation.overlay.modflownwt.runtime.wel]
ipakcb = 1
[comparison.simulation.overlay.modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 180
ny = 180
resampling = "nearest"

[comparison.simulation.overlay.modflownwt.sgrid.vertical]
nlay = 1

[comparison.simulation.overlay.modflownwt.tgrid]
firstpersteady = false

