base_config = "base_nancon_steady_hydrography_mesh_catchment.toml"

[workflow]
mode = "simulation"

[workspace]
root = "outputs/nancon_steady_mf6_irregular_network_methods/workspace_mf6_mesh_catchment_250"

[simulation]
name = "nancon_steady_mf6_irregular_network_methods__mf6_mesh_catchment_250"
description = "MODFLOW 6 Nancon steady candidate on a generated irregular mesh-catchment grid, target size 250 m."

[mesh]
cell_size = 250.0
river_cell_size = 130.0

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false
mf_verbose = false

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid.vertical]
nlay = 1
