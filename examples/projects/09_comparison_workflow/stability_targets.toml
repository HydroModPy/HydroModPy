schema_version = "comparison_stability_targets_v1"

# Minimal stabilized Boussinesq/MODFLOW 6 cases.
# These checks validate already materialized outputs; they do not run solvers.

[[case]]
id = "dupuit_mf6_vs_bouss"
comparison_root = "outputs/dupuit_mf6_vs_bouss"
allowed_audit_status = ["pass"]
required_simulations = ["mf6_ref", "bouss_candidate"]
required_figures = [
  "case_configuration.png",
  "head_map_last__triptych__mf6_ref__vs__bouss_candidate.png",
  "head_map_last__difference__mf6_ref__vs__bouss_candidate.png",
  "bouss_candidate__budget_diagnostics.png",
]

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_map_last"
n_pairs_min = 100
mae_max = 0.03
rmse_max = 0.04
max_abs_error_max = 0.12

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_west_last"
n_pairs_min = 1
max_abs_error_max = 0.01

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_middle_last"
n_pairs_min = 1
max_abs_error_max = 0.01

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_east_last"
n_pairs_min = 1
max_abs_error_max = 0.01

[[case]]
id = "natural_mesh_10km2_transient_pulse_mf6_vs_bouss"
comparison_root = "outputs/natural_mesh_10km2_transient_pulse_mf6_vs_bouss"
# This case intentionally allows warn because the current audit reports known
# head-above-top and recharge-budget semantic warnings while the head comparison
# itself remains close. Those warnings should stay visible, not hidden.
allowed_audit_status = ["pass", "warn"]
required_simulations = ["mf6_ref", "bouss_candidate"]
required_figures = [
  "case_configuration.png",
  "head_points_dashboard.png",
  "head_map_pulse__triptych__mf6_ref__vs__bouss_candidate.png",
  "head_map_last__triptych__mf6_ref__vs__bouss_candidate.png",
  "head_east_series__timeseries.png",
  "bouss_candidate__budget_diagnostics.png",
]

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_map_initial"
n_pairs_min = 500
rmse_max = 0.001
max_abs_error_max = 0.001

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_map_pulse"
n_pairs_min = 500
mae_max = 0.03
rmse_max = 0.04
max_abs_error_max = 0.08

[[case.metric]]
