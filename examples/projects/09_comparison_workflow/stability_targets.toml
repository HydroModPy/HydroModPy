[[case]]
id = "nancon_transient_seasonal_hydrography_mf6_vs_bouss"
comparison_root = "outputs/nancon_transient_seasonal_hydrography_mf6_vs_bouss"
# Nancon is kept as a broad stress-test lock. The thresholds are intentionally
# loose because the current case still mixes strong topographic interception,
# hydrography loading, and solver-specific surface accounting.
