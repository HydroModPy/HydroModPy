[[case]]
id = "nancon_transient_monthly_mf6_bouss_comparable"
comparison_root = "outputs/nancon_transient_monthly_mf6_bouss_comparable"
# This is the preferred Nancon MF6/Boussinesq natural benchmark. It reuses one
# precomputed river-constrained mesh, starts below topography, and uses stronger
# drainage than the broad seasonal stress test. The audit remains warn because
# MF6 still represents persistent above-top heads on part of the natural mesh.
allowed_audit_status = ["pass", "warn"]
required_simulations = ["mf6_ref", "bouss_candidate"]
required_figures = [
  "case_configuration.png",
  "head_points_dashboard.png",
  "head_map_after_first_month__fine_raster_triptych__mf6_ref__vs__bouss_candidate.png",
  "head_map_last__fine_raster_triptych__mf6_ref__vs__bouss_candidate.png",
  "head_eastern_plateau_series__timeseries.png",
  "bouss_candidate__budget_diagnostics.png",
]

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_map_after_first_month"
n_pairs_min = 6000
rmse_max = 8.5
max_abs_error_max = 55.0

[[case.metric]]
simulation_id = "bouss_candidate"
observable = "head_map_wet_period"
n_pairs_min = 6000
rmse_max = 8.5
max_abs_error_max = 55.0

[[case.metric]]
simulation_id = "bouss_candidate"
