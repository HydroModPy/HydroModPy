base_config = "base_nancon_steady_hydrography_structured.toml"

[workflow]
mode = "simulation"

[workspace]
project_root = "outputs/nancon_steady_mf6_irregular_network_methods/shared_workspace"
root = "../../"

[simulation]
name = "nancon_steady_hydrography_mesh_catchment_shared_case"
description = "Nancon steady comparison case with generated irregular catchment meshes."

[mesh]
engine = "voronoi"
cell_size = 350.0
river_cell_size = 180.0
river_band = 500.0
outside_factor = 2.0
transition_distance = 500.0

[mesh.families]
geology = "none"
watershed_boundary = "face"
