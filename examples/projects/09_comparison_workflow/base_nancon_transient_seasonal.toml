workflow = "simulation"

[workspace]
project_root = "outputs/nancon_transient_seasonal/workspace"
root = "../../"

[simulation]
name = "nancon_transient_seasonal_shared_case"
description = "Nancon watershed transient benchmark with a synthetic seasonal recharge chronicle."
on_collision = "replace"

[simulation.time]
start_datetime = "2020-10-01 00:00:00"
end_datetime = "2021-09-29 00:00:00"
step_value = "7 day"
coverage_policy = "error"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[geographic]
source_mode = "standard"
catch_def = "from_outlet_coord"
dem_init_path = "../../data/dem/DEM_armorican_massif.tif"
x_outlet = 389285.91
y_outlet = 6816518.749
snap_dist = "150 m"
buff_area = "10%"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
reuse_existing_outputs = false

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 0.5
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "30.0 m"

[flow]
flow_regime = "transient"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
param_list = ["K", "Ss", "Sy"]
runtime_max_iterations = 120
runtime_tol_residual_inf = 1.0e-8
runtime_tol_state_update_inf = 1.0e-8

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"

[flow.param.K.field_homogeneous]
value = "5e-5 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = "1e-5 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = "0.05 -"

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
id = "drainage"
type = "cauchy"
application_domain = "top"
description = "Cauchy drainage on the aquifer top face."
value = "1.0e-5 m2/s"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[data]
project_crs = "EPSG:2154"
types = ["dem", "recharge"]
inference_mode = "warn"

[[data.dem.sources]]
source = "custom"
path = "../../data/dem/DEM_armorican_massif.tif"

[data.recharge]
date_start = "2020-10-01"
date_end = "2021-09-29"

[[data.recharge.sources]]
source = "synthetic"
freq = "7D"
values = [
  2.0922, 0.9299, 1.4038, 1.0822, 0.8283, 0.6398, 1.4867, 0.7379,
  2.3287, 0.6830, 0.0179, 0.4076, 0.4673, 1.4257, 0.8979, 0.3736,
  0.1703, 0.0000, 0.4218, 0.0000, 1.2011, 0.0529, 0.1236, 0.0000,
  0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0286, 0.0000,
  0.0343, 0.0000, 0.1161, 0.0208, 0.0000, 0.0000, 0.2018, 0.8074,
  0.1170, 0.0820, 1.1593, 0.0224, 0.0608, 0.4274, 0.5237, 0.5116,
  0.5167, 0.7778, 1.0427, 1.2711,
]
runoff_ratio = 0.0

[display]
enabled = false

[mesh_catchment]
constraints_mode = "rivers_only"
output_layout = "flat"
figures_enabled = false
figure_dpi = 220
figure_regional_dpi = 180

[mesh_catchment.watershed_boundary]
enabled = true
boundary_refinement_distance = 300.0

[mesh_catchment.watershed_boundary.smoothing]
enabled = true
distance = 100.0
river_buffer_distance = 50.0
outer_bias_distance = 5.0

[mesh_catchment.watershed_boundary.outside_coarsening]
enabled = true
size_factor = 2.0
transition_distance = 500.0
grid_resolution = 500.0

[mesh_catchment.zone_meshing]
global_size = 350.0
min_size = 150.0
max_size = 800.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 180.0
interface_distance = 500.0
interface_sampling = 64
