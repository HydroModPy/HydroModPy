# Example 11: run from scratch, without a single figure, on the Canut catchment (Ille-et-Vilaine).
#
# The catchment is cut out of the regional DEM from its outlet, then a steady
# state under 350 mm/year of recharge is solved over a 50 m aquifer in three
# equal layers, with a uniform K, seepage at the ground surface, and particles.
# MODFLOW 6 solves the flow and its PRT tracks the particles. Nothing is drawn:
# the run exists for the files it leaves behind, which is what a batch job or a
# machine with no screen needs.
#
#   hmp run project.toml

[site]
name = "canut"

[workflow]
mode = "simulation"

[simulation]
name = "canut_example_11"
description = "Canut catchment, steady state, three layers, particle tracking, files only and no figure."

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "particles"
kind = "transport"
solvers = ["modflow6_prt"]

# The catchment is cut out of a regional 75 m DEM, upstream of the outlet,
# after the depressions of the DEM are breached. The domain is the box around
# the catchment widened by 10 % of the square root of its area.
[geographic]
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[geographic.catchment]
kind = "from_outlet_coord"
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
buff_area = "10% of sqrt(area)"

# 50 m under the ground surface, in three layers of the same thickness.
[domain.depth_model]
kind = "constant_thickness"
thickness = "50 m"

[domain.layers]
genmtd_lay = "constant"
nlay = 3

# Only the DEM. The recharge is written below.
[data]
types = ["dem"]

[[data.dem.sources]]
source = "file"
path = "workspace:DEM_armorican_massif.tif"

[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]

# The same K and the same Sy everywhere and at every depth.
[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.01

# Every cell drains at the ground surface. The conductance follows K,
# C = K * cell area / 1 m.
[flow.bc.drainage]

# 350 mm/year.
[flow.sinks_sources.recharge]
units = "mm/day"
values = [0.9589041096]

# One particle in each cell of the box, carried by the flow until it leaves
# the aquifer, most of them in a seepage cell. The porosity is 1 %. PRT tracks
# forward only, so a particle gives the time its water needs to reach the stream
# from the cell where it entered.
[transport.modflow6_prt]
release_zone = "domain"
porosity = 0.01
release_times = [0.0]
stop_time = "1000 years"

# No figure is drawn and no figure is asked for.
[display]
enabled = false

# What lands in runs/canut_example_11/exports/, ready for QGIS or a spreadsheet.
# A block says what and when, and the format follows the data.

# The catchment and its box: GeoPackage.
[[export]]
variable = ["watershed", "watershed_box_buff"]

# The DEM of the model: GeoTIFF.
[[export]]
variable = "watershed_dem"

# The water table, its depth, the seepage cells and the drain flow: one GeoTIFF each.
[[export]]
variable = ["watertable_elevation", "watertable_depth", "seepage_mask", "outflow_drain"]
time = "first"

# The same fields in one NetCDF file.
[[export]]
variable = ["watertable_elevation", "watertable_depth", "seepage_mask"]
file = "fields.nc"

# The water budget and the discharge at the outlet: CSV.
[[export]]
variable = ["budget", "discharge"]

# The particle tracks, one line per particle with its travel time in years: GeoPackage.
[[export]]
variable = "pathlines"
