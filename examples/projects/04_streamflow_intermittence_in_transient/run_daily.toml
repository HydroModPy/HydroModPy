# Nancon, the same model at a daily step. Only what the step changes is written
# here: the step, the forcing that carries it, the name, and the figures that
# index one. Everything else comes from project.toml.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/run_daily.toml

base_config = "project.toml"

[simulation]
name = "nancon_intermittence_mf6_daily"
description = "Nancon catchment, daily transient 2000-2002, seasonal seepage intermittence."

# 1096 stress periods instead of 36: count about thirty times the monthly run,
# in solver time and in stored fields, since every timestep writes its own
# per-cell budget. The calibration window the parent declares still drops 2000.
[simulation.time]
step_value = "1 day"

# The monthly series carries one rate per month, so a daily run reading it sees
# a staircase and no storm. `NANCON_REA` is the daily areal mean over the same
# catchment, 1990-2020. `source` and `path` stay what the parent said.
[[data.recharge.sources]]
station_ids = ["NANCON_REA"]

[[data.runoff.sources]]
station_ids = ["NANCON_REA"]

# 36 monthly points were too few to read a duration curve or a recession off,
# 1096 daily ones are not. `__append` adds to the parent's eight figures; a
# plain `figures = [...]` would replace them.
[display]
figures__append = ["duration_curve", "recession"]

# 15 October 2002 is step 1019 of 1096 here and was step 34 of 36 in the
# parent. Anything indexed by step has to follow the step.
[display.overrides.seepage_map]
timestep = 1018

# `orientation = "sn"` survives the merge; only `timestep` is replaced.
[display.overrides.cross_section]
timestep = 1018
