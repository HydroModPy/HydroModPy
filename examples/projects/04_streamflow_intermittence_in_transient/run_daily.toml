# Nancon, the same model at a daily step. Only what the step changes is written
# here: the step, the forcing that carries it, the name and three figures.
# The figure date, 2002-10-15, comes from project.toml and follows the step,
# and so do the four exports of project.toml: the discharge CSV is now daily.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/run_daily.toml

base_config = "project.toml"

[simulation]
name = "nancon_intermittence_mf6_daily"
description = "Nancon catchment, daily transient 2000-2002, seasonal seepage intermittence."

# 1096 stress periods instead of 36: count about thirty times the monthly run,
# in solver time and in stored fields, since every timestep writes its own
# per-cell budget. The spin-up year a calibration leaves out is written in
# dates, not in steps, so 2000 is still the year left out here.
[simulation.time]
step_value = "1 day"

# The monthly series carries one rate per month, so a daily run reading it sees
# a staircase and no storm. `NANCON_REA` is the daily areal mean over the same
# catchment, 1990-2020: a product of its own, not the gauge. A [site] gauge keys
# every series by itself, so this run drops it and names its stations: the
# discharge reads NANCON, the one station loaded, which makes it the gauge the
# run records. A list of tables replaces the parent's list whole, so each source
# is written in full.
[site]
gauge__delete = true

[[data.hydrometry.sources]]
source = "file"
path = "../../data/hydrometry"
station_ids = ["NANCON"]

[[data.recharge.sources]]
source = "file"
path = "../../data/recharge"
station_ids = ["NANCON_REA"]

[[data.runoff.sources]]
source = "file"
path = "../../data/runoff"
station_ids = ["NANCON_REA"]

# 36 monthly points were too few to read a duration curve or a recession off,
# 1096 daily ones are not. The linear hydrograph shows the storms the log axis
# flattens. `__append` adds to the parent's figures; a plain
# `figures = [...]` would replace them.
[display]
figures__append = ["hydrograph_sim_obs", "duration_curve", "recession"]
