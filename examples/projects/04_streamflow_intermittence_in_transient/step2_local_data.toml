# Step 2: step 1 plus the mapped river network and the gauge, read from local
# files. Still steady: the network is compared with the simulated seepage.
#
#   hmp run step2_local_data.toml

base_config = "step1_minimal.toml"

[simulation]
name = "nancon_step2_local"

[data]
types = ["hydrography", "hydrometry"]

# The permanent reaches of BD TOPO, under examples/data/hydrography/.
[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

# The gauge at the outlet, daily 1982-2022. Step 4 scores against it.
[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
station_ids = ["NANCON"]

# The mapped network alone, then against the simulated seepage cells: the
# confusion map says which cells agree, the distance map how far each
# simulated cell descends before it reaches the map.
[display]
figures = [
    "watershed_id_card",
    "hydrographic_network_reference",
    "seepage_network_confusion_map",
    "downslope_distance_map",
]

# Step 1's three exports, plus the mapped network as a GeoPackage.
# `__append` adds a block to the inherited ones.
[[export__append]]
variables = "hydrographic_network_reference"
