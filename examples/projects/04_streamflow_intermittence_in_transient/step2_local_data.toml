# Nancon, step 1 plus the mapped river network, read from local files. Only
# what surveyed data on disk changes is written here. Still steady.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/step2_local_data.toml

base_config = "step1_minimal.toml"

[simulation]
name = "nancon_step2_local"

[data]
types = ["hydrography", "hydrometry"]

# Both files sit under examples/data/ and are named, not pathed: the project
# store resolves them.
[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

# The gauge at the outlet, daily 1982-2022. A steady run reads none of it; it
# is declared so step 4 inherits an observed hydrograph.
[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
station_ids = ["NANCON"]

# No [geographic.enforce_streams] and no [geographic.river_network]. The burn
# reshapes the routing surface the flow paths are traced on, which the drainage
# boundary does not read: over 36 steps and 27004 cells it moves the head by
# 0 m and the release flux by 0. project.toml declares both because the
# calibration measures the simulated network along those flow paths.
