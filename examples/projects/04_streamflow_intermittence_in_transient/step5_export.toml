# Nancon, step 4 with its results written out. The model does not change: this
# file is the export and the figures. Four levels deep, step 5 over step 4 over
# step 2 over step 1; `hmp config check` on it resolves the chain.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/step5_export.toml

base_config = "step4_transient.toml"

[simulation]
name = "nancon_step5_export"

# Written under share/nancon_step5_export/. A format toggle writes one file per
# name in `variables`, so the two toggles below produce five files:
#
#   head_t33.tif                  the simulated head
#   watertable_elevation_t33.tif  water table elevation
#   watertable_depth_t33.tif      depth to water table
#   seepage_mask_t33.tif          where the water table crosses the surface
#   timeseries.csv                every series of tables.parquet, all 36 steps
#
# The console prints one line, `Exported 6 file(s) -> share/nancon_step5_export`,
# the sixth being the NetCDF below; `hmp run -v` names them one by one. The
# default `variables` is ["head"].
#
# `time` indexes the 36 stress periods. 33 is October 2002, the driest month of
# the record; the default, the last step, is a December with a nearly full
# network. A GeoTIFF holds one timestep, the CSV ignores the selector and
# covers every step. No `resolution`: the pixel size comes from the mesh.
[export]
geotiff = true
csv_timeseries = true
time = 33
variables = ["head", "watertable_elevation", "watertable_depth", "seepage_mask"]

# The other toggles are `netcdf`, `geopackage`, `vtu`, `shapefile`, and
# `package` for a portable `.hmp` archive. [[export.artifacts]] names one file
# instead: a variable or a list of them, a destination whose extension picks
# the format (.tif .nc .csv .shp .gpkg .vtu .hmp), and its own selector. It is
# the only way to write several timesteps, and only NetCDF holds a chronicle,
# so `time = "all"` is legal here and refused on a .tif.
[[export.artifacts]]
var = ["head", "watertable_depth"]
dest = "fields_2000_2002.nc"
time = "all"

# Where the catchment is, what enters and leaves it, the gauge against the
# simulation, and where the ground released water in the driest month.
# project.toml carries the full set of twelve.
[display]
figures = [
    "watershed_id_card",
    "flux_timeseries",
    "hydrograph_sim_obs",
    "seepage_map",
]

# A `timestep` is an index into the stress periods, so it has to be restated
# whenever the step changes.
[display.overrides.seepage_map]
timestep = 33
