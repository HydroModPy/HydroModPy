# Step 5: step 4 with its results written out, one [[export]] block per kind.
# The model does not change. Files land in share/nancon_step5_export/.
#
#   hmp run step5_export.toml
#   hmp export nancon_step5_export --list    what the run can export

base_config = "step4_transient.toml"

# Steps 1 to 4 already export a few files. This step writes its own list
# instead: the inherited blocks are dropped first.
export__delete = true

[simulation]
name = "nancon_step5_export"

# The catchment and the mapped network: GeoPackage. Step 3 writes the same
# for BD Topage, with the permanent reaches apart.
[[export]]
variables = ["watershed", "hydrographic_network_reference"]

# The same catchment as a Shapefile.
[[export]]
variables = "watershed"
format = "shapefile"

# The DEM the catchment was cut from: GeoTIFF.
[[export]]
variables = "watershed_dem"

# The water table in October 2002: one GeoTIFF per variable.
[[export]]
variables = ["head", "watertable_depth", "seepage_mask"]
time = "2002-10-15"

# The simulated active network that month, as mesh cells in a GeoPackage.
[[export]]
variables = "simulated_active_network"
time = "2002-10-15"
format = "geopackage"

# The whole record of the water table: one NetCDF chronicle.
[[export]]
variables = ["head", "watertable_depth"]
file = "watertable_2000_2002.nc"

# Simulated and gauged discharge over the two scored years: CSV.
[[export]]
variables = ["discharge", "discharge_obs"]
period = ["2001-01-01", "2002-12-31"]

# The monthly water budget: CSV.
[[export]]
variables = "budget"

# A web-map layer, reprojected; the extension gives the format.
[[export]]
variables = "watertable_depth"
time = "2002-10-15"
file = "watertable_depth_wgs84.tif"
crs = "EPSG:4326"

# ParaView.
[[export]]
variables = "head"
time = "2002-10-15"
format = "vtu"

# The portable archive of the run.
[[export]]
variables = "all"
format = "package"

# One figure beside most exports: the same data, drawn instead of written.
[display]
figures = [
    "watershed_id_card",
    "flux_timeseries",
    "hydrograph_sim_obs",
    "watertable_depth_map",
    "seepage_map",
    "seepage_network_confusion_map",
    "downslope_distance_map",
    "flow_persistence_map",
]
