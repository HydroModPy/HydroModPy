# Nancon, step 4 with its results written out. Nothing about the model changes:
# this file is the export and the figures, and it is four levels deep,
# step 5 over step 4 over step 2 over step 1, which is what a nested config
# looks like once the nesting has stopped being the point.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/step5_export.toml
#
# A key comes from the nearest ancestor that writes it and a table merges key
# by key, so the whole chain has to be read before a value is known. That is
# the price of not repeating it, and it is paid here rather than explained:
# `hmp config check` on this file resolves all four.

base_config = "step4_transient.toml"

[simulation]
name = "nancon_step5_export"

# What the run writes out on its own, under `share/nancon_step5_export/`.
#
# A format toggle does not name a file. It writes one file per variable that
# [export.variables] leaves active, and `head` and `derived` are both on by
# default, so the two toggles below produce five files and not two:
#
#   head_t33.tif                  the simulated head
#   watertable_elevation_t33.tif  the three derived fields
#   watertable_depth_t33.tif
#   seepage_mask_t33.tif
#   timeseries.csv                every series of tables.parquet, all 36 steps
#
# Naming [export.variables] explicitly is how that set is narrowed:
# `concentration` is off here because this run solves no transport, and
# `derived = false` would leave the head alone.
#
# `times` is an index into the 36 stress periods. 33 is October 2002, the
# driest month of the record and the one where the intermittence is visible at
# all; the default, the last step, is a December with a nearly full network.
# A GeoTIFF holds one timestep, so that index is the whole story for the four
# rasters. The time-series CSV ignores it and always covers every step.
# No `resolution`: the pixel size comes from the mesh, and naming one would
# only resample a result that has no finer content.
[export]
geotiff = true
csv_timeseries = true
times = 33

# The other formats are toggles beside those two: `netcdf`, `vtu`, `shapefile`,
# and `package` for a portable `.hmp` archive of the whole run. GeoPackage has
# no toggle and is reachable only through the form below.
#
# [[export.artifacts]] names one file instead of following a convention: a
# variable or a list of them, a destination whose extension picks the format
# (.tif .nc .csv .shp .gpkg .vtu .hmp), and its own timestep selector. A
# relative destination lands beside the five files above.
#
# It is also the only way to write several timesteps at once. NetCDF is the one
# format that holds a chronicle, so `time = "all"` is legal here and would be
# refused on a .tif, which holds one step per file.
[[export.artifacts]]
var = ["head", "watertable_depth"]
dest = "fields_2000_2002.nc"
time = "all"

# Four figures, in reading order: where the catchment is, what enters and
# leaves it, what the gauge saw against what was simulated, and where the
# ground was releasing water in that driest month. project.toml carries the
# full set of twelve; this is the short list a first run is read on.
[display]
figures = [
    "watershed_id_card",
    "flux_timeseries",
    "hydrograph_sim_obs",
    "seepage_map",
]

# The same instant as the export above, for the same reason. A `timestep` is an
# index into the stress periods, so it has to be restated whenever the step
# changes.
[display.overrides.seepage_map]
timestep = 33
