# Nancon, the same model, calibrated. The `[calibration]` block lives in
# project.toml; this file only makes `hmp run` dispatch it and gives the
# calibrated result a name of its own, so it sits beside the assumed-values run
# in the catalog instead of replacing it.
#
#   hmp run       .../run_calibration.toml                both stages, in order
#   hmp calibrate .../run_calibration.toml                the same two stages
#   hmp calibrate .../run_calibration.toml --list-phases  each stage: method, width, what it compares
#   hmp calibrate .../run_calibration.toml --expand       the stages the protocol writes, as TOML
#   hmp calibrate .../run_calibration.toml --check        every problem at once, no solve

base_config = "project.toml"

# One of: simulation, calibration, overview, comparison, testbed,
# site_selection.
[workflow]
mode = "calibration"

[simulation]
name = "nancon_intermittence_mf6_calibrated"
description = "Nancon catchment, K from the mapped network then Sy from the gauge."

# The bounds, the protocol, the scoring window and the figures stay the
# parent's. Tables merge key by key, so a variant narrows one of them with one
# line:
#
#   [calibration.protocol]
#   steady_tolerance = 0.05   # five per cent on K, 12 trials instead of 15
#
#   [calibration.parameters.K]
#   bounds = [1e-6, 1e-4]     # every other key of the table is kept
