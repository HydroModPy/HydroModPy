# Nancon catchment, monthly transient 2000-2002, MODFLOW 6. As recharge swings
# between wet winters and dry summers, the seepage cells and the active network
# expand and contract.
#
# The frozen reference of the example: the step files teach, this one is
# compared. The run_calibration*.toml files calibrate it.
#
#   hmp run project.toml

[workflow]
mode = "simulation"
# verbosity = "quiet" | "normal" (default) | "verbose" | "debug", overridden by
# `hmp run -q | -v | --debug`. step1_minimal.toml says what each level prints.

[workspace]
project_root = "."

[simulation]
name = "nancon_intermittence_mf6"
description = "Nancon catchment, monthly transient 2000-2002, seasonal seepage intermittence."
if_exists = "replace"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

# The per-cell seepage the network criterion reads.
[simulation.results.derived]
release_flux = true

[simulation.results.budget]
spatial_fields = true

[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "DEM_armorican_massif.tif"
x_outlet = 389285.910
y_outlet = 6816518.749
snap_dist = "150 m"
# "10%" is an area increase: the buffered domain covers 10 % more area than the catchment.
buff_area = "10%"

# No stream burning: the network criterion fills the model top on the mesh and
# descends that, not a routing DEM. Off by default, the snap below moves the
# mapped network onto the talwegs of that surface, within two cells. "diagnose"
# publishes how far the map sits from them and scores the raw map; "apply"
# scores the snapped map. Either one changes the validity length of Eq. 4, and
# "apply" the calibrated K, so the maintained results keep it off.
#
# [geographic.snap_streams]
# mode = "diagnose"

[domain.depth_model]
kind = "constant_thickness"
thickness = "30.0 m"


[data]
types = ["dem", "hydrography", "hydrometry", "recharge", "runoff"]

[[data.dem.sources]]
source = "custom"
path = "DEM_armorican_massif.tif"

[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
station_ids = ["NANCON"]

[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON"]

[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON"]


[flow]
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
# Seepage at the ground surface. No conductance is declared, so each drain
# derives it from K, C = K * cell_area / drain_bed_thickness_m (1 m by default):
# the drain follows K, which is why the network stage identifies K/R.
active_bc = ["drainage"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 5e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.05

[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

[display]
on_error = "raise"
# Every one-instant figure draws October 2002, the driest month of the record.
# The default, the last period, is a December with a nearly full network.
time = "2002-10-15"

# The catchment, what enters and leaves it, the gauge, the water table, then
# the five that answer which reaches dry up, when, and how far from the map.
# `hmp viz show <name>` renders any other figure on demand,
# network_extent_bounds_map among them: the yearly maximal and minimal
# simulated extents against the map.
#
# hydrograph_log_nse draws the same series as hydrograph_sim_obs on the axis an
# intermittent catchment is read on, and marks the window stage two scores.
#
# The five after the blank line only apply to a run the calibration promoted,
# and skip themselves, with a reason, on a plain `hmp run`. calibration_progress
# is the slide of the search: the value tried, the cost and what improves, run
# after run.
figures = [
    "watershed_id_card",
    "flux_timeseries",
    "hydrograph_log_nse",
    "cross_section",
    "watertable_depth_map",
    "seepage_map",
    "flow_persistence_map",
    "flow_intermittence_map",
    "seepage_network_confusion_map",
    "downslope_distance_map",

    "downslope_distance_crossing",
    "bisection_bracket_trace",
    "parameter_cost_profile",
    "matching_hydrographic_network_card",
    "calibration_progress",
]

# South to north through the outlet, so the section cuts the tributaries
# across. The west-east default crosses the valley once, at the southern edge.
[display.overrides.cross_section]
orientation = "sn"

# Persistence answers over the three years, intermittence classifies inside one
# cycle. Both name their window in the title, so the cells that flowed in
# 2000-2001 and never in 2002 read as a dry year.
[display.overrides.flow_intermittence_map]
cycle = "2002"

# The window the calibrations score, 2000 being spin-up, shaded on the figure.
[display.overrides.hydrograph_log_nse]
scoring_window = ["2001-01-01", "2002-12-31"]

# What each run writes to share/<run>/. The files based on this one inherit
# the four blocks: a calibration writes them for every run it promotes.

# The catchment and the mapped network: GeoPackage.
[[export]]
variables = ["watershed", "hydrographic_network_reference"]

# The water table and the seepage cells of October 2002: one GeoTIFF each.
[[export]]
variables = ["watertable_depth", "seepage_mask"]
time = "2002-10-15"

# Simulated and gauged discharge over the run: CSV.
[[export]]
variables = ["discharge", "discharge_obs"]

# The water budget of every period: CSV.
[[export]]
variables = "budget"
