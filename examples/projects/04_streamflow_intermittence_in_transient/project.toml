# Nancon catchment, monthly transient 2000-2002, MODFLOW 6. As recharge swings
# between wet winters and dry summers, the seepage cells and the active network
# expand and contract.
#
#   hmp run       <this file>    simulate at the values below
#   hmp calibrate <this file>    K from the mapped network, Sy from the gauge

[workflow]
mode = "simulation"

[workspace]
project_root = "."

[simulation]
name = "nancon_intermittence_mf6"
description = "Nancon catchment, monthly transient 2000-2002, seasonal seepage intermittence."
if_exists = "replace"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

# The per-cell seepage the network criterion reads.
[simulation.results.derived]
release_flux = true

[simulation.results.budget]
spatial_fields = true

[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "DEM_armorican_massif.tif"
x_outlet = 389285.910
y_outlet = 6816518.749
snap_dist = "150 m"
buff_area = "10%"

[geographic.river_network]
enabled = true
threshold_area_km2 = 0.5

# The criterion measures lengths along the flow paths of the DEM, so the mapped
# network has to sit in them. Burnt from [[data.hydrography.sources]].
[geographic.enforce_streams]
enabled = true
depth_m = 10.0

[domain.depth_model]
kind = "constant_thickness"
thickness = "30.0 m"


[data]
types = ["dem", "hydrography", "hydrometry", "recharge", "runoff"]

[[data.dem.sources]]
source = "custom"
path = "DEM_armorican_massif.tif"

[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
station_ids = ["NANCON"]

[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON"]

[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON"]


[flow]
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 5e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.05

[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

[flow.bc.drainage]
kind = "cauchy"

# K from the extent of the mapped network in steady state, then Sy from the
# gauged hydrograph with K frozen. Abherve et al. 2023, 10.5194/hess-27-3221-2023.
[calibration]
seed = 42
save_runs = "best_n"
save_best_n = 1
rerun_best_with_outputs = true
persist_iteration_detail = "full"

[calibration.parameters.K]
bounds = [1e-7, 1e-3]

[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"
# A descent over shared edges cannot follow a talweg that runs diagonally to the
# grid, which on this topography most of them do.
diagonal_neighbors = true

[calibration.protocol]
name = "matching_hydrographic_network"
steady_max_iter = 18
steady_tolerance = 0.01
transient_max_iter = 30
transient_tolerance = 0.05

# The coarse log sweep before the bisection: it checks the monotonicity the
# method assumes instead of supposing it.
[calibration.protocol.steady_engine_options]
sweep_points = 7

# 2000 is simulated and not scored.
[calibration.protocol.scoring_window]
start = "2001-01-01"
end = "2002-12-31"

# The stage-one cost is a distance in metres solved at zero, so a fraction of it
# is zero. 75 m is one cell of this mesh. Read the interval on K, not on Sy.
[calibration.uncertainty]
mode = "absolute"
tolerance = 75.0



[display]
on_error = "raise"

# Eight figures, read in this order: the catchment, what enters and leaves it,
# what the gauge saw, then the four that answer the question the example asks,
# which reaches dry up and when. Nothing here is drawn twice: a figure that
# restates another one on a different axis was dropped rather than kept as a
# second opinion. `hmp viz show <name>` renders any of the others on demand.
#
# One hydrograph, not three: hydrograph_log_nse draws the same simulated and
# observed series as hydrograph_sim_obs, on the axis an intermittent catchment
# is read on, and marks the window the second calibration stage scores.
#
# The four after the blank line only apply to a run the calibration promoted,
# and skip themselves, with a reason, on a plain `hmp run`.
figures = [
    "watershed_id_card",
    "flux_timeseries",
    "hydrograph_log_nse",
    "cross_section",
    "seepage_map",
    "flow_persistence_map",
    "flow_intermittence_map",
    "seepage_network_confusion_map",

    "downslope_distance_crossing",
    "bisection_bracket_trace",
    "parameter_cost_profile",
    "matching_hydrographic_network_card",
]

# Every figure that draws one instant draws the SAME instant: step 34 of 36,
# October 2002, the driest month of the record, and the month that makes the
# point. The default, the last timestep, is a December: the network is nearly
# full there and the maps show an intermittence no reader can see.
[display.overrides.seepage_map]
timestep = 33

# South to north through the outlet: the west-east default crosses the valley
# once, at the southern edge of the catchment. This one cuts the tributaries
# across, so the water table shows one dome per interfluve and touches the
# ground at each seepage face.
[display.overrides.cross_section]
timestep = 33
orientation = "sn"

# The two cells maps do not cover the same window, and that is the point:
# persistence answers over the three years, intermittence classifies inside
# one. Both now name their window in the title, so the 787 cells that flowed
# in 2000-2001 and never in 2002 read as a dry year and not as a contradiction.
[display.overrides.flow_intermittence_map]
cycle = "2002"

# The window [calibration.protocol.scoring_window] scores, so the figure shades
# the samples the NSElog reads instead of announcing it was not told.
[display.overrides.hydrograph_log_nse]
scoring_window = ["2001-01-01", "2002-12-31"]
