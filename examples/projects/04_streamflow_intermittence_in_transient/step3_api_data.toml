# Nancon, the model of step 2 with the network and the gauge fetched instead of
# read off disk. Only the provenance changes, so read it beside step 2 rather
# than after it. Needs network access; both services are French national ones
# and neither asks for a key. The DEM stays the local file of step 1: the IGN
# Geoplateforme elevation endpoint answers 403 from here.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/step3_api_data.toml

base_config = "step1_minimal.toml"

[simulation]
name = "nancon_step3_api"

[data]
types = ["hydrography", "hydrometry"]

# BD TOPAGE, the Sandre reference network, 99 features over this catchment. No
# path and no layer name: the download box comes from the delineated watershed,
# which is why step 1 sets [geographic] crs_project.
[[data.hydrography.sources]]
source = "bdtopage"

# A local CSV is read over whatever period it covers; an API has to be told
# one, and this steady run declares no [simulation.time]. The window is the one
# step 4 simulates.
[data.hydrometry]
date_start = "2000-01-01"
date_end = "2002-12-31"

# Hub'Eau. `QmM` is the monthly mean discharge, `QmnJ` the daily one, and the
# model this feeds runs on months. The stations are discovered inside the
# watershed rather than named, so a renumbering of the gauge does not break the
# file.
[[data.hydrometry.sources]]
source = "hubeau"
product = "QmM"
extent = "watershed"

# Nothing else, for the reason step 2 gives. The heads come out identical to
# step 2's to the bit: same model, two provenances.
