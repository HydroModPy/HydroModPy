# Step 3: step 2 with the network and the gauge fetched from French national
# APIs, BD Topage and Hub'Eau, instead of read off disk. Only the sources
# change. Needs network access, no key.
#
#   hmp run step3_api_data.toml

base_config = "step2_local_data.toml"

[simulation]
name = "nancon_step3_api"

# `sources__delete` drops step 2's list, so no local key leaks into the new one.
[data.hydrography]
sources__delete = true

# BD Topage: every reach with its permanence, the permanent ones kept apart.
# The download box comes from the delineated watershed.
[[data.hydrography.sources]]
source = "bdtopage"

# An API needs a period; the one step 4 simulates.
[data.hydrometry]
sources__delete = true
date_start = "2000-01-01"
date_end = "2002-12-31"

# Hub'Eau daily mean discharge of "Le Nançon à Lécousse - Pont aux Anes".
[[data.hydrometry.sources]]
source = "hubeau"
product = "QmnJ"
station_ids = ["J001401001"]

# The BD Topage network, all reaches then the permanent class, then the
# simulated seepage against all reaches.
[display]
figures = [
    "watershed_id_card",
    "hydrographic_network_reference",
    "hydrographic_network_permanence",
    "seepage_network_confusion_map",
    "downslope_distance_map",
]

# Step 2's exports, where the network is now all BD Topage reaches, plus the
# permanent reaches as a GeoPackage of their own.
[[export__append]]
variables = "hydrographic_network_reference_permanent"
