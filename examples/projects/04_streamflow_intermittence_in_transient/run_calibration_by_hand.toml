# Nancon, the two stages of project.toml written out instead of named:
#
#   1. K alone, steady over the record, moved until the simulated seepage
#      network matches the mapped one. No discharge record enters it.
#   2. Sy alone, monthly transient, K frozen at what stage one found, scored on
#      the gauged hydrograph and, here only, on the network.
#
# `depends_on` and `freeze_on_success` are what "then" means, and both stages
# run in one call. The long form can deviate, which this file does once; it
# loses the citation a protocol run records. Abherve et al. (2023),
# 10.5194/hess-27-3221-2023.
#
#   hmp calibrate .../run_calibration_by_hand.toml --list-phases   the assembly, no solve
#   hmp calibrate .../run_calibration_by_hand.toml --check         every problem at once, no solve
#   hmp calibrate .../run_calibration_by_hand.toml                 both stages, in order
#   hmp run       .../run_calibration_by_hand.toml                 the same, dispatched by mode

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "nancon_intermittence_mf6_by_hand"
description = "Nancon, K from the mapped network then Sy from the gauge and the network, stages written by hand."


[calibration]
# A file may not both name a protocol and declare its own stages. `__delete`
# drops the inherited name; the bounds, the network output, the uncertainty
# tolerance and the seed are kept.
protocol__delete = true


# The gauge as an output. The protocol scores stage two through the
# single-metric route, which names a variable and a station and declares no
# output; two criteria cannot use that route. `support = "point"` with
# `observes` reads what that route reads, which keeps the two costs
# comparable: the station's cell with the runoff over the area it drains, or
# the whole-catchment series when no cell was matched, which is this project.
# x and y are never read once `observes` is set.
[calibration.outputs.gauged_discharge]
support = "point"
variable = "discharge"
observes = "NANCON"
x = 389285.910
y = 6816518.749

# Stage one, and half of stage two. The signed difference of Eq. 1, cost
# |D_so - D_os| in metres. The other estimator, `distance_mean`, has an
# interior minimum instead of a zero crossing, so swapping it means swapping
# `method` on the steady stage too; `--check` refuses the mismatched pair.
[[calibration.objective_blocks]]
name = "network_extension"
metric = "distance_gap"
uses_outputs = ["seepage_network"]
# An exchange rate between metres and an efficiency, which nothing in the
# machinery can set. Normalized to sum to one, so the trial cost is
# 0.0099 * |gap in m| + 0.990 * (1 - NSElog); over the sixteen trials of stage
# two the two terms weighed about the same, which is the intent. Both are
# reported per trial, as `network_extension.total` and `hydrograph.total`.
weight = 0.01

# The other half of stage two. NSE on the logarithms, which weights the
# recessions where storage shows. Not `transform = "log"`, which takes the
# logarithm of an already computed cost.
[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["gauged_discharge"]
weight = 1.0
# The year 2000, dropped from this block alone. A scoring_window would say the
# same in dates and is refused here: it cuts a record on its dates, and the
# network block of the same stage is scored on distances that carry none.
warmup = 12


# Stage one: K against the mapped network, in steady state. The record becomes
# one period of 1096 days, 2000 being a leap year, and the recharge over it
# averages to the mean the criterion is defined at. A steady solve carries no
# storage, which is what makes K identifiable without a discharge record.
[[calibration.phases]]
name = "steady_conductivity"
description = "Match the simulated seepage network to the mapped one by moving K, steady state over the record."
# A root search, not a minimiser: the criterion is a step function that jumps
# over zero once in the four decades of the bracket. Bisection refuses a
# parameter that is not searched in log space, and refuses more than one.
method = "bisection"
max_iter = 18
# One per cent on K itself, the paper's precision. On a log-transformed
# parameter that is a ratio, which is how a conductivity is known.
tolerance = 0.01
parameters = ["K"]
objective_blocks = ["network_extension"]
# Stage two inherits this K and may not move it.
freeze_on_success = true

# A coarse log sweep before the bisection, to check the monotonicity the method
# assumes and see every crossing rather than the first. 0 gives the pure
# bisection of the paper.
[calibration.phases.optimizer_kwargs]
sweep_points = 7

# An override is a dotted path into the whole configuration, not only into the
# model. The last two lines are what makes this stage draw its two maps:
# project.toml points them at step 33 of the monthly run, and this stage solves
# one period.
[calibration.phases.overrides]
"flow.flow_regime" = "steady"
"simulation.time.start_datetime" = "2000-01-01"
"simulation.time.end_datetime" = "2002-12-31"
"simulation.time.step_unit" = "day"
"simulation.time.step_value" = 1096
"display.overrides.seepage_map.timestep" = 0
"display.overrides.cross_section.timestep" = 0


# Stage two: Sy against the hydrograph and the network, transient. The time
# grid is the parent's; only the regime is restated.
#
# The deviation: the published method scores this stage on the hydrograph
# alone. A network output in a transient run is read at the last stress period
# whatever its `time` says, so the block compares the December 2002 network
# with the mapped one. December is a month of refilling, which a small Sy
# refills at once and a large one still holds retracted, so the term is
# sensitive to the storage without averaging the 36 months. Scoring the
# seasonal extension properly needs an intermittence record, Abherve et al.
# (2024), doi:10.1002/hyp.15167, and the ONDE series here starts in 2012.
#
# The stage warns that the mean recharge moved between two builds of the
# criterion. The warning guards the ratio K/R while K is calibrated, which is
# stage one; here K is frozen.
#
# It produced K = 9.763e-05 m/s at a 2.7 m gap, then Sy = 0.083 at a December
# gap of 15.2 m and NSElog = 0.810. Without the network block, which is what
# the protocol runs, the same K and Sy = 0.055 at NSElog 0.841.
[[calibration.phases]]
name = "transient_storage"
description = "Read Sy from the gauged hydrograph and the December network, K frozen, monthly transient."
method = "scipy_nelder_mead"
max_iter = 30
# Five per cent on Sy, which is not known to one per cent, and each evaluation
# here is a full 36-month run.
tolerance = 0.05
parameters = ["Sy"]
objective_blocks = ["hydrograph", "network_extension"]
depends_on = "steady_conductivity"

[calibration.phases.overrides]
"flow.flow_regime" = "transient"


# Back to the published method: replace the `objective_blocks` line of
# `transient_storage` with the single-metric route, which declares no output
# and needs no station named, one gauge being loaded.
#
#   variable  = "discharge"
#   objective = "nse_log"
#
#   [calibration.phases.scoring_window]
#   start = "2001-01-01"
#   end   = "2002-12-31"
#
# A window is legal there: the stage scores one record and no dateless block is
# left in it. [calibration.outputs.gauged_discharge], the `hydrograph` block
# and its `warmup` then have nobody left to read them.
