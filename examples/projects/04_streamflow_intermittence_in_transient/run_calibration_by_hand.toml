# Nancon, the method of run_calibration.toml written out as two phases. It runs
# the same trials; only the citation a protocol run records is lost.
# `hmp calibrate run_calibration.toml --expand` prints what this file follows.
#
#   hmp calibrate run_calibration_by_hand.toml --list-phases   same lines as run_calibration.toml
#   hmp run       run_calibration_by_hand.toml                 both phases, in order

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "nancon_intermittence_mf6_by_hand"
description = "Nancon, K from the mapped network then Sy from the gauge."

[calibration]
rerun_best_with_outputs = true

[calibration.parameters.K]
bounds = [1e-7, 1e-3]

[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

# An output is a simulated quantity with its observation.
[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"

# The loaded record of station NANCON, on the simulated months.
[calibration.outputs.hydrograph]
support = "point"
variable = "discharge"
observes = "NANCON"

# A block scores outputs with one metric. Eq. 1: the network gap in metres,
# zero when the simulated network reaches as far as the mapped one.
[[calibration.objective_blocks]]
name = "network_extension"
metric = "distance_gap"
uses_outputs = ["seepage_network"]

# NSE on log discharge, which weights the recessions where storage shows.
[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["hydrograph"]

# Phase one: K alone, one steady period over 2000-2002, bisection on log K.
[[calibration.phases]]
name = "steady_conductivity"
description = "Match the simulated seepage network to the mapped one by moving K, steady state over the record."
parameters = ["K"]
regime = "steady"
objective_blocks = ["network_extension"]
method = "bisection"

# Phase two: Sy alone, monthly transient, K from phase one. It does not start
# if phase one did not converge.
[[calibration.phases]]
name = "transient_storage"
description = "Read Sy from the observed hydrograph, K frozen, transient, scored from 2001-01-01 on, the first year of the run left out as spin-up."
parameters = ["Sy"]
regime = "transient"
objective_blocks = ["hydrograph"]
method = "scipy_nelder_mead"
max_iter = 30
tolerance = 0.05
depends_on = "steady_conductivity"

# 2000 is spin-up: simulated, not scored.
[calibration.phases.scoring_window]
start = "2001-01-01"
