# Nancon, K and Sy together in one transient search, on two criteria at once:
# the seepage network of October 2002 and the gauged discharge. Where
# run_calibration.toml chains two stages, this file composes the criteria.
#
#   hmp calibrate run_calibration_composite.toml --list-phases   the blocks and their shares
#   hmp run       run_calibration_composite.toml                 about one hour: 60 runs of 1 min

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "nancon_intermittence_mf6_composite"
description = "Nancon, K and Sy together, monthly transient, network and hydrograph."

[calibration]
seed = 42

[calibration.parameters.K]
bounds = [1e-7, 1e-3]

[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

# The network of one month against the permanent map. October 2002 is the
# driest month, the state a map of permanent reaches describes.
[calibration.outputs.seepage_network]
support = "network"
time = "2002-10-15"

# The record of the gauge of [site]: a point output that names no station
# observes the gauge.

[calibration.outputs.seepage_network.map]
complete = "nancon_stream_network.gpkg"
[calibration.outputs.hydrograph]
support = "point"
variable = "discharge"

# The mean distance divided by the validity length (150 m here), so it adds to an NSE.
[[calibration.objective_blocks]]
name = "network"
metric = "distance_mean"
uses_outputs = ["seepage_network"]
normalize_cost = true

[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["hydrograph"]

[[calibration.phases]]
name = "conductivity_and_storage"
description = "K and Sy together, monthly transient, on the gauge and the October 2002 network."
parameters = ["K", "Sy"]
regime = "transient"
# Shares of the cost, normalized to sum to one.
objective_blocks = { hydrograph = 0.7, network = 0.3 }
# Two parameters and a cost with plateaus: a global sampler, reproducible
# with the seed above. It stops on budget only.
method = "optuna"
max_trials = 60

# 2000 is spin-up: both criteria are read from 2001 on.
[calibration.phases.window]
start = "2001-01-01"

# Its own figure list: the bisection figures of project.toml read a search on
# K alone. The cost profile and the distance crossing read K here, each trial
# at its own Sy. The exports are those of project.toml.
[display]
[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
preset = "water_budget"

[[display.figure]]
preset = "hydrograph"
scale = "log"
name = "hydrograph_log"

[[display.figure]]
variable = "discharge"
type = "xy"
observed = true
reference = ["one_to_one"]

[[display.figure]]
variable = "watertable_depth"

[[display.figure]]
variable = "seepage_mask"

[[display.figure]]  # replaces flow_persistence_map, flow_intermittence_map
variable = "simulated_active_network"
reduce = "frequency"

[[display.figure]]
variable = "network_agreement"

[[display.figure]]
variable = "downslope_distance"
scale = "log"

[[display.figure]]
preset = "calibration_progress"
when = "session"

[[display.figure]]
variable = ["trials.parameter", "trials.cost"]
type = "xy"
facet = "parameter"
when = "session"
# parameter = "K" has no equivalent: the new request has no such field

[[display.figure]]
preset = "root_search"
when = "session"
# parameter = "K" has no equivalent: the new request has no such field
