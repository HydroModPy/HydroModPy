# Nancon, the complete simulation: three years at a monthly step, with storage
# and the observed forcing. K, Sy and Ss are assumed here, not calibrated;
# run_calibration.toml fits them. About 44 s on 27004 cells.
#
#   hmp run examples/projects/04_streamflow_intermittence_in_transient/step4_transient.toml

base_config = "step2_local_data.toml"

[simulation]
name = "nancon_step4_transient"

# One month is the schema default, and 2000-2002 is the window the observed
# series cover. The first period is solved steady and gives the transient run
# its initial heads, so no [flow.ic] is needed.
[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"

# The per-cell seepage. Without it the run stores heads and budgets, and which
# reaches dry up and when has no field to be read off.
[simulation.results.derived]
release_flux = true

[flow]
# Restated although transient is also the schema default: step 1 declared
# steady, and an inherited value is not undone by a default.
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]

# Sy is not restated: step 1 declares it at 0.05 and the value is inherited.
# Only Ss is new here.

# Only matters where the aquifer is confined, which on 30 m of free-surface
# regolith is nowhere. Declared because MODFLOW 6 asks for a value.
[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# `__append` keeps the two families step 2 declares; a plain `types = [...]`
# would replace them.
[data]
types__append = ["recharge", "runoff"]

# The 36 monthly rates supersede the single mean of step 1: a series loaded
# from a data source replaces [flow.sinks_sources.recharge] entirely, value and
# unit alike.
[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON"]

# Surface runoff is not a flow package: it is the share of the gauged discharge
# the groundwater model does not produce. Without it the simulated baseflow is
# compared against a total it cannot reach.
[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON"]
