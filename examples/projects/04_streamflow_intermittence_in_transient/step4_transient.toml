# Step 4: step 2 in monthly transient over 2000-2002, forced by the local
# monthly recharge and runoff. K, Sy and Ss are assumed, not calibrated.
# It builds on the local data of step 2; step 3 is the same model on API data.
#
#   hmp run step4_transient.toml

base_config = "step2_local_data.toml"

[simulation]
name = "nancon_step4_transient"

# One month is the default step. The first period is solved steady and gives
# the initial heads.
[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"

[flow]
# Restated: an inherited "steady" is not undone by the default.
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]

# Only matters where the aquifer is confined; MODFLOW 6 asks for a value.
[flow.param.Ss.field]
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# A list replaces the parent's, so the four families are written out.
[data]
types = ["hydrography", "hydrometry", "recharge", "runoff"]

# 36 monthly rates replace the steady mean of step 1.
[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON"]

# The share of the gauged discharge the groundwater model does not produce.
[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON"]

# What enters and leaves, the gauge against the simulation, the seepage of
# October 2002, the driest month, then which cells flow and for how long:
# the share of the three years each cell flows, and its class in 2002.
[display]
time = "2002-10-15"
figures = [
    "flux_timeseries",
    "hydrograph_sim_obs",
    "seepage_map",
    "flow_persistence_map",
    "flow_intermittence_map",
]

# One hydrological year, the driest of the record.
[display.overrides.flow_intermittence_map]
cycle = "2002"

# The exports of steps 1 and 2, now of a transient run: the GeoTIFFs hold
# December 2002, the last month. Two blocks more for what a record adds.

# The water table over the 36 months: one NetCDF chronicle.
[[export__append]]
variables = ["head", "watertable_depth"]

# Simulated and gauged discharge over the run: CSV, the model monthly and
# the gauge daily.
[[export__append]]
variables = ["discharge", "discharge_obs"]
