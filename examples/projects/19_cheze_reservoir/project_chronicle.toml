# ======================================================================
# HydroModPy - Cheze reservoir (EBR), MODFLOW 6 LAK, DAILY full chronicle.
#
# Full-chronicle variant of project.toml: daily timestep over the entire
# observed/management record (2007-2025) instead of the 2019 weekly demo.
# Pair it with compare_chronicle.py for the simulated-vs-observed lake-level
# comparison (NSE / RMSE / R2 / bias + overlay figure).
#
# The managed inflow/withdrawal chronicles and the observed level all come
# from the same source (data_cheze_corrige.csv, 2007-2026); meteo comes from
# the SIM2 Meteo-France API. A ~19-year daily run is ~6940 stress periods:
# expect a large first-run SIM2 fetch and a multi-minute solve.
# ======================================================================

[workflow]
mode = "simulation"

[workspace]
project_root = "."

[simulation]
name = "cheze_reservoir_chronicle"
description = "Cheze reservoir (EBR), MODFLOW 6 LAK, daily 2007-2025, recharge from SIM2."

[simulation.time]
start_datetime = "2007-01-01"
# Inclusive-end semantics; any calendar day is a valid daily-step boundary.
# 2025-12-31 = the last day SIM2 covers and the last full observed year.
end_datetime = "2025-12-31"
step_value = "1 day"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]   # LAK is a MODFLOW 6 advanced package; modflow6 is required.

# ---------------------------------------------------------------------- geographic
[geographic]
source_mode = "standard"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
# Mask the active groundwater domain to the delineated catchment: only the
# watershed's recharge and hillslope drainage feed the reservoir (the full
# rectangular box would over-collect ~2.5x and peg the lake at the spillway).
domain_extent = "watershed"

[geographic.catchment]
catch_def = "from_outlet_coord"
# Bare filename: resolved via the workspace data convention into
# <workspace>/data/dem/ (this project sits at <workspace>/projects/<name>/).
dem_init_path = "DEM_armorican_massif.tif"
x_outlet = 331315.0
y_outlet = 6781273.0
snap_dist = "200 m"
buff_area = "10%"

# Stream network products for the SFR delineation (see project.toml).
[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
compute_stream_links = true
compute_strahler_order = true

# ---------------------------------------------------------------------- domain
[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "35.0 m"

# ---------------------------------------------------------------------- data
[data]
types = ["recharge", "precipitation", "etp", "runoff", "lake_geometry", "lake_abacus", "lake_inflow", "lake_withdrawal"]
inference_mode = "warn"

# All meteo comes from the SIM2 Meteo-France EDR API over the full window.
[data.recharge]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.recharge.sources]]
source = "sim2"
extent = "watershed"

[data.precipitation]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.precipitation.sources]]
source = "sim2"
extent = "watershed"

[data.etp]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.etp.sources]]
source = "sim2"
extent = "watershed"

[data.runoff]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.runoff.sources]]
source = "sim2"
extent = "watershed"

# Reservoir footprint polygon (EPSG:2154) -> LAK cell selection.
[[data.lake_geometry.sources]]
source = "custom"
path = "reservoir_cheze.gpkg"

# Stage-volume-area abacus -> ModflowUtllaktab.
[[data.lake_abacus.sources]]
source = "custom"
path = "reservoir_cheze.csv"
lake_id = "reservoir_cheze"

# Managed transfers INTO the lake (Meu + Canut), m3/day, full chronicle. The
# path names the <workspace>/data/lake_inflow/ directory (location file +
# chronicle CSVs).
[data.lake_inflow]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.lake_inflow.sources]]
source = "custom"
path = "lake_inflow"

# Managed abstraction + restitution leaving the lake, m3/day, full chronicle.
[data.lake_withdrawal]
date_start = "2007-01-01"
date_end = "2025-12-31"
[[data.lake_withdrawal.sources]]
source = "custom"
path = "lake_withdrawal"

# ---------------------------------------------------------------------- flow
[flow]
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["lake", "sfr", "drainage"]
# Steady warm-up around the observed start stage and mean recharge before the
# transient. On a 19-year daily run a bad cold start would propagate for years.
first_period_steady = true

[flow.param.K.field]
kind = "homogeneous"
value = "1e-4 m/s"

[flow.param.Sy.field]
kind = "homogeneous"
value = "0.0001 -"

[flow.param.Ss.field]
kind = "homogeneous"
value = "1e-5 m-1"

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
application_domain = "top"
kind = "cauchy"
value = "0.0 m2/s"
data_value = false

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

# ---- The Cheze reservoir ----------------------------------------------------
[flow.sinks_sources.lakes.reservoir_cheze]
# Lakebed leakance [1/T]; bibliographic 1e-6 m/s used as 1e-6 1/s (1 m equiv.
# bed). Under-dam-leakage calibration handle, refine against observed levels.
bedleak = 1e-6
bedleak_unit = "1/s"
# Observed Cheze level at the window start (2007-01-01), m NGF. The warm-up
# holds the stage there (status CONSTANT) so the chronicle starts exactly at
# the observed level instead of the natural steady equilibrium.
stageinit = "86.97 m"
steady_stage_hold = true
occupied_layers = 1

# Spillway: 35 m concrete crest at 87.3 m; overflow leaves the model.
[[flow.sinks_sources.lakes.reservoir_cheze.outlets]]
couttype = "WEIR"
invert = "87.3 m"
width = "35 m"
lakeout = 0

# Note: inflow/withdrawal and the SIM2 rainfall/evaporation forcings are bound
# automatically from the data families; the catchment runoff is routed through
# the SFR network below and reaches the lake via MVR (see project.toml).

# ---- The Cheze river (SFR streamflow routing) --------------------------------
# Same network as project.toml: delineated reaches truncated at the reservoir
# shoreline, baseflow capture + routed SIM2 runoff + hillslope drainage
# convergence (route_drainage), all delivered to the lake through MVR.
[flow.sinks_sources.sfr.cheze]
stream_threshold_km2 = 1.0
streambed_k = 0.08
streambed_k_unit = "m/day"
streambed_thickness = "0.1 m"
manning = 0.03
route_drainage = true
outflow_to_lake = 1

[flow.sinks_sources.sfr.cheze.width]
kind = "constant"
value = "2 m"

# ---------------------------------------------------------------------- solver
[modflow6.runtime]
# COMPLEX for the stiff steady lake-aquifer warm-up; safe for the transient too.
mf6_ims_complexity = "COMPLEX"
# 1 cm outer head-change criterion: ample for a catchment reservoir and cuts
# wasted outer iterations across ~6940 daily periods.
mf6_outer_dvclose = 1e-2

[modflow6.process_specific]
# Offload the time-varying lake forcings to external MF6 TS6 files instead of
# inlining ~6940 LAK PERIOD rows per forcing. "auto" already does this above
# ts6_min_periods (120); set explicitly for the long daily run.
lak_forcing_mode = "ts6"

[modflow6.sgrid.planar]
# ~100 m (60x60) grid; the native ~75 m grid is too heavy/stiff. Period count,
# not per-solve size, drives the long-run cost, so do not refine here.
mode = "resample_to_shape"
nx = 60
ny = 60
resampling = "bilinear"

[modflow6.sgrid.vertical]
genmtd_lay = "constant"
nlay = 2

# ---------------------------------------------------------------------- display
[display]
enabled = true
show = false
save = true
