# Shared MF6 transient replay on the committed 100 km2 outlet-2 basin mesh.
#
# This common base is intentionally flow-only and keeps the geometry stable.
# Child overlays specialize recharge scenarios and hydraulic-property patterns.

[workspace]
project_root = "./results_reused_real_meshes/headwater_100km2_outlet_2_mf6"

[geographic]
# The committed mesh already defines the active planar domain. For this MF6
# mesh-input family, geographic is used only to sample top/bottom surfaces from
# the regional DEM on a stable polygon that matches the committed mesh extent.
catch_def = "from_polyg_shp"
dem_init_path = "../../data/dem/DEM_armorican_massif.tif"
polyg_shp_path = "../../mesh_gallery/100km2/mesh_headwater_100km2_outlet_2_geology_rivers_buffer30/domain_bbox.geojson"
buff_area = "25 m"
crs_project = "EPSG:2154"

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "50.0 m"

[data]
types = ["recharge"]

[mesh_input]
mesh_path = "../../mesh_gallery/100km2/mesh_headwater_100km2_outlet_2_geology_rivers_buffer30/bundle/mesh_2d.msh"
bundle_dir = "../../mesh_gallery/100km2/mesh_headwater_100km2_outlet_2_geology_rivers_buffer30/bundle"

[flow]
flow_regime = "transient"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
param_list = ["K", "Sy", "Ss"]

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "0.0 m2/s"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[simulation]
name = "Headwater 100 km2 MF6 transient reused mesh"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2005-12-31 00:00:00"
step_value = "1 month"
coverage_policy = "warn"

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
display = true
matching_streams = false
native_mesh_npz = true
native_mesh_csv = true
native_mesh_vtu = false
native_mesh_png = true

[postprocess.flow.timeseries]
enabled = true

[display]
enabled = true
show = false
save = true
dpi = 300

[display.flow]
enabled = true
state_triptych = true
recharge_discharge_cumulative = true
watertable_map = true
cross_section = false
streamflow = false
piezometry = false

[modflow6.tgrid]
firstpersteady = false

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 6
lay_decay = 1.35
