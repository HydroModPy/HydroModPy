# Compare three Boussinesq runtime backends on one transient heterogeneous real
# committed 100 km2 basin.
#
# The geometry and cycling chronology stay fixed while the nonlinear runtime and
# surface-interaction closure change under strong lateral K/Sy contrasts.

[method_comparison]
comparison_id = "headwater_100km2_outlet_2_transient_cycling_recharge_heterogeneous_backends"
output_root = "method_comparison/headwater_100km2_outlet_2_transient_cycling_recharge_heterogeneous_backends"
anchors_file = "method_comparison_points.toml"
run_variants = true
continue_on_error = false
reference_variant = "boussinesq_scipy_sparse"

[[method_comparison.variant]]
id = "boussinesq_scipy_sparse"
label = "Boussinesq SciPy sparse transient cycling heterogeneous recharge"
solver = "boussinesq"
mesh_mode = "mesh_input"
mesh_label = "headwater_100km2_outlet_2"
simulation_config = "run_headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous.toml"

[[method_comparison.variant]]
id = "boussinesq_petsc_partition"
label = "Boussinesq PETSc regularized-partition transient cycling heterogeneous recharge"
solver = "boussinesq"
mesh_mode = "mesh_input"
mesh_label = "headwater_100km2_outlet_2"
simulation_config = "run_headwater_100km2_outlet_2_boussinesq_petsc_partition_transient_cycling_recharge_heterogeneous.toml"

[[method_comparison.variant]]
id = "boussinesq_petsc_mixed"
label = "Boussinesq PETSc mixed transient cycling heterogeneous recharge"
solver = "boussinesq"
mesh_mode = "mesh_input"
mesh_label = "headwater_100km2_outlet_2"
simulation_config = "run_headwater_100km2_outlet_2_boussinesq_petsc_transient_cycling_recharge_heterogeneous.toml"

[[method_comparison.observable]]
name = "head_outlet_point"
variable = "watertable_elevation"
support = "point"
anchor_id = "headwater_100km2_outlet_2.outlet"
time = "all"
time_reducer = "last"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
anchor_id = "headwater_100km2_outlet_2.outlet"
time = "all"
unit = "m3/s"

[[method_comparison.observable]]
name = "watertable_elevation_map"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "watertable_depth_map"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"
