# Moderate annual MF6 run on the same 60x60 structured grid as NWT.

base_config = "config_demonstrative_annual_moderate_common.toml"

[workspace]
project_root = "./results_reused_real_meshes/ex12_demo_mod_mf6_s60"

[simulation]
name = "Example 12 moderate annual MF6 on 60x60 structured grid"
run_id = "ex12_demo_mod_mf6_s60"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.sgrid.planar]
mode = "resample_to_shape"
nx = 60
ny = 60

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 6
lay_decay = 1.2
