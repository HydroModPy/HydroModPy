# Compare two real example12 flow solvers on the same committed triangular mesh.
#
# This is the cleanest real-case comparison because MF6 and Boussinesq reuse the
# exact same geometry and forcing family.

[method_comparison]
comparison_id = "example12_fast_shared_mesh"
output_root = "method_comparison/example12_fast_shared_mesh"
anchors_file = "method_comparison_points.toml"
run_variants = true
continue_on_error = false
reference_variant = "mf6_precomputed_gmsh"

[[method_comparison.variant]]
id = "mf6_precomputed_gmsh"
label = "MODFLOW 6 on committed triangular mesh"
solver = "modflow6"
mesh_mode = "mesh_input"
mesh_label = "example12_shared_gmsh"
simulation_config = "run_fast_mf6_precomputed_mesh_input.toml"

[[method_comparison.variant]]
id = "boussinesq_precomputed_gmsh"
label = "Boussinesq on committed triangular mesh"
solver = "boussinesq"
mesh_mode = "mesh_input"
mesh_label = "example12_shared_gmsh"
simulation_config = "run_fast_boussinesq_precomputed_mesh_input.toml"

[[method_comparison.observable]]
name = "head_reference_point"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.reference_point"
time = "all"
time_reducer = "last"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
anchor_id = "example12.outlet"
time = "all"
unit = "m3/s"

[[method_comparison.observable]]
name = "watertable_elevation_map"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "watertable_depth_map"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"
