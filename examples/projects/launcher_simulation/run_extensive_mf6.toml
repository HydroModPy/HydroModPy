# Canonical MODFLOW 6 / GWT launcher baseline for example12.
base_config = "config_extensive_common.toml"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modflow6gwt"]

[transport.modflow6gwt.parameters]
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 10
lay_decay = 1.2
