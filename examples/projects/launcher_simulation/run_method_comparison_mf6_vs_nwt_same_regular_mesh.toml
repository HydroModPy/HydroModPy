# Compare MODFLOW 6 and MODFLOW-NWT on the same regular structured mesh.
#
# Both variants keep the same 60x60 `sgrid` footprint, so cell-index based
# observables are meaningful across the two solvers.

[method_comparison]
comparison_id = "example12_mf6_vs_nwt_same_regular_mesh"
output_root = "method_comparison/example12_mf6_vs_nwt_same_regular_mesh"
run_variants = true
continue_on_error = false
reference_variant = "mf6_structured_60x60"

[[method_comparison.variant]]
id = "mf6_structured_60x60"
label = "MODFLOW 6 on 60x60 structured grid"
solver = "modflow6"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_fast_mf6.toml"

[[method_comparison.variant]]
id = "nwt_structured_60x60"
label = "MODFLOW-NWT on 60x60 structured grid"
solver = "modflownwt"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_fast_nwt.toml"

[[method_comparison.observable]]
name = "head_center_cell"
variable = "watertable_elevation"
support = "point"
cell_index = 1830
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "accumulation_east_boundary_cell"
variable = "accumulation_flux"
support = "point"
cell_index = 1859
time = "last"
unit = "m/day"

[[method_comparison.observable]]
name = "head_map_last"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
cell_index = 1859
time = "all"
unit = "m3/s"
