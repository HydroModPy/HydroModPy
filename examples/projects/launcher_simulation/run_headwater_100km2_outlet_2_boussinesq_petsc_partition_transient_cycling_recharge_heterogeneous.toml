# PETSc head-only regularized-partition replay of the heterogeneous transient
# cycling headwater case.

base_config = "run_headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous.toml"

[simulation]
name = "Headwater 100 km2 Boussinesq PETSc partition transient cycling recharge heterogeneous"
