# PETSc regularized-partition replay of the historical headwater 100 km2 outlet-2 real case.

base_config = "run_headwater_100km2_outlet_2_boussinesq_mesh_input.toml"

[simulation]
name = "Headwater 100 km2 outlet 2 boussinesq PETSc partition reused mesh"
run_id = "headwater_100km2_outlet_2_boussinesq_petsc_partition_reused_mesh"

[flow]
runtime_backend = "petsc"
surface_interaction_model = "regularized_partition"
runtime_max_iterations = 200
