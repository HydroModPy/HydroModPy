# Demonstrative MF6 vs NWT comparison on different example12 mesh families.
#
# The forcing and hydraulic properties are tuned to make temporal head changes
# and drainage/overflow signatures easier to read. A fine common raster is
# enabled for smoother visual comparison, but remains optional and specific to
# this showcase config.

[method_comparison]
comparison_id = "example12_mf6_vs_nwt_different_meshes_demonstrative"
output_root = "method_comparison/example12_mf6_vs_nwt_different_meshes_demonstrative"
anchors_file = "method_comparison_points.toml"
run_variants = true
continue_on_error = false
reference_variant = "mf6_demo_triangular"

[method_comparison.fine_raster]
enabled = true
resolution = 15.0
extent_mode = "intersection"
interpolation = "linear"
write_geotiff = true

[[method_comparison.variant]]
id = "mf6_demo_triangular"
label = "MF6 annual demonstrative on committed triangular mesh"
solver = "modflow6"
mesh_mode = "mesh_input"
mesh_label = "gmsh_precomputed"
simulation_config = "run_demonstrative_annual_mf6_precomputed_mesh_input.toml"

[[method_comparison.variant]]
id = "nwt_demo_structured"
label = "NWT annual demonstrative on 60x60 structured grid"
solver = "modflownwt"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_demonstrative_annual_nwt.toml"

[[method_comparison.observable]]
name = "head_outlet_lowland"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.outlet_lowland"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_mid_basin_response"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.mid_basin_response"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_upstream_ridge"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.upstream_ridge"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
anchor_id = "example12.outlet"
time = "all"
unit = "m3/s"

[[method_comparison.observable]]
name = "head_map_last"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "depth_map_last"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "outflow_drain_map_last"
variable = "outflow_drain"
support = "map"
time = "last"
unit = "m/day"
