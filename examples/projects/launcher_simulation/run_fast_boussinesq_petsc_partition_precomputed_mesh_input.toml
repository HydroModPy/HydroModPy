# Reduced pure-flow Boussinesq example reusing one committed triangular mesh
# with the PETSc regularized-partition formulation.

base_config = "run_fast_boussinesq_precomputed_mesh_input.toml"

[simulation]
name = "Example 12 launcher fast boussinesq PETSc partition precomputed mesh"
run_id = "example12_fast_boussinesq_petsc_partition_precomputed_mesh"

[flow]
runtime_backend = "petsc"
surface_interaction_model = "regularized_partition"
