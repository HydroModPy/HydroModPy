# MODFLOW 6 counterpart of the heterogeneous 10-day cycling headwater case.
#
# This keeps the same real mesh, hydrofacies and recharge chronology as the
# Boussinesq heterogeneous cycling scenario, but solves it with the MF6 flow
# stack so temporal dynamics can be compared on a finer time grid.

base_config = "config_headwater_100km2_mf6_transient_common.toml"

[workspace]
project_root = "./results_reused_real_meshes/headwater_100km2_outlet_2_mf6_transient_cycling_recharge_heterogeneous_10day"

[simulation]
name = "Headwater 100 km2 MF6 transient cycling recharge heterogeneous 10-day"
run_id = "headwater_100km2_outlet_2_mf6_transient_cycling_recharge_heterogeneous_10day"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2004-01-05 00:00:00"
step_value = "10 day"
coverage_policy = "warn"

[domain.supports.field_hydrofacies]
provider = "generated_rings"
coordinate_mode = "relative"
radii = [0.24, 0.58]
labels = ["weathered_core", "fractured_transition", "tight_margin"]
default_cell_samples_per_axis = 8

[flow.ic]
type = "custom"
value = "75.0 m"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "1.0e-5 m2/s"

[[data.recharge.sources]]
source = "synthetic"
values = [0.0, 8.0, -6.0, 8.0, -6.0, 8.0, -6.0, 8.0, -6.0, 8.0, -6.0, 0.0]
freq = "MS"
runoff_ratio = 0.10

[flow.param.K.field]
id = "K"
kind = "heterogeneous"
unit = "m/s"

[flow.param.K.field_heterogeneous]
values_source = "inline"
values = { weathered_core = 3.0e-4, fractured_transition = 1.5e-5, tight_margin = 8.0e-7 }
field_spatial_id = "field_hydrofacies"

[flow.param.Sy.field]
id = "Sy"
kind = "heterogeneous"
unit = "-"

[flow.param.Sy.field_heterogeneous]
values_source = "inline"
values = { weathered_core = 0.20, fractured_transition = 0.08, tight_margin = 0.02 }
field_spatial_id = "field_hydrofacies"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = 5e-6
