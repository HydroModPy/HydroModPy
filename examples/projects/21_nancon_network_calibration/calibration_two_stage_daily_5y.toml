# ======================================================================
# Nancon - calibration en deux etages, second etage au pas JOURNALIER
# ----------------------------------------------------------------------
# Meme methode que `calibration_two_stage.toml`, avec le second etage
# porte de mensuel a journalier sur cinq ans.
#
# Etage 1  K   : zero de l'ecart signe D_so - D_os entre le reseau de
#                suintement simule et le lineaire cartographie, en
#                permanent, par dichotomie. Aucune donnee de debit.
#                Le premier etage est permanent PAR CONSTRUCTION : le
#                critere lit un masque de suintement a l'equilibre. Le
#                passer en journalier ne le rendrait pas plus precis, il
#                le rendrait indefini.
# Etage 2  Sy  : NSE sur les logarithmes du debit observe, en transitoire
#                au pas journalier sur 2000-2004, K etant gele.
#
# Lancement :
#   hmp calibrate examples/projects/21_nancon_network_calibration/calibration_two_stage_daily_5y.toml
#   hmp calibrate .../calibration_two_stage_daily_5y.toml --list-phases
#
# COUT. Le pas journalier sur cinq ans fait 1 826 periodes de stress sur
# les 60 395 mailles du maillage, contre 120 periodes mensuelles sur dix
# ans dans la variante de reference. Un point de grille coute donc environ
# quinze fois plus cher. La grille est ramenee de neuf a cinq points pour
# que la mesure reste faisable ; cinq points sur une decade et demie de Sy
# suffisent a placer le plateau, et le profil de cout le montre.
# ======================================================================

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "nancon_two_stage_daily_5y"
description = "Nancon - K sur le reseau, puis Sy sur le debit journalier de cinq ans."


# ----------------------------------------------------------------------
# Parametres
# ----------------------------------------------------------------------
# K est cherche en log : le critere porte sur le rapport K/R et l'ecart
# signe change de signe une seule fois sur plusieurs decades. La
# dichotomie REFUSE un parametre qui n'est pas en `transform = "log"`,
# parce que sa tolerance et son expansion d'une decade sont des enonces
# sur la variable logarithmique.

[calibration.parameters.K]
bounds = [1e-7, 1e-3]
transform = "log"
path = "flow.param.K.field.value"
units = "m/s"

# Sy aussi en log : l'emmagasinement libre couvre une decade et demie et
# la sensibilite du NSE journalier y est tres asymetrique. Une grille
# lineaire depenserait ses points dans le haut de la fourchette.
[calibration.parameters.Sy]
bounds = [0.005, 0.30]
transform = "log"
path = "flow.param.Sy.field.value"
units = "-"


# ----------------------------------------------------------------------
# Sortie reseau et bloc objectif du premier etage
# ----------------------------------------------------------------------

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"
weighting = "area"
tau_specific_ratio = 1.0e-4
roptim_max = 2.0
time = "last"

[[calibration.objective_blocks]]
name = "abherve_gap"
metric = "distance_gap"
uses_outputs = ["seepage_network"]


# ----------------------------------------------------------------------
# Etage 1 : K par dichotomie sur le zero de l'ecart signe
# ----------------------------------------------------------------------

[[calibration.phases]]
name = "steady_k"
description = "Zero de l'ecart signe D_so - D_os, par dichotomie sur K."
method = "bisection"
max_iter = 20
parameters = ["K"]
objective_blocks = ["abherve_gap"]
freeze_on_success = true

[calibration.phases.optimizer_kwargs]
rel_tol = 0.01
sweep_points = 7

[calibration.phases.overrides]
"flow.flow_regime" = "steady"
"simulation.time.start_datetime" = "2000-01-01"
"simulation.time.end_datetime" = "2000-12-31"
# L'unite AVANT la valeur : la configuration normalise "1 year" en
# (1, "year"), donc ecrire une valeur portant une autre unite pendant que
# step_unit vaut encore l'ancienne est refuse.
"simulation.time.step_unit" = "year"
"simulation.time.step_value" = 1


# ----------------------------------------------------------------------
# Etage 2 : Sy sur l'hydrogramme journalier, K gele
# ----------------------------------------------------------------------

[[calibration.phases]]
name = "transient_sy_daily"
description = "NSE sur les logarithmes du debit journalier 2001-2004, K gele."
method = "grid"
max_iter = 5
parallel = 1
parameters = ["Sy"]
# Declarer `variable` et `objective` choisit la route mono-metrique :
# cette phase n'herite ni des sorties ni des blocs de la precedente, donc
# elle n'est pas scoree sur le critere de reseau.
variable = "discharge"
objective = "nse_log"
depends_on = "steady_k"

[calibration.phases.scoring_window]
# Une fenetre en dates, pas un nombre d'echantillons. L'annee 2000 sert
# de mise en regime et n'est pas scoree : au pas journalier la memoire de
# l'etat initial se voit sur les premieres recessions.
start = "2001-01-01"
end = "2004-12-31"

[calibration.phases.overrides]
"flow.flow_regime" = "transient"
"simulation.time.start_datetime" = "2000-01-01"
"simulation.time.end_datetime" = "2004-12-31"
"simulation.time.step_unit" = "day"
"simulation.time.step_value" = 1


# ----------------------------------------------------------------------
# Session
# ----------------------------------------------------------------------

[calibration]
seed = 42
save_runs = "best_n"
save_best_n = 1
persist_iteration_detail = "full"
use_cache = true
