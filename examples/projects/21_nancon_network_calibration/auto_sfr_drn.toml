# ======================================================================
# Nancon - SFR + DRN, calibration automatique K puis Sy, figures completes
# ----------------------------------------------------------------------
#   hmp calibrate examples/projects/21_nancon_network_calibration/auto_sfr_drn.toml
#
# Fichier AUTONOME : aucun `base_config`, aucun script Python.
#
# Le montage : les cours d'eau au-dela de 1 km2 draine deviennent des
# biefs SFR, les tetes de bassin restent au drain de Cauchy, et le
# drainage de versant est route dans les biefs par le MVR.
#
# ----------------------------------------------------------------------
# POURQUOI L'ETAGE 1 ETEINT LES BIEFS
# ----------------------------------------------------------------------
# Le critere de reseau d'Abherve calibre le rapport K/R, et cette
# invariance tient parce que la conductance du drain vaut C = K * A / e,
# donc proportionnelle a K. En SFR la conductance du lit vaut
# C = rhk * rlen * rwid / rbth : aucune valeur de `streambed_k` n'est
# proportionnelle a K, donc le montage SFR CASSE l'invariance dont
# l'etage 1 depend. Calibrer K par le critere avec les biefs allumes
# produirait un nombre, pas une mesure.
#
# La reponse retenue est de calibrer K la ou l'invariance tient, puis de
# le geler : l'etage 1 tourne en drain pur permanent, les biefs eteints
# par son propre `overrides`, exactement comme `auto_drn_full.toml`.
# L'etage 2 rallume les biefs et ne cale plus que Sy sur l'hydrogramme
# route. C'est ce que les runs de reference faisaient a la main, avec
# K = 2,0908e-4 herite de la calibration DRN.
#
# LIMITE A CONNAITRE : le K ainsi obtenu est celui de l'aquifere vu par
# un drain de versant. Il n'absorbe pas la resistance du lit SFR, qui est
# posee et non calibree. Les deux ne sont pas separables sur un seul
# hydrogramme, et ce fichier ne pretend pas les separer.
#
# COUT MESURE : la cadence du montage SFR est de 8,4 a 9,8 s/jour contre
# 2,3 s/jour pour le drain au point calibre, soit environ 3,7 fois plus
# lent. L'etage 2 tourne donc sur deux ans. Compter cinq a six heures.
# ======================================================================

[workflow]
mode = "calibration"

[workspace]
project_root = "."


# ----------------------------------------------------------------------
# Geographic - delimitation et surface de routage
# ----------------------------------------------------------------------

[geographic]
source_mode = "standard"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
reuse_existing_outputs = true

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "DEM_nancon_25m.tif"
x_outlet = 389285.91
y_outlet = 6816518.749
snap_dist = "150 m"
buff_area = "10%"

# Le burn est celui de la reference DRN, donc la delineation est la meme
# et les deux montages restent comparables.
[geographic.enforce_streams]
enabled = true
stream_geometry_path = "nancon_stream_network.gpkg"
mode = "constant"
# 10 m et non 30. Le trace derive est strictement identique des 10 m (1535
# mailles, Jaccard 1,000, et a 5 m 81 mailles du bassin changent encore de
# direction D8), donc 30 m ne fait rien gagner sur le routage.
#
# CE QUE LE BURN N'ATTEINT PLUS. La cote de lit `rtp` ET la pente `rgrd` sont
# lues sur le MNT DU TOIT, plus sur cette surface burnee. La profondeur de la
# tranchee ne peut donc plus devenir l'incision du lit ni gonfler la pente.
# Avant ce correctif, 84,7 % des 9,96 m medians de profondeur de lit venaient
# de la, et le lit remonte de 3,755 m en mediane depuis.
#
# Ce reglage abaisse le MNT DE ROUTAGE, pas l'aquifere, et il ne sert plus qu'a
# ce pour quoi il existe : tenir les chemins D8 sur le lineaire cartographie.
# Le raccordement des biefs vers l'aval revient a `min_slope`, au
# conditionnement monotone, et a `bed_incision` qui ancre le lit sous le toit
# de sa maille.
depth_m = 10.0

# Reseau derive du MNT, qui porte la topologie des biefs.
[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
compute_stream_links = true
compute_strahler_order = true


# ----------------------------------------------------------------------
# Domain
# ----------------------------------------------------------------------

[domain]
[domain.depth_model]
kind = "constant_thickness"
thickness = 30.0


# ----------------------------------------------------------------------
# Data
# ----------------------------------------------------------------------

[data]
project_crs = "EPSG:2154"
types = ["dem", "geology", "hydrography", "hydrometry", "recharge", "runoff"]

[[data.dem.sources]]
source = "custom"
path = "DEM_nancon_25m.tif"

[[data.geology.sources]]
source = "brgm_1m"

[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

[data.hydrometry]
date_start = "2000-01-01"
date_end = "2009-12-31"

[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
extent = "watershed"
station_ids = ["NANCON"]

[data.recharge]
date_start = "2000-01-01"
date_end = "2009-12-31"

[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON_REA"]

[data.runoff]
date_start = "2000-01-01"
date_end = "2009-12-31"

[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON_REA"]


# ----------------------------------------------------------------------
# Flow - biefs SFR sur le reseau, drain de Cauchy sur les versants
# ----------------------------------------------------------------------

[flow]
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage", "sfr"]
flow_regime = "steady"

[flow.ic]
type = "top"
description = "Nappe initialisee a la surface topographique."

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 6.4e-5

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = 0.05

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# `value = 0.0` selectionne le repli proportionnel C = K * A / e. C'est
# ce qui rend l'etage 1 valide quand les biefs sont eteints.
[flow.bc.drainage]
kind = "cauchy"
application_domain = "top"
description = "Drainage de Cauchy sur la face superieure de l'aquifere."
value = 0.0

[flow.sinks_sources.recharge]
values = 0.0

[flow.sinks_sources.sfr.nancon]
# 1 km2 draine sur 64,6 km2 : le reseau principal en SFR, les tetes de
# bassin restent au drain de Cauchy.
stream_threshold_km2 = 1.0

# Conductance de lit posee pour EGALER celle que la maille avait en
# drain, seule facon de comparer les deux montages a resistance egale :
#   drain  C = K * A / e_lit = 2.0908e-4 * 625 / 1.0 = 0.1307 m2/s
#   sfr    C = rhk * rlen * rwid / rbth = rhk * 25 * 2 / 1.0 = 50 * rhk
# d'ou rhk = 2.61e-3 m/s.
streambed_k = 2.61e-3
streambed_k_unit = "m/s"

# 1 m et non 0,1 m. MODFLOW 6 bascule un bief entre connecte et
# deconnecte a `rtp - rbth`, pas a `rtp` : avec rbth = 0,1 m la bascule
# se jouait sur dix centimetres et le permanent oscillait en cycle
# binaire. A 1 m le seuil descend a 1,5 m sous le sol avec l'incision.
streambed_thickness = "1 m"

manning = 0.035
min_slope = 1e-4
connected_to_aquifer = true

# Le lit est ancre 0,5 m sous le toit de SA PROPRE maille.
bed_incision = "0.5 m"
max_bed_sag = "5 m"

# OBLIGATOIRE ici. La serie de debit bascule sur la branche routee des
# qu'un `ext_outflow` SFR existe, et cette branche ecarte le residu DRN
# au lieu de l'ajouter. Sans routage ce residu serait TOUT le drainage de
# versant, et il serait jete.
route_drainage = true

# Laisse a false. `rectify_on_mesh` exigerait `[modflow6.sgrid]
# condition_top = true`, qui RELEVE le toit du modele. Les activer
# comparerait deux topographies au lieu de deux conditions limites.
rectify_on_mesh = false

[flow.sinks_sources.sfr.nancon.width]
kind = "constant"
value = "2 m"


# ----------------------------------------------------------------------
# Simulation
# ----------------------------------------------------------------------

[simulation]
name = "nancon_auto_sfr"
description = "Nancon - SFR + DRN, K par le reseau en drain pur puis Sy route."
if_exists = "replace"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2000-12-31"
step_value = "1 year"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[simulation.results.derived]
release_flux = true
watertable_elevation = true
watertable_depth = true
seepage_areas = true
accumulation_flux = true


# ----------------------------------------------------------------------
# MODFLOW 6
# ----------------------------------------------------------------------

[modflow6.runtime]
print_head = false
save_specific_discharge = false
save_saturation = false

# Le couplage MVR drain -> bief demande des iterations : mesure en
# permanent, `qfrommvr` decroissait d'environ 1 % par iteration externe.
mf6_outer_maximum = 1500
ims_print_option = "SUMMARY"

# Critere de charge a 5 mm au lieu de 0,1 mm. Un bief SFR bascule entre
# connecte et deconnecte quand la nappe traverse `rtp - rbth`, et ce
# basculement ne s'amortit pas : une seule maille alternait entre deux
# valeurs a l'identique sur 1430 iterations. Le drain de Cauchy n'a pas
# cette non-linearite et converge, lui, a 1e-4 ; l'ecart de critere est
# donc imputable au montage SFR et non au pas de temps. Sur un aquifere
# de 30 m, 5 mm reste 0,02 % de l'epaisseur, et le bilan de masse garde
# le dernier mot.
# 2e-2 et non 5e-3. MESURE, deux runs transitoires complets sur le lit
# corrige : la maille 201392 entre en cycle limite parfait au pas 486 sur
# 731, le residu alternant entre +1,064e-2 et -7,251e-3 m sur 1500
# iterations externes, aux memes chiffres dans les deux runs. Ce n'est pas
# le coude SFR : tripler `streambed_thickness` pour descendre le seuil de
# connexion de 2 m n'a pas deplace l'oscillation d'une decimale.
#
# Le lit remonte de 3,755 m met davantage de mailles dans la bande ou le
# solveur broute. La sous-relaxation DBD du preset COMPLEX est deja active
# (theta 0,8, kappa 1e-4, gamma 0) avec backtracking, et le TOML n'expose ni
# theta ni gamma : le critere est le seul levier. Controle a posteriori,
# l'ecart de bilan de masse s'AMELIORE, 0,30 % -> 0,13 % au maximum.
mf6_outer_dvclose = 2e-2


# ----------------------------------------------------------------------
# Calibration
# ----------------------------------------------------------------------

[calibration]
seed = 42
save_runs = "best_n"
save_best_n = 1
persist_iteration_detail = "full"
# Volontairement a false. La cle de cache tient les PARAMETRES et un contexte
# de configuration, jamais la version du code : un run rejoue apres un
# correctif de solveur ressert donc les anciens nombres sans le dire. Pour un
# fichier d'exemple dont l'objet est justement d'etre rejoue et verifie, c'est
# le mauvais defaut. Le passer a true fait gagner des heures sur une reprise
# apres interruption, quand le code n'a pas bouge.
use_cache = false
rerun_best_with_outputs = true

[calibration.parameters.K]
bounds = [1e-7, 1e-3]
transform = "log"
path = "flow.param.K.field.value"
units = "m/s"

# Bornes resserrees sur ce que la grille du 8 septembre a mesure. Ses quatre
# points log-espaces sur [5e-3 ; 0,30] ont donne un optimum INTERIEUR a
# Sy = 0,01957 (cout nse_log 0,17075), encadre par 0,005 (cout 1,086) et
# 0,0766 (cout 0,226). Le minimum est donc dans ]0,005 ; 0,0766[.
#
# Ces deux voisins deviennent les bornes. Comme ils encadrent l'optimum
# symetriquement en log, le centre de l'espace transforme tombe exactement
# sur 0,01957, et c'est de la que `scipy_nelder_mead` demarre : le simplexe
# initial couvre 0,119 decade au lieu de balayer deux ordres de grandeur.
#
# Historique : au calage du 3 septembre la borne basse valait 0,02 et
# l'optimum s'y est pose, avec des couts strictement croissants en Sy. Ce
# n'etait donc pas un optimum. L'abaisser a 5e-3 a rendu la grille valide.
[calibration.parameters.Sy]
bounds = [5e-3, 0.0766]
transform = "log"
path = "flow.param.Sy.field.value"
units = "-"

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"
weighting = "area"
tau_specific_ratio = 1.0e-4
roptim_max = 2.0
time = "last"
observed_position_accuracy = "50 m"

[[calibration.objective_blocks]]
name = "abherve_gap"
metric = "distance_gap"
uses_outputs = ["seepage_network"]


# --- Etage 1 : K par dichotomie, EN DRAIN PUR, biefs eteints ---
# Cet etage VIDE les reseaux SFR au lieu de retirer "sfr" de `active_bc`,
# et les deux ne sont pas equivalents. L'etape `resolve` du pipeline
# re-valide la configuration APRES avoir applique les overrides, et le
# validateur racine refuse un reseau declare hors `active_bc` ("the
# streams would be silently ignored"). Retirer la condition limite en
# laissant le reseau declare fait donc echouer l'etage en trois secondes.
# Vider `flow.sinks_sources.sfr` passe la re-validation et suffit : le
# builder court-circuite sur un mapping vide et ne construit aucun paquet.
# `active_bc` est retire en plus, pour que l'intention soit lisible.
#
# La conductance du drain redevient alors proportionnelle a K et le
# critere de reseau retrouve l'invariance K/R sur laquelle il repose.

[[calibration.phases]]
name = "steady_k"
description = "Zero de l'ecart signe D_so - D_os en drain pur, biefs eteints."
method = "bisection"
max_iter = 20
parameters = ["K"]
objective_blocks = ["abherve_gap"]
freeze_on_success = true

[calibration.phases.optimizer_kwargs]
rel_tol = 0.01
sweep_points = 7

[calibration.phases.overrides]
"flow.sinks_sources.sfr" = {}
"flow.active_bc" = ["drainage"]
"flow.flow_regime" = "steady"
"simulation.time.start_datetime" = "2000-01-01"
"simulation.time.end_datetime" = "2000-12-31"
"simulation.time.step_unit" = "year"
"simulation.time.step_value" = 1


# --- Etage 2 : Sy sur l'hydrogramme route, biefs rallumes, K gele ---
# Deux ans et non cinq : le montage SFR coute environ 3,7 fois le drain
# au meme Sy, donc cinq ans demanderaient une nuit par essai. La fenetre
# de score 2001 reste entiere et hors annee d'amorce. Les quatre essais
# tournent concurremment, le temps mural de l'etage vaut donc celui du
# plus lent.

[[calibration.phases]]
name = "transient_sy"
description = "NSE des logarithmes du debit journalier 2001, reseau route."
# Nelder-Mead et non plus une grille. La grille du 8 septembre a rendu un
# optimum INTERIEUR, Sy = 0,01957 pour un cout nse_log de 0,17075, avec des
# voisins a 1,086 (Sy = 0,005) et 0,226 (Sy = 0,0766). Mais quatre points
# log-espaces sur [5e-3 ; 0,30] sont distants de 0,59 decade : la valeur
# retenue etait le meilleur point TESTE, pas le minimum.
#
# Nelder-Mead est SEQUENTIEL, contrairement a la grille qui tournait a
# quatre en parallele. C'est pourquoi les bornes ci-dessous ont ete
# resserrees sur ce que la grille a appris (voir [calibration.parameters.Sy]) :
# l'adapter demarre au centre de l'espace transforme, qui tombe alors sur
# l'optimum de la grille, et le simplexe initial ne couvre plus que la
# region utile.
method = "scipy_nelder_mead"
max_iter = 12
batch_size = 1
parallel = 1
parameters = ["Sy"]
variable = "discharge"
objective = "nse_log"
depends_on = "steady_k"

[calibration.phases.optimizer_kwargs]
# Le budget est la vraie contrainte : chaque essai est un transitoire SFR de
# 731 jours, environ 2 h 20. maxfev = 10 borne l'etage a une nuit.
maxfev = 10
# Tolerances dans l'espace TRANSFORME, donc en decades de Sy. 0,02 decade
# vaut environ 5 % sur Sy, dix fois plus fin que le pas de la grille.
xatol = 0.02
# L'ecart entre les deux meilleurs points de la grille valait 0,055 ; 0,002
# distingue donc largement, sans depenser des essais pour rien.
fatol = 0.002

[calibration.phases.scoring_window]
start = "2001-01-01"
end = "2001-12-31"

[calibration.phases.overrides]
"flow.active_bc" = ["drainage", "sfr"]
"flow.flow_regime" = "transient"
"simulation.time.start_datetime" = "2000-01-01"
"simulation.time.end_datetime" = "2001-12-31"
"simulation.time.step_unit" = "day"
"simulation.time.step_value" = 1


# ----------------------------------------------------------------------
# Figures
# ----------------------------------------------------------------------
# Meme liste que le montage DRN, plus les trois figures propres au
# reseau SFR. Une figure dont le run ne remplit pas les prerequis est
# ignoree avec sa raison.

[display]
enabled = true
preset = "default"
show = false
save = true
output_dir = "figures"
cmap = "viridis"
on_error = "warn"



# Sept figures du registre sont volontairement ABSENTES de cette liste,
# parce qu'aucune valeur de TOML ne peut les rendre possibles, mesure faite :
#   residuals, scatter_one_to_one  le simule vit sous la station `_catchment`
#                                  et l'observe sous `NANCON` ; elles exigent
#                                  les deux sous LE MEME nom de station.
#   ensemble_band                  attend un RunSet, donc plusieurs runs.
#   roptim_validity_chart          compare plusieurs sites, un run en tient un.
#   calibration_landscape,         demandent deux parametres dans UNE session ;
#   calibration_objective_surface, chaque etage n'en echantillonne qu'un, c'est
#   calibration_pairplot           le principe meme de l'etagement.
#   conditioning_impact_map        exige [modflow6.sgrid] condition_top = true,
#                                  qui RELEVE le toit et changerait le modele.

figures = [
    # -- Identite du bassin et maillage --
    "watershed_id_card",
    "mesh_map",
    "boundary_package_map",
    "depression_map",
    "flow_direction_map",

    # -- Debit simule contre observe --
    "hydrograph_sim_obs",
    "hydrograph_log_nse",
    "hydrograph",
    "duration_curve",
    "recession",
    "seasonal_boxplot",

    # -- Bilan --
    "water_budget",
    "flux_timeseries",

    # -- Le reseau SFR lui-meme --
    "sfr_reach_network",
    "sfr_longitudinal_profile",
    "sfr_reach_timeseries",

    # -- Cartes de nappe et de suintement --
    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "recharge_map",
    "cross_section",
    "accumulation_map",

    # -- Reseau simule contre reseau cartographie --
    "simulated_active_network",
    "simulated_active_network_reference_overlay",
    "seepage_network_reference_overlay",
    "seepage_network_confusion_map",
    "downslope_distance_map",
    "hydrographic_network_reference",
    "hydrographic_network_generated",
    "hydrographic_network_comparison",

    # -- Diagnostic de la calibration elle-meme --
    "abherve_two_stage_card",
    "bisection_bracket_trace",
    "downslope_distance_crossing",
    "parameter_cost_profile",
    "calibration_convergence",
    "calibration_trace",
    "calibration_posterior",
]

# Ce que `hydrograph_log_nse` ne peut pas deviner. La fenetre de score est
# une notion de CALIBRATION : la figure lit un run, et un run ne sait pas
# sur quelle fenetre il a ete note. Sans elle la figure trace la serie
# entiere, sans zone grisee. Le SCORE lui-meme n'est volontairement pas
# pose ici : `nse_log =` existe, mais ce serait figer un resultat dans un
# fichier d'entree, faux des la prochaine calibration.
#
# CETTE TABLE DOIT RESTER LA DERNIERE DU FICHIER. En TOML, tout ce qui
# suit un en-tete de table lui appartient : placee avant `figures`, elle
# avalait la liste et le run ne dessinait plus rien, sans que
# `hmp config check` puisse s'en apercevoir puisque `overrides` accepte
# n'importe quelle cle.
[display.overrides.hydrograph_log_nse]
scoring_window = ["2001-01-01", "2001-12-31"]
