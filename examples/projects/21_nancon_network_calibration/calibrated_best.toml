[flow]
runtime_backend = "local" # Optional nonlinear runtime backend hint used by the Boussinesq solver implementation. Other flow solvers may ignore this field.
surface_interaction_model = "auto" # Optional Boussinesq surface-interaction closure selector. 'regularized_partition' uses the Marcais-style q_ex = G_r(theta) R(balance) law; 'complementarity' uses the mixed PETSc q_ex-perp-(z_top-h) formulation; 'vi_obstacle' uses the experimental PETSc head-only VI obstacle formulation; 'auto' keeps the historical backend-dependent default.
vi_substeps_per_period = 1 # Fixed number of Backward-Euler substeps per stress period for the experimental PETSc VI obstacle runtime. Rate-based forcing values are kept unchanged on each substep.
vi_substep_on_failure = false
ts_vi_steps_per_period = 4 # Fixed PETSc TS Backward-Euler steps per stress period for the experimental TS VI obstacle runtime.
ts_vi_adapt = false
ts_vi_dt_min_fraction = 0.015625 # Minimum TS VI time-step as a fraction of the stress-period length.
ts_vi_dt_max_fraction = 0.25 # Maximum TS VI time-step as a fraction of the stress-period length.
ts_vi_type = "beuler" # PETSc TS type for the experimental TS VI obstacle runtime.
ts_vi_snes_type = "vinewtonrsls" # PETSc SNES type for the experimental TS VI obstacle runtime.
param_list = ["K", "Sy", "Ss"] # Ordered list of flow-parameter identifiers used to build runtime parameters (for example ['K', 'Ss', 'Sy']).
active_sinks_sources = ["recharge"] # Explicitly activated sink/source names for this flow run. Allowed values: 'recharge', 'wells', 'etp'. Boussinesq currently rejects 'etp' at solver-contract validation. An empty list means no sink/source package is assembled by the solver.
active_bc = ["drainage", "sfr"] # Explicitly activated boundary-condition ids for this flow run. Allowed values are the canonical ids declared in the flow boundary-condition registry: 'ocean', 'stream', 'north_side', 'south_side', 'east_side', 'west_side', 'drainage', 'lake', 'reservoir'. 'lake'/'reservoir' build a MODFLOW 6 LAK advanced package and are only supported by the modflow6 backend. An empty list means no boundary-condition package is assembled by the solver.
flow_regime = "transient" # Global flow simulation regime used by solvers consuming [flow] (steady or transient).
first_period_steady = true

[flow.param.K.field] # Discriminated parameter section `[field]`.
id = "K" # Parameter identifier used in outputs and logs (for example 'K', 'Sy').
kind = "homogeneous" # Field type selector.
unit = "m/s" # Unit of parameter values. Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
value = 0.00021033748010870326 # Scalar surface value used when kind='homogeneous'.

[flow.param.Sy.field] # Discriminated parameter section `[field]`.
id = "Sy" # Parameter identifier used in outputs and logs (for example 'K', 'Sy').
kind = "homogeneous" # Field type selector.
unit = "-" # Unit of parameter values. Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
value = 0.019574338205844314 # Scalar surface value used when kind='homogeneous'.

[flow.param.Ss.field] # Discriminated parameter section `[field]`.
id = "Ss" # Parameter identifier used in outputs and logs (for example 'K', 'Sy').
kind = "homogeneous" # Field type selector.
unit = "m-1" # Unit of parameter values. Typical examples: 'm/s' (K), '-' (Sy), 'm-1' (Ss).
value = 1e-05 # Scalar surface value used when kind='homogeneous'.

[flow.ic.h] # Hydraulic-head initial condition payload.
description = "Nappe initialisee a la surface topographique." # Description of the initial condition
type = "top" # Initialize head at the top surface (full aquifer).

[flow.bc.drainage]
id = "drainage" # Boundary-condition identifier.
value = 0.0 # Boundary-condition value, scalar or one value per stress period.
description = "Drainage de Cauchy sur la face superieure de l'aquifere." # Boundary-condition description.
units = "m2/s" # Boundary-condition units.
kind = "cauchy" # Boundary-condition kind discriminator.
data_value = false
application_domain = "top" # Boundary-application domain. Supported values are: top, north side, south side, east side, west side.

[flow.sinks_sources.wells] # Mapping of well ids to typed well payloads.

[flow.sinks_sources.lakes] # Mapping of lake ids to typed lake / reservoir payloads.

[flow.sinks_sources.sfr.nancon]
stream_threshold_km2 = 1.0 # Drainage-area threshold [km^2] for stream initiation. Exactly one of stream_threshold_km2 / stream_threshold_cells must be set when reaches are delineated automatically.
min_reach_length = "0 m" # Prune reaches shorter than this [L] (0 keeps all reaches).
manning = 0.035 # Manning roughness coefficient n [T/L^(1/3)] (> 0). Default 0.035.
streambed_k = 0.00261 # Streambed hydraulic conductivity rhk [L/T]. 0 = no reach-aquifer leakage (pure routing).
streambed_k_unit = "m/s" # Unit of streambed_k (velocity, L/T): m/s, m/day, m/h... HydroModPy converts it to m/s for MF6, so a m/day value is not taken as m/s.
streambed_thickness = "1 m" # Streambed thickness rbth [L] (> 0).
min_slope = 0.0001 # Floor for the reach gradient rgrd [-] after monotone-downhill conditioning.
bed_incision = "0.5 m" # Depth [L] of the streambed top rtp below the top of the reach's OWN aquifer cell. A bed never sits above the ground of its own cell, whether this is set or not. None (default) only lifts the lower bound: the bed may then sink to the cell bottom instead of stopping at max_bed_sag. When set, each reach is solved inside [cell_top - bed_incision - max_bed_sag, cell_top - bed_incision], monotone downstream, and the build refuses when that band is empty. rtp is delineated on the model top, so this anchors a bed that a coarse DEM cannot resolve; it is not a correction for the stream burn, which never reaches the bed. Pick it against the water table, not against the channel: MODFLOW 6 switches a reach between connected and disconnected at rtp minus streambed_thickness (gwf-sfr.f90:3973-3985), so a bed sitting near the seasonal water-table depth toggles at every outer iteration.
max_bed_sag = "5 m" # Only read when bed_incision is set. How far [L] below cell_top - bed_incision the monotone-downstream solve may sink a reach. It bounds the cumulative descent that a traced channel climbing over a rise forces on everything downstream of it. Widening it never refuses the build on its own: a reach that cannot hold the descent is warned about and pinned to the floor.
connected_to_aquifer = true
route_drainage = true
storage = false
diversions = [] # SFR-to-SFR diversions (controlled splits). Empty = none.
outflow_mvrtype = "FACTOR" # MVR transfer rule for the SFR -> LAK coupling.
outflow_value = 1.0 # MVR value: the fraction for FACTOR, or the flow rate [L^3/T] for UPTO / EXCESS / THRESHOLD.
lake_feeder_snap = "300 m" # Max distance from a lake shoreline within which a dead-end reach is snapped to that lake via MVR (a real feeder the DEM fell short of). Scale it to the catchment: too large teleports an unrelated reach into the lake.
outlet_keepout = "1000 m" # Min distance from the model outlet a terminal reach must keep to count as a lake feeder. A terminal closer than this is the below-dam discharge reach (the lake feeds it and it leaves the model), so it is not routed into the lake.
rectify_on_mesh = false
rectify_stub_max_upstream = 2 # When rectify_on_mesh is set, demote a low-order parallel stub to hillslope drainage (DRN -> SFR) to thin braided bands: a reach cell with at most this many reach cells upstream of it that runs beside a reach carrying strictly more (the true channel) is dropped from SFR, keeping a one-thread channel; its water still reaches the network as routed drainage. 0 demotes only headwater leaves, a negative value keeps every traced cell. Default 2 removes stubs up to ~3 cells.
rectify_min_component_cells = 2 # When rectify_on_mesh is set, drop a whole reach component smaller than this many cells (a lone one-cell stream that just touches a lake or the outlet is hillslope drainage, not a channel, and reads as a spurious SFR -> lake entry). Its water still reaches the network as routed DRN. Default 2 drops single-cell components; 1 keeps every component.

[flow.sinks_sources.sfr.nancon.width] # How the reach width rwid [L] is set (constant / by_order / power_law).
kind = "constant" # Discriminator tag for the constant reach-width law.
value = "2 m" # Uniform reach width rwid [L] for all reaches.

[flow.sinks_sources.flow_barriers] # Mapping of flow-barrier ids to typed HFB payloads (general addon, modflow6 backend only; declaring one activates it). A lake's dam cutoff wall is declared on the lake instead.

[flow.sinks_sources.recharge] # Diffuse recharge configuration. None = zero recharge for all periods.
values = 0.0 # Recharge payload: scalar, list (one per stress period), mapping {kper: value}, or runtime series.
first_clim = "mean" # Period-0 policy when values is a sequence: 'mean' (series average), 'first' (first element), or a numeric scalar.
units = "mm/day" # Units of the recharge data source. Data-manager outputs use mm/day by convention; override when providing values in another unit (e.g. 'm/day'). Converted to m/s at runtime via factor_to_m_per_s().
negative_to_evt = true
spatial_mode = "auto" # How to interpret spatial data: 'auto' (points->homogeneous, fields->heterogeneous), 'homogeneous' (force spatial averaging), 'heterogeneous' (force per-cell discretization, including point-to-grid interpolation when stations have coordinates).
interpolation_method = "nearest" # Spatial interpolation method for gridded/point data onto the MODFLOW grid. Options: 'nearest', 'linear', 'idw'.

