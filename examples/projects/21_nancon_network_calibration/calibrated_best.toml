catalog_path = "/home/bb/Documents/01_Git_Repository/03-HydroModPy-lakeres/examples/projects/21_nancon_network_calibration/.hmp/index.duckdb" # Explicit path to the project index database. Defaults to <project_root>/.hmp/index.duckdb.
data_dir = "/home/bb/Documents/01_Git_Repository/03-HydroModPy-lakeres/examples/data" # Explicit path to the workspace data directory. Defaults to <root>/data.
runs_dir = "/home/bb/Documents/01_Git_Repository/03-HydroModPy-lakeres/examples/projects/21_nancon_network_calibration/runs" # Explicit path to the directory holding one sub-directory per run. Defaults to <project_root>/runs.

[geographic]
source_mode = "standard" # Geographic runtime mode. 'standard' keeps the historical DEM/outlet/polygon workflow. 'synthetic' builds one analytical support from [geographic.synthetic].
crs_project = "EPSG:2154" # Target projected CRS for all outputs (e.g. 'EPSG:2154'). If not set, derived from the input DEM.
dem_correc_type = "breach" # DEM depression correction method. 'breach' (recommended) preserves natural flow paths. 'fill' raises sinks to their pour point.
domain_extent = "box" # Selects the DEM surface used for the domain. 'box' (default) keeps the full buffered rectangular support. 'watershed' / 'watershed_buff' select the catchment (optionally with a buffer ring) surface. Note: the MODFLOW 6 mesh still covers the buffered box (the buffer stays active for inter-basin exchange); out-of-watershed drainage is kept out of the catchment discharge by the DRN watershed-routing, not by an idomain mask. Experimental.
reuse_existing_outputs = true
write_intermediates = false

[geographic.catchment] # Catchment definition payload used when source_mode='standard'. Discriminated by 'catch_def' on the nested table: 'dem' | 'txt' | 'from_outlet_coord' | 'from_polyg_shp'.
dem_init_path = "/home/bb/Documents/01_Git_Repository/03-HydroModPy-lakeres/examples/data/dem/DEM_nancon_25m.tif" # Path to the DEM raster used as input. For 'dem' and 'txt' modes: defines the model domain directly. For 'from_outlet_coord' and 'from_polyg_shp' modes: regional DEM used for flow analysis. May be left absent when [data.dem.sources] declares the DEM.
catch_def = "from_outlet_coord" # Watershed delineated from outlet coordinates on a regional DEM.
x_outlet = 389285.91 # X coordinate of the watershed outlet in the projected CRS.
y_outlet = 6816518.749 # Y coordinate of the watershed outlet in the projected CRS.
snap_dist = 150.0 # Maximum snapping distance (metres) to move the outlet to the nearest stream cell. Accepts inline units (e.g. 50, '50 m', '0.05 km').
buff_area = 10.0 # Buffer around the watershed polygon. Numeric values are interpreted as a percentage of sqrt(area [km^2]). String values are interpreted as explicit distances (for example '500 m', '2 km').

[geographic.synthetic] # Synthetic geographic support used when source_mode='synthetic'. This analytical mode bypasses watershed delineation from external DEM files.
case_id = "flat20" # Identifier used by local case runners and outputs.

[geographic.synthetic.grid] # Synthetic grid definition (extent and cell size).
length_x = 100.0 # Total domain length along x (metres). Accepts inline units, e.g. '0.1 km'.
length_y = 1.0 # Total domain length along y (metres). Accepts inline units, e.g. '1 m'.
nx = 100 # Number of cells along x.
ny = 1 # Number of cells along y.
xmin = 0.0 # Lower x coordinate of the support extent.
ymin = 0.0 # Lower y coordinate of the support extent.
crs = "EPSG:2154" # Projected CRS attached to synthetic outputs.
nodata = -9999.0 # Nodata sentinel exported to raster artefacts.

[geographic.synthetic.topography] # Synthetic topography definition (shape, elevations, slope).
kind = "flat" # Analytical topography law: 'flat' keeps one constant elevation.
base_elevation = 20.0 # Constant surface elevation (m).

[geographic.river_network] # Optional DEM-derived river-network extraction settings. When disabled, no stream network is generated in geographic preprocessing.
enabled = true
threshold_mode = "area_km2" # Stream-initiation threshold selector. 'area_km2' uses contributing area in km^2. 'cells' uses contributing-cell count directly.
threshold_area_km2 = 1.0 # Contributing area threshold (km^2), required when threshold_mode='area_km2'.
prune_short_streams = false
min_stream_length_m = 0.0 # Minimum stream length (metres) used by short-segment pruning. Accepts inline units (e.g. 0, 250, '250 m', '0.5 km').
compute_strahler_order = true
compute_stream_links = true
all_vertices = false

[geographic.enforce_streams] # Optional stream burning of the routing DEM: lower the mapped network cells so the computed D8 paths follow the observed network, without touching the model grid top. Applied before the lake carve.
enabled = true
stream_geometry_path = "/home/bb/Documents/01_Git_Repository/03-HydroModPy-lakeres/examples/data/hydrography/nancon_stream_network.gpkg" # Observed stream network (gpkg/shp) to burn. A bare filename resolves against <workspace>/data/hydrography/. Required when enabled.
mode = "constant" # Trench depth rule. 'constant' lowers every stream cell by depth_m. 'adaptive' derives one depth from the measured local relief along the network. Either way a single depth is used, so the along-channel gradient the trench exists to preserve is not rewritten.
depth_m = 10.0 # Trench depth (metres) for mode='constant'. It must exceed the local drop between a stream cell and its lowest non-stream neighbour; 5 m clears 0.90 agreement on every measured catchment, 10 to 20 m are needed for 0.95 to 0.99 on the difficult ones, and 1 m buys almost nothing. Accepts inline units (e.g. 30, '30 m').
adaptive_percentile = 95.0 # Percentile of the local relief along the network used as the trench depth when mode='adaptive'.
relief_report_percentile = 95.0 # Percentile of the local relief along the network reported in the burn report and compared to the depth actually used, whatever the mode. It is the drop a constant trench must clear to keep the flow on the mapped network, so a depth below it warns. Independent of adaptive_percentile, which SETS the depth; this one only JUDGES it.
rasterize_all_touched = true
dem_nodata_fallback = -9999.0 # Nodata value assumed when the DEM to burn declares none in its header. It decides which cells are excluded from the burn and from the relief measurement, so a raster using another sentinel must say so here.
alpha_warning_threshold = 0.9 # Below this agreement between the mapped network and the D8 paths of the routing DEM, a warning fires. alpha is the share of the downstream closure of the network that the network itself covers: 1.00 means the computed paths never leave the map, 0.50 is the signature of a systematic one-pixel shift. Below the threshold, any length measured along those paths reports a DEM-versus-map disagreement rather than hydrogeology.
max_catchment_area_drift = 0.05 # Relative change of the delineated catchment area the burn may cause. A trench that crosses a divide (mis-georeferenced trace, canal, flat area) reconnects two catchments and the delineation changes without any other sign, so the catchment is delineated before and after the burn and a larger drift raises. This costs one extra delineation pass whenever the burn is on.

[geographic.enforce_lakes] # Optional lake hydro-enforcement of the routing DEM: carve the lake footprints so streams route into the lakes and drain to the outlet, without touching the model grid top.
enabled = false
slope = 0.003 # Ramp gradient (m per m of distance to the outlet). Small and positive so each lake slopes gently toward the outlet with no flat depression (a flat sink would make the breach crawl).
buffer_m = 15.0 # Buffer (metres) applied to each lake footprint to bridge inter-lake sills and knit the shoreline into the carve.
capture_radius_m = 0.0 # If > 0, run a SECOND delineation pass: any stream that dead-ends within this distance of a lake (a near-miss over a flat forebay) is carved to the lake and re-delineated, so its channel reaches the shoreline. 0 disables the capture pass (lake carve only).
capture_max_streams = 8 # Capture pass: cap on how many near-miss stream terminals are carved to lakes per pass (kept by decreasing flow accumulation).
capture_min_acc_fraction = 0.3 # Capture pass: keep only near-miss terminals whose flow accumulation is at least this fraction of the largest, so a tiny rivulet is not carved.

[geographic.dam_carve] # Optional dam structure-carve of the model-top DEM: lower the dam footprint to the valley floor so a cutoff wall sits at the dam on a raw DEM (mirror of enforce_lakes, on the top instead of the routing DEM).
enabled = false
buffer_m = 40.0 # Half-width (metres) of the carved corridor around the dam trace. Make it a bit wider than one DEM/cell size so the whole dam body is brought to the valley floor.

[domain]
[domain.depth_model] # Vertical domain model configuration. Use 'constant_thickness' or 'flat_substratum'.
kind = "constant_thickness" # Depth-model kind discriminator. Use 'constant_thickness' to define bottom as top-thickness.
thickness = 30.0 # Constant aquifer thickness applied below topography (canonical metres). Accepts inline units, e.g. '0.2 km'.

