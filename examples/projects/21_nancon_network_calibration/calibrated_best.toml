# ======================================================================
# Nancon - le meilleur point du calage du 8 septembre 2026, rejoue
# ======================================================================
#
# Config RESOLUE de l'essai gagnant de auto_sfr_drn.toml, extraite de
# runs/grid_iter_0002/config.toml. La calibration avait fini ses quatre
# points ; c'est la promotion du meilleur avec ses sorties qui a ete
# coupee par la panne de batterie.
#
#   etage 1, bissection sur le reseau : K  = 2.1033748010870326e-4 m/s
#   etage 2, grille sur l'hydrogramme : Sy = 0.019574338205844314
#   cout nse_log 0.17075, soit NSE_log 0.8293
#
# L'optimum est INTERIEUR a la grille [5e-3 ; 0,30] : les couts voisins
# valent 1,086 a Sy = 0,005 et 0,226 a Sy = 0,0766. C'est ce que
# l'abaissement de la borne basse devait permettre.
#
# Premier calage sur la geometrie corrigee, ou la cote de lit vient du
# MNT du toit et non plus de la surface burnee.
# ======================================================================

# Generated by hydromodpy.core.toml_io.io
# profile = 'expert'

