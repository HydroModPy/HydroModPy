# ======================================================================
# Nancon - run TRANSITOIRE journalier au point calibre
# ----------------------------------------------------------------------
# Ce que le balayage de la bande ne pouvait pas donner : un hydrogramme.
# Les cinq runs de `band_d*.toml` sont en permanent sur une periode, donc
# sans serie temporelle et sans NSE possible. Celui-ci solve 2000-2004 au
# pas journalier, K et Sy poses aux valeurs de la calibration en deux
# etages, et produit la serie de debit que les metriques scorent.
#
#   hmp run examples/projects/21_nancon_network_calibration/transient_daily.toml
#
# CE QUE LE MODELE PRODUIT, ET CE QU'IL NE PRODUIT PAS. Le flux de drain
# est du debit de base. La station mesure le debit total, ruissellement
# direct compris. Mesure sur ce bassin, le rapport recharge / debit jauge
# tient entre 0,68 et 0,77 selon la fenetre, donc un quart du debit jauge
# n'a pas de contrepartie dans ce modele. Un NSE brut mesurera surtout
# cette part manquante ; le NSE des logarithmes pese les basses eaux, ou
# le debit de base domine, et c'est le critere que l'etage 2 utilise.
#
# L'annee 2000 est ecartee du score : au pas journalier la memoire de
# l'etat initial se voit sur les premieres recessions.
# ======================================================================

base_config = "project.toml"

[simulation]
name = "nancon_transient_daily"
description = "Nancon - transitoire journalier 2000-2004 au point calibre."
if_exists = "replace"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2004-12-31"
step_unit = "day"
step_value = 1

[flow]
flow_regime = "transient"

# Racine de l'etage 1, dichotomie sur le zero de l'ecart signe.
[flow.param.K.field]
value = 2.0535e-4

# Borne basse retenue par l'etage 2 sur la variante a 50 m.
[flow.param.Sy.field]
value = 5.0e-3

[simulation.results.derived]
release_flux = true
watertable_elevation = true
watertable_depth = true
seepage_areas = true

# Pas de galerie : ce run est la pour la serie, pas pour les cartes.
[display]
enabled = false
