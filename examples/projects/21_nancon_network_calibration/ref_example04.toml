# ======================================================================
# Nancon - replique MODFLOW 6 de addon_tempo/example_04_calibration.py
# ----------------------------------------------------------------------
#   hmp calibrate examples/projects/21_nancon_network_calibration/ref_example04.toml
#
# Fichier AUTONOME. Objet : rejouer, sous MODFLOW 6 et par le TOML, la
# calibration du script de reference, avec SES parametres et non ceux que
# les autres fichiers de ce dossier ont regles depuis. Il sert de point de
# comparaison, pas de configuration recommandee.
#
# Ce que la reference fait, et qui est reproduit ici :
#   - MNT regional a 75 m, exutoire (389358 ; 6816630), snap 150 m,
#     boite avec 10 % de marge, EPSG:2154 ;
#   - une seule couche de 30 m, K homogene (lay_decay = 1, donc aucune
#     decroissance avec la profondeur), Sy homogene ;
#   - drain sur chaque maille a conductance proportionnelle (cond_drain
#     = None dans la reference, `value = 0.0` ici) ;
#   - etage 1 : Nelder-Mead sur log10(K), en PERMANENT, cout
#     (D_so + D_os) / 2 ;
#   - etage 2 : Nelder-Mead sur log10(Sy), en TRANSITOIRE journalier,
#     cout 1 - NSE_log, K gele ;
#   - debit simule = drainage + ruissellement de surface.
#
# Les quatre ecarts, tous mesures et tous assumes :
#
#   1. PLAGE DE DONNEES. La reference declare 1995-2024. La recharge et le
#      ruissellement REA du Nancon s'arretent au 31 decembre 2020. La
#      fenetre est donc 1995-2020, soit 26 ans au lieu de 30, 9497 jours.
#      Le debit observe, lui, couvre 1982-2022 et ne limite rien.
#
#   2. SIMPLEXE INITIAL. La reference travaille dans un espace normalise
#      [0 ; 1] et regle ses tolerances la ; l'adaptateur de HydroModPy
#      travaille dans l'espace TRANSFORME, ici log10. Les tolerances
#      ci-dessous sont converties (voir chaque etage). Le pas du simplexe
#      initial vaut 10 % de l'intervalle et n'est pas reglable : 0,60
#      decade sur K la ou la reference en prend 0,15, et 0,39 decade sur
#      Sy la ou elle en prend 0,98. Le point de depart, lui, coincide :
#      l'adaptateur part du centre des bornes en espace transforme, ce qui
#      donne K = 1e-5 m/s exactement comme `hk` de la reference, et
#      Sy = 7,07e-3 contre 1e-2.
#
#   3. BORNE HAUTE DE Sy. La reference prend `sy_max = 80/100`. Le
#      validateur de HydroModPy plafonne un rendement specifique a 0,5 et
#      refuse la configuration. Il a raison : 0,8 signifierait que 80 % du
#      volume de roche se vidange par gravite, ce qu'aucun materiau
#      geologique ne fait. La borne est donc 0,5. L'optimum des autres
#      calages du dossier vaut 0,02 a 0,06, deux ordres de grandeur sous
#      la coupure, qui ne mord donc sur rien.
#
#   4. SURFACE DE ROUTAGE. La reference ne burne pas le reseau ;
#      `[geographic.enforce_streams]` reste actif a 10 m ici. C'est un
#      ecart SANS EFFET MESURABLE sur ce montage, et c'est une mesure et
#      non une opinion : l'etage 1 rejoue burn coupe rend les neuf memes
#      essais au bit pres, jusqu'au meme `best_objective`
#      185.7234104098768. L'etape geographique, elle, change bien
#      (alpha 0,996 burn actif contre 0,917 burn coupe), donc le calcul a
#      bien ete refait.
#
#      La raison est dans le code : le critere descend le TOIT BRUT et le
#      conditionne lui-meme sur le graphe du maillage
#      (`hydromodpy/core/stream_geometry.py`), il ne lit jamais la surface
#      burnee. Le burn n'entre que par le masque du bassin delimite, que
#      le run mesure a 64,603 km2 sans burn contre 64,614 avec, soit deux
#      mailles a 75 m.
#
#      Il est garde pour que la delimitation coincide avec celle des
#      autres fichiers du dossier, pas parce que le critere en aurait
#      besoin. Sur un montage AVEC des biefs SFR la question serait tout
#      autre : la le burn oriente la descente qui construit le reseau.
# ======================================================================

[workflow]
mode = "calibration"

[workspace]
project_root = "."


# ---------------------------------------------------------------------- geographic

[geographic]
source_mode = "standard"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
reuse_existing_outputs = true

[geographic.catchment]
catch_def = "from_outlet_coord"
# `DEM_armorican_massif.tif` EST le `regional dem.tif` de la reference :
# meme emprise (124012,5 - 481987,5 x ; 6597562,5 - 6969862,5 y), meme
# taille 4773 x 4964, meme pas de 75 m. C'est pourquoi ce fichier remplace
# ici `DEM_nancon_25m.tif` : la resolution fait partie des parametres a
# reproduire, et elle divise le maillage par neuf.
dem_init_path = "DEM_armorican_massif.tif"

# Coordonnees PAR DEFAUT du script de reference (`--x` / `--y`), et non
# celles du reste du dossier (389285,91 ; 6816518,749). Le snap de 150 m
# ramene les deux sur le meme brin.
x_outlet = 389358.0
y_outlet = 6816630.0
snap_dist = "150 m"
buff_area = "10%"

[geographic.enforce_streams]
enabled = true
mode = "constant"
depth_m = 10.0

# `[geographic.river_network]` est volontairement ABSENT. Il derive un
# trace du MNT et son ordre de Strahler, qui n'alimentent que les figures
# `hydrographic_network_generated` et `hydrographic_network_comparison`,
# dont aucune n'est dans la liste `figures` de ce fichier. Il ecrivait une
# table que rien ne relisait.


# ---------------------------------------------------------------------- domain
# `thick = 30` et `bottom = None` de la reference : epaisseur constante
# sous le toit. `nlay` n'est pas declare, donc une seule couche, ce qui
# est le `nlay = 1` de la reference.

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = 30.0


# ---------------------------------------------------------------------- data

[data]
project_crs = "EPSG:2154"
types = ["dem", "geology", "hydrography", "hydrometry", "recharge", "runoff"]

[[data.dem.sources]]
source = "custom"
path = "DEM_armorican_massif.tif"

[[data.geology.sources]]
source = "brgm_1m"

[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"

[data.hydrometry]
date_start = "1995-01-01"
date_end = "2020-12-31"

[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
extent = "watershed"
station_ids = ["NANCON"]

# `recharge_REA` de la reference, journalier, moyenne surfacique sur les
# mailles SIM2 du bassin. Le fichier couvre 1990-2020.
[data.recharge]
date_start = "1995-01-01"
date_end = "2020-12-31"

[[data.recharge.sources]]
source = "custom"
path = "recharge"
station_ids = ["NANCON_REA"]

# `runoff` de la reference. Il est ajoute au drainage simule avant
# comparaison au debit observe, exactement comme
# `Qmod = outflow_drain * 1000 + r * 1000` du script.
[data.runoff]
date_start = "1995-01-01"
date_end = "2020-12-31"

[[data.runoff.sources]]
source = "custom"
path = "runoff"
station_ids = ["NANCON_REA"]


# ---------------------------------------------------------------------- flow

[flow]
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
flow_regime = "steady"

[flow.ic]
type = "top"
description = "Water table initialised at the topographic surface."

# `hk = 1.0e-5 * 3600 * 24` de la reference, en m/s. La calibration la
# remplace des le premier essai ; elle n'est ecrite que pour que le
# fichier tourne aussi en `hmp run`.
[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 1.0e-5

# `sy = 1/100` de la reference.
[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = 0.01

# La reference ne regle pas le stockage specifique. 1e-5 m-1 est la valeur
# du reste du dossier ; sur 30 m elle pese 3e-4 contre un Sy de l'ordre du
# centieme, donc moins d'un pour cent du stockage.
[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"
value = 1e-5

# `cond_drain = None` de la reference : conductance proportionnelle
# C = K * A / e. C'est ce qui fait du rapport K/R la quantite calibree a
# l'etage 1.
[flow.bc.cauchy.drainage]
id = "drainage"
kind = "cauchy"
application_domain = "top"
description = "Cauchy drainage on the aquifer top face."
value = 0.0

[flow.sinks_sources.recharge]
values = 0.0


# ---------------------------------------------------------------------- simulation

[simulation]
name = "nancon_ref_ex04"
description = "Nancon - replique MF6 de example_04_calibration.py, K puis Sy par Nelder-Mead."
if_exists = "replace"

[simulation.time]
start_datetime = "1995-01-01"
end_datetime = "2020-12-31"
step_value = 1
step_unit = "day"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[simulation.results.derived]
release_flux = true
watertable_elevation = true
watertable_depth = true
seepage_areas = true
accumulation_flux = true


# ---------------------------------------------------------------------- modflow 6

[modflow6.runtime]
print_head = false
save_specific_discharge = false
save_saturation = false


# ---------------------------------------------------------------------- calibration

[calibration]
seed = 42
save_runs = "best_n"
save_best_n = 1
persist_iteration_detail = "full"
# `--resume` de la reference vaut True par defaut : elle relit son CSV
# d'essais et ressert un cout deja calcule au lieu de relancer le modele.
# `use_cache = true` est l'equivalent HydroModPy, et il est necessaire ici :
# l'etage 2 est une chronique de 9497 jours, donc plusieurs jours de calcul,
# qu'une interruption ne doit pas remettre a zero. Les autres fichiers du
# dossier le laissent a false parce qu'ils servent a verifier un correctif
# de solveur, ce qui n'est pas l'objet de celui-ci.
use_cache = true
rerun_best_with_outputs = true

# Bornes de la reference : `log_hk_min, log_hk_max = log10(1e-8*86400),
# log10(1e-2*86400)`, soit 1e-8 a 1e-2 m/s, six decades. Le centre en log
# tombe sur 1e-5 m/s, qui est le `hk` initial du script.
[calibration.parameters.K]
bounds = [1e-8, 1e-2]
transform = "log"
path = "flow.param.K.field.value"
units = "m/s"

# Bornes de la reference : `sy_min, sy_max = 0.01/100, 80/100`. La borne
# haute est ramenee a 0,5, le plafond physique que le validateur impose
# (voir l'ecart 3 en tete de fichier).
[calibration.parameters.Sy]
bounds = [1e-4, 0.5]
transform = "log"
path = "flow.param.Sy.field.value"
units = "-"

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"
weighting = "area"
tau_specific_ratio = 1.0e-4
roptim_max = 2.0
time = "last"
observed_position_accuracy = "50 m"

# `matching = (abs(sim_distance) + abs(obs_distance)) / 2` du script, soit
# l'equation 2 d'Abherve et non l'equation 1. Ce n'est PAS le meme
# estimateur que la dichotomie des autres fichiers du dossier : rien ne
# place le minimum interieur de cette moyenne sur le zero de l'ecart
# signe. C'est precisement l'ecart de methode que ce fichier sert a
# mesurer.
[[calibration.objective_blocks]]
name = "abherve_mean_distance"
metric = "distance_mean"
uses_outputs = ["seepage_network"]


# --- Etage 1 : K par Nelder-Mead sur la distance moyenne, en permanent ---
# `sim_state_steady = 'steady'` et `first_clim = 'mean'` de la reference :
# une seule periode permanente sur toute la chronique, donc la recharge
# moyenne 1995-2020.

[[calibration.phases]]
name = "steady_k"
description = "Minimum of (D_so + D_os) / 2 on K, steady state."
method = "scipy_nelder_mead"
max_iter = 60
batch_size = 1
parallel = 1
parameters = ["K"]
objective_blocks = ["abherve_mean_distance"]
freeze_on_success = true

[calibration.phases.optimizer_kwargs]
# `maxiter: 30` de la reference. `maxfev` n'y est pas regle, donc scipy
# prend 200 ; le plafond reel est ici `max_iter` de la phase.
maxiter = 30
maxfev = 60
# `xatol: 0.05` de la reference, exprime dans un espace normalise sur six
# decades. Converti : 0,05 x 6,0 = 0,30 decade de K.
xatol = 0.30
# `fatol: 0.05`. Le cout est une distance en metres et n'est pas
# normalise, la valeur passe telle quelle.
fatol = 0.05

[calibration.phases.overrides]
"flow.flow_regime" = "steady"
"simulation.time.start_datetime" = "1995-01-01"
"simulation.time.end_datetime" = "2020-12-31"
"simulation.time.step_unit" = "year"
"simulation.time.step_value" = 26


# --- Etage 2 : Sy par Nelder-Mead sur le NSE des logarithmes, K gele ---
# La reference score TOUTE la periode de calage, sans annee d'amorce
# ecartee (`calib_start_date = f"{first_year}-01-01"`). Aucune
# `scoring_window` n'est donc declaree ici, contrairement aux autres
# fichiers du dossier qui excartent 2000.
#
# `use_seasonal_filter = False` dans la reference : aucun masque saisonnier.

[[calibration.phases]]
name = "transient_sy"
description = "NSE of log daily discharge over 1995-2020, K frozen."
method = "scipy_nelder_mead"
max_iter = 120
batch_size = 1
parallel = 1
parameters = ["Sy"]
variable = "discharge"
objective = "nse_log"
depends_on = "steady_k"

[calibration.phases.optimizer_kwargs]
# `maxiter: 120` de la reference.
maxiter = 120
maxfev = 120
# `xatol: 1e-5` normalise sur les 3,699 decades de [1e-4 ; 0,5]
# -> 3,7e-5 decade de Sy.
# Inatteignable en pratique : c'est `maxiter` qui arrete la recherche,
# exactement comme dans la reference.
xatol = 3.7e-5
# `fatol: 1e-5`. Le cout 1 - NSE_log est sans dimension, valeur telle
# quelle.
fatol = 1e-5

[calibration.phases.overrides]
"flow.flow_regime" = "transient"
"simulation.time.start_datetime" = "1995-01-01"
"simulation.time.end_datetime" = "2020-12-31"
"simulation.time.step_unit" = "day"
"simulation.time.step_value" = 1


# ---------------------------------------------------------------------- display

[display]
enabled = true
preset = "default"
show = false
save = true
output_dir = "figures"
cmap = "viridis"
on_error = "warn"

figures = [
    "watershed_id_card",
    "mesh_map",
    "boundary_package_map",
    "depression_map",
    "flow_direction_map",

    "hydrograph_sim_obs",
    "hydrograph_log_nse",
    "hydrograph",
    "duration_curve",
    "recession",
    "seasonal_boxplot",

    "water_budget",
    "flux_timeseries",

    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "recharge_map",
    "simulated_active_network",
    "accumulation_map",

    "downslope_distance_map",
    "downslope_distance_crossing",
    "seepage_network_reference_overlay",
    "seepage_network_confusion_map",
    "parameter_cost_profile",
    "calibration_convergence",
    "calibration_trace",
    "abherve_two_stage_card",
]
