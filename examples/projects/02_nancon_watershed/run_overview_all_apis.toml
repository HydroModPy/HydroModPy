# ---- Recharge (SIM2 grid) -------------------------------------------
[data.recharge]
date_start = "2018-01-01"
date_end = "2020-12-31"

[[data.recharge.sources]]
source = "sim2"
extent = "watershed"


# ----------------------------------------------------------------------
# Overview - one PNG per panel, dropped under figures/overview/
# ----------------------------------------------------------------------

[overview]
name = "Nancon"
date_start = "2018-01-01"
date_end = "2020-12-31"

[overview.panels]
# Spatial panels: DEM, geology, river network.
map_dem = true
map_geology = true
map_hydrography = true
# Tabular panels: catchment summary metrics + station inventory.
stats_card = true
station_inventory = true
# Climatology bars from precipitation + ETP monthly means.
climatic_summary = true
# Discharge / piezometry / intermittency / water-quality timeseries.
# (intermittency + water_quality toggles are accepted by the schema but
# their rendering is not implemented yet in the overview report.)
timeseries_discharge = true
timeseries_piezometry = true
timeseries_intermittency = true
timeseries_water_quality = true
