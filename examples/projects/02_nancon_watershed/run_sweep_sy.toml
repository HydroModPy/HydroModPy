# ======================================================================
# Nançon - sweep paramétrique sur Sy
# ----------------------------------------------------------------------
# Overlay qui hérite de `project.toml`. Reproduit ce que fait
# `run_transient_prototype.py` : enchaîne 3 simulations avec trois
# valeurs explicites de Sy, K/Ss/épaisseur gelés à leur baseline.
#
# ATTENTION : `workflow = "sweep"` N'EST PAS ENCORE IMPLÉMENTÉ. Ce
# TOML sert de specification / brouillon de design pour le futur
# workflow. Il ne passera PAS le dispatch actuel
# (`hydromodpy/_cli/workflows.py:23-29`) tant que :
#   1. "sweep" n'est pas ajouté à KNOWN_WORKFLOWS
#   2. un `hydromodpy/sweep/` (config + runner) n'est pas écrit
#   3. `run_sweep()` n'est pas câblé dans DISPATCH
#
# Design cible :
#   uv run hmp run examples/projects/02_nancon_watershed/run_sweep_sy.toml
#   → lance 3 runs complets (chacun persisté en Zarr + Parquet), tagués
#     sous un `sweep_id` commun pour faciliter la comparaison.
# ======================================================================
base_config = "project.toml"

workflow = "sweep"

[simulation]
name = "nancon_sweep_sy"
description = "Sweep Sy ∈ {0.001, 0.05, 0.30} - K/Ss/épaisseur gelés."

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

# --- Paramètres gelés (non balayés) ----------------------------------

[domain.depth_model]
thickness = 30.0

[flow.param.K.field_homogeneous]
value = 5e-5

[flow.param.Ss.field_homogeneous]
value = 1e-5

[flow.sinks_sources.recharge]
first_clim = "first"

# --- Sweep -----------------------------------------------------------
#
# Stratégies envisagées (forward-looking) :
#   "enumerate" : une liste explicite de valeurs par paramètre (ce cas)
#   "grid"      : produit cartésien régulier (bounds + points_per_dim)
#   "lhs"       : Latin Hypercube Sampling (bounds + n_samples)
#   "sobol"     : quasi-MC Sobol pour analyse de sensibilité globale
#   "morris"    : plan Morris (élémentaires effects)
#
# Chaque paramètre déclare :
#   values / bounds : selon la stratégie
#   path            : chemin dotté dans HydroModPyConfig injecté par run
#   units           : label informatif

[sweep]
strategy = "enumerate"
naming = "{param}_{value:.4f}"   # template pour `simulations.name`
save_runs = "all"                # tous les runs gardent Zarr + Parquet

[sweep.parameters.Sy]
values = [0.001, 0.05, 0.30]
path = "flow.param.Sy.field_homogeneous.value"
units = "-"

# Exemple de sweep 2D (produit cartésien → 3×2 = 6 runs) - commenté :
# [sweep.parameters.K]
# values = [1e-5, 5e-5]
# path = "flow.param.K.field_homogeneous.value"
# units = "m/s"
