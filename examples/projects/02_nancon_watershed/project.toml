# ----------------------------------------------------------------------
# Workspace configuration for project-based workspace structure.
# ----------------------------------------------------------------------

workflow = "simulation"

[workspace]
# Path to the project directory.
# Auto-derived from TOML location when absent.
# Type: path | REQUIRED
project_root = "."

# Root directory for all outputs (simulations/<uuid>.zarr, .solver_scratch/).
# Defaults to project_root when not set.
# Use this to redirect heavy outputs to a separate disk.
# Type: path (optional) | Optional
# output_root = ""


# ----------------------------------------------------------------------
# Geographic configuration for watershed delineation.
# ----------------------------------------------------------------------

[geographic]
# Geographic runtime mode.
# 'standard' keeps the historical DEM/outlet/polygon workflow.
# 'synthetic' builds one analytical support from [geographic.synthetic].
# Type: Literal['standard', 'synthetic'] | one of: "standard", "synthetic" | Default: "standard"
source_mode = "standard"

# Catchment definition mode used when source_mode='standard'.
# 'dem' = model domain defined directly from a DEM raster (dem_init_path required).
# 'txt' = model domain from an XYZ text file (dem_init_path, cell_size required).
# 'from_outlet_coord' = watershed from outlet coordinates (dem_init_path, x_outlet, y_outlet, snap_dist, buff_area required).
# 'from_polyg_shp' = watershed from a polygon shapefile (dem_init_path, polyg_shp_path, buff_area required).
# Type: Literal (optional) | Optional
catch_def = "from_outlet_coord"

# Path to the DEM raster used as input.
# For 'dem' and 'txt' modes: defines the model domain directly.
# For 'from_outlet_coord' and 'from_polyg_shp' modes: regional DEM used for flow analysis.
# Auto-resolved from [[data.dem.sources]] when omitted (see [data] section below).
# Type: path (optional) | Optional
# dem_init_path = "../../data/dem/DEM_armorican_massif.tif"

# Grid cell size in metres used to rasterise the XYZ point cloud.
# Required for 'txt' mode.
# Type: float (optional) | > 0 | Optional
# cell_size = 1.0

# X coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: float (optional) | Optional
x_outlet = 389285.91

# Y coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: float (optional) | Optional
y_outlet = 6816518.749

# Maximum snapping distance to move the outlet to the nearest stream cell.
# Accepts SI-friendly values (for example 50, '50 m', '0.05 km').
# Required for 'from_outlet_coord' mode.
# Type: UnionType[float, str, NoneType] | Optional
snap_dist = "150 m"

# Buffer around the watershed polygon.
# Numeric values keep legacy behavior (percentage of sqrt(area [km^2])).
# String values are interpreted as explicit distances (for example '500 m', '2 km').
# Required for 'from_outlet_coord' and 'from_polyg_shp' modes.
# Type: UnionType[str, float, NoneType] | Optional
buff_area = "10%"

# Path to the watershed polygon shapefile.
# Required for 'from_polyg_shp' mode.
# Type: path (optional) | Optional
# polyg_shp_path = ""

# Target projected CRS for all outputs (e.g.
# 'EPSG:2154').
# If not set, derived from the input DEM.
# Type: string (optional) | Optional
crs_project = "EPSG:2154"

# DEM depression correction method.
# 'breach' (recommended) preserves natural flow paths.
# 'fill' raises sinks to their pour point.
# Type: Literal['breach', 'fill'] | one of: "breach", "fill" | Default: "breach"
dem_correc_type = "breach"

# Path to a raster representing the aquifer bottom elevation.
# Must share the same grid as the model domain.
# Type: path (optional) | Optional
# bottom_path = ""

# If true, reuse previously generated geographic artifacts when the cached fingerprint matches the current DEM, outlet/polygon and geographic settings.
# This is useful for profiling repeated simulation runs in the same workspace.
# Type: bool | Default: false
reuse_existing_outputs = false


# Synthetic geographic support used when source_mode='synthetic'.
# This analytical mode bypasses watershed delineation from external DEM files.

[geographic.synthetic]
# Identifier used by local case runners and outputs.
# Type: string | Default: "flat20"
case_id = "flat20"


[geographic.synthetic.grid]
# Total domain length along x.
# Accepts values such as 100, '100 m', or '0.1 km'.
# Type: float | Default: 100.0
length_x = 100.0

# Total domain length along y.
# Accepts values such as 1, '1 m', or '0.001 km'.
# Type: float | Default: 1.0
length_y = 1.0

# Number of cells along x.
# Type: int | >= 1 | Default: 100
nx = 100

# Number of cells along y.
# Type: int | >= 1 | Default: 1
ny = 1


[geographic.synthetic.topography]
# Analytical topography law.
# 'flat' keeps one constant elevation.
# 'linear' increases from right to left with a linear profile.
# 'radial_island' builds one circular emerged island surrounded by submerged ocean cells.
# Type: Literal['flat', 'linear', 'radial_island'] | one of: "flat", "linear", "radial_island" | Default: "flat"
kind = "flat"

# Reference elevation (m).
# For 'flat' this is the constant surface elevation.
# For 'linear' this is the elevation on the right boundary.
# For 'radial_island' this is the submerged ocean-floor elevation.
# Type: float | Default: 20.0
base_elevation = 20.0


# Optional DEM-derived river-network extraction settings.
# When disabled, no stream network is generated in geographic preprocessing.

[geographic.river_network]
# Enable DEM-based river-network extraction from flow accumulation during geographic preprocessing.
# Type: bool | Default: false
enabled = false

# Stream-initiation threshold selector.
# 'area_km2' uses contributing area in km^2.
# 'cells' uses contributing-cell count directly.
# Type: Literal['area_km2', 'cells'] | one of: "area_km2", "cells" | Default: "area_km2"
threshold_mode = "area_km2"

# Contributing area threshold (km^2), required when threshold_mode='area_km2'.
# Type: float (optional) | Optional
# threshold_area_km2 = 0.0

# Contributing-cell threshold, required when threshold_mode='cells'.
# Type: float (optional) | Optional
# threshold_cells = 0.0

# If true, remove short stream segments after extraction.
# Type: bool | Default: false
prune_short_streams = false

# Minimum stream length used by short-segment pruning.
# Accepts SI-friendly values (for example 0, 250, '250 m', '0.5 km').
# Type: UnionType[float, str] | Default: 0.0
min_stream_length_m = 0.0

# Compute Strahler order raster from extracted streams.
# Type: bool | Default: true
compute_strahler_order = true

# Compute stream-link identifier raster from extracted streams.
# Type: bool | Default: true
compute_stream_links = true

# Forwarded to Whitebox raster_streams_to_vector.
# False keeps a lighter vector geometry.
# Type: bool | Default: false
all_vertices = false


# ----------------------------------------------------------------------
# Domain configuration.
# ----------------------------------------------------------------------

[domain]
# Ordered list of zone identifiers loaded in the domain registry.
# Keep this list for actual runtime zones (for example 'catchment', 'geology', or custom zonations).
# Spatial-support declarations live under domain.supports.
# Type: list[str] | REQUIRED
zone_ids = ["geology"]

# Named spatial supports available to heterogeneous parameters.
# Each key is a support identifier referenced by field_spatial_id.
# Type: dict[str, Annotated] | REQUIRED
supports = {}


# Vertical domain model configuration.
# Use 'constant_thickness' or 'flat_substratum'.

[domain.depth_model]
# Depth-model type selector.
# Use 'constant_thickness' to define bottom as top-thickness.
# Type: Literal['constant_thickness'] | one of: "constant_thickness" | Default: "constant_thickness"
type = "constant_thickness"

# Constant aquifer thickness (m) applied below topography.
# Type: float | > 0.0 | Default: 50.0
# Épaisseur baseline — remplacée par le run overlay (run_transient_nwt.toml).
thickness = 30.0


