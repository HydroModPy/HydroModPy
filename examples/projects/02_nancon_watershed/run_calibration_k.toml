# ======================================================================
# Nançon - calibration of K against observed discharge
# ----------------------------------------------------------------------
# Overlay TOML. Inherits the project base config and runs an Optuna
# campaign that searches log10(K) to maximise NSE between the simulated
# drain discharge and the observed Nançon hydrograph.
#
# Sy, Ss and aquifer thickness are frozen at their baseline value.
#
# `hmp run` reads `workflow = "calibration"` and dispatches to the
# calibration ask/tell loop. Each iteration forks the prepared context
# and runs a real MODFLOW-NWT simulation in lightweight mode (no per
# iteration Zarr / Parquet by default).
#
# `save_runs = "best_n"` keeps full simulation outputs for the top N
# iterations after the campaign and back-fills their `sim_id` into the
# `calibration_iterations` table.
#
# Launch:
#   hmp run examples/projects/02_nancon_watershed/run_calibration_k.toml
# ======================================================================


# ---- Orchestration ---------------------------------------------------
base_config = "project.toml"

# `calibration` switches the dispatcher to the ask/tell loop instead of
# the single-run pipeline. Required: a [calibration] block (below).
workflow = "calibration"


[simulation]
name = "nancon_calibration_k"
description = "Optuna calibration of K vs NSE(discharge), Sy/Ss frozen."

[simulation.time]
# Same three-year window as the transient run.
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]


# ---- Frozen parameters (not calibrated) -----------------------------

[domain.depth_model]
thickness = 30.0

[flow.param.Sy.field_homogeneous]
value = 0.05

[flow.param.Ss.field_homogeneous]
value = 1e-5


# ---- Calibration -----------------------------------------------------
# The mere presence of [calibration] (with `workflow = "calibration"`)
# triggers the calibration workflow. Each parameter declares:
#   bounds     : [low, high] in the physical space
#   transform  : 'log' for K (strictly positive, multi-decade range)
#   prior      : sampling prior used by Bayesian optimisers
#   path       : dotted path into HydroModPyConfig - written at each ask
#   units      : informative label

[calibration]
# Optuna is the recommended sampler (Tree-structured Parzen Estimator).
method = "optuna"
# 40 trials is a small budget; bump it for production runs.
max_iter = 5
# One trial per ask (sequential). Increase for parallel optimisers.
batch_size = 1
# `best_n` promotes the top iterations to full simulations after the
# loop, with Zarr + figures. Cheaper than `all` for large campaigns.
save_runs = "best_n"
save_best_n = 1
# Fixed seed for reproducibility.
seed = 42
# Objective metric on the observed discharge time-series.
# KGE (Kling-Gupta Efficiency) is the standard for streamflow
# calibration: it decomposes the fit into correlation, bias and
# variability, so a poor amplitude is not hidden by a good mean.
# Other choices: 'rmse' / 'mae' (scale-dependent error), 'nse'
# (penalises mean bias only).
objective = "kge"
variable = "discharge"
# Memoise duplicate parameter samples through a content-addressed cache.
use_cache = true

[calibration.parameters.K]
# K spans many orders of magnitude. We sample uniformly in log10 space.
bounds = [1e-6, 1e-3]
transform = "log"
prior = "log_uniform"
# Dotted path written at each iteration. Pydantic flattens the
# [flow.param.K.field_homogeneous] subsection into a flat dict at
# validation time, so the runtime key is `flow.param.K.value` (not
# `flow.param.K.field_homogeneous.value` as on disk).
path = "flow.param.K.value"
units = "m/s"
