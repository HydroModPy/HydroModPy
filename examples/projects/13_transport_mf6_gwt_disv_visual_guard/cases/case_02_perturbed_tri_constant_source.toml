[case]
name = "case_02_perturbed_tri_constant_source"
title = "Perturbed triangular DISV mesh, constant source"
description = "Same transport setup as case 01 on a lightly perturbed triangular mesh."

[domain]
length_m = 120.0
width_m = 24.0
nx = 18
ny = 6
perturbation_fraction = 0.12
seed = 202
max_area_ratio = 2.50

[flow]
head_left_m = 1.2
head_right_m = 0.0
hydraulic_conductivity_m_per_day = 1.0
porosity = 0.30

[transport]
duration_days = 60.0
n_snapshots = 6
source_concentration = 1.0
source_schedule = "constant"
pulse_end_day = 60.0
longitudinal_dispersivity_m = 3.0
transverse_dispersivity_m = 0.3
diffusion_m2_per_day = 0.0
