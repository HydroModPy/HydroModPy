# ======================================================================
# Nancon - MODFLOW 6 sur grille non-structuree (DISV)
# ----------------------------------------------------------------------
# Meme bassin, mais la grille est un maillage triangulaire genere par
# gmsh et raffine le long du reseau hydrographique, au lieu d'un raster
# regulier. C'est le cas phare "maillage irregulier" : seul MODFLOW 6
# gere le DISV.
#
# Le maillage est construit par le bloc [mesh]. Le regime
# permanent garde le run rapide pour l'atelier.
#
# Lancement :
#   hmp run examples/projects/20_atelier_nancon/sim_mf6_unstructured.toml
# ======================================================================

base_config = "project.toml"


[workflow]
mode = "simulation"

[simulation]
name = "mf6_unstructured"
description = "Nancon permanent, MODFLOW 6 sur maillage DISV raffine sur les rivieres."

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2000-12-31"
step_value = "1 year"
coverage_policy = "warn"

[flow]
flow_regime = "steady"

# Le reseau hydrographique pilote le raffinement du maillage, il doit
# donc etre calcule.
[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 0.5
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

# Definition du maillage non-structure. "rivers_only" raffine la
# triangulation vers le reseau de cours d'eau et la limite du bassin.
[mesh]
engine = "voronoi"
cell_size = 1400.0
river_cell_size = 800.0
river_band = 1400.0
outside_factor = 2.0
transition_distance = 680.0

[mesh.families]
geology = "none"
watershed_boundary = "face"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 1e-4
mf6_inner_dvclose = 1e-4
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 1
lay_decay = 1.2

[flow.param.K.field]
value = 5e-5
