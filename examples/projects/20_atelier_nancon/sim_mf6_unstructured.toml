# ======================================================================
# Nancon - MODFLOW 6 sur grille non-structuree (DISV)
# ----------------------------------------------------------------------
# Meme bassin, mais la grille est un maillage triangulaire genere par
# gmsh et raffine le long du reseau hydrographique, au lieu d'un raster
# regulier. C'est le cas phare "maillage irregulier" : seul MODFLOW 6
# gere le DISV.
#
# Le maillage est construit par le bloc [mesh_catchment]. Le regime
# permanent garde le run rapide pour l'atelier.
#
# Lancement :
#   hmp run examples/projects/20_atelier_nancon/sim_mf6_unstructured.toml
# ======================================================================

base_config = "project.toml"


[workflow]
mode = "simulation"

[simulation]
name = "mf6_unstructured"
description = "Nancon permanent, MODFLOW 6 sur maillage DISV raffine sur les rivieres."

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2000-12-31"
step_value = "1 year"
coverage_policy = "warn"

[flow]
flow_regime = "steady"

# Le reseau hydrographique pilote le raffinement du maillage, il doit
# donc etre calcule.
[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 0.5
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

# Definition du maillage non-structure. "rivers_only" raffine la
# triangulation vers le reseau de cours d'eau et la limite du bassin.
[mesh_catchment]
constraints_mode = "rivers_only"
output_layout = "flat"
figures_enabled = true

[mesh_catchment.watershed_boundary]
enabled = true
boundary_refinement_distance = 400.0

[mesh_catchment.watershed_boundary.smoothing]
enabled = true
distance = 200.0
river_buffer_distance = 100.0
outer_bias_distance = 10.0

[mesh_catchment.watershed_boundary.outside_coarsening]
enabled = true
size_factor = 2.0
transition_distance = 680.0
grid_resolution = 680.0

# Tailles de triangles visees (metres). Plus fines pres des rivieres,
# plus grossieres en s'eloignant.
[mesh_catchment.zone_meshing]
global_size = 1400.0
min_size = 700.0
max_size = 2600.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 800.0
interface_distance = 1400.0
interface_sampling = 96

[mesh_catchment.zone_meshing.refinement_policy]
enabled = true
mode = "grid_local_budget"

[mesh_catchment.zone_meshing.refinement_policy.grid]
neighborhood_rings = 1
enable_exact_gap_check = false
max_exact_gap_candidates = 128

[mesh_catchment.zone_meshing.refinement_policy.hotspot]
radius = 1400.0
max_curve_count = 180
max_family_count = 2
min_gap = 200.0
max_node_degree = 4
short_segment_length = 500.0
max_short_segment_count = 12

[mesh_catchment.zone_meshing.refinement_policy.families.river]
enabled = true
priority = 300

[mesh_catchment.zone_meshing.refinement_policy.families.watershed_boundary]
enabled = true
priority = 100

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 1e-4
mf6_inner_dvclose = 1e-4
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 1
lay_decay = 1.2

[flow.param.K.field]
value = 5e-5
