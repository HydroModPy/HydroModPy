# HydroModPy - example 10, stage two: find K from the observed stream network
#
# Same catchment, same PyHELP recharge as project.toml, which this file
# inherits. Only the conductivity changes, and it is searched rather than
# written: the criterion is the signed gap between the network the water table
# sustains and the mapped one, driven to zero by bisection. No discharge
# observation enters it, which is the point on an ungauged Alpine headwater.
#
#   hmp calibrate examples/projects/10_coupling_with_land_surface_model_pyhelp/run_calibration_k.toml
#
# This is the v2 form of the legacy dichotomy loop (ex10, v1.0.0): the same
# root, K/R at the zero of the signed gap, run by the calibration engine
# instead of by a hand-written while loop. It is not a bit-for-bit replica,
# and the settings below depart from it on purpose:
#   - weighting = "area" is NOT the legacy script's rule. ex10 and the v1
#     `MatchingStreams` class both average one point per pixel (one cell, one
#     vote); "area" over-weights nothing there and is this file's own choice,
#     recommended once the mesh is refined along the streams.
#   - tau_specific_ratio = 1e-4 has no equivalent in ex10, which uses a purely
#     geometric seepage test (dem - head < 0), tau = 0.
#   - observed_position_accuracy = "50 m" floors L_ref; ex10 hard-codes
#     GRID_RES = 75 m into roptim's Table 1 analogue and never floors it.
#   - bounds are on K itself, [1e-7, 1e-4] m/s, not on K/R as ex10 declares
#     them (K/R in [1, 1000], KRmin/KRmax, ex10:643-648): the two are only the
#     same search once R is known, and R is read back from the model, not
#     fixed in the file.

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "urse_network_k"
description = "Urse catchment, K from the hydrographic-network criterion, PyHELP recharge."


[calibration]
seed = 42
save_runs = "best_n"
save_best_n = 1
rerun_best_with_outputs = true

[calibration.parameters.K]
bounds = [1e-7, 1e-4]

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "urse_stream_network.gpkg"
weighting = "area"
tau_specific_ratio = 1.0e-4
validity_length = "auto"
time = "last"
observed_position_accuracy = "50 m"

[[calibration.objective_blocks]]
name = "abherve_gap"
metric = "distance_gap"
uses_outputs = ["seepage_network"]

[[calibration.phases]]
name = "steady_conductivity"
method = "bisection"
max_iter = 20
parameters = ["K"]
objective_blocks = ["abherve_gap"]

[calibration.phases.optimizer_kwargs]
rel_tol = 0.01
sweep_points = 7


[display]
on_error = "raise"
figures = [
    "seepage_map",
    "simulated_active_network_reference_overlay",
    "downslope_distance_map",
    "seepage_network_confusion_map",
    "matching_hydrographic_network_card",
    "parameter_cost_profile",
    "calibration_convergence",
]
