# Example 10, K from the mapped stream network.
#
# The same catchment and the same PyHELP recharge as project.toml, which this file inherits.
# Only the conductivity changes, and it is searched. No discharge is observed on this Alpine
# headwater, so the search has only the mapped network to go by. The criterion is the signed
# gap between the length of the network that the water table sustains and the length of the
# mapped one. A K too small lets the water table reach the ground nearly everywhere. A K too
# large keeps it deep and leaves the streams dry. The gap changes sign between the two, and
# a bisection on K finds where it is zero. The method is the one of Abherve et al. (2023),
# 10.5194/hess-27-3221-2023.
#
#   hmp check run_calibration_k.toml
#   hmp run run_calibration_k.toml

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "urse_example_10_k"
description = "Urse catchment, K from the mapped stream network, PyHELP recharge."

[calibration]
seed = 42
# The best trial is replayed as a full run, with its figures and its exports.
save_runs = "best_n"
save_best_n = 1

# K / recharge from 1 to 1000. The recharge is 2.38e-8 m/s, so K goes from 2.4e-8 to 2.4e-5 m/s.
[calibration.parameters.K]
bounds = [2.4e-8, 2.4e-5]

# The network is scored on the cells of the catchment, at the end of the run.
[calibration.outputs.seepage_network]
support = "network"
time = "last"

# The polygon of the catchment, 6.17 km2, and the catchment that the flow directions of the
# DEM give, 6.5 km2, differ by 7.7 %, because the DEM and the polygon disagree along the
# divide. The outlet is the same, so the search goes on.
[calibration.outputs.seepage_network.verdict]
max_catchment_mismatch = false
validity_length = "auto"

# The mapped network, the one to match. A simulated cell within 50 m of it counts as on it.
[calibration.outputs.seepage_network.map]
complete = "urse_stream_network.gpkg"
position_accuracy = "50 m"

[calibration.outputs.seepage_network.model]
seepage_threshold = 0.0001
weighting = "area"

[[calibration.objective_blocks]]
name = "network_gap"
metric = "distance_gap"
uses_outputs = ["seepage_network"]

# The search stops when the interval of K is narrower than 1 % of its middle.
[[calibration.phases]]
name = "steady_conductivity"
method = "bisection"
max_trials = "auto"
parameters = ["K"]
objective_blocks = ["network_gap"]

[calibration.phases.method_options]
rel_tol = 0.01
sweep_points = 7

# The figures of the run and the ones that only a search has: the root search, the
# parameter against the cost, and the progress of the search.
[display]
on_error = "raise"

[[display.figure]]
variable = "downslope_distance"
scale = "log"

[[display.figure]]
preset = "root_search"
when = "session"

[[display.figure]]
variable = ["trials.parameter", "trials.cost"]
type = "xy"
facet = "parameter"
when = "session"

[[display.figure]]
preset = "calibration_progress"
when = "session"
