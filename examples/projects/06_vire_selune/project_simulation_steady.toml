workflow = "simulation"

[workspace]
project_root = "."

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "../../data/dem/DEM_armorican_massif.tif"
snap_dist = "150 m"
buff_area = "10%"
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[domain]
zone_ids = ["geology"]

[domain.supports.field_geology]
provider = "geology"

[domain.depth_model]
type = "constant_thickness"
thickness = "50.0 m"

[data]
types = ["geology", "recharge"]

[data.geology]
id = "field_geology"
cell_samples_per_axis = 8

[[data.geology.sources]]
source = "brgm_1m"

[data.recharge]
date_start = "2020-01-01"
date_end = "2020-12-31"

[[data.recharge.sources]]
source = "synthetic"
# 220 mm/an equivalent annual-average recharge.
values = [0.6023]
freq = "YE"
start_date = "2020-01-01"
periods = 1
runoff_ratio = 0.05

[flow]
flow_regime = "steady"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "heterogeneous"
unit = "m/s"

[flow.param.K.field_heterogeneous]
values_source = "csv"
values_csv_file = "../../data/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
field_spatial_id = "field_geology"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = "1e-5 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = "0.02 -"

[flow.ic]
type = "top"
value = 1.0
unit = "m"

[flow.bc.cauchy.drainage]
application_domain = "top"
type = "cauchy"
value = "0.0 m2/s"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
display = true
matching_streams = false
native_mesh_npz = true
native_mesh_csv = true
native_mesh_vtu = false
native_mesh_png = true

[postprocess.flow.timeseries]
enabled = true

[display]
enabled = true
show = false
save = true

[display.flow]
enabled = true
state_triptych = true
recharge_discharge_cumulative = true
watertable_map = true
cross_section = false
streamflow = false
piezometry = false
