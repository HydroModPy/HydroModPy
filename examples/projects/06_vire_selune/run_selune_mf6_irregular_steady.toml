base_config = "project_simulation_steady.toml"


[workflow]
mode = "simulation"

[workspace]
project_root = "outputs/selune_mf6_irregular_steady"
root = "../../"

[simulation]
name = "selune_mf6_irregular_steady_demo"

[simulation.time]
start_datetime = "2020-01-01 00:00:00"
end_datetime = "2020-12-31 00:00:00"
step_value = "1 year"
coverage_policy = "warn"

[geographic.catchment]
x_outlet = 379541.3716
y_outlet = 6845659.878
# "20%" is an area increase: the buffered domain covers 20 % more area than the catchment.
buff_area = "20%"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[mesh]
engine = "voronoi"
cell_size = 2200.0
river_cell_size = 1100.0
river_band = 1800.0
outside_factor = 2.0
transition_distance = 680.0

[mesh.families]
watershed_boundary = "face"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 0.0001
mf6_inner_dvclose = 0.0001
mf6_outer_maximum = 1000
mf6_inner_maximum = 1000
mf6_enable_rewet = false

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 1
lay_decay = 1.2
