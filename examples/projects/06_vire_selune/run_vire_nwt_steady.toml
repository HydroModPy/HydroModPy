base_config = "project_simulation_steady.toml"


[workflow]
mode = "simulation"

[workspace]
project_root = "outputs/vire_nwt_steady"
root = "../../"

[simulation]
name = "vire_nwt_steady_demo"
run_id = "vire_nwt_steady"

[simulation.time]
start_datetime = "2020-01-01 00:00:00"
end_datetime = "2020-12-31 00:00:00"
step_value = "1 year"
coverage_policy = "warn"

[geographic]
x_outlet = 400866.1983
y_outlet = 6923974.693
buff_area = "20%"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[modflownwt.runtime]

[modflownwt.runtime.nwt]
version = "mfnwt"
headtol = 1e-6
fluxtol = 1e-4
maxiterout = 500
thickfact = 1e-5
linmeth = 1
iprnwt = 0
ibotav = 1
options = "SIMPLE"
continue_run = false
backflag = 0
stoptol = 1e-10

[modflownwt.runtime.dis]
itmuni = 1

[modflownwt.runtime.bas]
hnoflo = -9999.0

[modflownwt.runtime.upw]
iphdry = 1
hdry = -100.0
layvka = 1

[modflownwt.runtime.evt]
nevtop = 3
ievt = 1
ipakcb = 1

[modflownwt.runtime.oc]
compact = true

[modflownwt.runtime.wel]
ipakcb = 1

[modflownwt.runtime.lmt]
output_file_name = "mt3d_link.ftl"
extension = "lmt8"
output_format = "unformatted"
[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 60
ny = 60

[modflownwt.sgrid.vertical]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2

[modflownwt.tgrid]
itmuni = "days"
genmtd = "synthetic_regular"
nper = 1
lenper = 1.0
