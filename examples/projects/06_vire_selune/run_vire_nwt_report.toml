base_config = "run_vire_nwt.toml"

[simulation]
name = "vire_nwt_report"

[data]
types = ["geology", "hydrography", "recharge"]

[[data.hydrography.sources]]
source = "bdtopage"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 2.0
prune_short_streams = false
min_stream_length_m = 0.0
compute_strahler_order = true
compute_stream_links = true

[display]
[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
variable = "watertable_elevation"

[[display.figure]]
preset = "water_budget"

[[display.figure]]
preset = "hydrograph"

[[display.figure]]
variable = "recharge"
layer = "sum"

[[display.figure]]
variable = "seepage_mask"

[[display.figure]]
variable = "topography"
overlays = ["relief", "network"]
name = "hydrographic_network_reference"

[[display.figure]]
variable = "topography"
overlays = ["relief", "generated_network"]
name = "hydrographic_network_generated"

[[display.figure]]  # replaces hydrographic_network_comparison, hydrographic_network_reference_missing_only, hydrographic_network_generated_extra_only
preset = "network_comparison"

[[display.figure]]
variable = "simulated_active_network"
overlays = ["relief", "network"]
