
[site]
name = "selune"

[workflow]
mode = "simulation"

[geographic]
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[geographic.catchment]
kind = "from_outlet_coord"
# Default outlet coordinates point to the Selune gauging station.
# Run overlays override these with the watershed-specific outlet.
x_outlet = 379541.3716
y_outlet = 6845659.878
snap_dist = "150 m"
# "10%" is an area increase: the buffered domain covers 10 % more area than the catchment.
buff_area = "10%"

[domain]
[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"

[data]
types = ["dem", "geology", "recharge"]

[[data.dem.sources]]
source = "file"
path = "../../data/dem/DEM_armorican_massif.tif"


[data.geology]
id = "field_geology"
cell_samples_per_axis = 8

[[data.geology.sources]]
source = "brgm_1m"

[data.recharge]
date_start = "2020-01-01"
date_end = "2020-12-31"

[[data.recharge.sources]]
source = "sim2"
extent = "watershed"

[flow]
flow_regime = "transient"
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = "1e-5 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"
value = "1e-5 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = "0.02 -"

[flow.ic]
kind = "top"

[flow.bc.drainage]
application_domain = "top"
value = "0.0 m2/s"
kind = "drain"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[display]
