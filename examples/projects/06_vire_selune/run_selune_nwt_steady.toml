base_config = "project_simulation_steady.toml"


[workflow]
mode = "simulation"

[workspace]
project_root = "outputs/selune_nwt_steady"
root = "../../"

[simulation]
name = "selune_nwt_steady_demo"
run_id = "selune_nwt_steady"

[simulation.time]
start_datetime = "2020-01-01 00:00:00"
end_datetime = "2020-12-31 00:00:00"
step_value = "1 year"
coverage_policy = "warn"

[geographic]
x_outlet = 379541.3716
y_outlet = 6845659.878
buff_area = "20%"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[modflownwt.runtime]

[modflownwt.runtime.nwt]
version = "mfnwt"
headtol = 1e-4
fluxtol = 500.0
maxiterout = 5000
thickfact = 1e-5
options = "COMPLEX"
[modflownwt.sgrid.vertical]
genmtd_lay = "decay"
nlay = 5
lay_decay = 1.5

[modflownwt.tgrid]
itmuni = "days"
genmtd = "synthetic_regular"
nper = 1
lenper = 1.0
