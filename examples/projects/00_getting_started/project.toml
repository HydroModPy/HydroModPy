# ======================================================================
# HydroModPy - exemple 00 : getting_started
# ======================================================================
# Aquifère synthétique 1D de type Dupuit, recharge uniforme, régime
# permanent, résolu avec MODFLOW-NWT. Auto-contenu : aucune donnée
# externe, aucun téléchargement.
#
# Lancement :
#   hmp run examples/00_getting_started/project.toml
#
# Ou en Python :
#   import hydromodpy as hmp
#   hmp.run("examples/00_getting_started/project.toml", headless=True)
# ======================================================================


[workflow]
mode = "simulation"

[simulation]
name = "getting_started_dupuit"
description = "Aquifère Dupuit synthétique minimal, régime permanent, MODFLOW-NWT."

[[simulation.process]]
id = "flow"
kind = "flow"
solvers = ["modflow_nwt"]

# --- Domaine géographique (synthétique, hors-ligne) ------------------
[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "getting_started"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "50.0 m"
nx = 40
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 20.0

# --- Géométrie verticale --------------------------------------------

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "20.0 m"

# --- Processus d'écoulement -----------------------------------------

[domain.layers]
nlay = 1

# --- Affichage (headless par défaut) --------------------------------

[flow]
flow_regime = "steady"
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
kind = "custom"
value = "5.0 m"

[flow.bc.west_side]
kind = "dirichlet"
value = "5.0 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "5.0 m"

[flow.sinks_sources.recharge]
first_clim = "mean"

# --- Données (recharge synthétique, hors-ligne) ---------------------

[data]
types = ["recharge"]
inference_mode = "warn"

[[data.recharge.sources]]
source = "synthetic"
values = [3.0]

# --- Solveur (MODFLOW-NWT) ------------------------------------------

[display]
enabled = true
