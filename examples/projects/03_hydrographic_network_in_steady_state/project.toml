# ======================================================================
# HydroModPy - example 03: hydrographic network in steady state
# ----------------------------------------------------------------------
# Canut catchment (Brittany, EPSG:2154), extracted from the regional 75 m
# DEM by outlet snapping. Steady-state groundwater flow in a 50 m aquifer
# split into five layers, solved with MODFLOW 6.
#
# Three networks are put side by side:
#   - the observed one, from the regional stream shapefile (reference),
#   - the one delineated from the DEM by flow accumulation (generated),
#   - the one the water table actually sustains (simulated active).
#
# This is the "how does the perennial network emerge from groundwater"
# case: raise or lower K and the simulated active network grows or
# shrinks. run_manual.py drives that sweep from Python.
#
# Launch:
#   hmp run examples/projects/03_hydrographic_network_in_steady_state/project.toml
# ======================================================================


[workflow]
mode = "simulation"

[workspace]
project_root = "."


[simulation]
name = "canut_steady_mf6"
description = "Canut catchment, steady-state MODFLOW 6, five-layer 50 m aquifer, observed and simulated stream networks."
if_exists = "replace"

# One steady groundwater-flow process.
[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

# Fields the network figures and run_manual.py read back. Each one is
# persisted during the run; they are not recomputed on read.
[simulation.results.derived]
watertable_elevation = true
watertable_depth = true
seepage_areas = true
outflow_drain = true
accumulation_flux = true


# ---------------------------------------------------------------------- geographic
[geographic]
source_mode = "standard"
crs_project = "EPSG:2154"
dem_correc_type = "breach"
domain_extent = "box"

[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "DEM_armorican_massif.tif"
# Canut outlet, EPSG:2154.
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
buff_area = "10%"

# Stream network delineated from the DEM: the reach cells drive the
# simulated_active_network and hydrographic_network_generated figures.
[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 0.5
compute_strahler_order = true
compute_stream_links = true


# ---------------------------------------------------------------------- domain
[domain]
# 50 m aquifer below the topography, split into five layers by
# [modflow6.sgrid.vertical].
[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"


# ---------------------------------------------------------------------- data
[data]
project_crs = "EPSG:2154"
types = ["dem", "recharge", "geology", "hydrography"]
inference_mode = "warn"

[[data.dem.sources]]
source = "custom"
path = "DEM_armorican_massif.tif"

# BRGM 1:1 000 000 geology, clipped to the catchment. Context only here:
# no parameter is zoned on it.
[data.geology]
id = "field_geology"

[[data.geology.sources]]
source = "custom"
path = "../../data/geology/GEO1M.shp"
code_field = "CODE_LEG"

# Observed stream network, BD Topage. This is what gives the run its
# "reference" hydrographic role, and with it the comparison figures.
[data.hydrography]

[[data.hydrography.sources]]
source = "bdtopage"

# Monthly recharge climatology of the Canut, mm/day. The steady run uses
# its mean (1.17 mm/day) through [flow.sinks_sources.recharge].
[[data.recharge.sources]]
source = "synthetic"
values = [0.333, 0.667, 1.000, 1.333, 1.667, 2.000, 2.000, 1.667, 1.333, 1.000, 0.667, 0.333]
start_date = "2000-01-01"
freq = "MS"
periods = 12


# ---------------------------------------------------------------------- flow
[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.ic]
type = "top"
description = "Water table initialised at the topographic surface."

# Representative hydraulic conductivity, 1e-5 m/s. run_manual.py sweeps it
# from 1e-8 to 1e-3 m/s to show the active network respond.
[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = 0.1

# value = 0.0 asks the solver for the K-based drain conductance
# (K * cell area / bed thickness) instead of a fixed one.
[flow.bc.cauchy.drainage]
id = "drainage"
kind = "cauchy"
application_domain = "top"
description = "Cauchy drainage on the aquifer top face."
value = 0.0

[flow.sinks_sources.recharge]
first_clim = "mean"


# ---------------------------------------------------------------------- solver
[modflow6.runtime]
mf6_ims_complexity = "MODERATE"

[modflow6.sgrid.planar]
mode = "keep_native"

[modflow6.sgrid.vertical]
# Five layers of uniform thickness over the 50 m aquifer.
genmtd_lay = "constant"
nlay = 5


# ---------------------------------------------------------------------- display
[display]
enabled = true
show = false
save = true
output_dir = "figures"
on_error = "raise"
figures = [
    "watershed_id_card",
    "mesh_map",
    "piezometric_map",
    "watertable_depth_map",
    "seepage_map",
    "hydrographic_network_reference",
    "hydrographic_network_generated",
    "hydrographic_network_comparison",
    "simulated_active_network",
    "simulated_active_network_reference_overlay",
    "accumulation_map",
    "cross_section",
    "water_budget",
]
