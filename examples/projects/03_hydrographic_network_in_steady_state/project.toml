# HydroModPy - example 03: hydrographic network in steady state
#
# Canut catchment (Brittany), steady MODFLOW 6 over a 50 m aquifer in five
# layers. Three networks side by side: the observed one (BD Topage), the one
# the DEM delineates by flow accumulation, and the one the water table
# sustains. Raise or lower K and the simulated active network grows or shrinks;
# run_manual.py drives that sweep.
#
#   hmp run examples/projects/03_hydrographic_network_in_steady_state/project.toml

[site]
name = "canut"

[workflow]
mode = "simulation"

[simulation]
name = "canut_steady_mf6"
description = "Canut catchment, steady-state MODFLOW 6, five-layer 50 m aquifer, observed and simulated stream networks."

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[geographic]
crs_project = "EPSG:2154"

[geographic.catchment]
kind = "from_outlet_coord"
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
# "10%" is an area increase: the buffered domain covers 10 % more area than the catchment.
buff_area = "10%"

# Reach cells delineated from the DEM: what the generated-network figures draw.
[geographic.river_network]
enabled = true
threshold_area_km2 = 0.5


[domain.depth_model]
kind = "constant_thickness"
thickness = "50.0 m"


[domain.layers]
nlay = 5


[data]
types = ["dem", "recharge", "geology", "hydrography"]

[[data.dem.sources]]
source = "file"
path = "../../data/dem/DEM_armorican_massif.tif"

# BRGM 1:1 000 000 geology, context only: no parameter is zoned on it.
[[data.geology.sources]]
source = "file"
path = "../../data/geology/GEO1M.shp"
code_field = "CODE_LEG"

# The observed network. This is what gives the run its reference hydrographic
# role, and with it the comparison figures.
[[data.hydrography.sources]]
source = "bdtopage"

# Monthly recharge climatology of the Canut, mm/day. The steady run uses its
# mean, 1.17 mm/day.
[[data.recharge.sources]]
source = "synthetic"
values = [0.333, 0.667, 1.000, 1.333, 1.667, 2.000, 2.000, 1.667, 1.333, 1.000, 0.667, 0.333]
start_date = "2000-01-01"
freq = "MS"
periods = 12


[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]

# run_manual.py sweeps K from 1e-8 to 1e-3 m/s to show the active network respond.
[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.1

# No explicit value: the solver derives the drain conductance from K.
[flow.bc.drainage]
kind = "drain"


[flow.sinks_sources.recharge]
enabled = true
[modflow6.runtime]
mf6_ims_complexity = "MODERATE"

[display]
on_error = "raise"
[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
variable = "topography"
overlays = ["mesh", "outline", "outlet"]
name = "mesh_map"

[[display.figure]]
variable = "watertable_elevation"

[[display.figure]]
variable = "watertable_depth"

[[display.figure]]
variable = "seepage_mask"

[[display.figure]]
variable = "topography"
overlays = ["relief", "network"]
name = "hydrographic_network_reference"

[[display.figure]]
variable = "topography"
overlays = ["relief", "generated_network"]
name = "hydrographic_network_generated"

[[display.figure]]
preset = "network_comparison"

[[display.figure]]
variable = "simulated_active_network"
name = "simulated_active_network"

[[display.figure]]
variable = "simulated_active_network"
overlays = ["relief", "network"]
name = "simulated_active_network_reference_overlay"

[[display.figure]]
variable = "drain_accumulation_flux"
scale = "log"

[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "cross_section"

[[display.figure]]
preset = "water_budget"
