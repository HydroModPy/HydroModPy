# Example 03: the stream network a water table feeds, Canut catchment (Ille-et-Vilaine).
#
# Steady state, 1.17 mm/day of recharge, a 50 m aquifer in five layers of
# equal thickness, seepage at the ground surface. Where the water table
# reaches the ground the aquifer seeps, and the seepage cells draw a network
# beside the mapped one. py1_run_and_plot.py changes K from 1e-8 to 1e-3 m/s
# and follows how this network grows and shrinks. MODFLOW 6 solves the flow.
#
#   hmp run project.toml

[site]
name = "canut"

[workflow]
mode = "simulation"

[simulation]
name = "canut_example_03"
description = "Canut catchment, steady state, five layers, the seepage network beside the mapped one."

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

# The catchment is cut out of a regional 75 m DEM, upstream of the outlet,
# after the depressions of the DEM are breached. The domain is the box around
# the catchment widened by 10 % of the square root of its area.
[geographic]
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[geographic.catchment]
kind = "from_outlet_coord"
x_outlet = 327816.965
y_outlet = 6777886.670
snap_dist = "150 m"
buff_area = "10% of sqrt(area)"

# 50 m under the ground surface, in five layers of 10 m.
[domain.depth_model]
kind = "constant_thickness"
thickness = "50 m"

[domain.layers]
nlay = 5

# The mapped streams are compared with the seepage network. The model does
# not read them.
[data]
types = ["dem", "hydrography"]

[[data.dem.sources]]
source = "file"
path = "workspace:DEM_armorican_massif.tif"

[[data.hydrography.sources]]
source = "file"
path = "workspace:canut_stream_network.gpkg"

[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]

# py1_run_and_plot.py sweeps K from 1e-8 to 1e-3 m/s.
[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 1e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.1

# Every cell drains at the ground surface. The conductance follows K,
# C = K * cell area / 1 m.
[flow.bc.drainage]

# 10, 20, 30, 40, 50, 60, 60, 50, 40, 30, 20 and 10 mm per month, divided by
# 30 days. The steady state takes their mean, 1.17 mm/day.
[flow.sinks_sources.recharge]
units = "mm/day"
values = [1.1666666667]

# The figures land in runs/canut_example_03/figures/. Each one that applies
# and fails stops the run, so a broken figure cannot go unseen.
[display]
on_error = "raise"

[[display.figure]]
preset = "watershed_id_card"

[[display.figure]]
variable = "topography"
overlays = ["mesh", "outline", "network", "outlet"]

[[display.figure]]
variable = "watertable_depth"
overlays = ["seepage", "outline"]
limits = [0.0, 10.0]
line = [[323775.0, 6779400.0], [323775.0, 6773850.0]]

# North to south through the middle of the box, on the dashed line above.
[[display.figure]]
variable = "watertable_elevation"
type = "section"
name = "section_north_south"
line = [[323775.0, 6779400.0], [323775.0, 6773850.0]]

# The seepage cells under the mapped streams, then the flow they carry
# downstream, then where the two networks agree, cell by cell.
[[display.figure]]
variable = "simulated_active_network"
overlays = ["relief", "network", "outline"]

[[display.figure]]
variable = "drain_accumulation_flux"
scale = "log"
overlays = ["network", "outline"]

[[display.figure]]
variable = "network_agreement"
overlays = ["outline"]

# What lands in runs/canut_example_03/exports/, ready for QGIS or a spreadsheet.

# The catchment and the mapped streams: GeoPackage.
[[export]]
variable = ["watershed", "hydrographic_network_reference"]

# The water table, its depth and the seepage cells: one GeoTIFF each.
[[export]]
variable = ["watertable_elevation", "watertable_depth", "seepage_mask"]
time = "first"
