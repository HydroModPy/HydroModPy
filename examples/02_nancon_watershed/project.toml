# ======================================================================
# HydroModPy — exemple 02 : bassin du Nançon (régime transitoire)
# ======================================================================
# Squelette régénéré depuis les modèles Pydantic v0.5 (profil user) puis
# renseigné avec les valeurs physiques de l'ancien cas Nançon. Seuls les
# champs non-défauts apparaissent ici.
#
# Lancement :
#   uv run hmp run examples/02_nancon_watershed/project.toml
# ======================================================================

[simulation]
name = "nancon_transient_nwt"
description = "Bassin du Nançon (~110 km²) — écoulement transitoire, MODFLOW-NWT."

[[simulation.process]]
id = "flow"
type = "flow"
solvers = ["modflownwt"]

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = 30
step_unit = "day"

# ---------------------------------------------------------------------
# Workspace
# ---------------------------------------------------------------------

[workspace]
project_root = "."

# ---------------------------------------------------------------------
# Domaine géographique — délimitation depuis un exutoire
# ---------------------------------------------------------------------

[geographic]
source_mode = "standard"
catch_def = "from_outlet_coord"
dem_init_path = "../data/dem/DEM_armorican_massif.tif"
x_outlet = 389285.91
y_outlet = 6816518.749
snap_dist = "150 m"
buff_area = "10%"
crs_project = "EPSG:2154"
dem_correc_type = "breach"

# ---------------------------------------------------------------------
# Géométrie verticale
# ---------------------------------------------------------------------

[domain]
zone_ids = ["geology"]

[domain.depth_model]
type = "constant_thickness"
thickness = "30.0 m"

# ---------------------------------------------------------------------
# Données d'entrée
# ---------------------------------------------------------------------

[data]
project_crs = "EPSG:2154"
types = ["geology", "hydrography", "hydrometry", "recharge"]

[data.geology]
id = "field_geology"

[[data.geology.sources]]
source = "brgm_1m"

[[data.hydrography.sources]]
source = "bdtopage"
rasterize_field = "FID"

[[data.hydrometry.sources]]
source = "custom"
path = "../data/hydrometry"
station_ids = []
extent = "watershed"

[data.recharge]
date_start = "2000-01-01"
date_end = "2002-12-31"

[[data.recharge.sources]]
source = "custom"
path = "../data/recharge"
station_ids = ["EX04"]

# ---------------------------------------------------------------------
# Processus d'écoulement
# ---------------------------------------------------------------------

[flow]
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"

[flow.param.K.field_homogeneous]
value = 5e-5

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = 0.05

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = 1e-5

[flow.ic]
type = "top"
value = 1.0
unit = "m"

[flow.bc.cauchy.drainage]
application_domain = "top"
type = "cauchy"
value = 0.0
unit = "m2/s"
data_value = false

[flow.sinks_sources.recharge]
first_clim = "first"
negative_to_evt = false

# ---------------------------------------------------------------------
# Solveur MODFLOW-NWT (seuls les écarts aux défauts sont renseignés)
# ---------------------------------------------------------------------

[modflownwt.runtime]
nwt_fluxtol = 0.006
dis_itmuni = 0

[modflownwt.sgrid.planar]
mode = "keep_native"

[modflownwt.sgrid.vertical]
genmtd_lay = "constant"
nlay = 1

[modflownwt.tgrid]
firstpersteady = true

# ---------------------------------------------------------------------
# Post-traitement et affichage
# ---------------------------------------------------------------------

[display]
enabled = true
show = false
save = true

[display.flow]
cross_section = true
streamflow = true
piezometry = true
watertable_map = true
dem_map = true
hydrography = true

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
display = true

[postprocess.flow.timeseries]
enabled = true
subbasin_results = true

[postprocess.flow.intermittency]
monthly = true
