# Nancon transient NWT — inherits structure from project.toml.
# Calibration parameters and simulation orchestration live here.
base_config = "project.toml"

[simulation]
name = "Nancon transitoire mensuel"

[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"
coverage_policy = "warn"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modpath"]

[simulation.results]
keep_solver_files = true

# --- Calibration parameters ---

[flow.param.K.field_homogeneous]
value = 5e-05

[flow.param.Sy.field_homogeneous]
value = 0.05

[flow.param.Ss.field_homogeneous]
value = 1e-05

[domain.depth_model]
thickness = 30.0

[flow.sinks_sources.recharge]
first_clim = "first"

