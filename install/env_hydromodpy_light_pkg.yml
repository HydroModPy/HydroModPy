  - contextily
  - flopy
  - geopandas
  - h5py
  - imageio
  - matplotlib
  - matplotlib-scalebar
  - netcdf4
  - numpy>=2.0
  - pandas
  - pint
  - pydantic
  - pydantic-pint
  - pytest
  - pytest-xdist
  - sphinx
  - pyproj
  - pyshp
  - pyvista
  - rasterio
  - rioxarray
  - cma
  - scikit-learn
  - scipy
  - selenium
  - sqlalchemy>=2.0
  - xarray
  - pysheds
  - dask
  - pip
  - pip:
      - gmsh
      - meshio
      - whitebox-workflows
      - -e "..[docs]"
