title = "HydroModPy Gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# A citation key is <author><year><word>: three lowercase-letter runs and a
# 4-digit year, which no credential shape can satisfy. Exempting the whole
# protocols/ directory on the generic key=" pattern instead would have
# swallowed a real `key = "ghp_..."` typed anywhere under it, measured.
[[rules.allowlists]]
description = "A bibliography citation key is not a credential."
condition = "AND"
regexTarget = "line"
paths = [
    '''(^|/)hydromodpy/calibration/protocols/.*\.py$''',
]
regexes = [
    '''^\s*key="[a-z]+[0-9]{4}[a-z]*",?\s*$''',
]

# A frozen run names its solution and its products by a sha256 digest, 64
# lowercase hex characters. The exemption holds only under the two frozen
# folders and only for that shape, so a real token there still fails.
[[rules.allowlists]]
description = "A sha256 digest of a frozen run is not a credential."
condition = "AND"
regexTarget = "secret"
paths = [
    '''(^|/)tests/regression/frozen_(runs|replay)/''',
]
regexes = [
    '''^[0-9a-f]{64}$''',
]
