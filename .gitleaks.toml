title = "HydroModPy Gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# A citation key is <author><year><word>: three lowercase-letter runs and a
# 4-digit year, which no credential shape can satisfy. Exempting the whole
# protocols/ directory on the generic key=" pattern instead would have
# swallowed a real `key = "ghp_..."` typed anywhere under it, measured.
[[rules.allowlists]]
description = "A bibliography citation key is not a credential."
condition = "AND"
regexTarget = "line"
paths = [
    '''(^|/)hydromodpy/calibration/protocols/.*\.py$''',
]
regexes = [
    '''^\s*key="[a-z]+[0-9]{4}[a-z]*",?\s*$''',
]

[[rules.allowlists]]
description = "Generated gallery metadata keys are not credentials."
condition = "AND"
regexTarget = "line"
paths = [
    '''(^|/)docs/source/_static/capability_gallery/.*_summary\.json$''',
    '''(^|/)examples/projects/07_mesh_gallery/.*/case\.json$''',
    '''(^|/)examples/projects/09_capability_gallery/.*/case\.json$''',
    '''(^|/)examples/projects/09_capability_gallery/.*/README\.md$''',
    '''(^|/)tools/doc_gallery/sync_mesh_catchment_runs\.py$''',
]
regexes = [
    '''^\s*"key":\s*"[A-Za-z0-9_.:-]+",?\s*$''',
    '''^\s*"case_family_key":\s*"[A-Za-z0-9_.:-]+",?\s*$''',
    '''^\s*"comparison_family_key":\s*"[A-Za-z0-9_.:-]+",?\s*$''',
    '''^\s*key="[A-Za-z0-9_.:-]+",?\s*$''',
    '''^\s*\|\s*`comparison_family_key`\s*\|.*$''',
]

[[rules.allowlists]]
description = "Testbed reporting scripts use key= and x/y_key= for figure axes, not credentials."
paths = [
    '''(^|/)examples/projects/10_testbed_workflow/.*\.py$''',
]
