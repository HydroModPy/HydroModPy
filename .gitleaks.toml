title = "HydroModPy Gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# A citation key is <author><year><word>: three lowercase-letter runs and a
# 4-digit year, which no credential shape can satisfy. Exempting the whole
# protocols/ directory on the generic key=" pattern instead would have
# swallowed a real `key = "ghp_..."` typed anywhere under it, measured.
[[rules.allowlists]]
description = "A bibliography citation key is not a credential."
condition = "AND"
regexTarget = "line"
paths = [
    '''(^|/)hydromodpy/calibration/protocols/.*\.py$''',
]
regexes = [
    '''^\s*key="[a-z]+[0-9]{4}[a-z]*",?\s*$''',
]
