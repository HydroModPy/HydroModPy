[project]
name = "hydromodpy-evaluator-reservoir"
version = "0.1.0"
description = "An out-of-tree linear reservoir evaluator for HydroModPy calibration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["hydromodpy"]

[project.entry-points."hydromodpy.calibration.evaluator"]
reservoir_recession = "hydromodpy_evaluator_reservoir.evaluator:ReservoirRecessionEvaluator"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
