# GitLab CI/CD Pipeline for HydroModPy
# Manual archive build, docs, and publication jobs

stages:
  - build
  - test
  - docs
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12
  before_script:
    - python --version
    - python -m pip install --upgrade pip

cache:
  paths:
    - .cache/pip

# Build package (source + wheel) - MANUAL
build:wheel:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 2 hours
  when: manual

# Test installation and basic imports - MANUAL
test:wheel:
  stage: test
  needs:
    - build:wheel
  script:
    - pip install dist/*.whl
    - python -c "import hydromodpy; print('hydromodpy version:', hydromodpy.__version__)"
  when: manual

# Build archived HTML docs - MANUAL
docs:html:
  stage: docs
  script:
    - pip install -e ".[docs]"
    - make -C docs html
  artifacts:
    paths:
      - docs/build/html/
    expire_in: 2 hours
  rules:
    - if: '$CI_COMMIT_BRANCH == "archive-v1"'
      when: manual
    - when: never

# Publish to TestPyPI (manual trigger, any branch)
publish:test-pypi:
  stage: publish
  needs:
    - build:wheel
    - test:wheel
  script:
    - pip install twine
    - python -m twine check dist/*
    - python -m twine upload --repository-url https://test.pypi.org/legacy/ --non-interactive dist/*
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "$TEST_PYPI_API_TOKEN"
  when: manual
  allow_failure: true

# Publish to PyPI PRODUCTION (manual, v1 tags only)
publish:pypi:
  stage: publish
  needs:
    - build:wheel
    - test:wheel
  script:
    - pip install twine
    - python -m twine check dist/*
    - python -m twine upload --non-interactive dist/*
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "$PYPI_API_TOKEN"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v1\.\d+\.\d+$/'
      when: manual
    - when: never
