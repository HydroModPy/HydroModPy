# GitLab CI/CD pour Build et Publication des Wheels
# Équivalent du workflow GitHub Actions pour GitLab vue sur la vidéo youtube

stages:
  - build
  - test
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# Job de build pour chaque plateforme
.build_template: &build_template
  stage: build
  script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install numpy meson meson-python ninja build wheel setuptools
    - python build_extensions.py
    - python -m build --wheel
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 7 days

# Linux builds
build:linux:python311:
  <<: *build_template
  image: quay.io/pypa/manylinux2014_x86_64
  before_script:
    - yum install -y gcc-gfortran
    - /opt/python/cp311-cp311/bin/python -m venv /tmp/venv
    - source /tmp/venv/bin/activate

build:linux:python312:
  <<: *build_template
  image: quay.io/pypa/manylinux2014_x86_64
  before_script:
    - yum install -y gcc-gfortran
    - /opt/python/cp312-cp312/bin/python -m venv /tmp/venv
    - source /tmp/venv/bin/activate

build:linux:python313:
  <<: *build_template
  image: quay.io/pypa/manylinux2014_x86_64
  before_script:
    - yum install -y gcc-gfortran
    - /opt/python/cp313-cp313/bin/python -m venv /tmp/venv
    - source /tmp/venv/bin/activate

# macOS builds (nécessite un runner macOS)
build:macos:python311:
  <<: *build_template
  before_script:
    - brew install gcc python@3.11
    - python3.11 -m venv venv
    - source venv/bin/activate
  tags:
    - macos
  only:
    - tags

build:macos:python312:
  <<: *build_template
  before_script:
    - brew install gcc python@3.12
    - python3.12 -m venv venv
    - source venv/bin/activate
  tags:
    - macos
  only:
    - tags

build:macos:python313:
  <<: *build_template
  before_script:
    - brew install gcc python@3.13
    - python3.13 -m venv venv
    - source venv/bin/activate
  tags:
    - macos
  only:
    - tags

# Windows builds (nécessite un runner Windows)
build:windows:python311:
  <<: *build_template
  before_script:
    - choco install mingw -y
    - py -3.11 -m venv venv
    - .\venv\Scripts\activate
  tags:
    - windows
  only:
    - tags

build:windows:python312:
  <<: *build_template
  before_script:
    - choco install mingw -y
    - py -3.12 -m venv venv
    - .\venv\Scripts\activate
  tags:
    - windows
  only:
    - tags

build:windows:python313:
  <<: *build_template
  before_script:
    - choco install mingw -y
    - py -3.13 -m venv venv
    - .\venv\Scripts\activate
  tags:
    - windows
  only:
    - tags

# Test d'installation des wheels
test:wheels:
  stage: test
  image: python:3.12
  script:
    - pip install dist/*.whl
    - python -c "from hydromodpy.pyhelp import HelpManager; print('✓ HelpManager OK')"
    - python -c "from hydromodpy.pyhelp import HELP3O; print('✓ HELP3O disponible:', HELP3O is not None)"
  dependencies:
    - build:linux:python312

# Publication sur TestPyPI (branches de test - Linux uniquement)
publish:test-pypi:
  stage: publish
  image: python:3.12
  script:
    - pip install twine
    - twine upload --repository testpypi dist/*.whl
  dependencies:
    - build:linux:python311
    - build:linux:python312
    - build:linux:python313
  only:
    - dev-python-upgrade  # Branches de développement
    - /^test-.*$/        # Branches qui commencent par "test-"
  when: manual
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $TEST_PYPI_API_TOKEN
    TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/

# Publication sur PyPI production (seulement sur tags)
publish:pypi:
  stage: publish
  image: python:3.12
  script:
    - pip install twine
    - twine upload dist/*.whl
  dependencies:
    - build:linux:python311
    - build:linux:python312
    - build:linux:python313
    - build:macos:python311
    - build:macos:python312
    - build:macos:python313
    - build:windows:python311
    - build:windows:python312
    - build:windows:python313
  only:
    - tags  # Seulement sur tags (v0.1.1, etc.)
  when: manual
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_API_TOKEN
