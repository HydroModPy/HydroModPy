[workspace]
project_root = "."

# A document that scores a model it did not write. The model answers the two
# outputs below and nothing else; which of them is compared, under which metric
# and with which weight, is decided here and never in the wheel.
[calibration]
evaluator = "scored_forward_model"
forward_model = "two_reservoir_cascade"
method = "grid"
max_iter = 9
optimizer_kwargs = { points_per_dim = 3 }

# The transformed 3 by 3 grid contains the reference truth: k_fast = 0.25 1/day
# and k_slow = 0.05 1/day, which is the pair the records below were produced at.
[calibration.parameters.k_fast]
path = "flow.properties.k_fast"
bounds = [0.025, 2.5]
transform = "log"

[calibration.parameters.k_slow]
path = "flow.properties.k_slow"
bounds = [0.005, 0.5]
transform = "log"

