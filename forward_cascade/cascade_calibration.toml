# Two costs in two units, so each is normalized before the weights arbitrate:
# an unnormalized sum would let m3/day outweigh metres by five orders of
# magnitude and the weights would describe nothing.
[[calibration.objective_blocks]]
name = "gauge"
metric = "rmse"
uses_outputs = ["gauge_record"]
weight = 0.5
normalize_cost = true

[[calibration.objective_blocks]]
name = "piezometry"
metric = "rmse"
uses_outputs = ["piezo_record"]
weight = 0.5
normalize_cost = true
