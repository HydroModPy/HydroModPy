# Dependabot keeps third-party dependencies fresh with weekly PRs.
# Covers Python runtime/test/dev extras, GitHub Actions pinned versions,
# and the Docker base image used by docker-build.yml.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    # A major version of these two breaks the tree and is taken by hand.
    # whitebox-workflows 2 dropped the `compress` argument of write_raster,
    # pandas 3 returns NaN where the frozen runs expect None.
    ignore:
      - dependency-name: "whitebox-workflows"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"
    # The image follows requires-python in pyproject.toml, which stops at 3.13.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14"]
    labels:
      - dependencies
      - docker
