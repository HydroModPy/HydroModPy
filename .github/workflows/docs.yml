# Sphinx documentation build gate.
# Runs the docs/ html-strict target (warnings-as-errors, --keep-going). The build
# writes the parameter, API, CLI and validation pages from the code and the tests
# (tools/docs). Uploads the rendered HTML tree as an artifact so PR reviewers can
# inspect the produced site.

name: Docs / Sphinx

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "hydromodpy/**"
      - "tools/docs/**"
      - "tests/**"
      - "validation_cases/**"
      - "examples/projects/04_streamflow_intermittence_in_transient/**"
      - "pyproject.toml"
      - "README.md"
      - "CONTRIBUTING.md"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "hydromodpy/**"
      - "tools/docs/**"
      - "tests/**"
      - "validation_cases/**"
      - "examples/projects/04_streamflow_intermittence_in_transient/**"
      - "pyproject.toml"
      - "README.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  html-strict:
    name: Docs / html-strict py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # sphinx-last-updated-by-git needs the full history: on a shallow
      # clone it warns once per page, and -W turns that into 465 errors.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa graphviz libgraphviz-dev pkg-config

      - name: Install package and docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx html-strict
        run: make -C docs html-strict

      # The build wrote the field registry; every written page is checked
      # against it: TOML keys, links, TOML blocks loaded by the real loader.
      - name: Check the written pages
        run: python -m tools.docs.check_page $(git ls-files 'docs/source/*.md')

      # Pages written by the extensions are raw HTML that Sphinx does not
      # check: links inside links, dead links and anchors, markup shown as text.
      - name: Check the built site
        run: python -m tools.docs.check_site docs/build/html

      # The build regenerates the tables a declared contract owns
      # (tools/doc_contracts.py). A tracked file under docs/source that the
      # build rewrites was stale.
      - name: Generated documentation must match its source
        run: |
          git diff --exit-code -- docs/source \
            || { echo "::error::A generated file is stale. Run 'make -C docs html' and commit the result."; exit 1; }

      - name: Upload built HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error
          retention-days: 14

