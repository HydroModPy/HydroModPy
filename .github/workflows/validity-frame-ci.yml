name: Validity Frame CI (advisory)

on:
  push:
    paths:
      - 'hydromodpy/validity_frame/**'
      - 'tests/validity_frame/**'
  pull_request:
    paths:
      - 'hydromodpy/validity_frame/**'
      - 'tests/validity_frame/**'

jobs:
  test-validity-frame:
    # Advisory workflow: surfaces regressions without blocking collaborators.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run validity_frame tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/validity_frame -q
