# Build the v1.0 documentation and publish it into the /v1.0/ subfolder on
# HydroModPy/hydromodpy.github.io (served at https://docs.hydromodpy.fr/v1.0/).
# The other versions already on gh-pages (main, dev, ...) are kept
# (keep_files: true), so a push to v1.0 rebuilds only the v1.0 site and never
# touches the development versions.
#
# v1.0 is the living branch cited by the HESS technical note: every fix pushed to
# v1.0 refreshes https://docs.hydromodpy.fr/v1.0/, so the paper link stays current.
#
# Setup is shared with the v2 deploy (same target repo and deploy key):
#   - ACTIONS_DEPLOY_KEY secret (this repo) = private deploy key,
#   - matching public deploy key with write access on hydromodpy.github.io,
#   - hydromodpy.github.io Pages source = gh-pages branch,
#   - custom domain docs.hydromodpy.fr, kept by the CNAME file at the root of
#     gh-pages. keep_files: true preserves it, so never publish with
#     keep_files: false or the domain drops back to hydromodpy.github.io.

name: Docs / Deploy Pages (v1.0)

on:
  push:
    branches: [v1.0]
    paths:
      - ".github/workflows/docs-deploy-pages.yml"
      - "tools/docs_pages_postbuild.py"
      - "docs/**"
      - "hydromodpy/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

# Single group shared with the v2 deploy: serialize pushes so concurrent deploys
# never race on the gh-pages push.
concurrency:
  group: docs-deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  build-deploy:
    name: Build ${{ github.ref_name }} and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libglu1-mesa

      - name: Install package and docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build this version only
        id: build
        run: |
          version="${GITHUB_REF_NAME}"
          if [ ! -f docs/source/conf.py ]; then
            echo "no docs/source/conf.py at ${version}, nothing to publish"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          HMP_DOC_VERSION="${version}" python -m sphinx -j auto -b html docs/source "site/${version}"

      - name: Build switcher.json (all versions)
        if: steps.build.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.build.outputs.version }}"
          existing=$(gh api "repos/HydroModPy/hydromodpy.github.io/contents?ref=gh-pages" \
            --jq '.[] | select(.type=="dir") | .name' 2>/dev/null || true)
          versions=$(printf '%s\n%s\n' "${existing}" "${version}" | grep -v '^$' | sort -u | paste -sd, -)
          echo "versions on site: ${versions}"
          python tools/docs_pages_postbuild.py site https://docs.hydromodpy.fr --versions "${versions}"

      - name: Add a root redirect to the default version
        if: steps.build.outputs.skip != '1'
        run: >
          printf '%s'
          '<!doctype html><meta charset="utf-8">'
          '<meta http-equiv="refresh" content="0; url=./main/">'
          '<link rel="canonical" href="https://docs.hydromodpy.fr/main/">'
          '<title>HydroModPy documentation</title>'
          '<a href="./main/">HydroModPy documentation</a>'
          > site/index.html

      - name: Publish to hydromodpy.github.io
        if: steps.build.outputs.skip != '1'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: HydroModPy/hydromodpy.github.io
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "docs: deploy ${{ steps.build.outputs.version }}"
