# Main CI gate for pushes and pull requests.
# Keep this workflow readable in the GitHub checks list: each job name starts
# with the domain that failed, then the tier and Python version when relevant.

name: CI / Main Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality / ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.15"

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  secrets:
    name: Security / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks CLI
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --no-banner --redact --verbose \
              --config /repo/.gitleaks.toml \
              --source /repo

  architecture:
    name: Architecture / layer matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run architecture contract tests
        run: python -m pytest tests/unit/architecture/ -q

  characterization:
    name: Characterization / produced run py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      # The tier's one run is the synthetic Dupuit aquifer of example 00, solved
      # with MODFLOW-NWT. Nothing here needs MODFLOW 6.
      - name: Install the solver binary the characterization run needs
        run: python -m hydromodpy install-binaries --subset mfnwt --quiet

      # The tier runs one real pipeline and reads only what it left on disk.
      # Its five strict xfails are the claims the code does not honour yet; a
      # strict xfail that starts passing fails this job, which is how a repaired
      # claim gets noticed instead of quietly staying green.
      - name: Run characterization tier
        run: python -m pytest tests/characterization/ --timeout=900 -q

  fast:
    name: Tests / fast marker py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,performance,calibration,delineation]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      - name: Install solver binaries for fast tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt --quiet || true

      # A single bad import aborts the whole pytest session, which silently
      # turns a tier into zero executed tests. This step fails loudly instead.
      - name: Collection gate
        run: python -m pytest tests/ --collect-only -q

      # The Whitebox native binding dies outright when several DEM workflows run
      # in one long-lived xdist worker, and --dist loadgroup is what puts them
      # there: tests/conftest.py groups every Whitebox test under one name, so
      # they all land on the same node. Run them in their own serial session
      # instead, like the weekly job already does for the backend unit tests.
      - name: Run fast marker suite
        run: |
          python -m pytest -m fast \
            --ignore=tests/regression/fast/geographic \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            -q

      - name: Run Whitebox-backed fast tests (serial)
        run: python -m pytest -m fast tests/regression/fast/geographic --timeout=300 -q

      # tests/contract/ is the only coverage of DuckDBCacheBackend and of the
      # catalog backend compatibility surface. It was in no workflow before.
      - name: Run contract tests
        run: python -m pytest tests/contract/ -q

  unit:
    name: Tests / unit py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      # Docstring examples were never executed, so they drifted: two showed a
      # wrong repr, one named the wrong exception class, one called an attribute
      # that does not exist. Scoped to the modules that carry examples - a
      # blanket --doctest-modules on hydromodpy/ would import every
      # optional-dependency module and fail for unrelated reasons.
      - name: Run docstring examples
        run: |
          python -m pytest --doctest-modules -q \
            hydromodpy/_api.py \
            hydromodpy/core/io/proj_bootstrap.py \
            hydromodpy/core/logging.py \
            hydromodpy/core/state/global_index.py \
            hydromodpy/core/units/types.py \
            hydromodpy/display/__init__.py \
            hydromodpy/display/viz.py \
            hydromodpy/project/facade.py \
            hydromodpy/results/catalog/facade.py \
            hydromodpy/results/exporters/ \
            hydromodpy/results/run/ \
            hydromodpy/spatial/field/core/physical_bounds.py

      # The whitebox-heavy tiers ran here for a while, on the assumption that
      # pinning the Whitebox fd-level stdio redirect off in tests/conftest.py made
      # them safe under xdist. It did not: a worker still died on main. The native
      # binding cannot share a long-lived worker with other DEM workflows, so it
      # gets its own serial step again.
      - name: Run unit tests in parallel
        run: |
          python -m pytest tests/unit/ \
            --ignore=tests/unit/architecture \
            --ignore=tests/unit/backends/test_whitebox_workflows_backend.py \
            --ignore=tests/unit/geographic/test_catchment_from_point.py \
            --ignore=tests/unit/geographic/test_reference_river_network_nancon_case.py \
            -m "not slow" \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --durations=25 \
            --cov=hydromodpy \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      - name: Run Whitebox-backed unit tests (serial)
        run: |
          python -m pytest \
            tests/unit/backends/test_whitebox_workflows_backend.py \
            tests/unit/geographic/test_catchment_from_point.py \
            tests/unit/geographic/test_reference_river_network_nancon_case.py \
            -m "not slow" --timeout=300 -q

      - name: Write unit coverage XML
        if: always()
        run: |
          coverage combine || true
          coverage xml || true

      - name: Upload unit coverage to Codecov
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  integration:
    name: Tests / integration py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      - name: Install solver binaries for integration tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt,mp6,mt3dusgs --quiet || true

      - name: Run integration suite
        run: |
          python -m pytest tests/integration/ \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=600 \
            -q

  regression-fast:
    name: Regression / fast solvers py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      - name: Install solver binaries for regression tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt,mp6,mt3dusgs --quiet

      # The Whitebox native binding dies outright when several DEM workflows run
      # in one long-lived xdist worker, and --dist loadgroup is what puts them
      # there: tests/conftest.py groups every Whitebox test under one name, so
      # they all land on the same node. Run them in their own serial session
      # instead, like the weekly job already does for the backend unit tests.
      - name: Run fast regression suite
        run: |
          python -m pytest tests/regression/fast/ \
            --ignore=tests/regression/fast/geographic \
            -n 2 --dist loadgroup --max-worker-restart=0 --timeout=600 -q

      - name: Run Whitebox-backed fast regression (serial)
        run: python -m pytest tests/regression/fast/geographic --timeout=600 -q

  package-smoke:
    name: Package / wheel smoke py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install build tooling
        run: pip install --upgrade pip "build>=1.2"

      - name: Build wheel and sdist
        run: python -m build

      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/hmp-smoke
          /tmp/hmp-smoke/bin/pip install --upgrade pip
          /tmp/hmp-smoke/bin/pip install dist/*.whl

      - name: Run hmp doctor from wheel install
        run: /tmp/hmp-smoke/bin/hmp doctor --json

  # The proof that the terrain port is a port. A second implementation ships as
  # its own distribution, no file of HydroModPy names it, and the conformance
  # suite runs it in an environment where the default engine is not installed.
  terrain-second-engine:
    name: Terrain / second distribution in a clean environment py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Build both wheels
        run: |
          pip install --upgrade pip "build>=1.2"
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist terrain_scipy

      # No delineation extra on purpose: whitebox-workflows is the engine this
      # job must not be able to fall back on. A run that passes here passes on
      # an engine that came from an entry point.
      - name: Install both wheels into a fresh environment
        run: |
          python -m venv /tmp/hmp-terrain
          /tmp/hmp-terrain/bin/pip install --upgrade pip
          /tmp/hmp-terrain/bin/pip install "$(ls dist/hydromodpy-*.whl)[test]"
          /tmp/hmp-terrain/bin/pip install dist/hydromodpy_terrain_scipy-*.whl

      # Run from outside the checkout on purpose: at the repository root the
      # working directory shadows the installed package with its own source,
      # and this step is about what was installed.
      - name: The registry resolves the installed engine, and not the default one
        working-directory: /
        run: |
          /tmp/hmp-terrain/bin/python - <<'PY'
          import importlib.util
          import inspect

          import hydromodpy
          from hydromodpy.spatial.terrain import registry

          served = registry.list_engine_ids()
          builtin = registry.builtin_engine_ids()
          assert "scipy_d8" in served, f"the wheel published nothing the registry resolves: {served}"
          assert "scipy_d8" not in builtin, f"scipy_d8 must come from the entry point, not from {builtin}"
          assert importlib.util.find_spec("whitebox_workflows") is None, (
              "the default engine is installed here, so this job would prove nothing"
          )
          engine_file = inspect.getfile(registry.get("scipy_d8"))
          assert "site-packages" in engine_file, f"resolved from a source tree: {engine_file}"
          assert "site-packages" in hydromodpy.__file__, hydromodpy.__file__
          print(f"resolvable engines: {served}")
          print(f"scipy_d8 resolved from {engine_file}")
          PY

      # The suite is read from the checkout, so HydroModPy itself is imported
      # from the source tree here, as in every other job. The engine is not:
      # terrain_scipy/src is on no path, so scipy_d8 can only come from the
      # wheel installed above, which is what this job is about.
      - name: Run the terrain conformance suite
        run: |
          /tmp/hmp-terrain/bin/python -m pytest tests/contract/test_terrain_engine_contract.py \
            -q -p no:cacheprovider --timeout=600 --junitxml=/tmp/conformance.xml

      # Without this the job is green when the entry point fails to load: the
      # suite is parametrized by what the registry resolves, so an engine that
      # never arrives simply produces fewer test nodes.
      - name: The installed engine ran the suite, it was not skipped
        run: |
          /tmp/hmp-terrain/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = [
              case
              for case in ET.parse("/tmp/conformance.xml").getroot().iter("testcase")
              if "scipy_d8" in case.get("name", "")
          ]
          executed = [case for case in cases if case.find("skipped") is None]
          assert len(executed) >= 40, f"{len(executed)} of {len(cases)} nodes ran on the installed engine"
          print(f"{len(executed)} conformance nodes executed against hydromodpy-terrain-scipy")
          PY

  evaluator-second-model:
    name: Calibration / installed foreign evaluator py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Build both wheels
        run: |
          pip install --upgrade pip "build>=1.2"
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist evaluator_reservoir

      - name: Install both wheels into a fresh environment
        run: |
          python -m venv /tmp/hmp-evaluator
          /tmp/hmp-evaluator/bin/pip install --upgrade pip
          /tmp/hmp-evaluator/bin/pip install "$(ls dist/hydromodpy-*.whl)[test]"
          /tmp/hmp-evaluator/bin/pip install dist/hydromodpy_evaluator_reservoir-*.whl

      - name: Verify the evaluator came from the installed wheel
        working-directory: /
        run: |
          /tmp/hmp-evaluator/bin/python - <<'PY'
          import inspect

          import hydromodpy
          from hydromodpy.calibration.evaluation import registry

          served = registry.list_evaluator_ids()
          assert "reservoir_recession" in served, served
          assert "reservoir_recession" not in registry.builtin_evaluator_ids()
          source = inspect.getfile(registry.get("reservoir_recession"))
          assert "site-packages" in source, source
          assert "site-packages" in hydromodpy.__file__, hydromodpy.__file__
          print(source)
          PY

      - name: Run the registry-driven conformance suite
        working-directory: /
        run: |
          /tmp/hmp-evaluator/bin/python - <<'PY'
          import os
          from pathlib import Path

          import hydromodpy
          import pytest

          assert "site-packages" in hydromodpy.__file__, hydromodpy.__file__
          suite = Path(os.environ["GITHUB_WORKSPACE"]) / "tests/contract/test_trial_evaluator_contract.py"
          raise SystemExit(pytest.main([
              str(suite), "-q", "-p", "no:cacheprovider",
              "--junitxml=/tmp/evaluator-conformance.xml",
          ]))
          PY

      - name: Verify the installed evaluator executed its conformance nodes
        run: |
          /tmp/hmp-evaluator/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = [
              case
              for case in ET.parse("/tmp/evaluator-conformance.xml").getroot().iter("testcase")
              if "reservoir_recession" in case.get("name", "")
          ]
          executed = [case for case in cases if case.find("skipped") is None]
          assert len(executed) >= 10, f"{len(executed)} of {len(cases)} nodes ran"
          print(f"{len(executed)} conformance nodes ran on the installed evaluator")
          PY

      - name: Calibrate the foreign model from its TOML
        working-directory: /
        run: |
          /tmp/hmp-evaluator/bin/python - <<'PY'
          import inspect
          import os
          from pathlib import Path

          import hydromodpy as hmp
          from hydromodpy.calibration.evaluation import registry
          import hydromodpy.calibration.runners.cli_runner as cli_runner

          assert "site-packages" in hmp.__file__, hmp.__file__
          evaluator_file = inspect.getfile(registry.get("reservoir_recession"))
          assert "site-packages" in evaluator_file, evaluator_file

          def forbidden_prepare(*args, **kwargs):
              raise AssertionError("a foreign evaluator prepared the HydroModPy model")

          cli_runner.prepare_trials = forbidden_prepare
          report = hmp.calibrate(
              Path(os.environ["GITHUB_WORKSPACE"]) / "evaluator_reservoir/recession_calibration.toml",
              workspace=Path("/tmp/hmp-reservoir-calibration"),
          )
          assert report["n_iterations"] == 9, report
          assert abs(report["best_parameters"]["k"] - 1e-4) < 1e-10, report
          assert abs(report["best_parameters"]["porosity"] - 0.155) < 1e-10, report
          assert report["best_objective"] < 1e-20, report
          PY

  forward-second-model:
    name: Calibration / installed foreign forward model py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Build both wheels
        run: |
          pip install --upgrade pip "build>=1.2"
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist forward_cascade

      - name: Install both wheels into a fresh environment
        run: |
          python -m venv /tmp/hmp-forward
          /tmp/hmp-forward/bin/pip install --upgrade pip
          /tmp/hmp-forward/bin/pip install "$(ls dist/hydromodpy-*.whl)[test]"
          /tmp/hmp-forward/bin/pip install dist/hydromodpy_forward_cascade-*.whl

      - name: Verify the model came from the installed wheel
        working-directory: /
        run: |
          /tmp/hmp-forward/bin/python - <<'PY'
          import inspect

          import hydromodpy
          from hydromodpy.calibration.evaluation import forward_registry

          served = forward_registry.list_model_ids()
          assert "two_reservoir_cascade" in served, served
          assert "two_reservoir_cascade" not in forward_registry.builtin_model_ids()
          source = inspect.getfile(forward_registry.get("two_reservoir_cascade"))
          assert "site-packages" in source, source
          assert "site-packages" in hydromodpy.__file__, hydromodpy.__file__
          print(source)
          PY

      - name: Run the registry-driven conformance suite
        working-directory: /
        run: |
          /tmp/hmp-forward/bin/python - <<'PY'
          import os
          from pathlib import Path

          import hydromodpy
          import pytest

          assert "site-packages" in hydromodpy.__file__, hydromodpy.__file__
          suite = Path(os.environ["GITHUB_WORKSPACE"]) / "tests/contract/test_forward_model_contract.py"
          raise SystemExit(pytest.main([
              str(suite), "-q", "-p", "no:cacheprovider",
              "--junitxml=/tmp/forward-conformance.xml",
          ]))
          PY

      - name: Verify the installed model executed its conformance nodes
        run: |
          /tmp/hmp-forward/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = [
              case
              for case in ET.parse("/tmp/forward-conformance.xml").getroot().iter("testcase")
              if "two_reservoir_cascade" in case.get("name", "")
          ]
          executed = [case for case in cases if case.find("skipped") is None]
          assert len(executed) >= 10, f"{len(executed)} of {len(cases)} nodes ran on the installed model"
          print(f"{len(executed)} conformance nodes ran on the installed forward model")
          PY

      - name: Score the foreign model with the criteria of its document
        working-directory: /
        run: |
          /tmp/hmp-forward/bin/python - <<'PY'
          import inspect
          import os
          from pathlib import Path

          import hydromodpy as hmp
          from hydromodpy.calibration.evaluation import forward_registry
          import hydromodpy.calibration.runners.cli_runner as cli_runner

          assert "site-packages" in hmp.__file__, hmp.__file__
          model_file = inspect.getfile(forward_registry.get("two_reservoir_cascade"))
          assert "site-packages" in model_file, model_file

          def forbidden_prepare(*args, **kwargs):
              raise AssertionError("a document-scored model prepared the HydroModPy model")

          cli_runner.prepare_trials = forbidden_prepare
          report = hmp.calibrate(
              Path(os.environ["GITHUB_WORKSPACE"]) / "forward_cascade/cascade_calibration.toml",
              workspace=Path("/tmp/hmp-cascade-calibration"),
          )
          assert report["n_iterations"] == 9, report
          assert abs(report["best_parameters"]["k_fast"] - 0.25) < 1e-10, report
          assert abs(report["best_parameters"]["k_slow"] - 0.05) < 1e-10, report
          assert report["best_objective"] < 1e-12, report
          PY

  typing:
    name: Typing / mypy baseline py3.12 (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and mypy
        run: |
          pip install --upgrade pip
          pip install -e "."
          pip install "mypy>=1.13" "pydantic>=2.13" "types-requests"

      - name: Run mypy baseline
        run: |
          set +e
          mypy hydromodpy
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy advisory baseline failed with exit code $status"
          fi
          exit 0
