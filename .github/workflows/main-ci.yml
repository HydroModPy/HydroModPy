# Main CI gate for pushes and pull requests.
# Keep this workflow readable in the GitHub checks list: each job name starts
# with the domain that failed, then the tier and Python version when relevant.

name: CI / Main Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality / ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.15"

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  secrets:
    name: Security / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks CLI
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --no-banner --redact --verbose \
              --config /repo/.gitleaks.toml \
              --source /repo

  architecture:
    name: Architecture / layer matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run architecture contract tests
        run: python -m pytest tests/unit/architecture/ -q

  characterization:
    name: Characterization / produced run py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration]"

      # The tier's one run is the synthetic Dupuit aquifer of example 00, solved
      # with MODFLOW-NWT. Nothing here needs MODFLOW 6.
      - name: Install the solver binary the characterization run needs
        run: python -m hydromodpy install-binaries --subset mfnwt --quiet

      # The tier runs one real pipeline and reads only what it left on disk.
      # Its five strict xfails are the claims the code does not honor yet; a
      # strict xfail that starts passing fails this job, which is how a repaired
      # claim gets noticed instead of quietly staying green.
      - name: Run characterization tier
        run: python -m pytest tests/characterization/ --timeout=900 -q

  fast:
    name: Tests / fast marker py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,performance,calibration,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      - name: Install solver binaries for fast tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt --quiet

      # A single bad import aborts the whole pytest session, which silently
      # turns a tier into zero executed tests. This step fails loudly instead.
      - name: Collection gate
        run: python -m pytest tests/ --collect-only -q

      # The Whitebox native binding dies outright when several DEM workflows run
      # in one long-lived xdist worker, and --dist loadgroup is what puts them
      # there: tests/conftest.py groups every Whitebox test under one name, so
      # they all land on the same node. Run them in their own serial session
      # instead, like the weekly job already does for the backend unit tests.
      - name: Run fast marker suite
        run: |
          python -m pytest -m fast \
            --ignore=tests/regression/fast/geographic \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            -q

      - name: Run Whitebox-backed fast tests (serial)
        run: python -m pytest -m fast tests/regression/fast/geographic --timeout=300 -q

      # tests/contract/ is the only coverage of DuckDBCacheBackend and of the
      # catalog backend compatibility surface. It was in no workflow before.
      # HMP_REQUIRE_GMSH turns a skipped gmsh engine into a failure: the mesh
      # engine contract proves nothing on an engine it did not run.
      - name: Run contract tests
        env:
          HMP_REQUIRE_GMSH: "1"
        run: python -m pytest tests/contract/ -q

  unit:
    name: Tests / unit py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      # tests/unit/docs and tests/unit/tools import the Sphinx extensions of
      # docs/source/_ext, which need the docs extra. The gmsh tests skip
      # without the mesh extra.
      - name: Install package, test, docs and mesh extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,docs,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      # Docstring examples were never executed, so they drifted: two showed a
      # wrong repr, one named the wrong exception class, one called an attribute
      # that does not exist. Scoped to the modules that carry examples - a
      # blanket --doctest-modules on hydromodpy/ would import every
      # optional-dependency module and fail for unrelated reasons.
      - name: Run docstring examples
        run: |
          python -m pytest --doctest-modules -q \
            hydromodpy/_api.py \
            hydromodpy/core/io/proj_bootstrap.py \
            hydromodpy/core/logging.py \
            hydromodpy/core/units/types.py \
            hydromodpy/display/__init__.py \
            hydromodpy/display/quicklook/viz.py \
            hydromodpy/project/facade.py \
            hydromodpy/results/catalog/ \
            hydromodpy/results/exporters/ \
            hydromodpy/results/run/ \
            hydromodpy/core/units/physical_bounds.py

      # The whitebox-heavy tiers ran here for a while, on the assumption that
      # pinning the Whitebox fd-level stdio redirect off in tests/conftest.py made
      # them safe under xdist. It did not: a worker still died on main. The native
      # binding cannot share a long-lived worker with other DEM workflows, so it
      # gets its own serial step again.
      - name: Run unit tests in parallel
        run: |
          python -m pytest tests/unit/ \
            --ignore=tests/unit/architecture \
            --ignore=tests/unit/delineation/whitebox_workflows_backend/test_whitebox_workflows_backend.py \
            --ignore=tests/unit/geographic/core/test_catchment_from_point.py \
            --ignore=tests/unit/tools/cases/geographic/test_run_case_river_network_nancon.py \
            -m "not slow" \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --durations=25 \
            --cov=hydromodpy \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      - name: Run Whitebox-backed unit tests (serial)
        run: |
          python -m pytest \
            tests/unit/delineation/whitebox_workflows_backend/test_whitebox_workflows_backend.py \
            tests/unit/geographic/core/test_catchment_from_point.py \
            tests/unit/tools/cases/geographic/test_run_case_river_network_nancon.py \
            -m "not slow" --timeout=300 -q

      - name: Write unit coverage XML
        if: always()
        run: |
          coverage combine || true
          coverage xml || true

      - name: Upload unit coverage to Codecov
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  mesh-coverage:
    name: Coverage / mesh gate py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package, test, docs and mesh extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,docs,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      - name: Install the solver binary the mesh regression needs
        run: python -m hydromodpy install-binaries --subset mf6 --quiet

      # Branch coverage of spatial/ over the unit tier, the engine contract,
      # the mesh regression and the domain-build worker, which only its integration
      # test reaches. HMP_REQUIRE_GMSH fails a skipped gmsh engine.
      - name: Run the tests that reach the spatial package
        env:
          HMP_REQUIRE_GMSH: "1"
        run: |
          python -m pytest tests/unit/ \
            tests/contract/test_mesh_engine_contract.py \
            tests/contract/test_mesh_conformance_reaches_an_installed_engine.py \
            tests/regression/mesh/ \
            tests/integration/domain/test_worker.py \
            --ignore=tests/unit/architecture \
            --ignore=tests/unit/delineation/whitebox_workflows_backend/test_whitebox_workflows_backend.py \
            --ignore=tests/unit/geographic/core/test_catchment_from_point.py \
            --ignore=tests/unit/tools/cases/geographic/test_run_case_river_network_nancon.py \
            -m "not slow" \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --cov=hydromodpy/spatial \
            --cov=hydromodpy/model \
            --cov=hydromodpy/results/derive/stream \
            --cov-branch \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      # The Whitebox-backed files are left out above, because the native binding
      # dies under xdist. They run here one at a time into the same coverage.
      - name: Run the serial Whitebox tests into the same coverage
        env:
          HMP_REQUIRE_GMSH: "1"
        run: |
          python -m pytest \
            tests/unit/delineation/whitebox_workflows_backend/test_whitebox_workflows_backend.py \
            tests/unit/geographic/core/test_catchment_from_point.py \
            tests/unit/tools/cases/geographic/test_run_case_river_network_nancon.py \
            -m "not slow" \
            --timeout=300 \
            --cov=hydromodpy/spatial \
            --cov=hydromodpy/model \
            --cov=hydromodpy/results/derive/stream \
            --cov-branch \
            --cov-append \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      # One floor per sub-package, so that no small package drops unseen inside
      # an average. The floors only go up: raise each to the value a clean-up
      # lot reaches. A floor goes down only when files enter or leave a package, or
      # covered code leaves it, with no covered line lost, and the commit says so.
      # The domain, properties, forcing and lake bed lines gate the parts of model/ that
      # came from spatial/, on the same files as before the move.
      # The line before the last gates the modules at the top of spatial/. The last one
      # gates results/derive/stream, which no other job measures: its tests run in this unit tier.
      - name: Gate the spatial coverage
        run: |
          coverage combine || true
          coverage report --include='hydromodpy/spatial/mesh/*' --precision=2 --fail-under=99.24
          coverage report --include='hydromodpy/spatial/administrative/*' --precision=2 --fail-under=100.0
          coverage report --include='hydromodpy/spatial/delineation/*' --precision=2 --fail-under=97.2
          coverage report --include='hydromodpy/model/domain/*' --omit='hydromodpy/model/domain/lake_bed_*,hydromodpy/model/domain/structure_binders.py' --precision=2 --fail-under=99.3
          coverage report --include='hydromodpy/spatial/drainage/*' --precision=2 --fail-under=93.7
          coverage report --include='hydromodpy/model/properties/*' --omit='hydromodpy/model/properties/physical_properties.py,hydromodpy/model/properties/property_ids.py,hydromodpy/model/properties/property_table.py' --precision=2 --fail-under=98.7
          coverage report --include='hydromodpy/model/forcing/__init__.py,hydromodpy/model/forcing/area_weights.py,hydromodpy/model/forcing/cells.py,hydromodpy/model/forcing/interpolation.py,hydromodpy/model/forcing/rasters.py,hydromodpy/model/forcing/recharge_rates.py,hydromodpy/model/forcing/sources.py,hydromodpy/model/forcing/stations.py' --precision=2 --fail-under=99.7
          coverage report --include='hydromodpy/spatial/geographic/*' --precision=2 --fail-under=96.4
          coverage report --include='hydromodpy/model/domain/lake_bed_*' --precision=2 --fail-under=98.9
          coverage report --include='hydromodpy/spatial/terrain/*' --precision=2 --fail-under=94.6
          coverage report --include='hydromodpy/spatial/*.py' --precision=2 --fail-under=99.2
          coverage report --include='hydromodpy/results/derive/stream/*' --precision=2 --fail-under=92.66

  core-coverage:
    name: Coverage / core gate py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      # Branch coverage of core/ by its own tests, tests/unit/core, which mirror
      # the sub-packages of core.
      - name: Run the tests of the core package
        run: |
          python -m pytest tests/unit/core/ \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --cov=hydromodpy/core \
            --cov-branch \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      # One floor per sub-package, half a point under the value measured on
      # 2026-11-05 with Python 3.12, so that the change of interpreter does not
      # trip it. The floors only go up. The last line gates the modules at the
      # top of core/.
      - name: Gate the core coverage
        run: |
          coverage combine || true
          coverage report --include='hydromodpy/core/budget/*' --precision=2 --fail-under=99.1
          coverage report --include='hydromodpy/core/config_kit/*' --precision=2 --fail-under=93.6
          coverage report --include='hydromodpy/core/console/*' --precision=2 --fail-under=89.8
          coverage report --include='hydromodpy/core/contracts/*' --precision=2 --fail-under=98.1
          coverage report --include='hydromodpy/core/fields/*' --precision=2 --fail-under=79.2
          coverage report --include='hydromodpy/core/io/*' --precision=2 --fail-under=88.3
          coverage report --include='hydromodpy/core/payload/*' --precision=2 --fail-under=93.0
          coverage report --include='hydromodpy/core/runtime/*' --precision=2 --fail-under=94.0
          coverage report --include='hydromodpy/core/scoring/*' --precision=2 --fail-under=79.5
          coverage report --include='hydromodpy/core/site/*' --precision=2 --fail-under=92.9
          coverage report --include='hydromodpy/core/state/*' --precision=2 --fail-under=83.8
          coverage report --include='hydromodpy/core/time/*' --precision=2 --fail-under=93.1
          coverage report --include='hydromodpy/core/toml_io/*' --precision=2 --fail-under=86.5
          coverage report --include='hydromodpy/core/tracking/*' --precision=2 --fail-under=95.0
          coverage report --include='hydromodpy/core/units/*' --precision=2 --fail-under=89.3
          coverage report --include='hydromodpy/core/workspace/*' --precision=2 --fail-under=81.1
          coverage report --include='hydromodpy/core/*.py' --precision=2 --fail-under=83.4

  project-workflow-coverage:
    name: Coverage / project and workflow gate py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      # Branch coverage of project/ and workflow/ by the tests of their own
      # layers and of the launchers.
      - name: Run the tests of the project and workflow packages
        run: |
          python -m pytest tests/unit/project tests/unit/workflow tests/unit/launchers \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --cov=hydromodpy/project \
            --cov=hydromodpy/workflow \
            --cov-branch \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      # One floor per package, half a point under the value measured on
      # 2026-11-05 with Python 3.12 (project 81.27, workflow 81.85). The floors
      # only go up.
      - name: Gate the project and workflow coverage
        run: |
          coverage combine || true
          coverage report --include='hydromodpy/project/*' --precision=2 --fail-under=80.7
          coverage report --include='hydromodpy/workflow/*' --precision=2 --fail-under=81.3

  calibration-coverage:
    name: Coverage / calibration gate py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package, test, calibration and mesh extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,mesh]"

      - name: Install external validity_frame package
        run: pip install -e validity_frame

      - name: Install the solver binary the calibration tests need
        run: python -m hydromodpy install-binaries --subset mf6 --quiet

      # Branch coverage of calibration/ over its own unit, integration and regression
      # tests. They are what the rework of the calibration will lean on.
      - name: Run the tests of the calibration package
        run: |
          python -m pytest tests/unit/calibration tests/integration/calibration \
            tests/regression/fast/calibration \
            -m "not slow" \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=300 \
            --cov=hydromodpy/calibration \
            --cov-branch \
            --cov-report= \
            --cov-fail-under=0 \
            -q

      # One floor per sub-package, the first measure rounded down to a half point.
      # The floors only go up, by the rule of the spatial gate above. The last line
      # gates the modules at the top of calibration/.
      - name: Gate the calibration coverage
        run: |
          coverage combine || true
          coverage report --include='hydromodpy/calibration/criteria/*' --precision=2 --fail-under=100.0
          coverage report --include='hydromodpy/calibration/evaluation/*' --precision=2 --fail-under=100.0
          coverage report --include='hydromodpy/calibration/metrics/*' --precision=2 --fail-under=99.5
          coverage report --include='hydromodpy/calibration/observations/*' --precision=2 --fail-under=99.5
          coverage report --include='hydromodpy/calibration/optim/*' --precision=2 --fail-under=99.0
          coverage report --include='hydromodpy/calibration/protocols/*' --precision=2 --fail-under=100.0
          coverage report --include='hydromodpy/calibration/runners/*' --precision=2 --fail-under=98.0
          coverage report --include='hydromodpy/calibration/*.py' --omit='hydromodpy/calibration/*/*' --precision=2 --fail-under=99.5

  integration:
    name: Tests / integration py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      # The gmsh tests skip without the mesh extra.
      - name: Install package, test and mesh extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,mesh]"

      - name: Install solver binaries for integration tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt,mp6,mt3dusgs --quiet

      - name: Run integration suite
        run: |
          python -m pytest tests/integration/ \
            -n 2 --dist loadgroup \
            --max-worker-restart=0 \
            --timeout=600 \
            -q

  regression-fast:
    name: Regression / fast solvers py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration]"

      - name: Install solver binaries for regression tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt,mp6,mt3dusgs --quiet

      # The Whitebox native binding dies outright when several DEM workflows run
      # in one long-lived xdist worker, and --dist loadgroup is what puts them
      # there: tests/conftest.py groups every Whitebox test under one name, so
      # they all land on the same node. Run them in their own serial session
      # instead, like the weekly job already does for the backend unit tests.
      - name: Run fast regression suite
        run: |
          python -m pytest tests/regression/fast/ \
            --ignore=tests/regression/fast/geographic \
            -n 2 --dist loadgroup --max-worker-restart=0 --timeout=600 -q

      - name: Run Whitebox-backed fast regression (serial)
        run: python -m pytest tests/regression/fast/geographic --timeout=600 -q

  example-catalog:
    name: Package / example catalog matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sha256 of every file the catalog names
        run: python tools/ci/check_example_catalog.py

  package-smoke:
    name: Package / wheel smoke py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install build tooling
        run: pip install --upgrade pip "build>=1.2"

      - name: Build wheel and sdist
        run: python -m build

      - name: Install wheel into fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/hmp-smoke"
          "$RUNNER_TEMP/hmp-smoke/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/hmp-smoke/bin/pip" install dist/*.whl

      - name: Run hmp doctor from wheel install
        run: |
          "$RUNNER_TEMP/hmp-smoke/bin/hmp" doctor --format json

  typing:
    name: Typing / mypy baseline py3.12 (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and mypy
        run: |
          pip install --upgrade pip
          pip install -e "."
          pip install "mypy>=1.13" "pydantic>=2.13" "types-requests"

      - name: Run mypy baseline
        run: |
          set +e
          mypy hydromodpy
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::mypy advisory baseline failed with exit code $status"
          fi
          exit 0
