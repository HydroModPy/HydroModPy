# Publish HydroModPy v1.0 to PyPI, on demand.
#
# Nothing is ever published by pushing a tag. The release is started by hand
# from the Actions tab ("Run workflow"), on a tag that already exists.
#
# Flow:
#   1. build   - check the tag matches the pyproject version, build sdist and
#                wheel, validate the metadata with `twine check --strict`.
#   2. verify  - install the built wheel on Linux, Windows and macOS for the
#                lowest and highest supported Python, import the package and
#                run the bundled MODFLOW 6 binary from its installed location.
#   3. publish - upload to PyPI. Guarded by the `pypi` environment, so a
#                reviewer approves before anything leaves the runner.
#   4. release - create the GitHub release from the CHANGELOG section.
#
# Tick `dry_run` to stop after `verify`: everything is built and tested, the
# artifacts stay downloadable from the run page, and PyPI is never touched.
#
# Trusted Publisher prerequisite (one-time, on PyPI):
#   project = hydromodpy
#   owner = HydroModPy
#   repository = HydroModPy
#   workflow = publish.yml
#   environment = pypi
#
# LAUNCHING: GitHub only shows the "Run workflow" button for workflow files
# present on the DEFAULT branch (main). Open the button, then switch the branch
# selector to v1.0 so this file is the one that runs.

name: Release / PyPI (v1.0)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify only, never upload to PyPI"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install "build>=1.2" "twine>=5.0"

      - name: Verify version matches tag
        run: |
          tag="${{ inputs.tag }}"
          expected="${tag#v}"
          actual=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Tag $tag does not match pyproject version $actual" >&2
            exit 1
          fi
          echo "publishing version $actual"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: Install ${{ matrix.os }} py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Fetch the WhiteboxTools binary
        run: |
          # watershed_root builds a whitebox.WhiteboxTools() at module level, so
          # `import hydromodpy` downloads a ~25 MB binary from whiteboxgeo.com on
          # first use. That third-party download truncates from time to time, and
          # it must not fail a release, so pull it here with retries. Nothing is
          # extracted on failure, which makes a retry re-download cleanly.
          for attempt in 1 2 3; do
            if python -c "import whitebox; whitebox.WhiteboxTools()"; then
              echo "WhiteboxTools ready (attempt ${attempt})"
              exit 0
            fi
            echo "WhiteboxTools download failed (attempt ${attempt}), retrying"
            sleep 20
          done
          echo "WhiteboxTools download kept failing after 3 attempts" >&2
          exit 1

      - name: Import the package and check the version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import hydromodpy

          expected = os.environ["RELEASE_TAG"].lstrip("v")
          print("installed version:", hydromodpy.__version__)
          assert hydromodpy.__version__ == expected, (hydromodpy.__version__, expected)
          PY

      - name: Run the bundled MODFLOW 6 binary
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          from hydromodpy import watershed_root

          # Same expression as Watershed.__init__ uses to locate the binaries.
          bin_dir = pathlib.Path(watershed_root.root_dir).parent / "bin"
          platform_dir = {"win32": "win", "darwin": "mac"}.get(sys.platform, "linux")
          exe = bin_dir / platform_dir / ("mf6.exe" if platform_dir == "win" else "mf6")

          assert exe.is_file(), f"missing bundled binary: {exe}"
          result = subprocess.run([str(exe), "-v"], capture_output=True, text=True)
          print(result.stdout.strip() or result.stderr.strip())
          assert result.returncode == 0, result.returncode
          PY

  publish:
    name: Upload to PyPI
    needs: [build, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hydromodpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create the GitHub release
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for tag
        run: |
          python - "${{ inputs.tag }}" <<'PY' > release_notes.md
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[)"
          match = re.search(pattern, changelog, re.DOTALL | re.MULTILINE)
          if not match:
              sys.stderr.write(f"No CHANGELOG section for {tag}\n")
              sys.exit(1)
          sys.stdout.write(match.group(1).strip() + "\n")
          PY

      - name: Classify release tag
        id: release-kind
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag }}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # GitHub marks the most recent release as "Latest", so a v1.0.x patch
          # cut after v2 would steal the badge. Claim it only while no release
          # with a higher major version exists.
          highest=0
          for published in $(gh release list --limit 100 --json tagName --jq '.[].tagName' || true); do
            major="${published#v}"
            major="${major%%.*}"
            case "$major" in
              '' | *[!0-9]*) continue ;;
            esac
            if [ "$major" -gt "$highest" ]; then highest="$major"; fi
          done
          echo "highest published major: ${highest}"
          if [ "$highest" -gt 1 ]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: HydroModPy ${{ inputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
          make_latest: ${{ steps.release-kind.outputs.make_latest }}
          files: |
            dist/*
