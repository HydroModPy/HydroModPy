# Publish HydroModPy to PyPI on tag push.
#
# Trigger: a git tag matching v*.*.* is pushed.
# Steps:
#   0. Gate: the tagged commit is on main or dev, its CI / Main Gate run passed, and
#      the example catalog matches the tree.
#   1. Build wheel + sdist with `python -m build`, then test the wheel on 3.11 to 3.13.
#   2. Generate a CycloneDX SBOM (`cyclonedx-bom`) from a fresh wheel install.
#   3. Upload to PyPI via Trusted Publishers (OIDC, no API token).
#   4. Create a GitHub release with the matching CHANGELOG section as body,
#      mark PEP 440 a/b/rc tags as pre-releases, and attach both the
#      distribution files and the SBOM as release assets.
#
# Trusted Publisher prerequisite (one-time, on PyPI):
#   project = hydromodpy
#   owner = (org/user)
#   repository = HydroModPy
#   workflow = publish.yml
#   environment = pypi

name: Release / PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Release / CI gate on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tagged commit is on main or dev
        run: |
          git fetch origin main dev
          if git merge-base --is-ancestor HEAD origin/main || git merge-base --is-ancestor HEAD origin/dev; then
            echo "Commit $(git rev-parse HEAD) is on main or dev"
          else
            echo "Commit $(git rev-parse HEAD) is on neither main nor dev" >&2
            exit 1
          fi

      - name: Check CI / Main Gate passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main-ci.yml \
            --commit "$sha" --status completed --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" -lt 1 ]; then
            echo "No successful CI / Main Gate run for $sha" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the example catalog against the tree of the tag
        run: python tools/ci/check_example_catalog.py

  build:
    name: Release / build sdist and wheel
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install "build>=1.2"

      - name: Build distributions
        run: python -m build

      - name: Verify version matches tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          actual=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Tag $tag does not match pyproject version $actual" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  wheel-test:
    name: Release / wheel test py${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/hmp-wheel"
          "$RUNNER_TEMP/hmp-wheel/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/hmp-wheel/bin/pip" install dist/*.whl

      - name: Import and run hmp doctor
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hmp-wheel/bin/python" -c "import hydromodpy; print(hydromodpy.__version__)"
          "$RUNNER_TEMP/hmp-wheel/bin/hmp" doctor --format json

  sbom:
    name: Release / generate CycloneDX SBOM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install SBOM tooling
        run: |
          pip install --upgrade pip
          pip install "cyclonedx-bom>=7,<8"

      - name: Install built wheel into fresh venv
        run: |
          python -m venv /tmp/hmp-sbom
          /tmp/hmp-sbom/bin/pip install --upgrade pip
          /tmp/hmp-sbom/bin/pip install dist/*.whl

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          mkdir -p sbom
          cyclonedx-py environment /tmp/hmp-sbom \
            --output-format JSON \
            --output-file sbom/hydromodpy-sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Release / upload to PyPI
    needs: [build, wheel-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hydromodpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Release / create GitHub release
    needs: [publish, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Extract CHANGELOG section for tag
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          python - "$tag" <<'PY' > release_notes.md
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[)"
          match = re.search(pattern, changelog, re.DOTALL | re.MULTILINE)
          if not match:
              sys.stderr.write(f"No CHANGELOG section for {tag}\n")
              sys.exit(1)
          sys.stdout.write(match.group(1).strip() + "\n")
          PY

      - name: Classify release tag
        id: release-kind
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/*
            sbom/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
