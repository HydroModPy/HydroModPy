# Publish HydroModPy to PyPI on tag push.
#
# Trigger: a git tag matching v*.*.* is pushed.
# Steps:
#   1. Build wheel + sdist with `python -m build`.
#   2. Upload to PyPI via Trusted Publishers (OIDC, no API token).
#   3. Create a GitHub release with the matching CHANGELOG section as body.
#
# Trusted Publisher prerequisite (one-time, on PyPI):
#   project = hydromodpy
#   owner = (org/user)
#   repository = HydroModPy
#   workflow = publish.yml
#   environment = pypi

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install "build>=1.2"

      - name: Build distributions
        run: python -m build

      - name: Verify version matches tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          actual=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Tag $tag does not match pyproject version $actual" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hydromodpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for tag
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          python - "$tag" <<'PY' > release_notes.md
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[)"
          match = re.search(pattern, changelog, re.DOTALL | re.MULTILINE)
          if not match:
              sys.stderr.write(f"No CHANGELOG section for {tag}\n")
              sys.exit(1)
          sys.stdout.write(match.group(1).strip() + "\n")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
