# Builds the HydroModPy Docker image on every push/PR touching the Dockerfile,
# the package source or the HTTP server. The image is not pushed to a registry
# yet, only built inside the runner to check the build, the hmp entry point and
# the server it carries.

name: Docker / Build Smoke

on:
  push:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "hydromodpy/**"
      - "hydromodpy_server/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "hydromodpy/**"
      - "hydromodpy_server/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Docker / build and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: hydromodpy:ci
          build-args: |
            HMP_IMAGE_TAG=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image entrypoints
        run: |
          docker run --rm hydromodpy:ci --help
          docker run --rm hydromodpy:ci --version

      - name: Smoke test the HTTP server inside image
        run: docker run --rm --entrypoint python hydromodpy:ci -m hydromodpy_server --help

      - name: Run hmp doctor inside image (advisory)
        continue-on-error: true
        run: docker run --rm hydromodpy:ci doctor --json
