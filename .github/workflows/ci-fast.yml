# Fast checks for every push and pull request on dev or master.
# Keeps feedback under ten minutes: lint, unit tests, fast regression.

name: CI Fast

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff and pip-audit
        run: pip install "ruff>=0.6" "pip-audit>=2.7"

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Audit declared dependencies for known vulnerabilities
        run: pip-audit --strict --vulnerability-service osv .

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks CLI
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --no-banner --redact --verbose \
              --config /repo/.gitleaks.toml \
              --source /repo

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      # The coverage .pth shim breaks numpy C extensions on CI runners.
      - name: Drop coverage .pth shim
        run: |
          python -c "
          import pathlib, sysconfig
          site = pathlib.Path(sysconfig.get_path('purelib'))
          for pth in site.glob('*coverage*.pth'):
              pth.unlink()
          "

      # Keep the unit tier serial on CI: xdist workers can terminate inside
      # native geospatial stacks and leave the job stuck near completion.
      - name: Run unit tests (without whitebox backend)
        run: |
          python -m pytest tests/unit/ \
            --ignore=tests/unit/backends/test_whitebox_workflows_backend.py \
            -q \
            --cov=hydromodpy \
            --cov-report=

      - name: Run whitebox backend tests (serial)
        run: |
          python -m pytest tests/unit/backends/test_whitebox_workflows_backend.py -q \
            --cov=hydromodpy \
            --cov-append \
            --cov-report=

      - name: Report coverage
        if: always()
        run: |
          coverage report --show-missing || true
          coverage xml || true

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  regression-fast:
    name: Fast regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install package and test extras
        run: |
          pip install --upgrade pip
          pip install -e ".[test,calibration,delineation]"

      - name: Drop coverage .pth shim
        run: |
          python -c "
          import pathlib, sysconfig
          site = pathlib.Path(sysconfig.get_path('purelib'))
          for pth in site.glob('*coverage*.pth'):
              pth.unlink()
          "

      - name: Install solver binaries for regression tests
        run: python -m hydromodpy install-binaries --subset mf6,mfnwt,mp6,mt3dusgs --quiet

      - name: Run fast regression with coverage
        env:
          HYDROMODPY_COVERAGE: "1"
        run: python -m pytest tests/regression/fast/ -n auto --dist loadgroup -q

      - name: Combine and report coverage
        if: always()
        run: |
          coverage combine || true
          coverage report --show-missing || true
          coverage xml || true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: regression-fast
          fail_ci_if_error: false

  wheel-smoke:
    name: Wheel install smoke (hmp doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install build tooling
        run: pip install --upgrade pip "build>=1.2"

      - name: Build wheel and sdist
        run: python -m build

      - name: Create fresh venv
        run: python -m venv /tmp/hmp-smoke

      - name: Install wheel into fresh venv
        run: |
          /tmp/hmp-smoke/bin/pip install --upgrade pip
          /tmp/hmp-smoke/bin/pip install dist/*.whl

      - name: Run hmp doctor against the freshly installed wheel
        run: /tmp/hmp-smoke/bin/hmp doctor --json

  type-check:
    name: Static type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and mypy
        run: |
          pip install --upgrade pip
          pip install -e "."
          pip install "mypy>=1.13" "pydantic>=2.13" "types-requests"

      - name: Run mypy (baseline, non-blocking)
        run: mypy hydromodpy || true
