# Nightly validation of the Boussinesq PETSc variants on main and dev.
# The other nightly and weekly jobs install with pip and have no petsc4py,
# so they deselect every `petsc` test. PETSc and petsc4py come from
# conda-forge only, so this job installs like petsc-smoke.yml. It runs
# every test of tests/validation/ marked `petsc`: the Boussinesq variant of
# each analytical case (marked by tests/conftest.py) and the PETSc obstacle
# variants of the transient linearized case.

name: Nightly / PETSc validation

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  validation-petsc:
    name: Nightly / validation PETSc on ${{ matrix.target_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target_branch: [main, dev]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_branch }}

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: hydromodpy-petsc
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          python-version: "3.12"

      - name: Install PETSc test environment
        shell: bash -el {0}
        run: |
          conda install -y \
            python=3.12 \
            pip \
            petsc \
            petsc4py \
            mpi4py \
            gmsh \
            flopy \
            geopandas \
            rasterio \
            rioxarray \
            pyproj \
            shapely \
            h5py \
            netcdf4 \
            numpy \
            scipy \
            pandas \
            xarray \
            matplotlib \
            pytest \
            pytest-xdist \
            pytest-timeout
          python -m pip install -e ".[test]"

      # Each test records what it measured (tests/validation/conftest.py).
      # tools/docs/validation_results.py fetch merges this artifact with the
      # one of ci-nightly.yml into the snapshot the Validation page reads.
      - name: Run PETSc validation tests
        shell: bash -el {0}
        env:
          HMP_VALIDATION_RESULTS: ${{ runner.temp }}/validation-results
          PYTHONFAULTHANDLER: "1"
        run: |
          python -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"
          python -m pytest tests/validation/ -m petsc -n auto --dist loadgroup -q

      - name: Merge validation results
        if: always()
        shell: bash -el {0}
        run: |
          python -m tools.docs.validation_results merge \
            "${{ runner.temp }}/validation-results" \
            --snapshot validation-results.json --replace || true

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-petsc-${{ matrix.target_branch }}
          path: validation-results.json
          if-no-files-found: warn
          retention-days: 30
