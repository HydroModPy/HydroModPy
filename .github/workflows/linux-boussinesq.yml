name: Linux Boussinesq

on:
  pull_request:
    paths:
      - ".github/workflows/linux-boussinesq.yml"
      - "hydromodpy/solver/boussinesq/**"
      - "hydromodpy/simulation/adapters/flow/boussinesq.py"
      - "hydromodpy/process/flow/**"
      - "tests/unit/solver/test_boussinesq_*.py"
      - "tests/unit/simulation/test_boussinesq_flow_adapter.py"
      - "tests/unit/validation/test_dupuit_fixed_head_petsc_alias.py"
      - "tests/unit/validation/test_hillslope_pulse_overflow_case.py"
      - "tests/validation/analytical/steady/test_dupuit_fixed_head_*.py"
      - "tests/validation/numerical/transient/test_boussinesq_hillslope_recharge_pulse_overflow_petsc.py"
      - "validation_cases/analytical/steady/dupuit_fixed_head_1d/**"
      - "validation_cases/numerical/transient/boussinesq_hillslope_recharge_pulse_overflow_1d/**"
      - "validation_cases/shared/**"
      - "tools/ci/run_boussinesq_*.sh"
  push:
    branches:
      - main
      - dev
      - develop
    paths:
      - ".github/workflows/linux-boussinesq.yml"
      - "hydromodpy/solver/boussinesq/**"
      - "hydromodpy/simulation/adapters/flow/boussinesq.py"
      - "hydromodpy/process/flow/**"
      - "tests/unit/solver/test_boussinesq_*.py"
      - "tests/unit/simulation/test_boussinesq_flow_adapter.py"
      - "tests/unit/validation/test_dupuit_fixed_head_petsc_alias.py"
      - "tests/unit/validation/test_hillslope_pulse_overflow_case.py"
      - "tests/validation/analytical/steady/test_dupuit_fixed_head_*.py"
      - "tests/validation/numerical/transient/test_boussinesq_hillslope_recharge_pulse_overflow_petsc.py"
      - "validation_cases/analytical/steady/dupuit_fixed_head_1d/**"
      - "validation_cases/numerical/transient/boussinesq_hillslope_recharge_pulse_overflow_1d/**"
      - "validation_cases/shared/**"
      - "tools/ci/run_boussinesq_*.sh"
  workflow_dispatch:
    inputs:
      run_petsc:
        description: "Run the Linux PETSc smoke job"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  HYDROMODPY_NO_DISPLAY: "1"
  HYDROMODPY_NO_SAVE: "1"
  MPLBACKEND: Agg

jobs:
  boussinesq-linux-smoke:
    name: Boussinesq Linux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r install/requirements-docker-light.txt
          python -m pip install \
            "pydantic>=2.0" \
            dask \
            imageio \
            matplotlib \
            meshio \
            pint \
            plotly \
            scipy \
            shapely \
            sqlalchemy \
            tomli-w \
            tqdm
          python -m pip install -e . --no-deps

      - name: Run Boussinesq smoke tests
        run: bash tools/ci/run_boussinesq_linux_smoke.sh

  boussinesq-petsc-smoke:
    name: Boussinesq PETSc smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_petsc) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: hydromodpy-petsc
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
          python-version: "3.12"

      - name: Install PETSc test environment
        shell: bash -el {0}
        run: |
          conda install -y \
            python=3.12 \
            pip \
            petsc \
            petsc4py \
            mpi4py \
            dask \
            plotly \
            numpy \
            scipy \
            pytest \
            pytest-xdist \
            pandas \
            xarray \
            pydantic \
            matplotlib \
            shapely \
            pyproj \
            geopandas \
            rasterio \
            rioxarray \
            flopy \
            h5py \
            netcdf4 \
            pint \
            pyshp \
            scikit-learn \
            meshio \
            imageio \
            requests \
            geopy \
            selenium \
            tqdm \
            sqlalchemy
          python -m pip install pysheds tomli-w whitebox-workflows
          python -m pip install -e . --no-deps

      - name: Run PETSc smoke tests
        shell: bash -el {0}
        run: bash tools/ci/run_boussinesq_petsc_smoke.sh
