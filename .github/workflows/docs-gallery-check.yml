# Checks that the committed documentation gallery artifacts match what
# tools/doc_gallery would regenerate. Runs only when gallery inputs change.

name: Docs / Gallery Sync

on:
  pull_request:
    paths:
      - ".github/workflows/docs-gallery-check.yml"
      - "tools/doc_gallery/**"
      - "examples/projects/07_mesh_gallery/**"
      - "examples/projects/09_capability_gallery/**"
      - "validation_cases/README.md"
      - "validation_cases/analytical/**"
      - "validation_cases/numerical/**"
      - "docs/source/capability_gallery/**"
      - "docs/source/_static/capability_gallery/**"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/docs-gallery-check.yml"
      - "tools/doc_gallery/**"
      - "examples/projects/07_mesh_gallery/**"
      - "examples/projects/09_capability_gallery/**"
      - "validation_cases/README.md"
      - "validation_cases/analytical/**"
      - "validation_cases/numerical/**"
      - "docs/source/capability_gallery/**"
      - "docs/source/_static/capability_gallery/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  docs-gallery-check:
    name: Docs / gallery artifacts in sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa graphviz libgraphviz-dev pkg-config

      - name: Install package and docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs,test]"

      # Four categories of nine, and the four are not arbitrary: --check
      # regenerates the gallery before comparing it, so it can only cover the
      # cases a bare runner can reproduce. validation and calibration need the
      # solver binaries, geometry and hydraulic_properties need the DEM and
      # geology bundles, and simulation needs the run that wrote its manifest.
      # Widening the list here would not verify those five, it would make them
      # pass on a preserved copy of themselves.
      #
      # What does cover all nine is check_gallery_sources_are_current in
      # tools/check_docs_inventory.py, asserted by
      # tests/unit/test_docs_inventory.py::
      # test_every_published_gallery_case_is_current_with_its_sources. It reads
      # the digests a case was published with instead of reproducing the case,
      # so it catches a page left behind by its own sources on every category.
      - name: Verify committed gallery artifacts
        run: >
          python -m tools.doc_gallery --check
          --category mesh,geographic,simulation_comparison,code_comparison
