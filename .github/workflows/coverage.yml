name: pytest

on:
  push:
    branches: [master, dev-refact, dev-data, dev-database]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"
          pip install coverage

      - name: Remove coverage .pth file (breaks numpy C extensions)
        run: |
          python -c "
          import sysconfig, pathlib, glob
          site = pathlib.Path(sysconfig.get_path('purelib'))
          for pth in site.glob('*coverage*.pth'):
              pth.unlink()
              print(f'Removed {pth}')
          "

      - name: Run unit tests with coverage
        run: |
          coverage run --rcfile=/dev/null \
            --include="hydromodpy/*" \
            --omit="hydromodpy/**/cases/*,hydromodpy/**/examples/*,hydromodpy/calibration_legacy/*,hydromodpy/calibration2/*" \
            -m pytest tests/unit/ -v

      - name: Report coverage
        if: always()
        run: |
          coverage report --rcfile=/dev/null --show-missing \
            --include="hydromodpy/*" \
            --omit="hydromodpy/**/cases/*,hydromodpy/**/examples/*,hydromodpy/calibration_legacy/*,hydromodpy/calibration2/*"
          coverage xml --rcfile=/dev/null \
            --include="hydromodpy/*" \
            --omit="hydromodpy/**/cases/*,hydromodpy/**/examples/*,hydromodpy/calibration_legacy/*,hydromodpy/calibration2/*"

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"
          pip install coverage

      - name: Remove coverage .pth file (breaks numpy C extensions)
        run: |
          python -c "
          import sysconfig, pathlib, glob
          site = pathlib.Path(sysconfig.get_path('purelib'))
          for pth in site.glob('*coverage*.pth'):
              pth.unlink()
              print(f'Removed {pth}')
          "

      - name: Run regression tests
        env:
          HYDROMODPY_COVERAGE: "1"
        run: |
          python -m pytest \
            tests/regression/fast/ \
            tests/regression/extensive/ -v

      - name: Combine and report coverage
        if: always()
        run: |
          coverage combine
          coverage report --show-missing
          coverage xml

      - name: Debug coverage files
        if: always()
        run: ls -la .coverage* || echo "No .coverage files found"

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: regression
          fail_ci_if_error: false
