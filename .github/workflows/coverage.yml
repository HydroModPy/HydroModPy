name: pytest

on:
  push:
    branches: [master, dev-refact]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"
          pip install coverage

      - name: Remove coverage .pth file (breaks numpy C extensions)
        run: |
          python -c "
          import sysconfig, pathlib, glob
          site = pathlib.Path(sysconfig.get_path('purelib'))
          for pth in site.glob('*coverage*.pth'):
              pth.unlink()
              print(f'Removed {pth}')
          "

      - name: Make MODFLOW binaries executable
        run: chmod +x bin/linux/*

      - name: Run tests
        env:
          HYDROMODPY_COVERAGE: "1"
        run: |
          python -m pytest \
            tests/regression/test_example12_npy_regression.py -v

      - name: Combine and report coverage
        if: always()
        run: |
          coverage combine
          coverage report --show-missing
          coverage xml

      - name: Debug coverage files
        if: always()
        run: ls -la .coverage* || echo "No .coverage files found"

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
