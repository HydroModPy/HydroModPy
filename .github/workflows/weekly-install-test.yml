name: Weekly install & examples (v1.0)

# Cross-OS / cross-Python install check for the v1.0 branch:
#   - pip editable (pip install -e .) and pip (pip install .)
#   - conda from the three install/*.yml files
# on Linux, Windows, macOS Intel (macos-15-intel) and macOS ARM (macos-14),
# for Python 3.11 / 3.12 / 3.13.
#
# LAUNCHING: GitHub only enables `schedule` and the "Run workflow"
# (workflow_dispatch) button when the workflow file is on the repository
# DEFAULT branch (master). This file therefore has to live on master to be
# launchable; it always checks out and tests the v1.0 branch (ref: v1.0 below).
#
# Hard check on every OS: the package installs and `import hydromodpy` works.
# The example scripts are only run on Linux (headless VTK/Qt is validated there);
# the bundled solver binaries are per-OS (bin/win, bin/mac, bin/linux), so
# example runs can be extended to Windows/macOS later if desired.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip:
    name: pip-${{ matrix.method }} ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
        python: ['3.11', '3.12', '3.13']
        method: [editable, plain]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for VTK/Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxrender1

      - name: Install (pip ${{ matrix.method }})
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.method }}" = "editable" ]; then
            pip install -e .
          else
            pip install .
          fi

      - name: Import smoke test
        run: python -c "import hydromodpy; from hydromodpy import watershed_root; print('import OK', hydromodpy.__version__)"

      - name: Run examples (headless, Linux only)
        if: runner.os == 'Linux'
        run: bash .github/scripts/run_ci_examples.sh

  conda:
    name: conda-${{ matrix.envfile }} ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
        python: ['3.11', '3.12', '3.13']
        envfile: [env_hydromodpy.yml, env_hydromodpy_light.yml, env_hydromodpy_pkg.yml]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-update-conda: false
          activate-environment: ''

      - name: Create env from ${{ matrix.envfile }}
        run: |
          # Pin the requested Python except 3.13: hard-pinning 3.13 can send libsolv
          # into a backtracking hang, while ">=3.11,<3.14" resolves to 3.13. Portable
          # rewrite (works on Linux/macOS/Windows, no sed).
          python -c "p='install/${{ matrix.envfile }}'; py='${{ matrix.python }}'; s=open(p).read(); s=s if py=='3.13' else s.replace('python>=3.11,<3.14','python='+py); open(p,'w').write(s)"
          # -n ci overrides the env name in the file; running from install/ makes the
          # pkg file's `pip: -e ..` resolve to the repo root.
          cd install
          mamba env create -n ci -f "${{ matrix.envfile }}"

      - name: Install package + verify Python
        run: |
          conda activate ci
          python -c "import sys; v='%d.%d'%sys.version_info[:2]; print('python', v); assert v=='${{ matrix.python }}', v"
          pip install -e .
          python -c "import hydromodpy; print('import OK', hydromodpy.__version__)"

      - name: Run examples (headless, Linux only)
        if: runner.os == 'Linux'
        run: |
          conda activate ci
          bash .github/scripts/run_ci_examples.sh
