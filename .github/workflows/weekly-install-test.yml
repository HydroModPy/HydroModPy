name: Weekly install & examples (v1.0)

# Sparse, intelligent cross-OS / cross-Python install check for the v1.0 branch.
#
# Coverage strategy (every axis value is exercised at least once, WITHOUT the
# full Cartesian product):
#   - Windows is the REFERENCE platform (~90% of the user base): full Python x
#     method/envfile coverage for install + `import hydromodpy`, AND it runs the
#     example scripts once per Python on the full conda env.
#   - Linux keeps ONE example run (newest Python) as a known-good headless
#     baseline to tell "broken on Windows only" from "broken everywhere".
#   - macOS (Intel + ARM) only smoke-tests install + import on the Python edges
#     (3.11 oldest, 3.13 newest), rotating method/envfile so each value appears.
#
# The example runner is INLINE here (not the v1.0 .github/scripts/
# run_ci_examples.sh): it is pure Python (subprocess with timeout, no GNU
# `timeout`, no PYTHONPATH/sitecustomize tricks), so it runs identically under
# Git Bash on Windows and bash on Linux. The example LIST is mirrored from the
# v1.0 script; keep them in sync if either changes.
#
# Net effect: 19 jobs instead of 60, while still touching every OS, every
# supported Python (3.11/3.12/3.13), both pip methods and all three conda envs.
#
# LAUNCHING: GitHub only enables `schedule` and the "Run workflow"
# (workflow_dispatch) button when the workflow file is on the repository
# DEFAULT branch (master). This file therefore has to live on master to be
# launchable; it always checks out and tests the v1.0 branch (ref: v1.0 below).

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip:
    name: pip-${{ matrix.method }} ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: full reference matrix (3 Python x 2 methods).
          - { os: windows-latest, python: '3.11', method: editable }
          - { os: windows-latest, python: '3.11', method: plain }
          - { os: windows-latest, python: '3.12', method: editable }
          - { os: windows-latest, python: '3.12', method: plain }
          - { os: windows-latest, python: '3.13', method: editable }
          - { os: windows-latest, python: '3.13', method: plain }
          # Linux: install/import edges (examples run in the conda job below).
          - { os: ubuntu-latest, python: '3.11', method: plain }
          - { os: ubuntu-latest, python: '3.13', method: editable }
          # macOS Intel (riskier legacy runner): newest Python, plain install.
          - { os: macos-15-intel, python: '3.13', method: plain }
          # macOS ARM: both Python edges, both methods.
          - { os: macos-14, python: '3.11', method: plain }
          - { os: macos-14, python: '3.13', method: editable }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for VTK/Qt (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxrender1

      - name: Install (pip ${{ matrix.method }})
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.method }}" = "editable" ]; then
            pip install -e .
          else
            pip install .
          fi

      - name: Import smoke test
        run: python -c "import hydromodpy; from hydromodpy import watershed_root; print('import OK', hydromodpy.__version__)"

  conda:
    name: conda-${{ matrix.envfile }} ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: full reference matrix; runs examples once per Python on the
          # full env. light/pkg envs validated on the newest Python.
          - { os: windows-latest, python: '3.13', envfile: env_hydromodpy.yml, examples: true }
          - { os: windows-latest, python: '3.13', envfile: env_hydromodpy_light.yml }
          - { os: windows-latest, python: '3.13', envfile: env_hydromodpy_pkg.yml }
          - { os: windows-latest, python: '3.11', envfile: env_hydromodpy.yml, examples: true }
          - { os: windows-latest, python: '3.12', envfile: env_hydromodpy.yml, examples: true }
          # Linux: one example run (newest Python) as a known-good baseline.
          - { os: ubuntu-latest, python: '3.13', envfile: env_hydromodpy.yml, examples: true }
          # macOS Intel: full env, oldest Python.
          - { os: macos-15-intel, python: '3.11', envfile: env_hydromodpy.yml }
          # macOS ARM: pkg env, newest Python.
          - { os: macos-14, python: '3.13', envfile: env_hydromodpy_pkg.yml }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-update-conda: false
          activate-environment: ''

      - name: System libraries for VTK/Qt (Linux only)
        if: runner.os == 'Linux' && matrix.examples
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxrender1

      - name: Create env from ${{ matrix.envfile }}
        run: |
          # Pin the requested Python except 3.13: hard-pinning 3.13 can send libsolv
          # into a backtracking hang, while ">=3.11,<3.14" resolves to 3.13. Portable
          # rewrite (works on Linux/macOS/Windows, no sed).
          python -c "p='install/${{ matrix.envfile }}'; py='${{ matrix.python }}'; s=open(p).read(); s=s if py=='3.13' else s.replace('python>=3.11,<3.14','python='+py); open(p,'w').write(s)"
          # -n ci overrides the env name in the file; running from install/ makes the
          # pkg file's `pip: -e ..` resolve to the repo root.
          cd install
          mamba env create -n ci -f "${{ matrix.envfile }}"

      - name: Install package + verify Python
        run: |
          conda activate ci
          python -c "import sys; v='%d.%d'%sys.version_info[:2]; print('python', v); assert v=='${{ matrix.python }}', v"
          pip install -e .
          python -c "import hydromodpy; print('import OK', hydromodpy.__version__)"

      - name: Run examples (headless, cross-OS)
        if: matrix.examples
        run: |
          conda activate ci
          # Make bundled solver binaries executable (no-op for Windows .exe).
          chmod +x bin/*/* 2>/dev/null || true
          # Portable headless runner: pure Python, no GNU `timeout`, no
          # PYTHONPATH/sitecustomize tricks. Works under Git Bash and bash.
          cat > _ci_run_examples.py <<'PY'
          import os
          import subprocess
          import sys

          EXAMPLES = [
              "examples/11_for run from scratch without plots/example_11.py",
              "examples/00_quick_test_of_wide_hydromodpy_capabilities/example_00.py",
              "examples/07_analytical_solution_for_streamflow_recession/example_07.py",
          ]

          # Neutralize interactive display in the child process before it runs.
          SHIM = r'''
          import os
          os.environ.setdefault('MPLBACKEND', 'Agg')
          import runpy
          import sys
          try:
              import matplotlib
              matplotlib.use('Agg', force=True)
              import matplotlib.pyplot as plt
              plt.show = lambda *a, **k: None
          except Exception:
              pass
          try:
              import vedo
              _v = vedo.Plotter.show
              vedo.Plotter.show = lambda self, *a, **k: _v(self, *a, **dict(k, interactive=False))
          except Exception:
              pass
          try:
              import plotly.basedatatypes as _p
              _p.BaseFigure.show = lambda self, *a, **k: None
          except Exception:
              pass
          runpy.run_path(sys.argv[1], run_name='__main__')
          '''

          env = dict(os.environ, MPLBACKEND="Agg", QT_QPA_PLATFORM="offscreen")
          rc_total = 0
          for rel in EXAMPLES:
              name = os.path.basename(rel)
              print("::group::example " + name)
              try:
                  rc = subprocess.run(
                      [sys.executable, "-c", SHIM, rel], env=env, timeout=900
                  ).returncode
              except subprocess.TimeoutExpired:
                  rc = 124
              if rc == 0:
                  print("PASS " + name)
              else:
                  print("::error::example %s failed (exit %d)" % (name, rc))
                  rc_total = 1
              print("::endgroup::")
          sys.exit(rc_total)
          PY
          python _ci_run_examples.py
