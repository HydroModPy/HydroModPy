name: Weekly / Install

# Weekly install check of the default branch. It builds the package, installs the
# wheel and the plain source tree on each Python, and runs `hmp doctor`. Linux
# x86_64 is the supported platform. macOS and Windows are best effort until their
# CI is green, so their jobs report but never block a release.
#
# GitHub only enables `schedule` and the "Run workflow" button when the file is on
# the default branch.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip:
    name: pip-${{ matrix.method }} ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        method: [wheel, source]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (${{ matrix.method }})
        run: |
          python -m pip install --upgrade pip build
          if [ "${{ matrix.method }}" = "wheel" ]; then
            python -m build --wheel
            pip install dist/*.whl
          else
            pip install .
          fi

      - name: Import and doctor
        run: |
          cd "$RUNNER_TEMP"
          python -c "import hydromodpy; print('import OK', hydromodpy.__version__)"
          hmp doctor --format json
