# Example mesh-only launcher config.
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_mesh_catchment_example.toml

base_config = "config_mesh_catchment_common.toml"

[mesh_catchment]
# Meshing driver for conformity targets.
# - "rivers_only"   : river-trace conformal meshing
# - "geology_only"  : geology-interface conformal meshing
# - "geology_rivers": river + geology conformity
constraints_mode = "geology_rivers"
# Optional:
# output_mesh = "outputs/mesh_catchment_example.msh"
# output_summary_json = "outputs/mesh_catchment_example_summary.json"
output_figure = "C:/results/HydromodPy/mesh_catchment_nancon/results_stable/mesh/gmsh/mesh_catchment_nancon_overview.png"
show_plot = false

[mesh_catchment.rivers]
source = "domain_geographic"
clip_to_domain = true
min_segment_length = 0.0
snap_tolerance = 0.0

[mesh_catchment.geology]
id = "field_geology"
cell_samples_per_axis = 8

[mesh_catchment.geology.source]
# Use the France-wide geology source, then clip locally on the current
# catchment box-buffer domain.
path = "../../data/France/geology/GEO1M.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "../../data/Brittany/dem/regional_dem_full.tif"
all_touched = false

[mesh_catchment.geology.landsea]
enabled = false
sea_value = 0
override_code = "1"

[mesh_catchment.hydraulic_properties.conductivity]
# Demonstration geology -> K mapping for bundle export.
# Values come from `geology_K_dummy_demo.csv` and are already in m/s.
values_source = "csv"
values_csv_file = "../../data/France/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
unit = "m/s"

[mesh_catchment.domain]
# Effective meshing domain resolved at runtime from the current catchment
# workflow: bounding box of the delineated watershed plus geographic buffer.
kind = "geographic_box_buffer"

# Optional scope to limit where geology/rivers interfaces are generated.
# Omit this block to keep interfaces on the full support domain above.
# Typical choices:
# - "geographic_watershed"     : strict catchment polygon
# - "geographic_watershed_box" : watershed bounding box before extra buffer
#
# [mesh_catchment.interface_scope]
# kind = "geographic_watershed"

# Optional scope to limit where interface refinement is applied.
# When omitted, refinement follows `interface_scope` when present, otherwise the
# full support domain. This scope is always clipped to the effective
# `interface_scope`, so it cannot enlarge the refinement area beyond it.
#
# Example:
# - keep interfaces on `geographic_watershed_box`
# - refine only on `geographic_watershed`
#
# [mesh_catchment.refinement_scope]
# kind = "geographic_watershed"

[mesh_catchment.zone_meshing]
algorithm = "delaunay"
# Coarser setup to target about 3x fewer cells than the previous example.
global_size = 680.0
min_size = 340.0
max_size = 1080.0
simplify_tolerance = 0.0
heal_tolerance = 0.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 250.0
interface_distance = 610.0
interface_sampling = 96
