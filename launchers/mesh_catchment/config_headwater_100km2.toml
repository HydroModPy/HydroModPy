# Example batch mesh-catchment launcher config.
# Paired preprocess config:
#   hydromodpy_annex/preprocess/catchment_identification_scan/config_headwater_100km2.toml
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_headwater_100km2.toml
#
# Inherits the shared batch DEM, geology source, conductivity demo mapping,
# output naming, and the default profile where only rivers and geology
# constrain the mesh.

base_config = "config_batch_common.toml"

[workspace]
# Base prefix used to name one catchment folder per outlet_id.
project_root = "~/HydroModPy/mesh_headwater_100km2"

[mesh_catchment_batch]
outlets_table_path = "~/HydroModPy/catchment_identification_scan/headwater_100km2/exutoires_headwater_100km2.csv"
# Run all outlets found in the preprocess table.
# selected_outlet_ids = [34, 28]

# Do not declare `interface_scope`: clipping geology/rivers on an intermediate
# scope would materialize that scope in the mesh. Keep only a refinement scope
# so small cells stay focused on the catchment.
[mesh_catchment.refinement_scope]
kind = "geographic_watershed"
