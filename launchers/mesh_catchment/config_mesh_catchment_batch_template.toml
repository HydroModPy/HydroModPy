# Auto-generated mesh-catchment launcher template.
# Regenerate with:
#   python -m launchers mesh-catchment template --batch --profile user

# Shared launcher bootstrap. Override this if your project uses another common base.
base_config = "config_mesh_catchment_common.toml"
# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: mesh_catchment_batch, mesh_catchment
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Optional batch loop over several outlet coordinates.
# ----------------------------------------------------------------------

[mesh_catchment_batch]
# Enable batch mode.
# When false or omitted, the launcher runs one mono-catchment workflow only.
# Type: bool | Default: false
enabled = false

# CSV or vector table listing outlet points to process in batch mode.
# Type: string (optional) | Optional
outlets_table_path = ""

# Column storing the outlet identifier in the batch table.
# Type: string | Default: "outlet_id"
outlet_id_column = "outlet_id"

# Column storing the outlet X coordinate in the batch table.
# Type: string | Default: "x_outlet_m"
x_column = "x_outlet_m"

# Column storing the outlet Y coordinate in the batch table.
# Type: string | Default: "y_outlet_m"
y_column = "y_outlet_m"

# Batch selection strategy.
# Use 'all' to process every outlet in the table, or 'selected' to restrict the batch to the outlet ids listed in selected_outlet_ids.
# Type: string | Default: "all"
selection_mode = "all"

# Explicit subset of outlet ids to mesh when selection_mode='selected'.
# Type: list[str] | REQUIRED
selected_outlet_ids = []

# Pattern used to derive the child catchment workspace name for each outlet.
# It must contain the {outlet_id} token.
# Type: string | Default: "{catch_name}_outlet_{outlet_id}"
catch_name_pattern = "{catch_name}_outlet_{outlet_id}"

# If true, keep processing later outlets after one batch item fails.
# Type: bool | Default: false
continue_on_error = false


# Optional batch-specific filename patterns.
# Use them whenever the main [mesh_catchment] section contains fixed output paths, so each outlet writes distinct artifacts.

[mesh_catchment_batch.outputs]
# Relative filename pattern for each generated mesh, resolved inside the outlet-specific mesh output folder.
# Use tokens like {outlet_id} and {catch_name}.
# Type: string (optional) | Optional
mesh_filename = ""

# Relative filename pattern for each JSON mesh summary written in batch mode.
# Type: string (optional) | Optional
summary_filename = ""

# Relative filename pattern for each overview figure written in batch mode.
# Type: string (optional) | Optional
figure_filename = ""

# Manifest CSV path summarizing the status of all outlet runs.
# Relative paths are resolved from the base catchment project root.
# Type: string (optional) | Optional
manifest_csv = ""


# ----------------------------------------------------------------------
# Top-level launcher contract for one mono-catchment meshing run.
# ----------------------------------------------------------------------

[mesh_catchment]
# Meshing compliance target.
# 'geology_only' conforms the mesh to geology interfaces only, 'rivers_only' conforms the mesh to river traces only, and 'geology_rivers' enforces both sets of constraints in one mesh.
# Type: string | REQUIRED
constraints_mode = ""

# Optional `.msh` output path for the generated planar mesh.
# When omitted, the launcher writes the mesh to `results_stable/mesh/gmsh/mesh_catchment.msh` inside the active catchment workspace.
# Type: string (optional) | Optional
output_mesh = ""

# Optional JSON sidecar path for QA metrics, cleaned-input diagnostics, and summary metadata describing the generated mesh.
# When omitted, the launcher writes it next to the default mesh output.
# Type: string (optional) | Optional
output_summary_json = ""

# Optional overview figure path.
# Use it when you want a quick visual QA artifact showing the support domain, geology zones, river constraints, and final mesh footprint.
# Type: string (optional) | Optional
output_figure = ""

# If true, open the generated overview figure interactively at the end of the run.
# Keep it false for batch or headless execution.
# Type: bool | Default: false
show_plot = false


# River-constraint section used when constraints_mode includes rivers.
# The default behavior is to reuse the in-memory river trace already built by the geographic pipeline.

[mesh_catchment.rivers]
# Origin of the river constraints used to force mesh edges along the river network.
# Use 'domain_geographic' for the in-memory river trace produced by geographic preprocessing, or 'file' to reload a vector river dataset from disk.
# Type: string | Default: "domain_geographic"
source = "domain_geographic"

# Vector file path used only when source='file'.
# The path may be absolute or relative to the TOML location and should point to a line dataset describing the river centerlines to honor during meshing.
# Type: string (optional) | Optional
path = ""

# If true, clip the river trace to the effective meshing support before sending it to Gmsh.
# Keep this enabled in most workflows to avoid constraining the mesh with segments that lie outside the chosen domain or scope.
# Type: bool | Default: true
clip_to_domain = true

# Minimum retained river segment length, in projected metres after reprojection.
# Use this to discard tiny residual segments created by clipping or noisy hydrography that would only add mesh complexity without hydraulic meaning.
# Type: float | >= 0.0 | Default: 0.0
min_segment_length = 0.0

# Reserved snapping tolerance, in projected metres, for future cleanup of nearly coincident river vertices.
# The current workflow stores the value in the config contract but does not yet apply an additional snapping pass.
# Type: float | >= 0.0 | Default: 0.0
snap_tolerance = 0.0


# Optional geology support used when constraints_mode includes geology.
# This section defines which polygon source represents lithological zones and how those polygons should be interpreted before conformal meshing.

# [mesh_catchment.geology]
# Logical identifier of the geology field once loaded into HydroModPy.
# This id is reused by support discretization and by parameter mappings that target geology-based zonation.
# Type: string | Default: "field_geology"
# id = "field_geology"

# Optional polygon mask applied before meshing or field projection.
# Use it to crop a very large national dataset to one smaller study area before further processing.
# Type: string (optional) | Optional
# clip_polygon_path = ""

# Default sampling density used later when projecting geology fractions onto a target mesh.
# Higher values improve fraction estimates in narrow or irregular polygons at the cost of runtime.
# Type: int | Default: 8
# cell_samples_per_axis = 8


# Raw geology source definition.
# This section explains where the geology polygons or raster come from and how they should be interpreted.

# [mesh_catchment.geology.source]
# Path to the raw geology dataset used by the meshing workflow.
# It can point to a raster or polygon vector file depending on kind.
# Type: string | REQUIRED
# path = ""

# How to interpret the geology source.
# Use 'vector' for polygon geology, 'raster' for an already rasterized grid, or 'auto' to infer the type from the file.
# Type: string | Default: "auto"
# kind = "auto"

# Attribute column carrying the geology code for each polygon when kind='vector'.
# Type: string (optional) | Optional
# code_field = ""

# Reference raster used when vector geology must be rasterized.
# Its extent and resolution define the target encoding grid.
# Type: string (optional) | Optional
# reference_raster_path = ""

# Rasterization rule for vector geology.
# When true, any pixel touched by a polygon is filled; when false, only pixels whose center falls inside are filled.
# Type: bool | Default: false
# all_touched = false


# Optional coastal override applied after loading the base geology source.

# [mesh_catchment.geology.landsea]
# Enable the coastal override that replaces geology values over sea areas.
# Type: bool | Default: false
# enabled = false

# Mask raster or vector path used when landsea.enabled=true.
# The mask is interpreted so that sea pixels/features overwrite the base geology code.
# Type: string (optional) | Optional
# path = ""

# Numeric value in the mask that represents the sea class.
# It is compared against the loaded mask before applying override_code.
# Type: float | Default: 0.0
# sea_value = 0.0

# Geology code written into sea areas after applying the land/sea mask.
# Choose a stable code that is meaningful in downstream parameter tables.
# Type: string | Default: "1"
# override_code = "1"


# Effective support domain to mesh.
# The default `geographic_box_buffer` mode reuses the catchment bounding box plus geographic buffer prepared during delineation, which is usually the right support for mono-catchment meshing.

[mesh_catchment.domain]
# Reuse the buffered catchment box prepared by the geographic workflow.
# This is usually the most convenient support for catchment meshing because it preserves some context around the watershed.
# Type: string | Default: "geographic_box_buffer"
kind = "geographic_box_buffer"


# Optional sub-domain where geology and river interfaces are actually materialized.
# Use it to keep the support domain large enough for context while constraining interfaces only on a stricter inner area.

# [mesh_catchment.interface_scope]
# Use an explicit axis-aligned bounding box defined directly in the TOML.
# This is the most direct way to prescribe a synthetic rectangular support.
# Type: string | Default: "bbox"
# kind = "bbox"

# Bounding box coordinates ordered as [xmin, ymin, xmax, ymax] in the projected CRS used by the mesher.
# Type: list[float] | REQUIRED
# bbox = []


# Optional sub-domain where interface refinement is allowed to act.
# This scope is always clipped to the effective interface_scope and is useful when you want interfaces on a broad support but fine cells only near the core catchment.

# [mesh_catchment.refinement_scope]
# Use an explicit axis-aligned bounding box defined directly in the TOML.
# This is the most direct way to prescribe a synthetic rectangular support.
# Type: string | Default: "bbox"
# kind = "bbox"

# Bounding box coordinates ordered as [xmin, ymin, xmax, ymax] in the projected CRS used by the mesher.
# Type: list[float] | REQUIRED
# bbox = []


# Low-level Gmsh sizing and cleanup parameters controlling cell size, simplification, and interface refinement.
# Defaults are valid, but project examples typically override them to target a desired number of cells.

[mesh_catchment.zone_meshing]
# Planar Gmsh algorithm name.
# In practice the examples use 'delaunay', which is a robust default for irregular geological and river-constrained domains.
# Type: string | Default: "delaunay"
algorithm = "delaunay"

# Baseline target cell size in projected metres over the full support domain.
# Think of it as the coarse background resolution before local interface refinement is added.
# Type: float | Default: 250.0
global_size = 250.0

# Lower bound on local cell size in projected metres.
# Use it to prevent extreme refinement from generating very small cells in narrow features.
# Type: float (optional) | Optional
min_size = 0.0

# Upper bound on local cell size in projected metres.
# Use it when you want to cap the coarsening far from interfaces.
# Type: float (optional) | Optional
max_size = 0.0

# Geometry simplification tolerance, in projected metres, applied before meshing.
# Increase it only when the source polygons contain excessive vertex noise that does not carry hydrogeological meaning.
# Type: float | Default: 0.0
simplify_tolerance = 0.0

# Cleanup tolerance, in projected metres, used to repair tiny gaps or slivers between input polygons.
# Keep it near zero unless the source dataset is known to contain topology artifacts.
# Type: float | Default: 0.0
heal_tolerance = 0.0

# Minimum polygon area, in square metres, kept after cleaning.
# Use it to drop microscopic remnants that would otherwise create meaningless tiny mesh patches.
# Type: float | Default: 0.0
min_polygon_area = 0.0

# Enable a distance-based size field around geology or river interfaces.
# When false, the mesh uses only the global background size constraints.
# Type: bool | Default: false
refine_interfaces = false

# Target local size, in projected metres, close to constrained interfaces.
# When omitted and refine_interfaces=true, the schema derives a conservative default from global_size/min_size.
# Type: float (optional) | Optional
interface_size = 0.0

# Influence distance, in projected metres, over which the local interface refinement fades back to the background size.
# Larger values spread refinement farther away from the interface network.
# Type: float (optional) | Optional
interface_distance = 0.0

# Sampling density used to discretize interface-based distance fields.
# Higher values better capture long and sinuous interfaces but increase Gmsh preprocessing cost.
# Type: int | Default: 64
interface_sampling = 64

