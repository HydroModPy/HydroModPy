# Batch mesh-catchment launcher config for the preprocess run:
#   hydromodpy_annex/preprocess/catchment_identification_scan/config_1000km2.toml
#
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_1000km2.toml
#
# Inherits the shared batch DEM, geology source, conductivity demo mapping,
# output naming, and the default profile where only rivers and geology
# constrain the mesh.

base_config = "config_batch_common.toml"

[workspace]
# One output folder is created per selected outlet_id under this prefix.
project_root = "~/HydroModPy/mesh_1000km2"

[mesh_catchment_batch]
outlets_table_path = "~/HydroModPy/catchment_identification_scan/1000km2/exutoires_1000km2.csv"
# The preprocess summary reports 11 selected basins in this table.
# selected_outlet_ids = [34, 28]

# Do not declare `interface_scope`: clipping geology/rivers on an intermediate
# scope would materialize that scope in the mesh. Keep only a refinement scope
# so small cells stay focused on the catchment.
[mesh_catchment.refinement_scope]
kind = "geographic_watershed"
