# Batch mesh-catchment launcher config for the preprocess run:
#   hydromodpy_annex/preprocess/catchment_identification_scan/config_s3_100km2.toml
#
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_s3_100km2.toml
#
# Inherits the shared batch DEM, geology source, conductivity demo mapping,
# output naming, default meshing profile, and the launcher-default
# watershed-boundary internal constraint.

base_config = "config_batch_common.toml"

[workspace]
# One output folder is created per selected outlet_id under this prefix.
project_root = "C:/results/HydromodPy/mesh_s3_100km2"

[mesh_catchment_batch]
outlets_table_path = "C:/results/HydromodPy/catchment_identification_scan/s3_100km2/exutoires_s3_100km2.csv"
# This preprocess table contains 314 selected outlets.
# selected_outlet_ids = [148, 195]
