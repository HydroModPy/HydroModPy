# Example mesh-only launcher config with explicit support/interface/refinement scopes.
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_mesh_catchment_scoped_example.toml

base_config = "config_mesh_catchment_common.toml"

[workspace]
# Keep this example isolated from the default single-catchment outputs.
project_root = "C:/results/HydromodPy/mesh_catchment_nancon_scoped"

[geographic]
# Nancon lies outside the lightweight `regional_dem.tif` extent from the common
# config, so this example must use the wider 4x DEM.
dem_init_path = "../../examples/data/dem/regional_dem_4x.tif"

[mesh_catchment]
constraints_mode = "geology_rivers"
# geographic_outputs_mode = "cleanup"
output_figure = "C:/results/HydromodPy/mesh_catchment_nancon_scoped/results_stable/mesh/mesh_catchment_nancon_scoped_overview.png"
show_plot = false

[mesh_catchment.rivers]
source = "domain_geographic"
clip_to_domain = true
min_segment_length = 0.0
snap_tolerance = 0.0

[mesh_catchment.geology]
id = "field_geology"
cell_samples_per_axis = 8

[mesh_catchment.geology.source]
# Use the France-wide geology source, then clip locally on the current
# catchment support.
path = "../../examples/data/geology/GEO1M.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "../../examples/data/dem/regional_dem_4x.tif"
all_touched = false

[mesh_catchment.geology.landsea]
enabled = false
sea_value = 0
override_code = "1"

[mesh_catchment.hydraulic_properties.conductivity]
# Demonstration geology -> K mapping for bundle export.
# Values come from `geology_K_dummy_demo.csv` and are already in m/s.
values_source = "csv"
values_csv_file = "../../examples/data/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
unit = "m/s"

[mesh_catchment.domain]
# Support domain for the mesh: watershed bounding box plus configured buffer.
kind = "geographic_box_buffer"

[mesh_catchment.interface_scope]
# Generate geology and river interfaces only inside the watershed-box support.
kind = "geographic_watershed_box"

[mesh_catchment.refinement_scope]
# Refine only inside the strict watershed polygon.
kind = "geographic_watershed"

[mesh_catchment.zone_meshing]
algorithm = "delaunay"
global_size = 680.0
min_size = 340.0
max_size = 1080.0
simplify_tolerance = 0.0
heal_tolerance = 0.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 250.0
interface_distance = 610.0
interface_sampling = 96
