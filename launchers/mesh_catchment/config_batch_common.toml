# Shared overlay for bundled batch mesh-catchment scenarios.
#
# Batch configs inherit the mono-catchment bootstrap from config_common.toml
# and only need to override:
# - [workspace].project_root
# - [mesh_catchment_batch].outlets_table_path
# - optional selected_outlet_ids comments per scenario

base_config = "config_common.toml"

[geographic]
# Batch scenarios rely on the wider Armorican massif DEM covering all outlets.
dem_init_path = "../../examples/data/dem/DEM_armorican_massif.tif"

[mesh_catchment_batch]
enabled = true
continue_on_error = true

[mesh_catchment_batch.outputs]
mesh_filename = "mesh_catchment_outlet_{outlet_id}.msh"
summary_filename = "mesh_catchment_outlet_{outlet_id}_summary.json"
figure_filename = "mesh_catchment_outlet_{outlet_id}.png"
manifest_csv = "batch/mesh_catchment_batch_manifest.csv"

[mesh_catchment.geology.source]
# Keep geology rasterization aligned with the batch DEM support.
reference_raster_path = "../../examples/data/dem/DEM_armorican_massif.tif"
