# Example mesh-only launcher config.
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_example.toml
#
# Inherits the shared Naizin DEM, geology source, conductivity demo mapping,
# default meshing profile, and the launcher-default internal
# watershed-boundary constraint.

base_config = "config_common.toml"

[mesh_catchment]
# Optional:
# output_mesh = "outputs/mesh_catchment_example.msh"
# output_summary_json = "outputs/mesh_catchment_example_summary.json"
# geographic_outputs_mode = "cleanup"
# To disable the default internal catchment-boundary constraint:
# [mesh_catchment.watershed_boundary]
# enabled = false
# To keep the boundary but disable its automatic smoothing:
# [mesh_catchment.watershed_boundary.smoothing]
# enabled = false
output_figure = "C:/results/HydromodPy/mesh_catchment_nancon/mesh_catchment_nancon_overview.png"

# Optional scope to limit where geology/rivers interfaces are generated.
# Omit this block to keep interfaces on the full support domain inherited from
# config_common.toml.
# Typical choices:
# - "geographic_watershed"     : strict catchment polygon
# - "geographic_watershed_box" : watershed bounding box before extra buffer
#
# [mesh_catchment.interface_scope]
# kind = "geographic_watershed"

# Optional scope to limit where interface refinement is applied.
# When omitted, refinement follows `interface_scope` when present, otherwise the
# full support domain. This scope is always clipped to the effective
# `interface_scope`, so it cannot enlarge the refinement area beyond it.
#
# Example:
# - keep interfaces on `geographic_watershed_box`
# - refine only on `geographic_watershed`
#
# [mesh_catchment.refinement_scope]
# kind = "geographic_watershed"
