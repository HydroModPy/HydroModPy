# Example mesh-only launcher config.
# Run with:
#   python -m launchers mesh-catchment run launchers/mesh_catchment/config_example.toml
#
# Inherits the shared Naizin DEM, geology source, conductivity demo mapping,
# and default meshing profile with no internal watershed-boundary constraint.

base_config = "config_common.toml"

[mesh_catchment]
# Optional:
# output_mesh = "outputs/mesh_catchment_example.msh"
# output_summary_json = "outputs/mesh_catchment_example_summary.json"
# geographic_outputs_mode = "cleanup"
# To re-enable the internal catchment-boundary constraint:
# [mesh_catchment.watershed_boundary]
# enabled = true
# To keep that boundary raw, without smoothing:
# [mesh_catchment.watershed_boundary.smoothing]
# enabled = false
output_figure = "~/HydroModPy/mesh_catchment_nancon/mesh_catchment_nancon_overview.png"

# Do not declare `interface_scope`: clipping geology/rivers on an intermediate
# scope would materialize that scope in the mesh. Keep only a refinement scope
# so small cells stay focused on the catchment while the outer support can
# remain coarser.
[mesh_catchment.refinement_scope]
kind = "geographic_watershed"
