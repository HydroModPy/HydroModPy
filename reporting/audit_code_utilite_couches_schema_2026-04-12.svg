<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
    .label { font: 700 18px Arial, sans-serif; fill: #111827; }
    .text { font: 400 15px Arial, sans-serif; fill: #111827; }
    .small { font: 400 13px Arial, sans-serif; fill: #374151; }
    .box { stroke: #334155; stroke-width: 2; rx: 8; ry: 8; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>

  <text x="60" y="60" class="title">Audit des couches - lecture simple</text>
  <text x="60" y="88" class="subtitle">A gauche: etat percu aujourd'hui. A droite: organisation cible plus lisible.</text>

  <text x="180" y="135" class="label">Aujourd'hui</text>
  <text x="900" y="135" class="label">Cible</text>

  <rect x="60" y="160" width="540" height="660" fill="#ffffff" class="box"/>
  <rect x="800" y="160" width="540" height="660" fill="#ffffff" class="box"/>

  <rect x="120" y="210" width="420" height="90" fill="#fde68a" class="box"/>
  <text x="145" y="245" class="label">Surface publique melangee</text>
  <text x="145" y="272" class="text">`hydromodpy` + `launchers` + compat + legacy</text>

  <rect x="120" y="340" width="420" height="110" fill="#bfdbfe" class="box"/>
  <text x="145" y="375" class="label">Noyau utile</text>
  <text x="145" y="402" class="text">`process`, coeur `solver`, coeur calibration</text>
  <text x="145" y="425" class="small">Le moteur existe bien, mais il est entoure de couches trop visibles.</text>

  <rect x="120" y="490" width="420" height="110" fill="#fecaca" class="box"/>
  <text x="145" y="525" class="label">Workflows caches sous `launchers`</text>
  <text x="145" y="552" class="text">simulation, calibration, method comparison</text>
  <text x="145" y="575" class="small">Ils font plus que lancer: ils preparent et pilotent des runs.</text>

  <rect x="120" y="640" width="200" height="120" fill="#ddd6fe" class="box"/>
  <text x="145" y="675" class="label">Legacy</text>
  <text x="145" y="702" class="text">config, modeling,</text>
  <text x="145" y="724" class="text">watershed</text>

  <rect x="340" y="640" width="200" height="120" fill="#bbf7d0" class="box"/>
  <text x="365" y="675" class="label">I/O + Display</text>
  <text x="365" y="702" class="text">loaders, bundles,</text>
  <text x="365" y="724" class="text">plots, viewers</text>

  <rect x="860" y="210" width="420" height="80" fill="#fde68a" class="box"/>
  <text x="885" y="245" class="label">API publique courte</text>
  <text x="885" y="270" class="text">Quelques imports canoniques dans `hydromodpy`</text>

  <rect x="860" y="330" width="420" height="90" fill="#fecaca" class="box"/>
  <text x="885" y="365" class="label">Workflows explicites</text>
  <text x="885" y="392" class="text">`hydromodpy.workflows.simulation`</text>
  <text x="885" y="412" class="text">`hydromodpy.workflows.calibration`, etc.</text>

  <rect x="860" y="460" width="420" height="110" fill="#bfdbfe" class="box"/>
  <text x="885" y="495" class="label">Noyau clairement identifiable</text>
  <text x="885" y="522" class="text">`process`, `solver`, `spatial`,</text>
  <text x="885" y="544" class="text">`analysis.calibration.core`</text>

  <rect x="860" y="610" width="200" height="120" fill="#bbf7d0" class="box"/>
  <text x="885" y="645" class="label">I/O</text>
  <text x="885" y="672" class="text">config, workspace,</text>
  <text x="885" y="694" class="text">readers, writers</text>

  <rect x="1080" y="610" width="200" height="120" fill="#c7d2fe" class="box"/>
  <text x="1105" y="645" class="label">Display</text>
  <text x="1105" y="672" class="text">postprocess,</text>
  <text x="1105" y="694" class="text">plots, reporting</text>

  <rect x="860" y="760" width="200" height="60" fill="#ddd6fe" class="box"/>
  <text x="885" y="798" class="label">Compat / Legacy explicite</text>

  <rect x="1080" y="760" width="200" height="60" fill="#e5e7eb" class="box"/>
  <text x="1110" y="798" class="label">Support hors coeur</text>

  <line x1="330" y1="300" x2="330" y2="336" class="arrow"/>
  <line x1="330" y1="450" x2="330" y2="486" class="arrow"/>
  <line x1="330" y1="600" x2="330" y2="636" class="arrow"/>

  <line x1="1070" y1="290" x2="1070" y2="326" class="arrow"/>
  <line x1="1070" y1="420" x2="1070" y2="456" class="arrow"/>
  <line x1="1070" y1="570" x2="1070" y2="606" class="arrow"/>
  <line x1="960" y1="730" x2="960" y2="756" class="arrow"/>

  <line x1="600" y1="380" x2="800" y2="380" class="arrow"/>
  <line x1="600" y1="545" x2="800" y2="375" class="arrow"/>
  <line x1="600" y1="700" x2="800" y2="790" class="arrow"/>
  <line x1="600" y1="700" x2="800" y2="645" class="arrow"/>

  <text x="610" y="360" class="small">clarifier</text>
  <text x="610" y="525" class="small">renommer / deplacer</text>
  <text x="610" y="685" class="small">isoler</text>
</svg>
