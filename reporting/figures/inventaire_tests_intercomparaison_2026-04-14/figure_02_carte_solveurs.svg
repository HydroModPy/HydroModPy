<svg viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-map-title fig-map-desc">
  <title id="fig-map-title">Carte des solveurs et des relations de comparaison</title>
  <desc id="fig-map-desc">Schema reliant les solveurs MODFLOW et Boussinesq, avec mise en evidence des comparaisons strictes PETSc et des scripts multi-solveurs.</desc>
  <defs>
    <marker id="arrow-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60707d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="370" rx="18" fill="#fffdf9"/>
  <text x="30" y="36" fill="#173242" font-size="23" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Qui est compare a qui ?</text>
  <text x="30" y="58" fill="#5a6874" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Deux grandes familles coexistent : la ligne MODFLOW et la ligne Boussinesq.</text>

  <rect x="34" y="84" width="318" height="240" rx="18" fill="#eef5fb" stroke="#d5e6f3"/>
  <text x="54" y="112" fill="#1f4660" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Famille MODFLOW</text>
  <rect x="58" y="132" width="120" height="46" rx="12" fill="#3b7ea1"/>
  <text x="118" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">MODFLOW-NWT</text>
  <rect x="206" y="132" width="110" height="46" rx="12" fill="#2f6685"/>
  <text x="261" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">MODFLOW 6</text>
  <rect x="118" y="218" width="140" height="52" rx="12" fill="#7ea5c0"/>
  <text x="188" y="244" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">modflow6</text>
  <text x="188" y="262" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Segoe UI, Aptos, sans-serif">irregular_tri</text>
  <path d="M178 154 L206 154" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
  <path d="M261 180 L212 214" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
  <text x="58" y="298" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">Comparaisons fortes : <tspan font-weight="700">NWT vs MF6</tspan>,</text>
  <text x="58" y="316" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">puis <tspan font-weight="700">MF6 structure vs MF6 triangulaire</tspan>.</text>

  <rect x="548" y="84" width="318" height="240" rx="18" fill="#eef7f2" stroke="#d6e8df"/>
  <text x="568" y="112" fill="#114b48" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Famille Boussinesq</text>
  <rect x="572" y="132" width="130" height="46" rx="12" fill="#2c7a67"/>
  <text x="637" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">boussinesq</text>
  <rect x="724" y="132" width="118" height="46" rx="12" fill="#58a087"/>
  <text x="783" y="160" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">scipy_sparse</text>
  <rect x="566" y="218" width="128" height="52" rx="12" fill="#1d6f6b"/>
  <text x="630" y="246" text-anchor="middle" fill="#ffffff" font-size="15" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">petsc_partition</text>
  <rect x="716" y="218" width="118" height="52" rx="12" fill="#114b48"/>
  <text x="775" y="246" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">petsc</text>
  <path d="M637 178 L630 214" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
  <path d="M637 178 L775 214" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
  <text x="568" y="298" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">Comparaison la plus stricte : <tspan font-weight="700">petsc_partition vs petsc</tspan>.</text>
  <text x="568" y="316" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">Les autres variantes servent surtout aux campagnes et investigations.</text>

  <rect x="382" y="132" width="138" height="144" rx="18" fill="#fbf0d8" stroke="#eed8ab"/>
  <text x="451" y="158" text-anchor="middle" fill="#7d5512" font-size="17" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Zone de rencontre</text>
  <text x="451" y="184" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">cas simples</text>
  <text x="451" y="202" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">cas transitoires</text>
  <text x="451" y="220" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">meme maillage ou non</text>
  <text x="451" y="238" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">observables et metriques</text>
  <text x="451" y="256" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">pairwise solver-a-solver</text>

  <path d="M352 204 L382 204" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
  <path d="M520 204 L548 204" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-a)"/>
</svg>
