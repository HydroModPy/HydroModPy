<svg viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-ladder-title fig-ladder-desc">
  <title id="fig-ladder-title">Niveaux de couverture de l'intercomparaison de solveurs</title>
  <desc id="fig-ladder-desc">Schema en quatre niveaux montrant la difference entre validation pytest stricte, campagnes, infrastructure et artefacts.</desc>
  <rect x="0" y="0" width="920" height="340" rx="18" fill="#fffdf9"/>
  <text x="36" y="38" fill="#173242" font-size="24" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Ou se situe la vraie validation solveur-a-solveur ?</text>
  <text x="36" y="62" fill="#5a6874" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Le depot couvre plusieurs niveaux de maturite. Le niveau A est le plus robuste scientifiquement.</text>

  <circle cx="52" cy="102" r="20" fill="#1d6f6b"/>
  <text x="52" y="108" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">A</text>
  <rect x="84" y="78" width="776" height="48" rx="14" fill="#dcefea" stroke="#c7dfd8"/>
  <text x="104" y="99" fill="#114b48" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Validation scientifique pytest stricte</text>
  <text x="104" y="118" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Principalement : <tspan font-weight="700">petsc_partition vs petsc</tspan> sur des cas numeriques cibles avec assertions de convergence et de signature hydrologique.</text>

  <circle cx="52" cy="162" r="20" fill="#3b7ea1"/>
  <text x="52" y="168" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">B</text>
  <rect x="84" y="138" width="776" height="48" rx="14" fill="#e7f0f7" stroke="#d2e1ee"/>
  <text x="104" y="159" fill="#1f4660" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Scripts de campagne reproductibles</text>
  <text x="104" y="178" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Comparaisons <tspan font-weight="700">MODFLOW-NWT / MODFLOW 6 / Boussinesq</tspan> avec reference analytique, ecarts pairwise, figures et rapports exportes.</text>

  <circle cx="52" cy="222" r="20" fill="#9a6a18"/>
  <text x="52" y="228" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">C</text>
  <rect x="84" y="198" width="776" height="48" rx="14" fill="#f8ebcf" stroke="#ebdcb7"/>
  <text x="104" y="219" fill="#7d5512" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Infrastructure generique d'intercomparaison</text>
  <text x="104" y="238" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Le moteur <tspan font-weight="700">launchers/method_comparison</tspan> aligne les sorties, calcule les metriques et produit les tableaux de bord.</text>

  <circle cx="52" cy="282" r="20" fill="#6b7280"/>
  <text x="52" y="288" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">D</text>
  <rect x="84" y="258" width="776" height="48" rx="14" fill="#f2efe8" stroke="#e2dacd"/>
  <text x="104" y="279" fill="#4b5563" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Artefacts deja produits dans <tspan font-family="Cascadia Code, Consolas, monospace">out/</tspan></text>
  <text x="104" y="298" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Ils confirment que les campagnes ont deja tourne, mais ne remplacent pas a eux seuls une validation pytest stabilisee.</text>

  <path d="M885 292 L885 92" stroke="#9a6a18" stroke-width="4" stroke-linecap="round"/>
  <path d="M876 103 L885 88 L894 103" fill="none" stroke="#9a6a18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900" y="196" transform="rotate(-90 900 196)" text-anchor="middle" fill="#7d5512" font-size="13" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">plus de robustesse scientifique</text>
</svg>
