<svg viewBox="0 0 920 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-petsc-title fig-petsc-desc">
  <title id="fig-petsc-title">Schema de lecture de l'intercomparaison PETSc</title>
  <desc id="fig-petsc-desc">Schema montrant un meme cas partage entre deux fermetures PETSc et les assertions utilisees pour les comparer.</desc>
  <defs>
    <marker id="arrow-c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60707d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="340" rx="18" fill="#fffdf9"/>
  <text x="32" y="38" fill="#173242" font-size="24" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Ce que mesure exactement la comparaison PETSc</text>
  <text x="32" y="60" fill="#5a6874" font-size="14" font-family="Segoe UI, Aptos, sans-serif">Il ne s'agit pas d'opposer deux codes complets, mais deux formulations numeriques sur un meme moteur Boussinesq.</text>

  <rect x="38" y="110" width="210" height="124" rx="18" fill="#f8ebcf" stroke="#eed8ab"/>
  <text x="143" y="140" text-anchor="middle" fill="#7d5512" font-size="19" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Entree commune</text>
  <text x="143" y="168" text-anchor="middle" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">meme cas</text>
  <text x="143" y="188" text-anchor="middle" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">meme maillage</text>
  <text x="143" y="208" text-anchor="middle" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">meme forcage</text>

  <rect x="318" y="96" width="220" height="138" rx="18" fill="#eef7f2" stroke="#d6e8df"/>
  <text x="428" y="126" text-anchor="middle" fill="#114b48" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">petsc_partition</text>
  <text x="428" y="154" text-anchor="middle" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">regularized_partition</text>
  <text x="428" y="176" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">activation lisse du debordement</text>
  <text x="428" y="194" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">souvent actif plus longtemps</text>
  <text x="428" y="212" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">signature hydrologique propre</text>

  <rect x="584" y="96" width="220" height="138" rx="18" fill="#e7f0f7" stroke="#d2e1ee"/>
  <text x="694" y="126" text-anchor="middle" fill="#1f4660" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">petsc</text>
  <text x="694" y="154" text-anchor="middle" fill="#274350" font-size="14" font-family="Segoe UI, Aptos, sans-serif">complementarity</text>
  <text x="694" y="176" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">ouverture / fermeture de fenetres</text>
  <text x="694" y="194" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">verifications de gap, rate, overlap</text>
  <text x="694" y="212" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">signature hydrologique differenciee</text>

  <rect x="318" y="260" width="486" height="50" rx="14" fill="#f4efe7" stroke="#e2d9ca"/>
  <text x="561" y="282" text-anchor="middle" fill="#173242" font-size="18" font-family="Segoe UI, Aptos, sans-serif" font-weight="700">Assertions communes et comparatives</text>
  <text x="561" y="300" text-anchor="middle" fill="#274350" font-size="13" font-family="Segoe UI, Aptos, sans-serif">convergence, residu final, cellules actives, debit de surface, temps d'apparition, transitions et complementarite</text>

  <path d="M248 164 L318 164" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-c)"/>
  <path d="M248 180 L584 180" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-c)"/>
  <path d="M428 234 L428 260" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-c)"/>
  <path d="M694 234 L694 260" stroke="#60707d" stroke-width="3" marker-end="url(#arrow-c)"/>
</svg>
