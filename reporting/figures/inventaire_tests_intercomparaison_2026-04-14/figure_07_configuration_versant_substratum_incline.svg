<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Configuration du versant a substratum incline</title>
  <desc id="desc">Schema d'un versant synthetique avec topographie inclinee a 12 degres et substratum incline a 10 degres, recharge transitoire, drainage de surface et comparaison entre maillage structure et triangulaire irregulier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6fb"/>
      <stop offset="100%" stop-color="#fbf5ea"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#cdb28d"/>
      <stop offset="100%" stop-color="#9b7a56"/>
    </linearGradient>
    <linearGradient id="sat" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8dc8ff"/>
      <stop offset="100%" stop-color="#427fb6"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d6f6b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="472" rx="24" fill="#fffdf9" stroke="#d9cfbf" stroke-width="2"/>

  <text x="60" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#173242">
    Versant a substratum incline
  </text>
  <text x="60" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5a6874">
    Cas sensible au couple solveur + support geometrique
  </text>

  <path d="M120 260 L930 88 L930 390 L120 390 Z" fill="url(#rock)" stroke="#8d6d49" stroke-width="2.5"/>
  <path d="M120 260 L930 88" fill="none" stroke="#455b66" stroke-width="5"/>
  <path d="M120 370 L930 229" fill="none" stroke="#6a4f37" stroke-width="5"/>
  <path d="M120 338 Q350 300 580 258 T930 182" fill="none" stroke="url(#sat)" stroke-width="6"/>

  <text x="100" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173242">Topographie 12 deg</text>
  <text x="102" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173242">Substratum 10 deg</text>

  <g stroke="#1d6f6b" stroke-width="3" marker-end="url(#arrow2)">
    <line x1="210" y1="132" x2="210" y2="226"/>
    <line x1="330" y1="108" x2="330" y2="201"/>
    <line x1="450" y1="86" x2="450" y2="175"/>
    <line x1="570" y1="72" x2="570" y2="151"/>
  </g>
  <text x="168" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#114b48">
    Recharge transitoire 15 j
  </text>

  <line x1="930" y1="88" x2="930" y2="390" stroke="#1d6f6b" stroke-width="5"/>
  <text x="950" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#114b48">Exutoire est unique</text>
  <text x="950" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#114b48">charge imposee</text>

  <g transform="translate(740 280)">
    <rect x="0" y="0" width="380" height="150" rx="18" fill="#f7f1e6" stroke="#d9cfbf"/>
    <text x="22" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173242">
      Supports compares
    </text>
    <rect x="22" y="48" width="138" height="78" rx="10" fill="#fffdf9" stroke="#c8bbaa"/>
    <line x1="22" y1="74" x2="160" y2="74" stroke="#c8bbaa"/>
    <line x1="22" y1="100" x2="160" y2="100" stroke="#c8bbaa"/>
    <line x1="68" y1="48" x2="68" y2="126" stroke="#c8bbaa"/>
    <line x1="114" y1="48" x2="114" y2="126" stroke="#c8bbaa"/>
    <text x="34" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a6874">structure 50 x 6</text>
    <polygon points="220,48 338,48 280,126" fill="#fffdf9" stroke="#c8bbaa"/>
    <line x1="249" y1="87" x2="309" y2="87" stroke="#c8bbaa"/>
    <line x1="280" y1="48" x2="249" y2="87" stroke="#c8bbaa"/>
    <line x1="280" y1="48" x2="309" y2="87" stroke="#c8bbaa"/>
    <line x1="280" y1="126" x2="249" y2="87" stroke="#c8bbaa"/>
    <line x1="280" y1="126" x2="309" y2="87" stroke="#c8bbaa"/>
    <text x="204" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a6874">triangles explicites</text>
  </g>

  <text x="60" y="458" font-family="Consolas, monospace" font-size="16" fill="#33404b">
    Geometrie type : 100 m x 12 m, drainage de surface, k = 2e-5 m/s, stockage specifique 1e-10 m-1
  </text>
</svg>
