# ----------------------------------------------------------------------
# Domain-only case extracted from examples/example12/config.toml
# ----------------------------------------------------------------------

[workspace]
catch_name = "example12_domain_case"
out_dir_path = "../../../examples/results"
data_path = "../../../examples/example12/data"

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "../../../data/Brittany/dem/regional dem.tif"
x_outlet = 265611.933
y_outlet = 6784182.776
snap_dist = 50
buff_area = 20.0
crs_project = "EPSG:2154"
dem_correc_type = "breach"

[domain]
zone_ids = ["geology"]

[domain.depth_model]
type = "constant_thickness"
thickness = 50.0

[data]
types = ["geology"]

[data.geology]
id = "field_geology"
geo_path = "../../../data/France/geology"
types_obs = "GEO1M.shp"
fields_obs = "CODE_LEG"
cell_samples_per_axis = 8
