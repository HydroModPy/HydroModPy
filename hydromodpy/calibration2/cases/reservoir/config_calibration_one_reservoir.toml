[chronicle]
# Synthetic forcing and "true" model parameters for one-reservoir calibration.
n_days = 365
start_year = 2000
target_annual_precip_mm = 800.0
precip_seed = 42
runoff_coeff = 0.15
losses_mm_day = 1.5
losses_months = [4, 5, 6, 7, 8, 9]

# True parameters for model_name = "one_reservoir"
capacity_mm_true = 10.0
k_per_day_true = 0.04
s0_mm = 0.0

error_fraction = 0.05
error_seed = 12345
# Numerical backend for direct model simulation:
# - "analytic": exact discrete update (default, faster)
# - "ode": scipy solve_ivp integration
solver_backend = "analytic"

[calibration]
# One-reservoir case (2 calibrated parameters: C, k).
model_name = "one_reservoir"
objective_metric = "kge"
global_method = "simplex"

[bounds]
C = [2.0, 30.0]
k = [0.005, 0.20]

[calibration_method.simplex]
max_iter = 800
xtol = 1.0e-10
ftol = 1.0e-10

[calibration_method.random_search]
n_samples = 1500
seed = 2026
log_scale_indices = []

[calibration_method.grid_search]
n_per_dim = 80
log_scale_indices = []

[calibration_method.nelder_mead]
max_iter = 800

[calibration_method.gp_mapping]
seed = 42
n_init = 100
n_refine = 3
batch_size = 20
n_candidates = 3000
kappa = 3.0
alpha = 1.0e-6
jitter = 1.0e-8
n_posterior_pool = 100000
n_posterior_samples = 10000
log_transform = true

[calibration_method.da_mh_gp]
n_init = 70
n_samples = 2500
burn_in = 500
thin = 2
proposal_scale = {C = 0.8, k = 0.01}
sigma_noise = 0.30
prior_mean = {C = 10.0, k = 0.04}
prior_std = {C = 4.0, k = 0.02}
retrain_interval = 20
full_mh_prob = 0.03
seed = 42

[output]
output_dir = "outputs"
show_plot = true
# In 2D (C, k), objective surface is enabled and shown in the figure.
show_objective_surface = true
objective_surface_n_evaluations = 500
objective_surface_seed = 42
# figure_name = "reservoir_calibration_one_reservoir.png"
