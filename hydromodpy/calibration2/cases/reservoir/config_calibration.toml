[chronicle]
# Synthetic forcing and "true" model parameters.
# This section controls how pseudo-observations are generated before calibration.
n_days = 365
start_year = 2000
target_annual_precip_mm = 800.0
precip_seed = 42
runoff_coeff = 0.15
losses_mm_day = 1.5
losses_months = [4, 5, 6, 7, 8, 9]

# True parameters for model_name = "one_reservoir"
# capacity_mm_true = 10.0
# k_per_day_true = 0.04
# s0_mm = 0.0

# True parameters for model_name = "two_reservoir"
a_true = 0.35
kq_days_true = 3.0
ks_days_true = 45.0
sq0_mm = 0.0
ss0_mm = 0.0

error_fraction = 0.05
error_seed = 12345

[calibration]
# Model choice: "one_reservoir" or "two_reservoir"
# This selects which model equations are used for both truth generation and
# calibration.
model_name = "two_reservoir"
# Objective metric: "nse", "nse_log", "kge", or "rmse"
# For method "da_mh_gp", use "rmse".
objective_metric = "kge"
# Method: "grid_search", "random_search", "nelder_mead", "simplex", "gp_mapping", or "da_mh_gp"
global_method = "da_mh_gp"

[bounds]
# Bounds must include all parameters of the selected model.
# - one_reservoir: C, k
# - two_reservoir: a, Kq, Ks
# Calibration explores only this box-constrained parameter space.
a = [0.05, 0.95]
Kq = [1.0, 10.0]
Ks = [15.0, 120.0]

[calibration_method.grid_search]
n_per_dim = 80
log_scale_indices = []

[calibration_method.random_search]
n_samples = 3000
seed = 2026
log_scale_indices = []

[calibration_method.nelder_mead]
max_iter = 1200

[calibration_method.simplex]
max_iter = 1500
xtol = 1.0e-10
ftol = 1.0e-10

[calibration_method.gp_mapping]
seed = 42
n_init = 120
n_refine = 3
batch_size = 25
n_candidates = 4000
kappa = 3.0
alpha = 1.0e-6
jitter = 1.0e-8
n_posterior_pool = 200000
n_posterior_samples = 20000
log_transform = true

[calibration_method.da_mh_gp]
# Initial expensive model evaluations used to build the first GP surrogate.
n_init = 70
# Number of MCMC iterations in the raw chain.
n_samples = 4500
# Number of first samples discarded before posterior extraction.
burn_in = 900
# Keep one sample every `thin` steps after burn-in.
thin = 2
# Per-parameter options can be given as explicit mappings:
# - one_reservoir: {C=..., k=...}
# - two_reservoir: {a=..., Kq=..., Ks=...}
# Random-walk proposal scales in native parameter units.
proposal_scale = {a = 0.05, Kq = 0.5, Ks = 5.0}
# Likelihood noise scale (RMSE-based likelihood in DA-MH).
# Larger values smooth posterior surface; smaller values make it sharper.
sigma_noise = 0.30
# Independent Normal prior mean per parameter.
prior_mean = {a = 0.35, Kq = 3.0, Ks = 45.0}
# Independent Normal prior standard deviation per parameter.
prior_std = {a = 0.20, Kq = 2.0, Ks = 20.0}
# Retrain GP surrogate every N newly accepted expensive evaluations.
retrain_interval = 30
# Probability of doing one full MH step (without delayed acceptance).
# Small non-zero values can improve chain mixing robustness.
full_mh_prob = 0.03
# Seed for reproducibility.
seed = 42

[output]
output_dir = "outputs"
show_plot = true
# Optional fixed figure name:
# figure_name = "reservoir_calibration.png"
