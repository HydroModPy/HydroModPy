# ----------------------------------------------------------------------
# Temporal-mesh demo scenarios extracted from tmesh_generation_demo.py
# ----------------------------------------------------------------------

[case]
output_summary_json = "outputs/tmesh_case_summary.json"
output_figures_dir = "outputs/figures"

[[case.scenarios]]
id = "steady_synthetic"
description = "Steady-state synthetic regular periods"
itmuni = "d"
sim_state = "steady"
genmtd = "synthetic_regular"
nper = 10
lenper = 1
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
firstpersteady = true
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0

[[case.scenarios]]
id = "transient_synthetic"
description = "Transient synthetic regular periods without initial steady period"
itmuni = "d"
sim_state = "transient"
genmtd = "synthetic_regular"
nper = 5
lenper = 3
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
firstpersteady = false
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0

[[case.scenarios]]
id = "transient_from_chron"
description = "Transient time steps computed from explicit chronicle dates"
itmuni = "d"
sim_state = "transient"
genmtd = "from_chron"
nper = 100
lenper = 3
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
firstpersteady = true
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0
