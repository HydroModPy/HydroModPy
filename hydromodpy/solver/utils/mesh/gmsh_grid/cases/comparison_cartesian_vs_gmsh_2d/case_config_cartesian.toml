[case]
cell_samples_per_axis = 8
depth = 0.0
strict_field_spatial_id_match = true
output_summary_json = "outputs/cartesian_summary.json"

[case.geology]
id = "field_geology"
cell_samples_per_axis = 8

[case.geology.source]
path = "../../../../../../../data/Brittany_small_test_example/geology/GEO1M_brittany.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "../../../cartesian_grid/examples/discretization/demo_top_bretagne_10km.tif"
all_touched = false

[case.geology.landsea]
enabled = false
sea_value = 0
override_code = "1"

[case.field_param.field]
id = "K"
kind = "heterogeneous"

[case.field_param.field_homogeneous]
value = 1e-6

[case.field_param.field_heterogeneous]
values_source = "csv"
values_csv_file = "../../../../../../../data/Brittany_small_test_example/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
field_spatial_id = "field_geology"

[case.field_param.field_vertical_profile]
mode = "none"

[case.sgrid]
sgrid_type = "structured"
genmtd_top = "filepath"
top_path = "../../../cartesian_grid/examples/discretization/demo_top_bretagne_10km.tif"
crs = "EPSG:2154"
plan_discretization_mode = "resample_to_shape"
nx = 21
ny = 21
nodata = -9999

genmtd_bot = "constant_thickness"
thick = 200.0

genmtd_lay = "decay"
nlay = 5
lay_decay = 2.0
