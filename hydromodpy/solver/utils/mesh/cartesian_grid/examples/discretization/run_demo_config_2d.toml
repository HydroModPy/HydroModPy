# Standalone SGrid + GeologyField + FieldParam discretization case.
#
# This config is self-contained:
# - geology settings are embedded under [case.geology]
# - field-param settings are embedded under [case.field_param.*]
# - sgrid settings are embedded under [case.sgrid]

[case]
# Optional run controls
# cell_samples_per_axis = 10
depth = 0.0
strict_field_spatial_id_match = true

# Optional outputs (relative to this file)
output_npy = "outputs/sgrid_fieldparam_values.npy"
output_summary_json = "outputs/sgrid_fieldparam_summary.json"

[case.geology]
id = "field_geology"
cell_samples_per_axis = 8

[case.geology.source]
path = "../../../../../../../data/Brittany_small_test_example/geology/GEO1M_brittany.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "demo_top_bretagne_10km.tif"
all_touched = false

[case.geology.landsea]
enabled = false
sea_value = 0
override_code = "1"

[case.field_param.field]
id = "K"
kind = "heterogeneous"

[case.field_param.field_homogeneous]
value = 1e-6

[case.field_param.field_heterogeneous]
values_source = "csv"
values_csv_file = "../../../../../../../data/Brittany_small_test_example/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
field_spatial_id = "field_geology"

[case.field_param.field_vertical_profile]
mode = "none"

[case.sgrid]
sgrid_type = "structured"
lenuni = "m"
genmtd_top = "filepath"
top_path = "demo_top_bretagne_10km.tif"
crs = "EPSG:2154"
plan_discretization_mode = "shape"
nx = 40
ny = 40
nodata = -9999

genmtd_bot = "constant_thickness"
thick = 200.0

genmtd_lay = "decay"
nlay = 5
lay_decay = 2.0
