# Dedicated 3D demo case for SGrid + GeologyField + FieldParam discretization.
#
# This config is independent from run_demo_config_2d.toml and is tuned for
# visualization of vertical exponential decay.

[case]
depth = 0.0
strict_field_spatial_id_match = true

# Optional outputs (relative to this file)
output_npy = "outputs/sgrid_fieldparam_values_3d_demo_plan.npy"
output_summary_json = "outputs/sgrid_fieldparam_summary_3d_demo.json"

[case.geology]
id = "field_geology"
cell_samples_per_axis = 8

[case.geology.source]
path = "../../../../../../../data/Brittany_small_test_example/geology/GEO1M_brittany.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "demo_top_bretagne_10km.tif"
all_touched = false

[case.geology.landsea]
enabled = false
sea_value = 0
override_code = "1"

[case.field_param.field]
id = "K"
kind = "heterogeneous"

[case.field_param.field_homogeneous]
value = 1e-6

[case.field_param.field_heterogeneous]
values_source = "csv"
values_csv_file = "../../../../../../../data/Brittany_small_test_example/geology/geology_K_dummy_demo.csv"
csv_key_column = "zone_key"
csv_value_column = "K_value"
field_spatial_id = "field_geology"

[case.field_param.field_vertical_profile]
mode = "exponential"
characteristic_depth = 45.0

[case.sgrid]
sgrid_type = "structured"
lenuni = "m"
genmtd_top = "filepath"
top_path = "demo_top_bretagne_10km.tif"
crs = "EPSG:2154"
plan_discretization_mode = "shape"
nx = 48
ny = 48
nodata = -9999

genmtd_bot = "constant_thickness"
thick = 180.0

genmtd_lay = "constant"
nlay = 24
