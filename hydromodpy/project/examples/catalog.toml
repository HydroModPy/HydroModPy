[[example]]
id = "10"
directory = "10_coupling_with_land_surface_model_pyhelp"
title = "Coupling with a land surface model on the Urse catchment"
summary = "The Urse catchment (Switzerland, EPSG:2056), 6.2 km² of Alpine grassland between 1800 and 3400 m. The land surface model PyHELP computed the recharge, a grid of daily percolation over 2021-2023 from the rain, the air temperature and the solar radiation, and `examples/data/recharge/recharge_pyhelp_urse.nc` holds that grid. This example models the groundwater flow it forces: steady state, MODFLOW 6, one layer 50 m thick, K of 3.1e-6 m/s, seepage at the ground surface. A second file searches K on the mapped stream network, with no discharge observation. A run takes about 40 s."
runtime = "about 40 s"
entry_config = "project.toml"

