[[example]]
id = "09"
directory = "09_transport_model_for_an_agricultural_catchment"
title = "Nitrate in the aquifer of an agricultural catchment"
summary = "The Kervidy catchment at Naizin (Morbihan), 5.0 km² of farmland cut out of a 25 m DEM, in a box of 134 by 165 cells. A synthetic drought year 2003 in 52 weekly stress periods: 2 mm/day of recharge in January, February, November and December, and none from March to October. The aquifer sits on a flat base at sea level, about 100 m under the valley, cut in ten layers that thicken with depth. K and Sy fall with depth, and every cell drains at the ground surface. The nitrate starts at 100 mg/L in the whole aquifer, the recharge brings 50 mg/L, and it decays with a mean life of two years. MODFLOW 6 solves the flow, its transport model GWT carries the nitrate and its particle tracking PRT gives the travel time of the water. A run takes about 20 minutes."
runtime = "about 20 minutes"
entry_config = "project.toml"

