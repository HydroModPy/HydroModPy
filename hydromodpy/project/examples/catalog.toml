[[example]]
id = "07"
directory = "07_analytical_solution_for_streamflow_recession"
title = "A hillslope that drains by recession, set against a closed-form solution"
summary = "A flat hillslope, 1000 m long and one 20 m cell wide, over a flat substratum at 0 m, with a stream on its west edge. A pulse of recharge of 33 mm/day fills the aquifer for 30 days, then 970 days without recharge empty it through the stream. The discharge of the falling limb is compared with the late-time solution of the non-linear Boussinesq equation. MODFLOW 6 solves the flow. A run takes about 15 s."
runtime = "about 15 s"
