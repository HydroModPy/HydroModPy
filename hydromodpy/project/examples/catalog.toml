[[example]]
id = "05"
directory = "05_piezometry_in_a_heterogeneous_coastal_aquifer"
title = "Piezometry in a heterogeneous coastal aquifer"
summary = "The coastal aquifer of Gouville-sur-Mer (Manche), a strip of 3.2 km² along the shore cut on a 25 m DEM, 39 by 134 cells. One year 2016 in daily stress periods, one layer down to a flat base at 20 m below sea level. The aquifer has two zones: a western strip along the shore with K = 18.5 m/day and Sy = 0.08, and an eastern one inland with K = 95 m/day and Sy = 0.45. The recharge changes every day and the sea level follows the tide. The 549 cells whose ground is at or below the highest sea level of the year are held at the sea level of the day, and every other cell drains at the ground. 1 January is solved in steady state under the mean recharge and the mean sea level. The simulated head is put next to the daily record of the piezometer BSS 01423X0044/F4, in the western strip. MODFLOW 6 solves the flow. A run takes about 40 s."
runtime = "about 40 s"
entry_config = "project.toml"

