# Piezometry station-set configuration
#
# DISCOVERY MODES (see run_piezometry_example.py for examples):
# 1) provide piezometer_ids in [selection] section
# 2) leave piezometer_ids empty [] to trigger automatic discovery with fallback
# 3) use mask_path to select piezometers by geographic mask
#
# DISCOVERY WITH FALLBACK (new feature):
# - PiezometerSet.discover_piezometer_ids(
#     bbox=(minx, miny, maxx, maxy),
#     center_point=(lon, lat),     # Optional: sort by distance
#     fallback_if_empty=True,      # NEW: if no piezometers in bbox, search beyond
#     max_ids=5
#   )
# - If zone is empty and fallback_if_empty=True, searches France-wide for closest ones
# - Automatically sorted by distance to center_point or mask centroid
#
# Supported combinations:
# 1) selection.mode = "stations" + source.mode = "api"
# 2) selection.mode = "mask"     + source.mode = "api"
# 3) selection.mode = "stations" + source.mode = "local"
# 4) selection.mode = "mask"     + source.mode = "local"
#
# Notes for local mode:
# - piezometer loading needs station CSV files in source.local_data_dir
# - mask loading requires local reference tables:
#   stations_info.csv (preferred) or metadata.csv with WGS84 coordinates

[piezometry]
# "level" (groundwater level), "depth" (depth to water table), or "both"
measurement = "both"
display = false
# Optional date filter:
date_start = "2024-01-01"
date_end = "2025-12-31"

[source]
# "api" or "local"
mode = "api"
# Used when source.mode = "local"
# local_data_dir = "exports"

[selection]
# "stations" or "mask"
mode = "mask"

# Used when selection.mode = "stations"
# Leave empty [] to trigger automatic discovery in run_piezometry_example.py
# Example fixed ID: ["03884X0021/TF1PR", "06932X0178/P10"]
# piezometer_ids = []

# Used when selection.mode = "mask"
# Example: mask_path = "../../data/France/dem/ALT_5M.tif"
# Testing with example12 geographic mask (no piezometers inside, triggers fallback)
# Path from HydroModPy/hydromodpy/data_managers/piezometry/ to examples/results/example12/
mask_path = "../../../examples/results/example12/results_stable/geographic/watershed.shp"

[output]
# Export loaded data again after loading (filtered subset):
enabled = true
path = "exports"
# "lite" -> station CSVs only
# "full" -> station CSVs + metadata/stations_info/missing_data_summary
export_mode = "lite"
