[intermittency_case]
intermittency_path = "../../../../examples/data/intermittency"
file_name = "regional onde stations.shp"
out_path = "outputs"

# "square_mask" creates an internal watershed polygon from center/window values.
# "existing_shp" uses watershed_shp directly.
watershed_mode = "square_mask"
watershed_shp = "../../../../examples_legacy/results/example12/results_stable/geographic/watershed.shp"
center_x = 265611.933
center_y = 6784182.776
window_km = "20 km"
mask_crs = "EPSG:2154"

# Case display controls.
save_overview = true
show_plot = false
overview_max_stations = 8
