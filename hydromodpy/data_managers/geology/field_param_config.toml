# Example field-parameter config for geology case.
#
# Goal:
# -----
# Map geology zone keys to one physical property value through FieldParam.
# This example uses CSV as value source (recommended for long correspondence
# tables).
#
# Usage:
#   from hydromodpy.field.core.field_param import FieldParam
#   p = FieldParam.from_toml("hydromodpy/data_managers/geology/field_param_config.toml")

[field]
id = "K"
kind = "heterogeneous"

[field_heterogeneous]
# values_source:
# - "inline": values are defined directly in TOML via `values = {...}`
# - "csv": values are loaded from a CSV file
values_source = "csv"

# Relative paths are resolved from this TOML file directory.
values_csv_file = "geology_property_values.csv"

# CSV columns:
# - zone key column must match geology `zone_key` values
# - numeric value column is the property value
# - optional extra columns (for readability) are allowed, for example:
#     geology_name
csv_key_column = "zone_key"
csv_value_column = "K_value"

# Must match `geology.id` in geology_config.toml.
field_spatial_id = "field_geology"
