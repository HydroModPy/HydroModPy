[chronicle]
# Synthetic "true" coarse-sand recession parameters.
# This section defines how pseudo-observations are generated before calibration.
Q0 = 0.35
K = 2.0e-4
Sy = 0.28
solution = "boussinesq"
A = 1.2e6
ag = 0.7
p = 0.346
n_points = 50
log_spacing = true
t_min_days = 0.1
error_fraction = 0.05
random_seed = 12345

[calibration]
# Objective metric: "nse", "nse_log", "kge", or "rmse"
# For method "da_mh_gp", use "rmse".
objective_metric = "rmse"
# Global method: "grid_search", "random_search", "nelder_mead", "simplex", "gp_mapping", or "da_mh_gp"
# This selects the optimization/sampling algorithm used by CalibrationEngine.
global_method = "da_mh_gp"

[bounds]
# Parameter bounds used during calibration.
# Bounds must include all model parameters (K and Sy).
# Calibration only explores this box-constrained parameter space.
K = [1.0e-5, 1.0e-3]
Sy = [0.20, 0.35]

[calibration_method.grid_search]
n_per_dim = [90, 90]
log_scale_indices = [0]

[calibration_method.random_search]
n_samples = 9000
seed = 2026
log_scale_indices = [0]

[calibration_method.nelder_mead]
max_iter = 1200

[calibration_method.simplex]
max_iter = 2500
xtol = 1.0e-10
ftol = 1.0e-10

[calibration_method.gp_mapping]
# Initial expensive evaluations used to train the first GP surrogate.
seed = 42
n_init = 120
# Adaptive UCB refinement budget.
n_refine = 3
batch_size = 25
n_candidates = 4000
kappa = 3.0
alpha = 1.0e-6
jitter = 1.0e-8
n_posterior_pool = 200000
n_posterior_samples = 20000
log_transform = true

[calibration_method.da_mh_gp]
# Initial expensive evaluations before MCMC starts.
n_init = 80
# Raw Markov-chain length.
n_samples = 4000
# Number of first samples discarded as warm-up.
burn_in = 800
# Keep one sample every `thin` iterations after burn-in.
thin = 4
# Per-parameter options can be given as explicit mappings {K=..., Sy=...}.
# Random-walk proposal scales in each parameter unit.
proposal_scale = {K = 1.6e-4, Sy = 0.08}
# RMSE likelihood noise scale. Smaller values make posterior sharper.
sigma_noise = 0.01
# Independent Normal prior mean for each calibrated parameter.
prior_mean = {K = 2.0e-4, Sy = 0.28}
# Independent Normal prior standard deviation for each parameter.
prior_std = {K = 2.0e-4, Sy = 0.06}
# Retrain GP surrogate every N newly accepted expensive evaluations.
retrain_interval = 100

[output]
output_dir = "outputs"
# Keep `true` to inspect figures interactively (blocking display).
show_plot = true
# Optional objective-cost surface panel (1D/2D only).
show_objective_surface = true
# Number of additional direct model evaluations used to approximate the
# objective surface drawn in the figure.
objective_surface_n_evaluations = 300
# RNG seed for objective-surface sampling.
objective_surface_seed = 42
# Optional fixed figure name. If omitted, a name based on metric/method is used.
# figure_name = "coarse_sand_calibration.png"
