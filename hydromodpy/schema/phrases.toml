fr = "Aucun score n'est enregistré pour ce run."

[method.score_coverage]
en = "The observations cover {share} of that window."
fr = "Les observations couvrent {share} de cette fenêtre."

[method.role_calibration]
en = "calibration"
fr = "calage"

[method.role_validation]
