# The phrase of each code a check of a configuration gives, in English and in French.
#
# A diagnostic carries its code, its path and what the validator said about the
# case. The command line and a front end write this phrase beside it, in the
# language of the reader. A key of [check] is a code: the set is closed, and a
# test holds every code a check gives to one row here.

[check.to_fill]
en = "This key is required and not written yet. The checks that read this key with other sections run once it is filled."
fr = "Cette clé est requise et pas encore écrite. Les contrôles qui la lisent avec d'autres sections tournent une fois qu'elle est remplie."

[check.unknown_key]
en = "This key is not one the configuration reads. Check its spelling and the table it sits in."
fr = "Cette clé n'est pas lue par la configuration. Vérifiez son orthographe et la table où elle se trouve."

[check.retired_section]
en = "This section is no longer read. The detail says what replaces it."
fr = "Cette section n'est plus lue. Le détail dit ce qui la remplace."

[check.retired_key]
en = "This key or this form is refused since a release. The detail says what to write instead."
fr = "Cette clé ou cette forme est refusée depuis une version. Le détail dit quoi écrire à la place."

[check.old_key]
en = "This key is written under an older name or form. It still loads, and hmp doctor --fix-config rewrites the file."
fr = "Cette clé est écrite sous un nom ou une forme ancienne. Elle se charge encore, et hmp doctor --fix-config réécrit le fichier."

[check.wrong_type]
en = "This value does not have the type the key takes, a number, a text, a table or a list."
fr = "Cette valeur n'a pas le type que la clé attend, un nombre, un texte, une table ou une liste."

[check.out_of_range]
en = "This value is outside the bounds the key accepts, or holds too few or too many items."
fr = "Cette valeur est hors des bornes que la clé accepte, ou compte trop peu ou trop d'éléments."

[check.not_a_choice]
en = "This value is not one of the choices the key accepts. The detail lists them."
fr = "Cette valeur ne fait pas partie des choix que la clé accepte. Le détail les donne."

[check.unknown_name]
en = "This name is not served by this installation. The detail lists the names it serves."
fr = "Ce nom n'est pas servi par cette installation. Le détail donne les noms qu'elle sert."

[check.refused_value]
en = "This value is refused by the check of its key or its table. The detail says why."
fr = "Cette valeur est refusée par le contrôle de sa clé ou de sa table. Le détail dit pourquoi."

[check.cross_rule]
en = "Two or more sections disagree with each other. The detail names the keys and what to change."
fr = "Deux sections ou plus se contredisent. Le détail nomme les clés et ce qu'il faut changer."

[check.incompatible]
en = "The solver this document runs does not honour what it asks for. The detail names the solvers that do."
fr = "Le solveur que ce document lance ne prend pas en compte ce qu'il demande. Le détail nomme les solveurs qui le font."

[check.contamination]
en = "Two keys spoil each other whatever the solver. The detail says why and what to keep."
fr = "Deux clés se gênent quel que soit le solveur. Le détail dit pourquoi et laquelle garder."

[check.cross_warning]
en = "Two sections run together, and the result may not be what the file means. The detail says why."
fr = "Deux sections fonctionnent ensemble, et le résultat n'est peut-être pas celui que le fichier veut. Le détail dit pourquoi."

[check.section_warning]
en = "This section loads, and its check has a warning about it. The detail says what."
fr = "Cette section se charge, et son contrôle donne un avertissement. Le détail dit lequel."

[check.experimental_key]
en = "This key is experimental and may change in a minor release."
fr = "Cette clé est expérimentale et peut changer dans une version mineure."

[check.bad_toml]
en = "The file is not valid TOML. The detail gives the line and the column."
fr = "Le fichier n'est pas un TOML valide. Le détail donne la ligne et la colonne."

[check.bad_chain]
en = "The base_config chain of this file cannot be read. The detail names the file at fault."
fr = "La chaîne base_config de ce fichier ne peut pas être lue. Le détail nomme le fichier en cause."

[check.calibration_preflight]
en = "The preflight of the calibration found this before any run. The detail says what to write."
fr = "Le contrôle préalable du calage a trouvé ceci avant tout lancement. Le détail dit quoi écrire."

[check.sites_case]
en = "A case of this [sites] project does not expand. The detail names the case and the cell or the file."
fr = "Un cas de ce projet [sites] ne se construit pas. Le détail nomme le cas et la cellule ou le fichier."

[check.input_header]
en = "The header of this input file does not hold its contract. The detail says what it reads."
fr = "L'en-tête de ce fichier d'entrée ne respecte pas son contrat. Le détail dit ce qu'il contient."

[check.input_unreachable]
en = "This input file cannot be opened: it is absent, its host is outside the bounds of the call, or it does not answer."
fr = "Ce fichier d'entrée ne s'ouvre pas : il est absent, son hôte est hors des bornes de l'appel, ou il ne répond pas."

# The label a run gets from the validity rules, and why. A reason is a code with
# the values its phrase needs, written in {name} fields. The set of codes is
# closed, and a test holds every code and every label value to one row here.

[label.exploratory]
en = "exploratory"
fr = "exploratoire"

[label.calibrated]
en = "calibrated"
fr = "calibré"

[label.evaluated]
en = "evaluated"
fr = "évalué"

[label.failed]
en = "failed"
fr = "en échec"

[label_reason.fatal_validity]
en = "fatal validity failed: {names}"
fr = "validité fatale en échec : {names}"

[label_reason.not_converged]
en = "solver did not converge"
fr = "le solveur n'a pas convergé"

[label_reason.known_issue]
en = "known issue {id} touches {version}: {text}"
fr = "le bogue connu {id} touche {version} : {text}"

[label_reason.promoted]
en = "promoted by session {session_id}, {status}"
fr = "promu par la session {session_id}, {status}"

[label_reason.overlaps_calibration]
en = "scored on a window that overlaps the calibration window {start} to {end} (run window {window_start} to {window_end}, {samples} samples)"
fr = "scoré sur une fenêtre qui recouvre la fenêtre de calage {start} à {end} (fenêtre du run {window_start} à {window_end}, {samples} échantillons)"

[label_reason.scored_outside_calibration]
en = "scored on {window_start} to {window_end} with {samples} samples, outside the calibration window {start} to {end}"
fr = "scoré sur {window_start} à {window_end} avec {samples} échantillons, hors de la fenêtre de calage {start} à {end}"

[label_reason.no_scored_window]
en = "no scored window"
fr = "aucune fenêtre scorée"

[label_reason.session_ended]
en = "session {session_id} ended {status}"
fr = "la session {session_id} s'est terminée {status}"

[label_reason.no_score_window]
en = "no score window"
fr = "aucune fenêtre de score"

[label_reason.too_few_samples]
en = "{samples} samples scored"
fr = "{samples} échantillons scorés"

[label_reason.not_promoted]
en = "scored on {window_start} to {window_end}, not promoted by a session"
fr = "scoré sur {window_start} à {window_end}, non promu par une session"

[label_reason.bound_reached]
en = "a parameter reached its bound: {names}"
fr = "un paramètre a atteint sa borne : {names}"

# The three states a check of a run is shown in.

[check_state.passed]
en = "passed"
fr = "réussi"

[check_state.failed]
en = "failed"
fr = "échoué"

[check_state.unknown]
en = "unknown"
fr = "inconnu"

# The sentences of the method text of a run, in the order of its five paragraphs:
# the run, the data, the calibration, the quality and the limits. A phrase takes
# its values in {name} fields. Dates are written as ISO days and numbers as the
# run holds them. A key with no use in results/method.py fails the test of that
# module.

[method.label]
en = "This run is labelled {label} on {date}, under the validity rules {rule_version}."
fr = "Ce run est étiqueté {label} au {date}, selon les règles de validité {rule_version}."

[method.run]
en = "The run {name} was computed with the {solver} solver, using HydroModPy {version}."
fr = "Le run {name} a été calculé avec le solveur {solver}, par HydroModPy {version}."

[method.mesh]
en = "Its {engine} mesh has {n_cells} cells in {n_layers} layers."
fr = "Son maillage {engine} compte {n_cells} mailles sur {n_layers} couches."

[method.mesh_one_layer]
en = "Its {engine} mesh has {n_cells} cells in one layer."
fr = "Son maillage {engine} compte {n_cells} mailles sur une couche."

[method.mesh_cells]
en = "Its {engine} mesh has {n_cells} cells."
fr = "Son maillage {engine} compte {n_cells} mailles."

[method.period]
en = "It covers {start} to {end} in {n_timesteps} time steps."
fr = "Il couvre du {start} au {end} en {n_timesteps} pas de temps."

[method.period_bounds]
en = "It covers {start} to {end}."
fr = "Il couvre du {start} au {end}."

[method.period_steady]
en = "It is a steady state, with no period."
fr = "C'est un état permanent, sans période."

[method.data_input]
en = "The input {variable} comes from {source}, under the licence {license}."
fr = "L'entrée {variable} vient de {source}, sous la licence {license}."

[method.data_input_unlicensed]
en = "The input {variable} comes from {source}, and no licence is stated for it."
fr = "L'entrée {variable} vient de {source}, et aucune licence n'est indiquée pour elle."

[method.data_none]
en = "The run recorded no input."
fr = "Le run n'a enregistré aucune entrée."

[method.calib_none]
en = "No calibration session promoted this run, so its parameters are the ones its configuration declares."
fr = "Aucune session de calage n'a promu ce run, donc ses paramètres sont ceux que sa configuration déclare."

[method.calib_session]
en = "It was promoted by trial {trial} of session {session_id} (final status: {status})."
fr = "Il a été promu par l'essai {trial} de la session {session_id} (état final : {status})."

[method.calib_phase]
en = "The search ran in the phase {phase}."
fr = "La recherche a tourné dans la phase {phase}."

[method.calib_stop_rule_met]
en = "The search converged: it met its own rule, {rule}."
fr = "La recherche a convergé : elle a atteint sa propre règle, {rule}."

[method.calib_stop_plan_exhausted]
en = "The search converged: it solved every point of its plan, {rule}."
fr = "La recherche a convergé : elle a résolu chaque point de son plan, {rule}."

[method.calib_stop_budget_spent]
en = "The search did not converge: it spent its budget before its rule, {rule}, was met."
fr = "La recherche n'a pas convergé : elle a épuisé son budget avant d'atteindre sa règle, {rule}."

[method.calib_stop_budget_only]
en = "The search did not converge: it has a budget and no rule of its own, and it spent the budget."
fr = "La recherche n'a pas convergé : elle a un budget et aucune règle propre, et elle a épuisé le budget."

[method.calib_stop_unknown]
en = "The way the search stopped is not recorded."
fr = "La façon dont la recherche s'est arrêtée n'est pas enregistrée."

[method.calib_cost]
en = "Its {metric} cost at that trial is {cost}."
fr = "Son coût {metric} à cet essai vaut {cost}."

[method.calib_cost_unnamed]
en = "Its cost at that trial is {cost}."
fr = "Son coût à cet essai vaut {cost}."

[method.calib_validation_cost]
en = "On the validation period it costs {cost}."
fr = "Sur la période de validation il coûte {cost}."

[method.calib_components]
en = "The cost has these components: {components}."
fr = "Le coût a pour composantes : {components}."

[method.calib_rule]
en = "The rule of that cost is {rule}."
fr = "La règle de ce coût est {rule}."

[method.calib_window]
en = "The {role} period {name} runs from {start} to {end}."
fr = "La période de {role} {name} va du {start} au {end}."

[method.calib_no_windows]
en = "The search did not record its periods."
fr = "La recherche n'a pas enregistré ses périodes."

[method.calib_parameters]
en = "The calibration set these parameters: {parameters}."
fr = "Le calage a posé ces paramètres : {parameters}."

[method.calib_bounds]
en = "Parameters on a bound: {names}. The best value of each may lie outside the range declared for it."
fr = "Paramètres en butée : {names}. La meilleure valeur de chacun peut se trouver hors de la plage déclarée pour lui."

[method.score]
en = "Its headline score is {metric} {value} on {start} to {end}, from {n_samples} samples."
fr = "Son score de tête est {metric} {value} du {start} au {end}, sur {n_samples} échantillons."

[method.score_unavailable]
