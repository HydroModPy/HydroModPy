[[recipe]]
id = "seal_v4_one_model"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A run seal and a job seal are one document, manifest_version = 4 with profile = \"run\" or \"job\". A run seal carries the digests of its values and one lineage block, and its identity names the run by solution_key and request_id instead of config_hash; a job seal carries the request id, the process and the input set it read. A version 3 run seal and an hmp-manifest/v2 job seal are read in memory, and the file is never rewritten."

[[recipe]]
id = "seal_hashes_the_values"
since = "2.1.0"
effect = "identity"
quantities = []
text = "A run seal carries one values/1 digest per array of fields.zarr, per array of final_state/ and per floating column of every table, simulation and parameters included, with the wall-clock row of metrics left out. A field rounded at write time is hashed on the float64 values the writer received, kept per step in the facts of the run. Two runs of the same values seal the same digests, verify_artifacts still compares bytes only, and no value of an ordinary run moves."

[[recipe]]
id = "replay_plays_then_classes"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A replay plays the sealed run again, then compares its values to the seal: bit when every field, every column of a quantity and the final state hash the same in double precision, deviation otherwise, with the size of each difference, the keys added and removed, the basis of the comparison and the changes of this register it crossed. A source sealed before 2.1.0 is compared on the stored values of both runs, and a final_state/ array it could not hold is listed as added without making the replay a deviation. A moved default or another solver binary no longer refuses a replay, it is written in the lineage. Only --strict refuses a deviation, and an input with another digest is still refused."


# The one-row table of a run loses the hash of its configuration, which the
# identity footer of every table already carries under its new name.

[[recipe]]
id = "simulation_table_leaves_the_config_hash"
since = "2.1.0"
effect = "layout"
quantities = []
text = "simulation.parquet loses its config_hash column and keeps version v3: an old reader never asked for that column, and a new reader ignores the column of a 2.0.0 table. refhash/1 already excluded config_hash from that table, so no reference moves."

[[recipe]]
id = "seal_copies_the_mesh"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The seal of a run copies the mesh product it read into mesh/ of its directory, as mesh.json and mesh.npz, and lists that folder in its inventory with the digest of its tree. A replay of an engine that cannot rebuild its mesh bit for bit reads the mesh sealed beside its source when its tree still hashes to the seal and its identity matches the request, logs reused = sealed, and seals those bytes in its own mesh/; otherwise it builds again. A run sealed before 2.1.0 has no mesh/ and a replay reads the store."


# The replay verb, the values it classes and the mesh it reads.

[[recipe]]
id = "replay_is_its_own_verb"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp replay REF plays a sealed run or a published copy again, and --strict refuses a value that did not reproduce its source before the seal. hmp run --frozen on the config.toml of a sealed run or of a published copy is refused and names the verb; it used to replay them, and a copy no longer replays through hmp run."


# A delivery and a copy share published.jsonl, in its second version.

[[recipe]]
id = "delivery_lines_in_published"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A run delivers the files of an [[export]] block that names deliver_to once it is sealed, to a local or UNC folder or an ftp, ftps or sftp address. Each line of published.jsonl now says kind = \"copy\" or \"delivery\" (hydromodpy.published.v2); a line written by HydroModPy 2.0 is refused with a sentence that names this form. No number of a run changes."


# A calibration journal of events, the version of its trial series and the
# optimizer its session names.

[[recipe]]
id = "trial_journal_in_events"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The trial journal writes one line per event, schema hydromodpy.trial.v3: proposed when the optimizer asks, finished with the cost, its components, their rule and window and where the time went, linked when the trial becomes a run. A reader keeps the highest event of each trial. A 2.0 line reads as a finished trial."

[[recipe]]
id = "session_names_its_optimizer"
since = "2.1.0"
effect = "layout"
quantities = []
text = "session.json names, for each phase, the options of its search method resolved to their defaults, the seed the session received, the seed each restart was given and the versions of the libraries the method runs on. The method itself stays in method. A 2.0 session.json has none and still reads."

[[recipe]]
id = "trial_series_carry_their_version"
since = "2.1.0"
effect = "layout"
quantities = []
text = "Each file of trial_series/ written by a calibration carries hmp.schema_version = \"hydromodpy.trial_series.v1\" and hydromodpy_version in its footer. The columns and the values are the same. A file without the key, written by 2.0.0, is read as v1, and a version this code does not know is refused by name."

[[recipe]]
id = "run_level_decides_what_is_kept"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A run keeps what its level asks. A kept calibration trial is research: it keeps its head, its final state and the per-cell budget terms its criterion reads, and draws no figure and writes no export. Every other run is a result and keeps the whole per-cell budget unless keep_per_cell_budget = false, so the best of an earlier phase keeps what the project asks instead of the terms its figures read. No value changes."

[[recipe]]
id = "face_flows_on_demand"
since = "2.1.0"
effect = "layout"
quantities = []
text = "[simulation.results] keep_face_flows = true keeps the flow between each pair of connected cells, once per connection, in face_flow beside connection_cells, under MODFLOW 6 and MODFLOW-NWT; a flow that does not write it is refused. About 350 MB in float32 on the daily six-year run of example 04, where FLOW-JA-FACE weighs 1.87 GB in float64."

[[recipe]]
id = "identical_run_needs_its_level"
since = "2.1.0"
effect = "identity"
quantities = []
text = "A run is skipped only for an identical completed run of its level or above. A kept calibration trial moved under runs/ no longer stands for a run that was asked, which then runs."

[[recipe]]
id = "gc_measures_and_purges"
since = "2.1.0"
effect = "layout"
quantities = []
text = "hmp catalog gc measures the project, removes the scratch of dead attempts and what the earlier attempts of sealed runs hold beside their outcome.json, removes the product keys over the store cap that its dry run lists, and removes fields.zarr of the kept trials that reached the project more than 90 days ago, all but the best of a session that names one, keeping their seal, mesh, tables, final state and series; purged.json says what left and when."


# Edition 2.1 writes the series of every trial by default.

[[default]]
id = "trial_series_by_default"
since = "2.1.0"
edition = "2.1"
key = "calibration.persist_trial_series"
old = false
new = true
quantities = []
text = "Under edition 2.1, a calibration writes the scored series of every trial to sessions/<case>/trial_series/ by default, about 2 kB per trial on the island case. A document without edition is of edition 2.0 and keeps false, and a calibration document of that edition receives false as a written value, so the value enters its identity. A document with no [calibration] section, a simulation for one, keeps none."


# Edition 2.1 writes the project index under its lock and publishes a copy with its results and inputs.

[[recipe]]
id = "index_written_under_its_lock"
since = "2.1.0"
effect = "layout"
quantities = []
text = "One process at a time writes the project index .hmp/index.duckdb, under .hmp/index.duckdb.lock, which names its process, its host and its date and is taken over when that process died on this host or after 10 minutes without renewal; a pass no longer drops a run another pass indexed meanwhile. The index is written in DuckDB blocks of 16 KiB, 2.6 MB for a project of 100 runs instead of 14.7 MB, opening a project builds a missing index, metrics.metric_name is now metric as in metrics.parquet, and cases.bytes holds the size of each directory. The ledger of figures/ and exports/ takes the same kind of lock on every system. No value of a run changes."

[[recipe]]
id = "publish_carries_inputs_and_results"
since = "2.1.0"
effect = "layout"
quantities = []
text = "hmp publish takes along the results (fields.zarr, tables.parquet, final_state/), the inputs with INSTALL.toml, the sealed mesh and products.json by default, and writes .zenodo.json beside the RO-Crate; --without results and --without inputs leave them out, and --with is refused for a copy with a sentence that names --without. No value changes."

[[recipe]]
id = "replay_deviation_is_not_published"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp publish refuses a replay that is not classed bit, a deviation or a replay of a copy without values, because a published copy states that it gives the sealed numbers; hmp publish . leaves such a replay out and names it."


# Edition 2.1 reads the stream criterion once, scores a promoted run by its rule, labels by rule 3 and carries licences as facts.

[[recipe]]
id = "stream_criterion_read_once"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The stream criterion reads each of its inputs once, for a trial and for the figure drawn from the run. The run keeps mesh/open_water, the cells of open water the criterion leaves out of both supports, and mesh/catchment_cells, the cells whose center the catchment outline covers, beside the mean recharge it already kept. A figure takes the centers of the solver, the open water and the outline of the trial, not the polygon centroids and the delineated polygon, so on a mesh whose seeds are not the centroids it draws the partition the trial scored (5 cells of 56 moved with seeds 3 m off on cells of 25 m, none on a quad grid). It refuses a run that kept no mean recharge when the seepage threshold is above zero, and a run that kept no mesh/open_water, with a sentence that says to replay it. frac_minimal_outside_maximal, a diagnostic of the journal, is read on the scored cells and moves from 0.6883 to 0.6842 with 1 % of open water. No value of metrics.parquet changes."

[[recipe]]
id = "one_pairing_scores_the_promoted_run"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A calibration trial and the run it promotes pair their series by one function, so on the same series they keep the same periods and give the same score, bit for bit (647, 19 and 727 pairs on a daily discharge, a monthly discharge and a daily head). A run a session promoted also gets the rows of each calibration period of its seal in metrics.parquet, with window_role calibration and metric_rule_version, written before the seal. These rows score the station of [metrics] on the days of the case, or every paired station when [metrics] names none, and not the observations the search fitted. The headline rows of [metrics] do not change, so the new rows are values a replay adds and no existing value moves."

[[recipe]]
id = "promoted_run_seals_its_objective"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The calibrated_by block of the seal of a promoted run gains rule, the version of the metric rule the cost of its case was read under, and components, the parts of that cost without the validation cost, which keeps its own field. The block keeps the schema hydromodpy.checks.v2, since both fields are optional, and a seal written before carries null and an empty table. No value changes."

[[recipe]]
id = "label_rule_3"
since = "2.1.0"
effect = "label"
quantities = []
text = "Labels follow rule 3. A promoted run is calibrated or evaluated only when a window was scored: a calibration period of its seal, the headline window with enough samples, or the single state of a steady run whose session read a finite cost. A transient run promoted without a scored window is now exploratory, with the reason no_scored_window, and a steady calibration stays calibrated. A parameter on a bound of its range adds the reason bound_reached to any label, last, without changing it. Each reason is a code with a sentence in English and in French, and the English sentences are those of rule 2."

[[recipe]]
id = "licence_is_a_carried_fact"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp publish --public warns instead of refusing when the project declares no [publication] license, and when the copy carries its inputs it warns and names each input that has no licence. The copy is written and states LicenseRef-undetermined for what has no licence. hmp replay of a published copy installs the files a provider delivered by their sha256 in the workspace of the project, where it used to refuse them. A delivered file whose destination holds other bytes is still refused, and nothing is written. A run states the roll-up of the licences its inputs.json entries carry, read from the sidecar of each file when the run recorded it, where it used to look a loaded record up by provider. A source that reads no file (constant, synthetic, a record built in memory) and a record read from a product of the run write no entry, so they add no licence. A run that read such a source beside files that all carry one licence states that licence, where it used to state LicenseRef-undetermined."

[[recipe]]
id = "basin_budget_split_per_element"
since = "2.1.0"
effect = "numbers"
quantities = ["fluxes@modflow6", "fluxes@modflow_nwt", "fluxes@boussinesq"]
text = "The catchment series and budget_over count the inflow and the outflow of each element (layer, cell) on its own, as the extractors do, where the catchment series summed the layers of a cell first. A drain only leaves the aquifer, so the discharge does not move: 0 on the six reference runs and on two runs of example 04, all one layer. On a multilayer run the inflow and the outflow of a term whose sign changes between layers move, and their difference does not."

[[recipe]]
id = "plan_in_one_table"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A plan keeps its cases and the cells of their sites in plan/<hash>/cases.csv beside plan.json (schema hydromodpy.plan.v2), where 2.0 wrote sites.parquet and cases.parquet. The hash of a plan now starts from its schema, so every project gets a new hash. A plan written by 2.0 is refused with the command that writes it again, hmp project plan."

[[recipe]]
id = "basin_budget_non_finite_elements"
since = "2.1.0"
effect = "numbers"
quantities = ["fluxes@modflow6", "fluxes@modflow_nwt", "fluxes@boussinesq"]
text = "The catchment series and budget_over drop a non-finite element (layer, cell) alone, where 2.0 dropped the whole cell when one of its layers held a NaN, so the discharge of a multilayer run whose drain cell holds a NaN in one layer now counts its finite layers. A time step with no finite element under the weights gives NaN, where 2.0 gave 0, and a family such as storage is NaN on a step where one of its terms is NaN. A run of one layer with finite fluxes does not move: 0 on the six reference runs."

[[recipe]]
id = "root_interval_counts_points"
since = "2.1.0"
effect = "numbers"
quantities = ["metrics"]
text = "The root interval of a bisection counts in n_trials and n_within the distinct points of the search variable that solved, where 2.0 counted the solved trials, so a point solved twice counts once and keeps its first cost. 0 cases out of 3,000 searches move."

[[recipe]]
id = "renders_carry_the_label"
since = "2.1.0"
effect = "label"
quantities = []
text = "The figures and the data exports of a run are written after its seal, from the sealed run, so each one carries the label of the day. The steps of a run end with derive, export, seal, display: the export step only drops the solver files and cleans the scratch, the data exports and the metadata views follow the seal, then the figures. The footer of a figure reads the site, the period, the HydroModPy version, then the label, the rule it follows and the date, as calibrated, rule 3, 2026-11-11, and stays unlabelled on a directory without a seal. A figure or an export that fails after the seal leaves the run sealed and completed, and the command exits with the category of the display or export error and names hmp viz show or hmp export. The seal no longer lists figures/, exports/ and report/, and the STAC view of a run no longer carries a figure asset. No value of a result changes."

[[recipe]]
id = "catchment_report_reads_a_sealed_run"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp report catchment reads a sealed run, and an overview run of the same site for the context panels, with the options --preset research or management, --lang, --station and --strict. The report is written by one engine that replaces the two block renderers, in two presets. The research preset writes a Method block first, then the page at three levels with the figures the preset names, all registered figures, and report.json, which replaces block_report_manifest.json and block_report_postflight.json and lists each figure with its file or null and the required figures that are missing. The figures the run did not draw are drawn from the [display] it sealed. The management preset writes one page, report/sheet-en or report/sheet-fr, with the label and its reasons, the method text, three figures, the headline score of each station and the inputs with a warning for each one whose licence is undetermined. A report TOML, with its [report] and [layout] tables, and the flags --run-overview, --run-simulation, --context-only, --report-only, --stream-run-logs and --strict-figure-postflight are refused with a sentence that names hmp run and hmp report catchment RUN. The preset generic is gone. The variable HMP_OVERVIEW_HTML_REVIEW_LEVELS is gone and the pages of the levels are always written. No value of a result changes."

[[recipe]]
id = "overview_keeps_its_inventory"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The seal of a data overview writes tables.parquet/data_inventory.parquet, with one row per data family, per station and per well (row_kind, family, source, item_id, name, x, y, crs_epsg, first, last, records, mean_value, unit), and lists the inputs it loaded in inputs.json as a simulation does. The stats card, the station table and the page are drawn from these rows, so a count the page shows can be read from the sealed directory. The page is written after the seal from the sealed run, and the review pages are always written, so the variable HMP_OVERVIEW_HTML_REVIEW_LEVELS is no longer read. No simulation value changes and no run of a simulation writes the new table."

[[recipe]]
id = "windows_project_folder_is_bounded"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "On Windows a project folder longer than 99 characters is refused when the project is created and when a run or a calibration session takes its folder, before anything is computed: a project writes paths up to 160 characters below its folder, and MODFLOW 6 and DuckDB open no path longer than 259. A geographic feature file keeps its name on every system instead of a hash under a long Windows path. Nothing changes on Linux or macOS, and no value of a run changes."

[[recipe]]
id = "image_in_provenance"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A run played inside the HydroModPy image writes the image tag and digest under environment.image of provenance.json. The tag comes from the image, the digest from HMP_IMAGE_DIGEST, which the server requires when it starts. A run that finds a malformed digest keeps going and seals it under environment.image.digest_refused. A run outside an image writes the same provenance.json as before, and a replay in another image names the digest change in its lineage."
