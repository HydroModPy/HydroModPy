# The three bugs of the register of known issues, which this file replaces. A run
# of the versions they name is labelled exploratory when it exposes a quantity
# they touch.

[[bug]]
id = "discharge_scores_before_period_alignment"
since = "2.0.0"
versions = "<2.0.0a1"
quantities = ["metrics"]
text = "A stress-period stamp was compared with the observed value at the stamp instead of the mean of the period it closes, so discharge scores (NSE, KGE, RMSE) of these runs are not comparable with later ones."
commit = "e6c5e50f5"

[[bug]]
id = "voronoi_nwt_boussinesq_fixes_2026_10_09"
since = "2.0.0"
versions = "<2.0.0a5"
quantities = ["mesh@voronoi", "fluxes@modflow_nwt", "heads@boussinesq", "fluxes@boussinesq"]
text = "MF6 wells and sides were placed on the triangulation instead of the Voronoi dual cells, MODFLOW-NWT stored one slice per time step and read a wrong budget, and Boussinesq ignored the steady first period, the bed thickness of drains, the recharge rule of fixed-head cells and the sub-steps; fixed between c14c1b4c6 and 48d7db46e."
commit = "c14c1b4c6"

[[bug]]
id = "mf6_computation_top"
since = "2.0.0"
versions = "<2.0.0a5"
quantities = ["heads@modflow6", "fluxes@modflow6"]
text = "The MODFLOW 6 DISV took the ground as its top, so the top layer had an uneven thickness and heads under a varying thickness were off by 0.16 to 0.31 m on the Nancon; the DISV now carries a computation top, fixed between b1fa87021 and ec7f8de88."
commit = "b1fa87021"

# hmp project new of 2.0.0 wrote [[simulation.process]] type = "flow". The key is kind
# since 2.0.0, so a project made by that release loads in 2.1 with a warning.

[[migration]]
document = "config"
old = "simulation.process[*].type"
new = "simulation.process[*].kind"
since = "2.0.0"

# The forms of 2.0.0 that moved in 2.1.0 and had no row yet. The two parent
# tables of [transport] come after the rows of their parameters, which empty them.

[[migration]]
document = "config"
old = "solver.backend.name"
new = "solver.backend"
since = "2.1.0"
rule = "flatten_the_backend_table"

[[migration]]
document = "config"
old = "transport.modflow6gwt"
new = "transport.modflow6"
since = "2.1.0"

[[migration]]
document = "config"
old = "transport.modflow6prt"
new = "transport.modflow6_prt"
since = "2.1.0"

[[migration]]
document = "config"
old = "calibration.forward_model"
instead = "A forward model is a solver backend since 2.1.0: name it by solver.backend, register it in the hydromodpy.solver entry-point group, and calibrate it with the pipeline evaluator. evaluator = \"scored_forward_model\" leaves with it."
since = "2.1.0"
rule = "drop_the_forward_model"

[[recipe]]
id = "resolved_config_carries_edition"
since = "2.1.0"
effect = "layout"
quantities = []
text = "config.resolved.toml writes edition, the set of defaults the run used, \"2.0\" today. A resolved file without it reads as edition 2.0."

[[recipe]]
id = "frozen_replay_reads_a_new_key_at_its_edition"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp run --frozen no longer refuses a run whose config.resolved.toml does not write a key that a later version added, when that key is at the default of the edition the run sealed. lineage.drift of a rerun lists such keys under new_at_default. A key the sealed file writes with another value is still a difference."

[[recipe]]
id = "prerelease_forms_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A file or a sealed run that holds one of the 175 keys or values only a pre-release of 2.0 wrote is refused, with every such key it holds. pip install \"hydromodpy~=2.0.0\" then hmp doctor --fix-config rewrites it. The list is hydromodpy/config/prerelease_forms.txt, and it leaves in 2.3.0."

[[recipe]]
id = "stac_and_prov_exports_need_the_annex"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp export --as stac and --as prov, and [[export]] format = \"stac\" or \"prov\", are refused when hydromodpy_annex is not installed, with the module to install. Both views moved to the annex. RO-Crate stays in the wheel."

[[recipe]]
id = "data_cache_never_in_the_user_cache"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A data request or a call without a data folder no longer caches a DEM, a geology map or a crossings layer under the user cache of the machine. The file goes under the data folder of the call, data/ of a project without a workspace, so a file fetched earlier is fetched again, and a newer product version can change the values read."

[[recipe]]
id = "data_cache_is_its_sidecars"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The data cache is the sidecar next to each fetched file, and data/cache.duckdb is gone. A sidecar names the variable, the source, the station, the product, the box, the period, the window asked, the sha256, the size and the licence of its file. A station that answered nothing is a sidecar marked empty, without a file. A user file is never a row of the cache."

[[recipe]]
id = "stale_cache_file_rehashed"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A cached file whose size differs from its sidecar, or that is newer than its sidecar by more than a second, is hashed again, and is fetched again only when its sha256 changed. A copy of a workspace by cp no longer fetches its files again."

[[recipe]]
id = "prune_keeps_cited_inputs"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp data prune never removes a file whose sha256 a sealed run, a kept trial or a lockfile of the workspace cites, and names each one it keeps. When the inputs of a run or a lockfile cannot be read, it removes nothing."

[[recipe]]
id = "former_data_cache_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A data folder that still holds data/cache.duckdb of HydroModPy 2.0.0 is refused with a sentence that names hmp workspace clean --data-cache, and a lockfile hydromodpy.lock.v1 is refused with a sentence that names hmp data lock. Neither is read."

[[recipe]]
id = "frozen_replay_pins_empty_answers"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hydromodpy.lock pins a station that answered nothing as an input with empty = true and no sha256. hmp run --frozen replays such a station when the lockfile pins it, refuses an empty answer the lockfile does not pin, and refuses a file for a station the lockfile pins empty. In 2.0.0 every empty answer was refused under --frozen, because the lockfile could not pin it."

[[recipe]]
id = "request_identity_composition"
since = "2.1.0"
effect = "identity"
quantities = []
text = "A run is now told identical to a completed run by its request, the configuration as written with its edition and the digest and state of every input it reads, plus the code, the solver binaries and the numeric packages that compute it. The address of a URL and the path of a file no longer count, their bytes do. A run or a calibration that 2.0 would have skipped runs once again."

[[recipe]]
id = "json_paths_need_a_base"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A configuration given as a dict or as JSON text reads its relative paths from the base the caller names, never from the current folder, and is refused without one. JSON text is read as a file is, with the same refusals."

[[recipe]]
id = "run_and_project_names_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A run name or a project name holds lower case letters, digits, _ and -, forty characters at most, and holds neither a doubled underscore nor a device name Windows reserves. A name written otherwise is refused with the folded name to write. A name the code makes, from a file stem or a case of a plan, is folded in silence and still refused when it is too long or reserved."

[[recipe]]
id = "stage_products_in_one_store"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The meshes, and the output of the soil reservoir, are kept in one product store under .hmp/products/, keyed by what they read and by the code that computes them, under the cap [workspace] products_cap_mb. The mesh cache of 2.0 under .hmp/mesh_cache/ is no longer read, so a triangle mesh is drawn once more, the same mesh with the same gmsh."

# The DEM header contract, read by the pipeline and by check(inputs=True).
# A DEM that breaks it was routed or snapped without a word before, so the
# refusal replaces a silent wrong catchment.

[[recipe]]
id = "dem_header_contract"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A DEM that breaks the header contract is refused before routing: no CRS, a CRS that is not projected or not in metres, a rotated grid, pixels not square within 1 %, a routed resolution outside 1 to 250 m, elevations outside -500 to 9000 m, or an outlet outside the raster or on a nodata cell."

# The regional flow rasters move from the geographic cache to the product store.
# The product is a copy of the bytes the engine wrote, so no number moves.

[[recipe]]
id = "terrain_product_store"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The corrected DEM, the D8 directions and the D8 accumulation are now a stage product under .hmp/products/, keyed by the DEM digest, its state, the conditioning method and the terrain engine; a rerun reads the stored terrain instead of rebuilding it."

# The two geographic cache keys retire with the cache they switched.

[[migration]]
document = "config"
old = "geographic.reuse_existing_outputs"
instead = "The terrain cache is the product store under .hmp/products/ since 2.1.0, and a rerun reads it without a switch."
since = "2.1.0"
sealed = "drop"
rule = "drop_the_cache_switches"

[[migration]]
document = "config"
old = "geographic.reg_fold"
instead = 'The regional flow folder is the terrain product since 2.1.0. To reuse a conditioned DEM between projects, declare state = "conditioned" on its [data.dem.sources] entry.'
since = "2.1.0"
sealed = "drop"
rule = "drop_the_cache_switches"

[[recipe]]
id = "solve_time_leaves_the_tables"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The wall time of the solve is no longer a row of metrics.parquet nor of the seal. It is in profile.json, with the time of every step. A 2.0 run keeps its row, and show reads it."

[[recipe]]
id = "restart_head_written_exact"
since = "2.1.0"
effect = "numbers"
quantities = ["heads@modflow6", "fluxes@modflow6"]
text = "The start head of a run that restarts from another one is written to MODFLOW 6 as a double precision binary array, and its lake stages with all their digits, no longer rounded as text. Heads move by about 1e-9 m and lake stages by up to 5e-9 m."

[[bug]]
id = "restart_read_the_rounded_head"
since = "2.1.0"
versions = "<2.1.0"
quantities = ["start@restart_from"]
text = "A run started from flow.restart_from read the last head of the earlier run as stored, rounded to 2^-17 under the compact precision, up to 0.8 mm on 100 m of head. It now reads final_state, in double precision."

[[bug]]
id = "cyclic_spinup_restarted_the_lake"
since = "2.1.0"
versions = "<2.1.0"
quantities = ["start@spinup_cyclic_lake"]
text = "The cyclic spin-up carried the heads from one cycle to the next and restarted every lake from its initial_stage, so the lake never settled. Each cycle now starts from the final stage of the previous one."

[[recipe]]
id = "restart_reach_stage_under_sfr_storage"
since = "2.1.0"
effect = "numbers"
quantities = ["heads@modflow6", "fluxes@modflow6"]
text = "MODFLOW 6 with SFR storage: a run that restarts from another one, and each window of a chain, gives each reach the stage it ended on as INITIALSTAGES, read from final_state, where the reach used to start from the stage the package computes. On a two-window chain the head of window 2 moves by about 1e-4 m, and the chain then differs from the run in one piece by 6e-10 m. A source run of 2.0 has no final_state, and its reaches start as before."


