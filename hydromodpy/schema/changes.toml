# The register of changes of HydroModPy.
#
# One row per change a reader of an older run or an older file has to know about.
# [[bug]] is a fix that changes the numbers of a run. [[default]] is a default that
# moves with an edition, and only a file that writes that edition gets the new value.
# [[recipe]] is a computation or a rule that changes without a bug. [[migration]] is
# one key that moves or leaves, or one value that is renamed, in the TOML grammar or
# in a stored document.
#
# hydromodpy/schema/changes.py reads this file once, at import, and refuses a
# faulty row. The label of a run reads its bugs, the migration of a configuration
# reads the rows of document = "config", and
# tests/unit/architecture/test_changes_register.py holds the rest. The Numbers
# section of CHANGELOG.md is generated from the bugs, the defaults and the recipes
# whose effect is "numbers" (python -m tools.changes_changelog --write). Every row
# is listed on the generated page docs/source/reference/changes-register.md.
#
# Rules for every row:
# - id is [a-z0-9_]+, unique in the whole file, and never reused. A migration row has
#   no id.
# - since is the first version that carries the change, such as "2.1.0".
# - text is the changelog line, in plain English: the quantity, the case, the old
#   value, the new value and the size of the change.
# - quantities are the tokens a run exposes, as in results/validity_rules.py:
#   "metrics", "heads@<solver>", "fluxes@<solver>", "mesh@<engine>", "derived@<v>",
#   and "source@<section>_<source>" for each [[data.<section>.sources]] of its config.toml.
# - A path is dotted, with [*] for each table of a list and {*} for the tables under
#   free names, as in the dotted paths of the TOML grammar.

schema = "hydromodpy.changes.v1"

# A fix that changes a number. The commit of the fix adds its row. versions is the
# PEP 440 set of the versions that carry the bug, so a run of one of them is
# labelled exploratory.
#
# [[bug]]
# id = "<snake_case_name>"
# since = "2.1.0"
# versions = "<2.1.0"
# quantities = ["metrics"]
# text = "<The quantity, on which case, goes from <old> to <new>.>"
# commit = "<sha of the fix, optional>"

# A default that moves. The commit that moves it adds its row. A file that does not
# write edition keeps the old value.
#
# [[default]]
# id = "<snake_case_name>"
# since = "2.1.0"
# edition = "2.1"
# key = "<section>.<key>"
# old = 0.5
# new = 0.45
# quantities = ["heads@modflow6", "fluxes@modflow6"]
# text = "<With edition 2.1, <key> defaults to <new> instead of <old>. <Size of the change>.>"

# A computation or a rule that changes without a bug. The commit that changes it
# adds its row. effect is one of "numbers", "refusal", "label", "identity", "layout".
#
# [[recipe]]
# id = "<snake_case_name>"
# since = "2.1.0"
# effect = "numbers"
# quantities = ["metrics"]
# text = "<What the step computes now, on which case, and the size of the change.>"

# One key that moves, in the TOML grammar (document = "config") or in a stored
# document (document = "manifest", "published", "sidecar", ...). The commit that
# moves or retires the key adds its row, one row per key. Three shapes:
#
# A key that moves. Its sub-keys keep their names.
# [[migration]]
# document = "config"
# old = "<section>.<old_key>"
# new = "<section>.<new_key>"
# since = "2.1.0"
#
# A key that leaves. A live file is refused with instead. A sealed run is refused
# too, unless sealed = "drop" says that a replay never needed the key.
# [[migration]]
# document = "config"
# old = "<section>.<key>"
# instead = "<What to write instead.>"
# sealed = "drop"
# since = "2.1.0"
#
# A value that is renamed under a key that keeps its name.
# [[migration]]
# document = "config"
# key = "<section>.<key>"
# old_value = "<old>"
# new_value = "<new>"
# since = "2.1.0"
#
# Any shape may add rule = "<name>" when one row cannot say the whole change. The
# name is a key of the table RULES of the reader of the document, in
# [a-z][a-z0-9_]*, never a module path. The function carries the change, and the
# row stays for the changelog.

[[recipe]]
id = "seal_digests_the_field_store"
since = "2.0.0"
effect = "identity"
quantities = []
text = "The seal of a run gives the sha256 of its field store fields.zarr, over the path and the content of every file, so hmp doctor reports a store changed since the seal. A seal written before 2.0.0 has no digest for the store, which still reads and is not checked."

[[recipe]]
id = "frozen_replay_is_never_skipped"
since = "2.0.0"
effect = "refusal"
quantities = []
text = "hmp run --frozen on the config.toml of a completed run replays it without --force. It used to be skipped as identical to the run it replays. A run that replays no sealed record is still skipped when a completed run is identical."

[[recipe]]
id = "modflow_steady_start_ignores_boussinesq_runtime"
since = "2.1.0"
effect = "numbers"
quantities = ["heads@modflow6", "fluxes@modflow6", "heads@modflow_nwt", "fluxes@modflow_nwt"]
text = "The auxiliary steady solve that sets the initial heads of a MODFLOW 6 or MODFLOW-NWT run with [flow.ic] kind = \"steady_state\" always starts from the top of the model. It used to start 0.01 m below the top when [flow.runtime] set backend = \"petsc\" and surface_interaction_model = \"vi_obstacle\", two Boussinesq settings that MODFLOW does not use. Only that combination changes, by the order of the head closure of the auxiliary solve (at least 1e-3 m for MODFLOW 6, headtol, 1e-4 m by default, for NWT); no example, reference or validation case uses it."

[[migration]]
document = "config"
old = "modflow6"
new = "solver.modflow6"
since = "2.1.0"

[[migration]]
document = "config"
old = "modflownwt"
new = "solver.modflow_nwt"
since = "2.1.0"

[[migration]]
document = "config"
old = "flow.runtime"
new = "solver.boussinesq"
since = "2.1.0"

[[migration]]
document = "config"
old = "solver.backend.kind"
new = "solver.backend"
since = "2.1.0"
rule = "flatten_the_backend_table"

[[recipe]]
id = "lake_refused_under_a_cyclic_start"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A file that declares an active lake and flow.ic.kind = \"spinup_cyclic\" is refused when it is read. The cycle carries the heads and not the lake stage, which started again from initial_stage at each cycle. Run hmp spinup, which carries both, then start from its result with flow.restart_from. A sealed run that holds the pair still reads, with a warning."

[[recipe]]
id = "keys_the_flow_solver_ignores_are_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A key the chosen flow solver does not honor is refused when the file is read, from the supports the solver declares, and the refusal names the solvers that honor it. This adds four refusals: solver.sink_fill = true, solver.drain_band_depth_m and solver.drain_conductance_floor_m2_s away from their defaults, and [flow.sinks_sources.etp], all under Boussinesq, which reads none of them. A transport solver whose requires does not name the flow solver is refused at the read too, where a MODFLOW 6 and MODFLOW-NWT pair used to be refused when the plan was built. A sealed run still reads, with a warning."

[[recipe]]
id = "transport_refused_behind_an_unconverged_steady_start"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A transport run is refused with SolverDivergedError when the flow it follows started from a steady solve that did not converge. MODFLOW 6 accepted such a solve when its final water budget was closed, and the transport went on with a warning only. The replay of a sealed run warns instead of refusing. A steady start that converges, a cyclic spin-up and every run without a transport are unchanged."


[[bug]]
id = "hubeau_qixm_discharge"
since = "2.1.0"
versions = "<2.1.0"
quantities = ["source@hydrometry_hubeau"]
text = "Hub'Eau product QIXM (monthly maximum instantaneous discharge) was read as a water level in m, with the l/s value unconverted. It is now a discharge in m3/s, 1000 times smaller. QixM, which Hub'Eau does not serve and which returned no observation, is read as QIXM."

[[migration]]
document = "config"
key = "data.hydrometry.sources[*].product"
old_value = "QixM"
new_value = "QIXM"
since = "2.1.0"

[[bug]]
id = "hubeau_named_stations_capped"
since = "2.1.0"
versions = "<2.1.0"
quantities = ["source@hydrometry_hubeau"]
text = "With station_ids and max_stations both set, Hub'Eau hydrometry loaded only the first max_stations named stations that had data and never said so. max_stations now counts only the stations a search over the extent finds, and every named station is loaded."

[[bug]]
id = "hubeau_cache_ignores_product"
since = "2.1.0"
versions = "<2.1.0"
quantities = ["source@hydrometry_hubeau"]
text = "Hub'Eau cache looked up cached series without product in the cache key. An entry whose product differed answered anyway."

[[recipe]]
id = "named_station_without_data"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "When every named station returns no observation, the variable is refused with DataSourceError."

[[recipe]]
id = "bare_input_names_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "Bare file names are no longer looked up in the workspace data folder."

[[recipe]]
id = "input_path_scheme_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "Input paths starting with a URL scheme are refused with a message directing users to source = 'url'."

[[recipe]]
id = "url_source"
since = "2.1.0"
effect = "layout"
quantities = []
text = "URL sources download into the data cache as data/<variable>/<variable>_url_<host>_<sha8><suffix>."

[[migration]]
document = "config"
old = "geographic.catchment.dem_init_path"
instead = "geographic.catchment.dem_init_path was removed in 2.1.0. Declare the DEM as [[data.dem.sources]] with source = \"file\" and path = \"<the same path>\". `hmp doctor --fix-config` rewrites it."
since = "2.1.0"
rule = "move_the_dem_init_path"

[[migration]]
document = "config"
key = "data.{*}.sources[*].source"
old_value = "custom"
new_value = "file"
since = "2.1.0"

[[migration]]
document = "sidecar"
key = "source"
old_value = "custom"
new_value = "file"
since = "2.1.0"

# The [transport] tables of the 2.0.0 grammar sat one level deeper: the
# parameters of each transport rise under [transport.<name>], the registry name
# of that solver (E34), and the emptied parent table goes. Four moves, same
# since as the solver tables.

[[migration]]
document = "config"
old = "transport.modflow6gwt.parameters"
new = "transport.modflow6"
since = "2.1.0"

[[migration]]
document = "config"
old = "transport.modflow6prt.parameters"
new = "transport.modflow6_prt"
since = "2.1.0"

[[migration]]
document = "config"
old = "transport.mt3dms.parameters"
new = "transport.mt3dms"
since = "2.1.0"

[[migration]]
document = "config"
old = "transport.modpath.parameters"
new = "transport.modpath"
since = "2.1.0"

[[migration]]
document = "fields"
old = "concentration"
new = "concentration.{*}"
since = "2.1.0"

# The three bugs of the register of known issues, which this file replaces. A run
# of the versions they name is labelled exploratory when it exposes a quantity
# they touch.

[[bug]]
id = "discharge_scores_before_period_alignment"
since = "2.0.0"
versions = "<2.0.0a1"
quantities = ["metrics"]
text = "A stress-period stamp was compared with the observed value at the stamp instead of the mean of the period it closes, so discharge scores (NSE, KGE, RMSE) of these runs are not comparable with later ones."
commit = "e6c5e50f5"

[[bug]]
id = "voronoi_nwt_boussinesq_fixes_2026_10_09"
since = "2.0.0"
versions = "<2.0.0a5"
quantities = ["mesh@voronoi", "fluxes@modflow_nwt", "heads@boussinesq", "fluxes@boussinesq"]
text = "MF6 wells and sides were placed on the triangulation instead of the Voronoi dual cells, MODFLOW-NWT stored one slice per time step and read a wrong budget, and Boussinesq ignored the steady first period, the bed thickness of drains, the recharge rule of fixed-head cells and the sub-steps; fixed between c14c1b4c6 and 48d7db46e."
commit = "c14c1b4c6"

[[bug]]
id = "mf6_computation_top"
since = "2.0.0"
versions = "<2.0.0a5"
quantities = ["heads@modflow6", "fluxes@modflow6"]
text = "The MODFLOW 6 DISV took the ground as its top, so the top layer had an uneven thickness and heads under a varying thickness were off by 0.16 to 0.31 m on the Nancon; the DISV now carries a computation top, fixed between b1fa87021 and ec7f8de88."
commit = "b1fa87021"

# hmp project new of 2.0.0 wrote [[simulation.process]] type = "flow". The key is kind
# since 2.0.0, so a project made by that release loads in 2.1 with a warning.

[[migration]]
document = "config"
old = "simulation.process[*].type"
new = "simulation.process[*].kind"
since = "2.0.0"

# The forms of 2.0.0 that moved in 2.1.0 and had no row yet. The two parent
# tables of [transport] come after the rows of their parameters, which empty them.

[[migration]]
document = "config"
old = "solver.backend.name"
new = "solver.backend"
since = "2.1.0"
rule = "flatten_the_backend_table"

[[migration]]
document = "config"
old = "transport.modflow6gwt"
new = "transport.modflow6"
since = "2.1.0"

[[migration]]
document = "config"
old = "transport.modflow6prt"
new = "transport.modflow6_prt"
since = "2.1.0"

[[migration]]
document = "config"
old = "calibration.forward_model"
instead = "A forward model is a solver backend since 2.1.0: name it by solver.backend, register it in the hydromodpy.solver entry-point group, and calibrate it with the pipeline evaluator. evaluator = \"scored_forward_model\" leaves with it."
since = "2.1.0"
rule = "drop_the_forward_model"

[[recipe]]
id = "resolved_config_carries_edition"
since = "2.1.0"
effect = "layout"
quantities = []
text = "config.resolved.toml writes edition, the set of defaults the run used, \"2.0\" today. A resolved file without it reads as edition 2.0."

[[recipe]]
id = "frozen_replay_reads_a_new_key_at_its_edition"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp run --frozen no longer refuses a run whose config.resolved.toml does not write a key that a later version added, when that key is at the default of the edition the run sealed. lineage.drift of a rerun lists such keys under new_at_default. A key the sealed file writes with another value is still a difference."

[[recipe]]
id = "prerelease_forms_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A file or a sealed run that holds one of the 175 keys or values only a pre-release of 2.0 wrote is refused, with every such key it holds. pip install \"hydromodpy~=2.0.0\" then hmp doctor --fix-config rewrites it. The list is hydromodpy/config/prerelease_forms.txt, and it leaves in 2.3.0."

[[recipe]]
id = "stac_and_prov_exports_need_the_annex"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp export --as stac and --as prov, and [[export]] format = \"stac\" or \"prov\", are refused when hydromodpy_annex is not installed, with the module to install. Both views moved to the annex. RO-Crate stays in the wheel."

[[recipe]]
id = "data_cache_never_in_the_user_cache"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A data request or a call without a data folder no longer caches a DEM, a geology map or a crossings layer under the user cache of the machine. The file goes under the data folder of the call, data/ of a project without a workspace, so a file fetched earlier is fetched again, and a newer product version can change the values read."

[[recipe]]
id = "data_cache_is_its_sidecars"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The data cache is the sidecar next to each fetched file, and data/cache.duckdb is gone. A sidecar names the variable, the source, the station, the product, the box, the period, the window asked, the sha256, the size and the licence of its file. A station that answered nothing is a sidecar marked empty, without a file. A user file is never a row of the cache."

[[recipe]]
id = "stale_cache_file_rehashed"
since = "2.1.0"
effect = "layout"
quantities = []
text = "A cached file whose size differs from its sidecar, or that is newer than its sidecar by more than a second, is hashed again, and is fetched again only when its sha256 changed. A copy of a workspace by cp no longer fetches its files again."

[[recipe]]
id = "prune_keeps_cited_inputs"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hmp data prune never removes a file whose sha256 a sealed run, a kept trial or a lockfile of the workspace cites, and names each one it keeps. When the inputs of a run or a lockfile cannot be read, it removes nothing."

[[recipe]]
id = "former_data_cache_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A data folder that still holds data/cache.duckdb of HydroModPy 2.0.0 is refused with a sentence that names hmp workspace clean --data-cache, and a lockfile hydromodpy.lock.v1 is refused with a sentence that names hmp data lock. Neither is read."

[[recipe]]
id = "frozen_replay_pins_empty_answers"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "hydromodpy.lock pins a station that answered nothing as an input with empty = true and no sha256. hmp run --frozen replays such a station when the lockfile pins it, refuses an empty answer the lockfile does not pin, and refuses a file for a station the lockfile pins empty. In 2.0.0 every empty answer was refused under --frozen, because the lockfile could not pin it."

[[recipe]]
id = "request_identity_composition"
since = "2.1.0"
effect = "identity"
quantities = []
text = "A run is now told identical to a completed run by its request, the configuration as written with its edition and the digest and state of every input it reads, plus the code, the solver binaries and the numeric packages that compute it. The address of a URL and the path of a file no longer count, their bytes do. A run or a calibration that 2.0 would have skipped runs once again."

[[recipe]]
id = "json_paths_need_a_base"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A configuration given as a dict or as JSON text reads its relative paths from the base the caller names, never from the current folder, and is refused without one. JSON text is read as a file is, with the same refusals."

[[recipe]]
id = "run_and_project_names_refused"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A run name or a project name holds lower case letters, digits, _ and -, forty characters at most, and holds neither a doubled underscore nor a device name Windows reserves. A name written otherwise is refused with the folded name to write. A name the code makes, from a file stem or a case of a plan, is folded in silence and still refused when it is too long or reserved."

[[recipe]]
id = "stage_products_in_one_store"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The meshes, and the output of the soil reservoir, are kept in one product store under .hmp/products/, keyed by what they read and by the code that computes them, under the cap [workspace] products_cap_mb. The mesh cache of 2.0 under .hmp/mesh_cache/ is no longer read, so a triangle mesh is drawn once more, the same mesh with the same gmsh."

# The DEM header contract, read by the pipeline and by check(inputs=True).
# A DEM that breaks it was routed or snapped without a word before, so the
# refusal replaces a silent wrong catchment.

[[recipe]]
id = "dem_header_contract"
since = "2.1.0"
effect = "refusal"
quantities = []
text = "A DEM that breaks the header contract is refused before routing: no CRS, a CRS that is not projected or not in metres, a rotated grid, pixels not square within 1 %, a routed resolution outside 1 to 250 m, elevations outside -500 to 9000 m, or an outlet outside the raster or on a nodata cell."

# The regional flow rasters move from the geographic cache to the product store.
# The product is a copy of the bytes the engine wrote, so no number moves.

[[recipe]]
id = "terrain_product_store"
since = "2.1.0"
effect = "layout"
quantities = []
text = "The corrected DEM, the D8 directions and the D8 accumulation are now a stage product under .hmp/products/, keyed by the DEM digest, its state, the conditioning method and the terrain engine; a rerun reads the stored terrain instead of rebuilding it."

# The two geographic cache keys retire with the cache they switched.

[[migration]]
document = "config"
old = "geographic.reuse_existing_outputs"
instead = "The terrain cache is the product store under .hmp/products/ since 2.1.0, and a rerun reads it without a switch."
since = "2.1.0"
sealed = "drop"
rule = "drop_the_cache_switches"

[[migration]]
document = "config"
old = "geographic.reg_fold"
instead = 'The regional flow folder is the terrain product since 2.1.0. To reuse a conditioned DEM between projects, declare state = "conditioned" on its [data.dem.sources] entry.'
since = "2.1.0"
sealed = "drop"
rule = "drop_the_cache_switches"
