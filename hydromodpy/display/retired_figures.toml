# Former figure names and what replaces each one.
# One table per name. "figure" is the [[display.figure]] that replaces it (a list when it takes two).
# "none" says what to do when nothing replaces it, and "lost" what the new form no longer shows.

[abherve_two_stage_card]
figure = { preset = "root_search", when = "session" }
lost = "The two-stage layout is gone. The calibration_progress figure shows the phases."

[accumulation_map]
figure = { variable = "drain_accumulation_flux", scale = "log" }

[bisection_bracket_trace]
figure = { preset = "root_search", when = "session" }

[boundary_package_map]
figure = { variable = "package_cells" }

[calibration_convergence]
figure = { preset = "calibration_progress", when = "session" }

[calibration_landscape]
figure = { preset = "calibration_landscape", when = "session" }

[calibration_objective_surface]
figure = { preset = "calibration_landscape", when = "session" }
lost = "The interpolated surface is gone. The trials are drawn as markers coloured by cost."

[calibration_pairplot]
figure = { preset = "calibration_landscape", when = "session" }

[calibration_progress]
figure = { preset = "calibration_progress", when = "session" }

[calibration_trace]
figure = { variable = "trials.parameter", type = "series", facet = "parameter", when = "session" }

[calibration_trial_distribution]
figure = { variable = "trials.parameter", type = "distribution", facet = "parameter", when = "session" }

[concentration_boxplot]
figure = { variable = "concentration", type = "groups", by = "time" }

[concentration_map]
figure = { variable = "concentration", layer = 0 }

[conditioning_impact_map]
none = "This figure never showed a difference, because the two runs it compared were equal. To compare a topography with another run, write a figure with variable = \"topography\" and against = \"<run>\"."

[cross_section]
figure = { variable = "watertable_elevation", type = "section", name = "cross_section" }

[depression_map]
figure = { variable = "depression_fill_depth", scale = "log" }

[difference_map]
none = "A difference needs a second run, which a project file cannot name. Draw it in Python with run.figure(variable, against=<run>), or with hmp show --figure <variable>."

[distribution]
none = "The cohort figures of a multi-site project read summary tables, not a run. Draw them with the overview of the project."

[downslope_distance_crossing]
figure = { preset = "root_search", when = "session" }

[downslope_distance_map]
figure = { variable = "downslope_distance", scale = "log" }
lost = "The four paper classes of the old map are now one logarithmic colour ramp."

[duration_curve]
figure = { variable = "discharge", type = "distribution", cumulative = true }
lost = "The Q10, Q50 and Q90 markers are not drawn."

[ensemble_band]
figure = { preset = "ensemble_band" }

[flow_direction_map]
figure = { preset = "flow_directions" }

[flow_intermittence_map]
figure = { variable = "simulated_active_network", reduce = "frequency" }
lost = "The panel that classes cells as perennial or intermittent is gone. A cell flowing 100 % of the time reads as perennial."

[flow_persistence_map]
figure = { variable = "simulated_active_network", reduce = "frequency" }

[flux_timeseries]
figure = { preset = "water_budget" }
lost = "The fluxes are now in mm/d over the zone, not in m3/s or mm per period."

[hydrograph]
figure = { preset = "hydrograph" }

[hydrograph_log_nse]
figure = { preset = "hydrograph", scale = "log", name = "hydrograph_log" }
lost = "The drainage and runoff curves, which only Python could ask for, are not drawn."

[hydrograph_sim_obs]
