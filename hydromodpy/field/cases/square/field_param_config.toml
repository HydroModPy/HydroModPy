# Example TOML for hydromodpy.field.
#
# Read once with:
#   FieldParam.from_toml("hydromodpy/field/cases/square/field_param_config.toml")
#
# Note:
#   Field geometry and FieldMesh use dedicated TOML files:
#   - hydromodpy/field/cases/square/field_spatial_config.toml
#   - hydromodpy/field/cases/square/mesh_config.toml

# Active field choice for the launcher:
# - set kind = "homogeneous"  -> use [field_homogeneous]
# - set kind = "heterogeneous" -> use [field_heterogeneous]
[field]
id = "K"
# Allowed kinds are strictly:
# - "homogeneous"
# - "heterogeneous"
kind = "heterogeneous"

[field_homogeneous]
value = 12.5

[field_heterogeneous]
# Value source options:
# - inline dictionary (used below),
# - CSV table via:
#     values_source = "csv"
#     values_csv_file = "my_values.csv"
#     csv_key_column = "zone_key"
#     csv_value_column = "value"
# Inline TOML dictionary (compact syntax for short lists).
values = { granite = 10.0, micaschists = 2.0 }
# Must match the loaded field geometry id.
field_spatial_id = "field_square"
