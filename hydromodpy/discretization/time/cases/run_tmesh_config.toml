# ----------------------------------------------------------------------
# Temporal-mesh demo scenarios used by run_tmesh_case.py
# ----------------------------------------------------------------------

[case]
output_summary_json = "outputs/tmesh_case_summary.json"
output_figures_dir = "outputs/figures"

[[case.scenarios]]
id = "regular_synthetic"
description = "Synthetic regular periods"
itmuni = "d"
genmtd = "synthetic_regular"
nper = 10
lenper = 1
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0

[[case.scenarios]]
id = "transient_synthetic"
description = "Synthetic regular periods with a longer period length"
itmuni = "d"
genmtd = "synthetic_regular"
nper = 5
lenper = 3
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0

[[case.scenarios]]
id = "from_chron"
description = "Time steps computed from explicit chronicle dates"
itmuni = "d"
genmtd = "from_chron"
nper = 100
lenper = 3
chron_path = "../rech_chronicles.csv"
chron_dateformat = "%d/%m/%Y"
chron_colsep = "\t"
chron_time_col = "date"
tsmult = 1
ntsp = 1
temporal_nodata = -9999.0
