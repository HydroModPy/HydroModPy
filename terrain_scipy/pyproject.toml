[project]
name = "hydromodpy-terrain-scipy"
version = "0.1.0"
description = "An out-of-tree terrain engine for HydroModPy, routing D8 flow on numpy and scipy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "hydromodpy",
    "numpy>=2.4.4,<3",
    "scipy>=1.17.1,<2",
    "rasterio>=1.4.0,<2",
    "geopandas>=1.1.3,<2",
    "shapely>=2.0.0,<3",
]

# The whole point of the distribution: HydroModPy resolves this engine by the
# name written here, and no file of HydroModPy names it.
[project.entry-points."hydromodpy.terrain.engine"]
scipy_d8 = "hydromodpy_terrain_scipy.engine:ScipyTerrainEngine"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
