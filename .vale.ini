# House style for the written documentation (CI job "vale" in .github/workflows/docs.yml).
# Run it locally: vale docs/source README.md
# The rules are in styles/HydroModPy. Each one holds on the written pages today.

StylesPath = styles
MinAlertLevel = warning

# MyST pages are read as Markdown. Code, TOML blocks and inline code are skipped.
[docs/source/**/*.md]
BasedOnStyles = HydroModPy

[README.md]
BasedOnStyles = HydroModPy
