# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - pandoc
    - plantuml
  jobs:
    install:
      - python -m pip install --upgrade --no-cache-dir pip setuptools wheel
      - python -m pip install --exists-action=w --no-cache-dir -r docs/readthedocs_requirements.txt
      - python -m pip install --no-build-isolation --no-deps --no-cache-dir .
    build:
      html:
        # -j 2 (not auto): RTD runners report the host CPU count (~20+), so
        # -j auto spawns that many parallel workers, each holding the ~900-page
        # autosummary doctree, and the build OOMs. Two workers stay parallel
        # while keeping peak memory (~1.5 GB) under the RTD container limit.
        - python -m sphinx -T -j 2 -b html -d _build/doctrees -D language=en docs/source $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/source/conf.py
