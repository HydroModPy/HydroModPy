# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - plantuml

sphinx:
  configuration: docs/readthedocs/source/conf.py

python:
  install:
    # Install the HydroModPy package
    - method: pip
      path: .
    # Install documentation-specific dependencies
    - requirements: docs/readthedocs/readthedocs_requirements.txt
