# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
    - pandoc
    - plantuml
  jobs:
    build:
      html:
        - python -m sphinx -T -j auto -b html -d _build/doctrees -D language=en docs/source $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Install the HydroModPy package
    - method: pip
      path: .
    # Install documentation-specific dependencies
    - requirements: docs/readthedocs_requirements.txt
