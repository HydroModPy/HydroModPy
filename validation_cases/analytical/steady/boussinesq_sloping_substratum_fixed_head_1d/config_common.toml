
[workflow]
mode = "simulation"

[simulation]
name = "Bsq sloping substratum fixed head 1D"
description = "Synthetic steady-state unconfined flow on a sloping substratum with general fixed heads and no recharge."

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "validation_boussinesq_sloping_substratum_fixed_head"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "50.0 m"
nx = 40
ny = 5

[geographic.synthetic.topography]
kind = "linear"
base_elevation = 20.0
right_to_left_amplitude = 5.0

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "20.0 m"

[flow]
flow_regime = "steady"
active_sinks_sources = []
active_bc = ["west_side", "east_side"]
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
type = "custom"
value = "10.0 m"

[flow.bc.dirichlet.west_side]
type = "dirichlet"
value = "15.0 m"

[flow.bc.dirichlet.east_side]
type = "dirichlet"
value = "5.0 m"

[display]
enabled = false
