[head_profile]
rmse = 0.00017
max_abs_error = 0.0006
row_spread = 1e-07

[doc]
reason = """
Twice the error measured with the default local engine on 40 columns; PETSc and
the local engine agree to 1e-8 m: RMSE 8.5e-05 m, max error 0.0003 m. The strip
splits each 10 m square into two right triangles, the diagonal alternating like
a checkerboard. On it the solver reproduces the h^2 profile at the triangle
centroids to 1e-8 m (checked cell by cell with recharge), far below the MODFLOW
band of this case. What is left comes from the column average of two triangles,
centroids at dx/3 and 2 dx/3, against the reference at the column centre. The
heads sit at the centroid of the triangle that owns a side edge, dx/3 inside the
face. The strip is uniform across rows, so a row spread is solver noise: the
local engine reads below 1e-8 m (its head closure is 1e-9 m); the bound is 1e-7
m.
"""
