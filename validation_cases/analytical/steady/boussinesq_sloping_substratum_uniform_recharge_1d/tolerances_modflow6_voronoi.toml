row spread is the float noise of the area-weighted mean.
B9 of the unified mesh, measured again on 2026-10-26. Tightened to twice the
measure: head_profile.rmse 0.037 to 0.0368 (measure 0.0184);
head_profile.max_abs_error 0.059 to 0.0585 (measure 0.0292). Kept at a
