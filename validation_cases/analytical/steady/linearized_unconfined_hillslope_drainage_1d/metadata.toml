case_id = "lu_hillslope_drainage_1d"
category = "analytical"
regime = "steady"
dimension = "1d"
config_file = "config_modflownwt.toml"
default_solver = "modflow_nwt"
base_config = "config_modflownwt.toml"

[config_files]
modflow_nwt = "config_modflownwt.toml"
modflow6 = "config_modflow6.toml"
modflow6_irregular_tri = "config_modflow6_irregular_tri.toml"


[workspace]
results_folder_name = "results_simulations"

[output]
observable_name = "watertable_elevation"
expected_shape = [5, 50]

[reference]
xmin = 0.0
xmax = 100.0
length_y_m = 10.0
west_head_m = 7.25
east_head_m = 5.25
topography_base_elevation_m = 5.0
topography_right_to_left_amplitude_m = 2.0
# The drains take C = K * cell_area / b, so the leakance per unit area is
# K / b = 2.5e-6 1/s on every mesh.
drain_bed_thickness_m = 40.0
hydraulic_conductivity_m_per_s = 1e-4
reference_saturated_thickness_m = 30.0
aquifer_thickness_m = 30.0
profile_axis = 0
