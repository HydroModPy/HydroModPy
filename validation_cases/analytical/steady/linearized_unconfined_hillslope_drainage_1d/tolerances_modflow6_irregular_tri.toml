[head_profile]
rmse = 4.7e-4
max_abs_error = 1.3e-3
row_spread = 1e-9

[doc]
reason = """
Twice the error measured on the 352-triangle strip: RMSE 2.3e-4 m, max error
6.4e-4 m. Each drain takes C = K * cell_area / b, so the leakance K / b is the
same on every triangle and the 1D reference holds on this mesh. With a head
closure of 1e-6 m the RMSE goes from 2.7e-4 m on this strip to 1.2e-4 m on a
mesh of 1588 triangles, and the max error from 6.1e-4 m to 5.2e-4 m, then in
the first bin, next to the fixed head. The heads are posed at the mean
centroid of the triangles that own a boundary edge, and the reference is
averaged over the same x bins as the model. The row spread is zero by
construction: the loader tiles one profile.
"""
