[doc]
reason = """
Twice the error measured with PETSc VI on 40 columns; PETSc and the local engine
agree to 1e-8 m: RMSE 9.9e-05 m, max error 0.00015 m. The strip splits each 10 m
square into two right triangles, the diagonal alternating like a checkerboard.
On it the solver reproduces the h^2 profile at the triangle centroids to 1e-8 m
(checked cell by cell with recharge), far below the MODFLOW band of this case.
What is left comes from the column average of two triangles, centroids at dx/3
and 2 dx/3, against the reference at the column centre. The heads sit at the
centroid of the triangle that owns a side edge, dx/3 inside the face. The strip
is uniform across rows, so a row spread is solver noise: PETSc reads below 1e-14
m; the bound is 1e-8 m.
"""
