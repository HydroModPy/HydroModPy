
[workflow]
mode = "simulation"

[simulation]
name = "Analytical Dupuit uniform recharge validation"
description = "Synthetic steady-state unconfined flow with uniform recharge and fixed heads on west/east boundaries."

[[simulation.process]]
id = "flow_validation"
kind = "flow"
solvers = ["modflow_nwt"]

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "validation_dupuit_uniform_recharge"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "50.0 m"
nx = 40
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 20.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "20.0 m"

[domain.layers]
nlay = 1

[flow]
flow_regime = "steady"
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
kind = "custom"
value = "5.0 m"

[flow.bc.west_side]
kind = "dirichlet"
value = "5.0 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "5.0 m"

[flow.sinks_sources.recharge]
first_clim = "mean"

[data]
types = ["recharge"]
inference_mode = "warn"

[[data.recharge.sources]]
source = "synthetic"
values = [3.0]

[display]
enabled = false
