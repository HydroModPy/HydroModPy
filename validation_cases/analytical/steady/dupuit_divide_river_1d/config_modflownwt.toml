workflow = "simulation"

[simulation]
name = "Analytical Dupuit divide-river validation"
description = "Synthetic steady-state unconfined flow with west-side divide, east-side fixed head, and uniform recharge."

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "validation_dupuit_divide_river"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "50.0 m"
nx = 40
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 20.0

[domain]
zone_ids = []

[domain.depth_model]
type = "constant_thickness"
thickness = "20.0 m"

[data]
types = ["recharge"]
inference_mode = "warn"

[flow]
flow_regime = "steady"
active_sinks_sources = ["recharge"]
active_bc = ["east_side"]
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
type = "custom"
value = "9.0 m"

[flow.bc.dirichlet.east_side]
type = "dirichlet"
value = "5.0 m"

[flow.sinks_sources.recharge]
first_clim = "mean"

[[data.recharge.sources]]
source = "synthetic"
values = [1.0]
runoff_ratio = 0.0

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 40
ny = 5
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
