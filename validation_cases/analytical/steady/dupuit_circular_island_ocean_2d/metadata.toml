case_id = "dupuit_circular_island_ocean_2d"
category = "analytical"
regime = "steady"
dimension = "2d"
config_file = "config_modflownwt.toml"
default_solver = "modflow_nwt"
base_config = "config_modflownwt.toml"

[config_files]
modflow_nwt = "config_modflownwt.toml"
modflow6 = "config_modflow6.toml"
modflow6_irregular_tri = "config_modflow6_irregular_tri.toml"
modflow6_voronoi = "config_modflow6_voronoi.toml"
boussinesq = "config_boussinesq.toml"
boussinesq_local = "config_boussinesq_local.toml"


[workspace]
results_folder_name = "results_simulations"

[output]
observable_name = "watertable_elevation"
expected_shape = [61, 61]

[reference]
crs = "EPSG:2154"
xmin = 265400.0
ymin = 6784100.0
length_x_m = 610.0
length_y_m = 610.0
nx = 61
ny = 61
center_x_m = 265705.0
center_y_m = 6784405.0
sea_level_m = 0.0
ocean_floor_elevation_m = -1.0
crest_elevation_m = 12.0
island_radius_m = 200.0
comparison_radius_max_m = 190.0
radial_bin_width_m = 10.0
substratum_elevation_m = -5.0
hydraulic_conductivity_m_per_s = 5e-6
recharge_mm_day = 1.0

[reference.topography_island_radius_m_by_solver]
# The Voronoi run puts its DEM shoreline 1 m inside the coast node ring, so
# that ring reads the sea floor (config_modflow6_voronoi.toml). The reference
# keeps its coast at 200 m, where that run holds the sea level; the land
# surface of the freeboard is the one the run was given.
modflow6_voronoi = 199.0

[reference.radial_bin_width_m_by_solver]
# Voronoi cells are centred on the node rings of the mesh bundle (0, 20, 40, 60,
# 70, 90, 120, 140, 160, 180 and 190 m). A 5 m bin holds one ring, so the profile
# reads each ring at its own radius and the spread is azimuthal only.
modflow6_voronoi = 5.0
