[[simulation.process]]
solvers = ["modflow_nwt"]

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 80
ny = 5
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[flow.param.K.field]
value = "2.5e-2 m/s"

[[data.recharge.sources]]
source = "synthetic"
values = [864.0]
runoff_ratio = 0.0
