# PETSc VI obstacle on the k_only scenario. The absolute residual closure is in
# m3/s, so it follows the recharge: the same share of what a cell receives.
[flow]
runtime_backend = "petsc"
surface_interaction_model = "vi_obstacle"
runtime_max_iterations = 80
runtime_tol_residual_inf = 1e-9

[flow.ic]
type = "custom"
value = 2.0
