drain_outflow_ratio_error = 5e-4

[doc]
reason = """
Default local engine, the regularized partition closure, on 320 triangles (80
columns of 5 m, 2 rows). The partition releases a little water wherever the
water table is within a few of its 0.05 m depth scale of the surface, so a cell
seeps when its head is within 1e-6 m of the surface, read on the mean of each
5 m bin, and the water that leaves is the surface-excess flux. Measured, the
seepage limit sits at 200 m (error 0) in the three scenarios of x_e = 200 m and
at 135 m against 133.3 m for the doubled K (1.67 m): bound twice that. Head
profile: max error 4.2e-4 m, 8.2e-5 m for the doubled K; bound twice the largest.
The K/R invariance holds to 1.8e-8 m and moves no cell, but only with the Newton
closures scaled with the recharge (residual 1e-8, 1e-10, 1e-6 m3/s). Doubling K alone moves
26 cells; the release is 2.4e-4 of R * area off, bound 5e-4. From a flat start
the dense Newton of the doubled K drives tens of toe cells below the bottom and its
Jacobian solve fails (300 iterations, with a flat start from 0.5 to 10 m, the surface or
an offset below it): the control starts from the solution of the reference
scenario, 86 iterations to 1.8e-10 m3/s.
"""
