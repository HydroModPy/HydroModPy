# PETSc VI obstacle, the exact h <= z_top complementarity, on the base scenario.
# From a flat 2 m start above the surface it converges in 30 iterations; a start
# at the surface does not converge in 80, so the start matters.
[flow]

[flow.ic]
kind = "custom"
value = 2.0

[flow.runtime]
backend = "petsc"
surface_interaction_model = "vi_obstacle"
max_iterations = 80
tol_residual_inf = 1e-9
