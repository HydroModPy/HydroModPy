[seepage_limit]
position_error = 3.4
head_profile_max_abs_error = 0.012
mask_row_disagreement_max = 6

[invariance]
head_max_abs_error = 4e-7

[control]
drain_outflow_ratio_error = 3e-9

[doc]
reason = """
MODFLOW 6 on 594 irregular triangles of about 6 m (DISV), the land surface a DRN
of conductance K * area / b with b = 1 m, so the leakance K / b is the same on
every triangle whatever its area. The 5 m raster the tops are sampled from is
flat past the centre of its end columns: the reference is read at the same
positions, at each centroid, and averaged over the same 5 m columns as the
model. Measured, the seepage limit sits at 200 m (error 0) in the three
scenarios of x_e = 200 m and at 135 m against 133.3 m for the doubled K (1.67 m):
bound twice that. Head profile: max error 4.7e-3 m, 5.8e-3 m for the doubled K;
bound twice the largest. Three cells (the limit falls inside one column) differ
from the seepage state of their column, as in the doubled-K scenario; bound twice
that. The K/R invariance holds to 1.8e-7 m and moves no cell: bound 4e-7 m.
Doubling K alone moves 107 cells and leaves the drain outflow at R * area to
1.1e-9, bound 3e-9. Needs the ILUT fill of the case config: with the stock
fill the inner solves hit their cap.
"""
