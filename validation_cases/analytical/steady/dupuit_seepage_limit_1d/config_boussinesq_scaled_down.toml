# PETSc VI obstacle on the scaled_down scenario. The absolute residual closure is in
# m3/s, so it follows the recharge: the same share of what a cell receives.
[flow]

[flow.ic]
kind = "custom"
value = 2.0

[solver.boussinesq]
backend = "petsc"
surface_interaction_model = "vi_obstacle"
max_iterations = 80
tol_residual_inf = 1e-11
