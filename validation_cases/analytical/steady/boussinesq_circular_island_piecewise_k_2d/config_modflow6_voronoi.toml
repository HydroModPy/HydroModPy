
[workflow]
mode = "simulation"

[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf_verbose = false
mf6_ims_complexity = "COMPLEX"

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid]
# One cell per bundle node, centred on the node (the Voronoi dual of the triangles).
grid_dual = "voronoi"

[modflow6.sgrid.vertical]
nlay = 1

# Node rings sit at 196 m (land) and 200 m, the coast, where the model must
# hold the sea level. A cell takes the ocean head where the DEM sampled at its
# node is at or below sea level, and a node on the shoreline itself is a tie:
# the bilinear sample of the 10 m raster read -0.25 to +1.07 m there, and 36 of
# the 48 coast cells stayed land. A 1 m raster with the shoreline 1 m inside
# the coast ring reads -1 m on every coast node and 2.07 m on the 196 m ring.
[geographic.synthetic.grid]
xmin = 265400.0
ymin = 6784100.0
nx = 610
ny = 610

[geographic.synthetic.topography]
island_radius = "199.0 m"

[mesh_input]
mesh_path = "../../../shared/mesh_bundles/boussinesq_circular_island_piecewise_k_irregular_tri_radial_48/mesh_2d.msh"
bundle_dir = "../../../shared/mesh_bundles/boussinesq_circular_island_piecewise_k_irregular_tri_radial_48"
