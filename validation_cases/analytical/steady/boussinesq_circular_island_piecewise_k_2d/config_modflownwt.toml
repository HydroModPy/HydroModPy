
[workflow]
mode = "simulation"

[simulation]
name = "Bsq island piecewise K 2D"
description = "Synthetic steady-state unconfined flow on a circular island with uniform recharge, ocean boundary, and concentric piecewise-constant hydraulic conductivity."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-01-02 00:00:00"
step_value = "1 day"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "validation_boussinesq_circular_island_piecewise_k"

[geographic.synthetic.grid]
length_x = "610.0 m"
length_y = "610.0 m"
nx = 61
ny = 61

[geographic.synthetic.topography]
kind = "radial_island"
base_elevation = -1.0
crest_elevation = 12.0
island_radius = "200.0 m"

[domain]

[domain.supports.k_rings]
provider = "generated_rings"
coordinate_mode = "absolute"
radii = ["70.0 m", "140.0 m"]
labels = ["inner_ring", "middle_ring", "outer_ring"]

[domain.depth_model]
type = "flat_substratum"
substratum_elevation = -5.0

[data]
types = ["oceanic", "recharge"]
inference_mode = "strict"

[data.oceanic]
[[data.oceanic.sources]]
source = "constant"
value = 0.0

[flow]
flow_regime = "steady"
active_sinks_sources = ["recharge"]
active_bc = ["ocean"]
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "heterogeneous"
values_source = "inline"
values = { inner_ring = "8e-6 m/s", middle_ring = "4e-6 m/s", outer_ring = "1e-5 m/s" }
field_spatial_id = "k_rings"

[flow.ic]
type = "custom"
value = "1.0 m"

[flow.bc.dirichlet.ocean]
type = "dirichlet"
value = "0.0 m"

[flow.sinks_sources.recharge]
first_clim = "mean"

[[data.recharge.sources]]
source = "synthetic"
values = [1.0]
runoff_ratio = 0.0

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 61
ny = 61
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
