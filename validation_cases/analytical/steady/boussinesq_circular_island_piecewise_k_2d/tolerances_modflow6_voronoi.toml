boundaries (70 m and 140 m) pass through node rings, so those cells straddle
two zones and take an area-weighted K; the largest error, 0.19 m, sits on the
140 m ring. Control runs on the same input files: flat 13 m top, radial RMSE
0.088 m, with heads 0.06 to 0.12 m too low inside 120 m; no Newton, 0.062 m.
"""
