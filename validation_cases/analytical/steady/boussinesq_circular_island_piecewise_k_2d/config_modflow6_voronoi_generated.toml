# MODFLOW 6 on a Voronoi mesh the engine generates over the 610 m square of the
# 10 m raster, cells of about 10 m. The island, the ocean around it and the two
# rings of K (70 m and 140 m) are the ones of the structured MODFLOW 6 run. The
# engine puts a face on each ring contact (mirror pairs), so no cell straddles
# two zones of K: the cells hold one K whole. The coast is not a face line: a
# cell holds the ocean head where the DEM at its center is at or below sea
# level, as on the structured grid.

[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf_verbose = false
mf6_ims_complexity = "COMPLEX"

[geographic.synthetic.grid]
xmin = 265400.0
ymin = 6784100.0

[mesh]
engine = "voronoi"
cell_size = 10.0

[domain.layers]
nlay = 1

