
[workflow]
mode = "simulation"

[simulation]
name = "LU drainage val"
description = "Synthetic steady-state unconfined flow with fixed heads and uniform top drainage."

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_lu_drainage"

[geographic.synthetic.grid]
length_x = "100.0 m"
length_y = "10.0 m"
nx = 50
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 0.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "20.0 m"

[flow]
flow_regime = "steady"
active_sinks_sources = []
active_bc = ["west_side", "east_side", "drainage"]
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
type = "custom"
value = "6.0 m"

[flow.bc.dirichlet.west_side]
kind = "dirichlet"
value = "6.2 m"

[flow.bc.dirichlet.east_side]
kind = "dirichlet"
value = "5.8 m"

[flow.bc.cauchy.drainage]
application_domain = "top"
kind = "cauchy"
value = "1e-7 m2/s"

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 50
ny = 5
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
