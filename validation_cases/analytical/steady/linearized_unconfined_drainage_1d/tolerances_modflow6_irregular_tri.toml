[head_profile]
rmse = 5.5e-4
max_abs_error = 7.5e-4
row_spread = 1e-9

[doc]
reason = """
Twice the error measured on the 352-triangle strip: RMSE 2.7e-4 m, max error
3.7e-4 m. Each drain takes C = K * cell_area / b, so the leakance K / b is the
same on every triangle and the 1D reference holds on this mesh. With a head
closure of 1e-7 m the strip gives an RMSE of 1.8e-4 m, and 3.6e-5 m on a mesh
of 1588 triangles: the triangle error falls with the mesh, and the rest is the
default MODFLOW 6 head closure of 1e-4 m, as on the grid. The heads are posed
at the mean centroid of the triangles that own a boundary edge, and the
reference is averaged over the same x bins as the model. The row spread is
zero by construction: the loader tiles one profile.
"""
