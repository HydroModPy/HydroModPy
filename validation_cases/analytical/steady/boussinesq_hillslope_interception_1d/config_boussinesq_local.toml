# Default-engine `flow/boussinesq` variant: what a run with
# solvers = ["boussinesq"] and no runtime key gets. The validation runtime reads
# `[flow]` defaults from this file and drops every runtime key of the case, so
# the FlowConfig defaults apply: runtime_backend = "auto" with the regularized
# partition surface closure. "auto" runs the dense local engine up to 400 cells
# and scipy_sparse above.
#
# One key is set, the Newton closure. From the outlet head over the whole
# hillslope the dense Newton of the regularized partition stalls at 2.5e-9
# m3/s, its line search unable to reduce the residual where cells within a few
# centimetres of the surface switch between releasing and not; the default
# 1e-9 m3/s is out of reach. 1e-8 m3/s is 1e-2 of the recharge of one cell and
# moves the heads by less than 1e-4 m.

[flow]
runtime_tol_residual_inf = 1e-8
