[head_profile]
rmse = 0.0085
max_abs_error = 0.012
row_spread = 1e-5

[doc]
reason = """
Twice the error measured on the 40-column grid, MODFLOW-NWT and MODFLOW 6
alike: RMSE 4.2e-3 m, max error 5.9e-3 m. Both upstream-weight the saturated
thickness between cells, a first-order scheme: refining the grid by 2 halves
the error. The heads are posed where the model holds them, at the centres of
the boundary cells. The row spread bound is 0.1 times the MODFLOW 6 head
closure (1e-4 m).
"""
