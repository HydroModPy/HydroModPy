sits below the one-step MODFLOW band of this case. The heads sit dx/3 inside the
faces. Before 2026-10-09 the 40-column strips had 3 rows, cells of 2.5 x 3.3 m:
on right triangles of unequal sides the two-point flux of the solver is not
consistent, and the recharge step ended 1.1e-2 m off. The strip is uniform
across rows, so a row spread is solver noise: PETSc reads below 1e-14 m; the
bound is 1e-8 m.
