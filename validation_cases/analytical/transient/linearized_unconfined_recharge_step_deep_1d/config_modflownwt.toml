
[workflow]
mode = "simulation"

[simulation]
name = "LU recharge step deep val"
description = "Synthetic transient unconfined flow with a recharge step, fixed heads, and a deeper aquifer."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-01-30 23:00:00"
step_value = "12 hour"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
kind = "flow"
solvers = ["modflow_nwt"]

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_lu_recharge_step_deep"

[geographic.synthetic.grid]
length_x = "100.0 m"
length_y = "10.0 m"
nx = 50
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 200.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "200.0 m"

[domain.layers]
nlay = 1

[flow]
first_period_steady = false
flow_regime = "transient"
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
value = "1e-10 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
value = "0.10 -"

[flow.ic]
kind = "custom"
value = "100.0 m"

[flow.bc.west_side]
kind = "dirichlet"
value = "100.0 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "100.0 m"

[flow.sinks_sources.recharge]
first_clim = "mean"
negative_to_evt = true

[data]
types = ["recharge"]
inference_mode = "warn"

[[data.recharge.sources]]
source = "synthetic"
values = [10.0]

[display]
enabled = false
