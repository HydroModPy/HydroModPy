# Default-engine `flow/boussinesq` variant: what a run with
# solvers = ["boussinesq"] and no runtime key gets. The validation runtime reads
# `[flow]` defaults from this file and drops every runtime key of the case, so
# the FlowConfig defaults apply: runtime_backend = "auto" with the regularized
# partition surface closure. "auto" runs the dense local engine up to 400 cells
# and scipy_sparse above. In transient each stress period takes the
# [simulation.time].substeps_per_period backward-Euler steps of the case.

[flow]
# One key is set, the Newton closure, for the reason the MODFLOW validation
# profiles tighten theirs. The default 1e-9 m3/s per cell is absolute: here a
# triangle receives 3.6e-7 m3/s of recharge and the 100 m aquifer lifts a
# mound of 1.5 cm only, so Newton stopped 1.7e-5 m off the steady profile,
# worse than MODFLOW. From 1e-12 m3/s the final RMSE reads 1.6e-6 m.
runtime_tol_residual_inf = 1e-12
