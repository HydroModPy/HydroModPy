
[workflow]
mode = "simulation"

[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf_verbose = false
mf6_ims_complexity = "COMPLEX"

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid.vertical]
nlay = 1

[mesh]
engine = "voronoi"

[mesh.triangle]
path = "../../../shared/mesh_bundles/brutsaert_recession_boussinesq_thin_irregular_tri_50x30/mesh_2d.msh"

[mesh.voronoi]
seeds = "triangulation"
