case_id = "brutsaert_recession_boussinesq_thin_1d"
category = "analytical"
regime = "transient"
dimension = "1d"
config_file = "config_modflownwt.toml"
default_solver = "modflow_nwt"
base_config = "config_common.toml"

[config_files]
modflow_nwt = "config_modflownwt.toml"
modflow6 = "config_modflow6.toml"
modflow6_irregular_tri = "config_modflow6_irregular_tri.toml"
boussinesq = "config_boussinesq.toml"
boussinesq_local = "config_boussinesq_local.toml"

[workspace]
results_folder_name = "results_simulations"

[output]
observable_name = "outlet_discharge_east_side_m3_s"
expected_periods = 128
head_observable_name = "watertable_elevation"

[output.warmup_periods_by_solver]
modflow_nwt = 1
modflow6 = 1
modflow6_irregular_tri = 1
boussinesq = 0
boussinesq_local = 0

[time]
nper = 128
dt_seconds = 86400.0

[runtime]
acceptable_steady_residual_inf = 1e-6

# The strip geometry and hydraulics come from config_common.toml. The late
# law holds once the water table has the separable shape: an independent
# fine-grid Boussinesq solution started from the same steady state matches the
# law to 1e-4 from day 16 on.
[reference]
solution = "nonlinear"
compare_start_day = 16.0
late_window_start_day = 16.0
