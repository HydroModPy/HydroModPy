
[workflow]
mode = "simulation"

[simulation]
name = "Hantush recharge mound 2D validation"
description = "Synthetic transient unconfined flow under a rectangle of uniform recharge, fixed heads far away on all outer boundaries."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-01-10 23:00:00"
step_value = "6 hour"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflow_nwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_hantush_recharge_mound_2d"

[geographic.synthetic.grid]
length_x = "2020.0 m"
length_y = "2020.0 m"
nx = 101
ny = 101

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 60.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "60.0 m"

[data]
types = ["recharge"]

# A rectangle of 300 m x 180 m at 20 mm/day, zero elsewhere: a raster of the
# model grid, so each cell centre reads the pixel it sits in.
[[data.recharge.sources]]
source = "custom"
path = "recharge_zone.tif"
source_unit = "mm/day"

[flow]
first_period_steady = false
flow_regime = "transient"
active_sinks_sources = ["recharge"]
active_bc = ["west_side", "east_side", "north_side", "south_side"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "4e-5 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
value = "1e-10 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
value = "0.15 -"

[flow.ic]
type = "custom"
value = "50.0 m"

[flow.sinks_sources.recharge]
spatial_mode = "heterogeneous"
interpolation_method = "nearest"

[flow.bc.west_side]
kind = "dirichlet"
value = "50.0 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "50.0 m"

[flow.bc.north_side]
kind = "dirichlet"
value = "50.0 m"

[flow.bc.south_side]
kind = "dirichlet"
value = "50.0 m"

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 101
ny = 101
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
