[workflow]
mode = "simulation"

[simulation]
name = "Hillslope recharge step interception val"
description = "Synthetic transient unconfined flow on a hillslope: a recharge step, an outlet head at the toe, drained at the land surface."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-04-30 00:00:00"
step_value = "10 day"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflow_nwt"]

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_hillslope_recharge_step_interception"

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "30.0 m"
nx = 40
ny = 3

[geographic.synthetic.topography]
kind = "linear"
# The surface is 5.0 m, the outlet head, at the centre of the last column
# (x = 395 m, where the model holds the head): 5 + 0.0125 * (395 - x) is 9.875 m
# at the centre of the first column.
base_elevation = 5.0
right_to_left_amplitude = 4.875

[domain]

[domain.depth_model]
kind = "flat_substratum"
substratum_elevation = 0.0

[flow]
first_period_steady = false
flow_regime = "transient"
active_sinks_sources = ["recharge"]
active_bc = ["east_side", "drainage"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
value = "1e-10 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
value = "0.10 -"

[flow.ic]
type = "custom"
value = "5.0 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "5.0 m"

[flow.bc.drainage]
application_domain = "top"
kind = "cauchy"
# No conductance: each drain takes C = K * cell_area / b with b = 1 m.
value = "0.0 m2/s"

[flow.sinks_sources.recharge]
first_clim = "mean"

[data]
types = ["recharge"]
inference_mode = "warn"

[[data.recharge.sources]]
source = "synthetic"
values = [2.0]

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
