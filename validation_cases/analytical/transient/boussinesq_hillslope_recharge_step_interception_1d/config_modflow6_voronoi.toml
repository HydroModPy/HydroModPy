[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf_verbose = false
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 1e-8
mf6_inner_dvclose = 1e-9
mf6_inner_rclose = 1e-11
# The stock ILUT (fill 5, drop 1e-4) with BICGSTAB stalls on the unstructured
# Newton matrix: every inner solve hits the 500 cap and the outer loop creeps.
mf6_preconditioner_levels = 40
mf6_preconditioner_drop_tolerance = 0.0

[modflow6.process_specific]
vka = 1.0

[geographic.synthetic.grid]
length_x = "400.0 m"
length_y = "30.0 m"
nx = 160
ny = 12

[geographic.synthetic.topography]
base_elevation = 5.015625
right_to_left_amplitude = 4.96875

[mesh]
engine = "voronoi"

[mesh.triangle]
path = "../../steady/boussinesq_hillslope_interception_1d/mesh_bundles/boussinesq_hillslope_interception_irregular_tri_400x30/mesh_2d.msh"

[mesh.voronoi]
seeds = "triangulation"

[domain.layers]
nlay = 1

# A 2.5 m raster (160 x 12) under the 10 m columns of the structured grids: a
# linear surface is flat past the centre of the end raster columns, 1.25 m from
# the faces. The surface is 5.0 m, the outlet head, at the held cells: on the nodes of the east
# face, x = 400 m.
