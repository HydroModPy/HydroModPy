default 'auto' engine runs scipy_sparse, one backward-Euler step a period as
MODFLOW does, and on 50 x 5 square cells of 2 m it reads space-time RMSE
0.0061 m, max error 0.033 m, final RMSE 0.0027 m, against 6.1e-3, 3.3e-2 and
2.8e-3 m for MODFLOW. The strip is uniform across rows, so a row spread is
