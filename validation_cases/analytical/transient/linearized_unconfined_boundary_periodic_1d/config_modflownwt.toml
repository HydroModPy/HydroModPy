
[workflow]
mode = "simulation"

[simulation]
name = "LU boundary periodic val"
description = "Synthetic transient unconfined flow with a tidal west-boundary head read as hourly means and a fixed east boundary."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-01-08 23:00:00"
step_value = "1 hour"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflow_nwt"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "val_lu_boundary_periodic"

[geographic.synthetic.grid]
length_x = "100.0 m"
length_y = "10.0 m"
nx = 50
ny = 5

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 20.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "20.0 m"

[flow]
first_period_steady = false
flow_regime = "transient"
active_sinks_sources = []
active_bc = ["west_side", "east_side"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
value = "1e-10 m-1"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
value = "0.2 -"

[flow.ic]
type = "custom"
value = "10.0 m"

[flow.bc.west_side]
kind = "dirichlet"

# Hourly mean sea level: each stress period takes the mean of the samples
# stamped in it, here one sample per period.
[flow.bc.west_side.forcing]
mode = "csv"
path_file = "west_head_tide.csv"
aggregate = "mean"

[flow.bc.east_side]
kind = "dirichlet"
value = "10.0 m"

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 50
ny = 5
resampling = "nearest"

[modflownwt.sgrid.vertical]
nlay = 1

[display]
enabled = false
