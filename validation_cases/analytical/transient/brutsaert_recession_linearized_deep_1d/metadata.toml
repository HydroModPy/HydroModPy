case_id = "brutsaert_recession_linearized_deep_1d"
category = "analytical"
regime = "transient"
dimension = "1d"
config_file = "config_modflownwt.toml"
default_solver = "modflow_nwt"
base_config = "config_common.toml"

[config_files]
modflow_nwt = "config_modflownwt.toml"
modflow6 = "config_modflow6.toml"
modflow6_irregular_tri = "config_modflow6_irregular_tri.toml"
boussinesq = "config_boussinesq.toml"
boussinesq_local = "config_boussinesq_local.toml"

[workspace]
results_folder_name = "results_simulations"

[output]
observable_name = "outlet_discharge_east_side_m3_s"
expected_periods = 9
head_observable_name = "watertable_elevation"

[output.warmup_periods_by_solver]
modflow_nwt = 1
modflow6 = 1
modflow6_irregular_tri = 1
boussinesq = 0
boussinesq_local = 0

[time]
nper = 9
dt_seconds = 864000.0

[runtime]
acceptable_steady_residual_inf = 1e-6

# The strip geometry and hydraulics come from config_common.toml. The series
# solution covers the whole recession; from day 30 the second mode is below
# 1e-8 of the first, so the late window sees the single exponential.
[reference]
solution = "linear"
compare_start_day = 0.0
late_window_start_day = 30.0
