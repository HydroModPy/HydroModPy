# Derived from a time-step refinement of this case on MODFLOW 6 and
# MODFLOW-NWT, 10 to 400 steps per 10-day period. The reference is the
# linearized series solution from the steady warm-up, averaged over each
# period as the run averages its steps. With dx = 10 m the space error on the
# decay rate is about 1e-4, so the time step sets the bounds.
[discharge]
# Whole series, scaled by Q0, twice the measurement at 100 steps: RMSE 8.4e-4
# to 9.3e-4, maximum 2.2e-3 to 2.4e-3, on the first period. The maximum falls
# with the step, 6.4e-3, 2.2e-3 and 1.15e-3 at 25, 100 and 400 steps (MF6), to a
# floor of 1.1e-3 on the first two periods that a 5 m grid does not move (2.1e-3
# at 100 steps).
relative_rmse = 2e-3
relative_max_error = 5e-3

[recession]
# Fitted decay rate of the tail against pi^2 K D / (4 Sy B^2). Backward Euler
# lowers it by a dt / 2 = 0.33 % at 100 steps a period; measured -0.32 to
# -0.34 %, -0.22 % on the triangles.
coefficient_relative_error = 5e-3
# Fitted b against 1. From day 30 the head rise is below 0.1 % of D, so the
# nonlinearity moves b by less than 1e-3; measured 3e-4 to 7.5e-4.
exponent_abs_error = 2e-3
# RMSE of Q / Q_ref - 1 from day 30 to day 90. The rate bias accumulates to
# (a dt / 2) a t, 0.7 % at day 30 and 2.0 % at day 90, RMS 1.4 %; measured
# 0.57 to 0.61 % against the period means, 0.32 % on the triangles.
late_relative_rmse = 0.015

[uniformity]
row_spread = 1e-6

[monotonicity]
max_positive_increment_m3_s = 1e-12

[doc]
reason = """
The run stores the mean discharge of each 10-day period, over its 100
backward-Euler steps, and the reference is the mean of the series solution over
the same period. Twice the measured error: relative RMSE 8.4e-4 to 9.3e-4,
maximum 2.2e-3 to 2.4e-3, on the first period, where the fast modes decay
within a few steps. The maximum falls with the step, 6.4e-3, 2.2e-3 and 1.15e-3
at 25, 100 and 400 steps a period on MODFLOW 6, down to a floor of 1.1e-3 on
the first two periods that a 5 m grid leaves where it is. Until 2026-10-10 the
run stored the discharge of the last step of each period and the reference was
read at the period end: RMSE 1.3e-4, maximum 2e-4.
"""
