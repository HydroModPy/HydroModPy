[discharge]
relative_rmse = 2e-3
relative_max_error = 5e-3

[recession]
coefficient_relative_error = 5e-3
exponent_abs_error = 2e-3
late_relative_rmse = 0.015

[uniformity]
row_spread = 1e-6

[monotonicity]
max_positive_increment_m3_s = 1e-12

[doc]
reason = """
The band of tolerances.toml, shared with MODFLOW. The default 'auto' engine runs
local on these 240 cells and takes the 100 backward-Euler steps a period of the
case, as MODFLOW does, and stores the mean discharge of each period. With the
Newton closure of the case (1e-12 m3/s, see config_boussinesq_local.toml) it
reads relative RMSE 8.4e-4, maximum 2.2e-3 against the period means of the
series solution, decay rate -0.31 %, |b - 1| 2.7e-4 and late RMSE 0.0054, the
PETSc values to three digits, against 8.4e-4 to 9.0e-4, 2.2e-3 to 2.3e-3,
-0.32 to -0.34 %, 2.7e-4 to 4.7e-4 and 0.0057 to 0.0061 for MODFLOW on the grid. Before 2026-10-09 this engine took one step a period whatever the case
asked.
"""
