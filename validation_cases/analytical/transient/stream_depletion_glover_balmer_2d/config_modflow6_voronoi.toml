
[workflow]
mode = "simulation"

[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf_verbose = false
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 1e-9
mf6_inner_dvclose = 1e-10
mf6_inner_rclose = 1e-10

[modflow6.process_specific]
vka = 1.0

[modflow6.sgrid]
# One cell per bundle node, centred on the node (the Voronoi dual of the triangles).
grid_dual = "voronoi"

[modflow6.sgrid.vertical]
nlay = 1

# The well is a node of the mesh, so the dual cell that holds it is centred
# on the well.
[flow.sinks_sources.wells.P1]
units = "m3/day"
description = "Pumping well 100 m from the stream, on the Voronoi dual of the refined mesh"

[flow.sinks_sources.wells.P1.location]
kind = "absolute_xy"
layer = 0
x = 105.0
y = 805.0

[flow.sinks_sources.wells.P1.forcing]
value = -300.0
kind = "constant"

[mesh_input]
mesh_path = "../../../shared/mesh_bundles/stream_depletion_glover_balmer_tri_refined_well/mesh_2d.msh"
bundle_dir = "../../../shared/mesh_bundles/stream_depletion_glover_balmer_tri_refined_well"
