[simulation]
name = "Late-time unconfined pumping 2D validation"
description = "Synthetic transient unconfined flow with one central pumping well and fixed heads on all outer boundaries."

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-01-15 23:00:00"
step_value = "12 hour"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflownwt"]

[workspace]
catch_name = "val_late_time_unconfined_pumping_2d"
out_dir_path = "../results"
data_path = "."

[geographic]
source_mode = "synthetic"
crs_project = "EPSG:2154"

[geographic.synthetic]
case_id = "val_late_time_unconfined_pumping_2d"

[geographic.synthetic.grid]
length_x = "2000.0 m"
length_y = "2000.0 m"
nx = 101
ny = 101
xmin = 0.0
ymin = 0.0
crs = "EPSG:2154"
nodata = -9999.0

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 40.0
right_to_left_amplitude = 0.0

[domain]
support_mode = "none"

[domain.depth_model]
type = "constant_thickness"
thickness = "40.0 m"

[flow]
flow_regime = "transient"
active_sinks_sources = ["wells"]
active_bc = ["west_side", "east_side", "north_side", "south_side"]
param_list = ["K", "Ss", "Sy"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"

[flow.param.K.field_homogeneous]
value = "1e-4 m/s"

[flow.param.K.field_vertical_profile]
mode = "none"
characteristic_depth = "10.0 m"
min_factor = 1.0
depths = [0.0, 20.0, 40.0]
factors = [1.0, 1.0, 1.0]
interpolation = "linear"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"

[flow.param.Ss.field_homogeneous]
value = "1e-5 m-1"

[flow.param.Ss.field_vertical_profile]
mode = "none"
characteristic_depth = "10.0 m"
min_factor = 1.0
depths = [0.0, 20.0, 40.0]
factors = [1.0, 1.0, 1.0]
interpolation = "linear"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"

[flow.param.Sy.field_homogeneous]
value = "0.15 -"

[flow.param.Sy.field_vertical_profile]
mode = "none"
characteristic_depth = "10.0 m"
min_factor = 1.0
depths = [0.0, 20.0, 40.0]
factors = [1.0, 1.0, 1.0]
interpolation = "linear"

[flow.ic]
type = "custom"
value = "30.0 m"

[flow.bc.dirichlet.west_side]
type = "dirichlet"
value = "30.0 m"

[flow.bc.dirichlet.east_side]
type = "dirichlet"
value = "30.0 m"

[flow.bc.dirichlet.north_side]
type = "dirichlet"
value = "30.0 m"

[flow.bc.dirichlet.south_side]
type = "dirichlet"
value = "30.0 m"

[flow.sinks_sources.wells.P1]
cell = [0, 50, 50]
units = "m3/day"
description = "Central pumping well"

[flow.sinks_sources.wells.P1.forcing]
mode = "constant"
value = -1000.0

[modflownwt.runtime]
mf_version = "mfnwt"
mf_listunit = 2
mf_verbose = false
nwt_headtol = 1e-6
nwt_fluxtol = 1e-4
nwt_maxiterout = 500
nwt_thickfact = 1e-5
nwt_linmeth = 1
nwt_iprnwt = 0
nwt_ibotav = 1
nwt_options = "SIMPLE"
nwt_continue = false
nwt_backflag = 0
nwt_stoptol = 1e-10
dis_itmuni = 1
bas_hnoflo = -9999.0
upw_iphdry = 1
upw_hdry = -100.0
upw_layvka = 1
evt_nevtop = 3
evt_ievt = 1
evt_ipakcb = 1
oc_compact = true
wel_ipakcb = 1
lmt_output_file_name = "mt3d_link.ftl"
lmt_extension = "lmt8"
lmt_output_format = "unformatted"

[modflownwt.process_specific]
vka = 1.0
exdp = "1.0 m"

[modflownwt.sgrid.planar]
mode = "shape"
nx = 101
ny = 101
resampling = "nearest"

[modflownwt.sgrid.vertical]
lenuni = "m"
genmtd_lay = "constant"
nlay = 1
lay_decay = 1.0
nodata = -9999.0

[modflownwt.tgrid]
firstpersteady = false

[postprocess]
enabled = false

[display]
enabled = false
