[doc]
reason = """
Twice the error measured with the default 'auto' engine, which runs
scipy_sparse on the 10082 triangles of 71 x 71 squares (397 m2, the cell area
of the MODFLOW grid) with one backward-Euler step a period: space-time RMSE
0.0043 m, max error 0.0127 m, final RMSE 0.0038 m, final max error 0.0064 m,
azimuthal spread 0.0013 m. On 31 x 31 squares the space-time RMSE read
0.0084 m; from 61 x 61 on it stays at 0.0042 to 0.0045 m, the value MODFLOW
reads with the same single step a period: the rest is the time step and the
fixed-transmissivity Theis reference, not the mesh. The reference is read at
the centroid of the triangle each monitor point reads, with the well at the
centroid of the triangle that holds it, 6.6 m off the well point. Read from
the well point, that offset alone gave an azimuthal spread of 0.136 m on the
former 31 x 31 mesh.
"""
