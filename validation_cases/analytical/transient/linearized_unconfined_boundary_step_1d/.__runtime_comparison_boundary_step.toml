
[workflow]
mode = "comparison"

[comparison]
comparison_id = "lu_boundary_step_same_support"
base_simulation_config = "C:/codes/HydroModPy/validation_cases/analytical/transient/linearized_unconfined_boundary_step_1d/config_modflownwt.toml"
