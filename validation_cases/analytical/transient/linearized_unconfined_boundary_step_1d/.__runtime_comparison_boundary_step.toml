root = "C:/codes/HydroModPy/tmp/lu_boundary_step_same_support_workspace"
output_root = "C:/codes/HydroModPy/tmp/lu_boundary_step_same_support_workspace"

[comparison.simulation.overlay.flow]
[comparison.simulation.overlay.flow.bc]
[comparison.simulation.overlay.flow.bc.dirichlet]
[comparison.simulation.overlay.flow.bc.dirichlet.west_side]
[comparison.simulation.overlay.flow.bc.dirichlet.west_side.forcing]
