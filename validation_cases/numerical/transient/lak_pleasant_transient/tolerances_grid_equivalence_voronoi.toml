# Tolerances for the LAK quad-vs-Voronoi grid-equivalence leg (tests/TOLERANCES.md,
# the row that follows row 42). The SAME lake-aquifer problem is solved on the 15x15
# quad DISV (225 cells, 40 m) and on a ragged Voronoi DISV (372 cells, 4 to 9 edges,
# 20 m cells over the lake) with identical physics (cross_grid.py).

[stage]
max_abs_stage_diff_m = 0.059

[exchange]
steady_exchange_rel_diff = 0.05

[budget]
budget_percent_discrepancy = 1.0

[mesh]
# The lattice of 20 m seeds tiles the 200 m x 200 m lake with 10 x 10 cells.
min_irregular_lake_cells = 100

[doc]
gap = """
