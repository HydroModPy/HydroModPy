# MODFLOW 6 on the Voronoi dual of the same skewed triangles: one cell per mesh
# node, centered on the node, with the two-point flux. The dual is orthogonal
# (the face between two cells is the bisector of their nodes), so the flux of a
# uniform gradient is exact without XT3D. The side heads sit on the face nodes.

[[simulation.process]]
solvers = ["modflow6"]

[modflow6.runtime]
mf6_ims_complexity = "COMPLEX"
mf6_outer_dvclose = 1e-9
mf6_inner_dvclose = 1e-10
mf6_inner_rclose = 1e-10
mf_verbose = false

[mesh]
engine = "voronoi"

[mesh.triangle]
path = "../../../shared/mesh_bundles/patch_test_skewed_triangles_100x40/mesh_2d.msh"

[mesh.voronoi]
seeds = "triangulation"

[domain.layers]
nlay = 1

