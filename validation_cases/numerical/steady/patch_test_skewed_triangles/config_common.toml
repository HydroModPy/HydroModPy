# Uniform flow through a 100 x 40 m strip of skewed triangles: a head of 50.2 m
# held on the west edge and 50.0 m on the east edge, no recharge, no-flow north
# and south. The aquifer runs from -1000 to 1000 m and the heads sit near its
# middle: the transmissivity is uniform to 2e-4, the steady head is linear in x
# to 5e-6 m, and the surface closure of the Boussinesq solver, which releases a
# share exp(-(1 - theta) / 0.05) of a positive balance at a saturation theta,
# stays below 1e-4 of it.

[workflow]
mode = "simulation"

[simulation]
name = "Patch test on skewed triangles"
description = "Steady uniform flow on a strip of skewed, non-isosceles triangles."

[[simulation.process]]
id = "flow_validation"
type = "flow"
solvers = ["modflow6"]

[workspace]
project_root = "."

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "validation_patch_test_skewed_triangles"

[geographic.synthetic.grid]
length_x = "100.0 m"
length_y = "40.0 m"
nx = 10
ny = 4

[geographic.synthetic.topography]
kind = "flat"
base_elevation = 1000.0

[domain]

[domain.depth_model]
kind = "constant_thickness"
thickness = "2000.0 m"

[flow]
flow_regime = "steady"
active_sinks_sources = []
active_bc = ["west_side", "east_side"]
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
value = "1e-4 m/s"

[flow.ic]
type = "custom"
value = "50.1 m"

[flow.bc.west_side]
kind = "dirichlet"
value = "50.2 m"

[flow.bc.east_side]
kind = "dirichlet"
value = "50.0 m"

[display]
enabled = false
