# The Boussinesq solver on its PETSc engine. The residual is the one of the
# default engine (the two-point flux between triangle centroids), so the result
# is the same; the keys are those of the Dupuit fixed-head case.

[[simulation.process]]
solvers = ["boussinesq"]

[flow]
runtime_backend = "petsc"
surface_interaction_model = "vi_obstacle"

[mesh_input]
mesh_path = "../../../shared/mesh_bundles/patch_test_skewed_triangles_100x40/mesh_2d.msh"
bundle_dir = "../../../shared/mesh_bundles/patch_test_skewed_triangles_100x40"
