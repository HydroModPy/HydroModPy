# Import rules inside hydromodpy/solver.
# Checked by test_package_layouts.py.

# Each part of hydromodpy/solver lists the parts of hydromodpy/solver it may
# import. A part may always import itself. "<init>" is the package facade,
# hydromodpy/solver/__init__.py. A part is a subpackage or a module at the
# root of the package. What lies outside hydromodpy/solver is the business of
# layer_matrix.yaml.
#
# Rows are written lowest first: a row names only rows written above it, so
# this table cannot allow a cycle.
allowed:
  base: []
  modflow_grid: [base]
  modflow_common: [base, modflow_grid]
  boussinesq: [base]
  modflow6: [base, modflow_common, modflow_grid]
  modflow_nwt: [base, modflow_common, modflow_grid]
  "<init>": [base]

# The flow backends. No backend reads another one, whatever the order of the
# rows above (test_a_backend_never_imports_another_backend). What two MODFLOW
# backends share lives in modflow_common and modflow_grid.
backends: [boussinesq, modflow6, modflow_nwt]

# base/registry.py names the built-in adapters and extractors by a dotted path
# written as text, imported on the first lookup that asks for one. Only this
# file may name a module of solver that way.
text_paths:
  - hydromodpy/solver/base/registry.py

# What another layer of hydromodpy may import from hydromodpy/solver.
# Everything else is private to hydromodpy/solver.
public:
  - hydromodpy.solver
  - hydromodpy.solver.base.*
  # Read by cli and workflow to find the binaries and run the flow adapter.
  - hydromodpy.solver.modflow_common.binaries
  - hydromodpy.solver.modflow_common.flow_adapter_helpers
