# Import rules inside hydromodpy/mesh, described in hydromodpy/mesh/README.md.
# Checked by test_package_layouts.py. A part is a root module or a subpackage of
# hydromodpy/mesh; it may always import itself. "<init>" is the package facade,
# a docstring only. ``from hydromodpy.mesh import registry`` counts as an import
# of "<init>". What lies outside hydromodpy/mesh is the business of
# layer_matrix.yaml.
#
# Rows are written lowest first: a row names only rows written above it, so
# this table cannot allow a cycle.
allowed:
  "<init>":          []
  planar:            []
  request:           []
  refinement_config: []
  mesh_config:       ["<init>", refinement_config]
  resample:          [planar, request]
  cells:             [planar, request]
  io:                [planar]
  stored:            [planar]
  port:              [planar, request]
  registry:          [port]
  engines:           [stored, cells, planar, port, request, resample]
  planning:          ["<init>", io, mesh_config, planar, refinement_config, request, resample]

# registry.py names the built-in engines by a dotted path written as text,
# imported on the first lookup, so resolving "regular" never imports gmsh.
# Only this file may name a module of mesh that way.
text_paths:
  - hydromodpy/mesh/registry.py

# What another layer of hydromodpy may import from hydromodpy/mesh. The engines,
# resample.py and the inner modules of planning are private: a caller builds a
# mesh through the registry and the planner.
public:
  - hydromodpy.mesh
  - hydromodpy.mesh.request
  - hydromodpy.mesh.mesh_config
  - hydromodpy.mesh.refinement_config
  - hydromodpy.mesh.port
  - hydromodpy.mesh.registry
  - hydromodpy.mesh.stored
  - hydromodpy.mesh.planar.*
  - hydromodpy.mesh.cells.*
  - hydromodpy.mesh.io.*
  - hydromodpy.mesh.planning.plan
  - hydromodpy.mesh.planning.inputs
  - hydromodpy.mesh.planning.geology_contacts
  - hydromodpy.mesh.planning.input_triangulation
  - hydromodpy.mesh.planning.lake_structures
  - hydromodpy.mesh.planning.refinement_zones
