# Layer matrix contract - see docs/developers/architecture.md.
#
# Each row lists the set of packages a source layer is allowed to import.
# A package always implicitly allows imports targeting itself.
# Packages absent from the row's list are forbidden (CI flags them).

allowed:
  "<root>":      ["<root>", core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, reporting, workflow, catalog, cli]
  core:          [core]
  schema:        [core, schema, config]
  config:        [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, reporting, workflow]
  physics:       [core, schema, physics]
  data:          [core, schema, data, spatial]
  spatial:       [core, schema, spatial]
  simulation:    [core, schema, physics, spatial, data, simulation]
  solver:        [core, schema, physics, spatial, solver, simulation]
  calibration:   [core, schema, physics, data, spatial, solver, simulation, calibration, results]
  results:       [core, schema, config, results, spatial]
  display:       [core, schema, results, display]
  analysis:      [core, schema, physics, data, results, display, analysis]
  # ``reporting`` hosts HTML composites (calibration session report,
  # comparison web report, streamlit UI). It assembles figures from
  # ``display`` and features from ``analysis`` so it sits above both.
  reporting:     [core, schema, config, results, display, analysis, reporting]
  workflow:      [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, reporting, workflow]
  # ``catalog`` is the V1 facade over the three DuckDB scopes (cache, project, index).
  # It reaches into ``core``, ``data`` and ``results`` to wrap the underlying
  # stores. The reverse (data/results importing catalog) is forbidden so the
  # facade stays a one-way wrapper.
  catalog:       [core, schema, data, results, catalog]
  # ``project`` hosts the public ``Project`` facade and its dispatch adapters.
  # It sits above the matrix (like ``cli``) so workflow/calibration launchers
  # can be bound to ``Project`` without lower layers depending on the facade.
  project:       [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, reporting, workflow, catalog, project]
  cli:           ["<root>", core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, reporting, workflow, catalog, project, cli]

# Cross-edges tolerated for now. Each tolerance must point at a documented
# rationale. Tighten over time.
tolerances:
  - {src: "<root>",    tgt: project,  reason: "root facade lazy-resolves Project through hydromodpy.project"}
  - {src: analysis,    tgt: display,  reason: "comparison exports reuse plot mesh loading"}
  - {src: analysis,    tgt: reporting, reason: "comparison experiment_launcher writes the HTML report at the end of the orchestration (candidate to move into workflow/)"}
  - {src: physics,     tgt: spatial,  reason: "FlowConfig embeds spatial FieldSection discriminated union"}
  - {src: core,        tgt: physics,  reason: "core.time.tmesh_* uses FlowRegime/normalize_flow_regime to validate steady vs transient stress periods"}
  - {src: data,        tgt: results,  reason: "cross-DB ATTACH bridge: data.DataEntry.used_by reads results.cross_db (commit 1bd5f31ef)"}
  - {src: results,     tgt: data,     reason: "cross-DB ATTACH bridge: results.cross_db reads DataCatalogDuckDB via ATTACH read-only (commit 1bd5f31ef)"}

# Files exempt from the layer rule. Bootstrap shims that wire forward refs,
# plus *.cases.run_*case.py CLI entrypoints that load HydroModPyConfig from a
# user-provided TOML (these are example runners, semantically closer to the
# `examples/` tree than to the layer they live under).
exempt_files:
  - hydromodpy/__init__.py
  - hydromodpy/_bootstrap.py
  - hydromodpy/__main__.py
  - hydromodpy/spatial/domain/cases/run_domain_case.py
  - hydromodpy/spatial/geographic/cases/reference_catchment_delineation_case/run_case.py
