# Layer matrix contract - see docs/developers/architecture.md.
#
# Each row lists the set of packages a source layer is allowed to import.
# A package always implicitly allows imports targeting itself.
# Packages absent from the row's list are forbidden (CI flags them).

allowed:
  "<root>":      ["<root>", core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, workflow, cli]
  core:          [core]
  schema:        [core, schema, config]
  config:        [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, workflow]
  physics:       [core, schema, physics]
  data:          [core, schema, data]
  spatial:       [core, schema, spatial]
  simulation:    [core, schema, physics, spatial, data, simulation]
  solver:        [core, schema, physics, spatial, solver, simulation]
  calibration:   [core, schema, physics, data, spatial, solver, simulation, calibration]
  results:       [core, schema, config, results]
  display:       [core, schema, results, display]
  analysis:      [core, schema, data, results, analysis]
  workflow:      [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, workflow]
  cli:           [core, schema, config, physics, data, spatial, simulation, solver, calibration, results, display, analysis, workflow, cli]

# Cross-edges tolerated for now. Each tolerance must point at a documented
# rationale. Empty until R0 lands. Tighten over time.
tolerances:
  - {src: data,        tgt: spatial,  reason: "geology field bridging"}
  - {src: calibration, tgt: results,  reason: "calibration reads catalog at planning time"}
  - {src: simulation,  tgt: solver,   reason: "simulation queries solver registry"}
  - {src: results,     tgt: spatial,  reason: "results stores spatial indices"}
  - {src: analysis,    tgt: physics,  reason: "history contract"}
  - {src: calibration, tgt: "<root>", reason: "trial promotion launches public Project facade"}
  - {src: cli,         tgt: "<root>", reason: "CLI dispatch delegates to public Project facade"}
  - {src: results,     tgt: "<root>", reason: "Run.rerun launches public Project facade"}
  - {src: workflow,    tgt: "<root>", reason: "sweep helper accepts Project facade instances"}
  - {src: analysis,    tgt: display,  reason: "comparison exports reuse plot mesh loading"}
  - {src: analysis,    tgt: solver,   reason: "comparison runtime resolves solver families"}
  - {src: results,     tgt: analysis, reason: "Run exposes stream-network diagnostics"}

# Files exempt from the layer rule. Bootstrap shims that wire forward refs,
# plus *.cases.run_*case.py CLI entrypoints that load HydroModPyConfig from a
# user-provided TOML (these are example runners, semantically closer to the
# `examples/` tree than to the layer they live under).
exempt_files:
  - hydromodpy/__init__.py
  - hydromodpy/_bootstrap.py
  - hydromodpy/__main__.py
  - hydromodpy/project.py
  - hydromodpy/spatial/domain/cases/run_domain_case.py
  - hydromodpy/spatial/geographic/cases/reference_catchment_delineation_case/run_case.py
