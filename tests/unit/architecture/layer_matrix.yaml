# Layer matrix contract. Source of truth for the architecture docs.
#
# Each row of ``allowed`` lists the packages a layer may import. A layer may
# always import itself. Anything absent from a row is forbidden.
#
# Rows are written lowest first: a row cites only rows written above it, so
# the matrix cannot hold a cycle. test_layer_matrix.py checks the order.
#
# ``allowed`` is the target tree: fourteen packages, the root facade and the
# ``python -m hydromodpy`` entry point. Every package of the target exists.
# ``transitional`` keeps only the imports that the root files and a few cli
# commands still make, each with its files and why. Every entry leaves as soon
# as the tree no longer needs it: the gate refuses an entry that nothing uses
# any more, so this file only shrinks.

allowed:
  core:        [core]
  schema:      [core, schema]
  catchment:   [core, schema, catchment]
  mesh:        [core, schema, catchment, mesh]
  # A property field lives on a mesh, and a drain condition reads the descent.
  model:       [core, schema, catchment, mesh, model]
  data:        [core, schema, catchment, mesh, model, data]
  # results never reads solver or config, and data never reads results.
  results:     [core, schema, catchment, mesh, model, results]
  # An extractor writes into a RunStore, so solver reads results.
  solver:      [core, schema, catchment, mesh, model, results, solver]
  calibration: [core, schema, catchment, mesh, model, data, results, solver, calibration]
  # display reads only core and results, so a figure stays generic.
  display:     [core, results, display]
  config:      [core, schema, catchment, mesh, model, data, results, solver, calibration, display, config]
  workflow:    [core, schema, catchment, mesh, model, data, results, solver, calibration, display, config, workflow]
  project:     [core, schema, catchment, mesh, model, data, results, solver, calibration, display, config, workflow, project]
  cli:         [core, schema, catchment, mesh, model, data, results, solver, calibration, display, config, workflow, project, cli]
  # The facade hydromodpy/__init__.py and the other modules at the root.
  "<root>":    ["<root>", core, project]
  # hydromodpy/__main__.py alone, which runs ``python -m hydromodpy``.
  "<main>":    ["<main>", cli]

transitional:
  # Imports of today that no row grants. Each one names its files and why, and
  # leaves once the root files live in project.
  edges:
    - src: "<root>"
      tgt: calibration
      files: [hydromodpy/_api.py, hydromodpy/_lazy.py]
      reason: &root_reason >-
        The verbs of _api.py and the lazy names of _lazy.py still sit at the
        root. The root reads only core and project once they live in project.
    - {src: "<root>", tgt: config,   files: [hydromodpy/_api.py, hydromodpy/_lazy.py], reason: *root_reason}
    - {src: "<root>", tgt: data,     files: [hydromodpy/_api.py, hydromodpy/_lazy.py], reason: *root_reason}
    - {src: "<root>", tgt: display,  files: [hydromodpy/_api.py, hydromodpy/_lazy.py], reason: *root_reason}
    - {src: "<root>", tgt: results,  files: [hydromodpy/_api.py, hydromodpy/_lazy.py], reason: *root_reason}
    - {src: "<root>", tgt: solver,   files: [hydromodpy/_lazy.py], reason: *root_reason}
    - {src: "<root>", tgt: workflow, files: [hydromodpy/_api.py, hydromodpy/_lazy.py], reason: *root_reason}
    # The root files also read the packages that were built from the old ones.
    - {src: "<root>", tgt: model,     files: [hydromodpy/_api.py], reason: *root_reason}
    - src: cli
      tgt: "<root>"
      files:
        - hydromodpy/cli/commands/calibrate.py
        - hydromodpy/cli/commands/example/add.py
        - hydromodpy/cli/commands/export.py
        - hydromodpy/cli/commands/spinup.py
      reason: >-
        These commands call the verbs through the facade. They call project
        once the verbs live there.

# Cross edges tolerated for good, each with its reason. The target has none.
tolerances: []

# Files exempt from the layer rule. The target has none.
exempt_files: []
