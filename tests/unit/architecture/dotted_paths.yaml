# What test_dotted_paths.py allows. The gate reads every dotted path written as a
# string in a known place and resolves it on disk. This file lists the strings that
# look like a module path and are not one, and the ones that point at nothing today.

not_modules:
  # Format ids of stored documents, such as hydromodpy.lock.v2 or hydromodpy.manifest.v.
  documents: '^hydromodpy\.[a-z_]+\.v\d*$'
  # Entry-point groups, read by the registries. None is a module.
  groups:
    - hydromodpy.calibration.evaluator
    - hydromodpy.calibration.optimizer
    - hydromodpy.export.format
    - hydromodpy.mesh.engine
    - hydromodpy.solver.extractor
    - hydromodpy.terrain.engine
  # Entry-point groups that are also real packages. They must resolve.
  groups_that_are_packages:
    - hydromodpy.solver
    - hydromodpy.data.source
  # Other names. A name with prefix: true stands for every module it starts.
  names:
    - {text: hydromodpy.lock, why: the lockfile name}
    - {text: hydromodpy.identity, why: the PNG text key of the identity block}
    - {text: hydromodpy.github.io, why: the documentation host in the Pages workflow}
    - {text: hydromodpy.core.io.http_client, why: a module retired by the fetch rework, kept as a refused name of hydromodpy._lazy}
    - {text: hydromodpy.core.io.pinned_download, why: a module retired by the fetch rework, kept as a refused name of hydromodpy._lazy}
    - {text: hydromodpy.data.workspace.custom_scan, why: a module retired by the fetch rework, kept as a refused name of hydromodpy._lazy}
    - {text: hydromodpy.core.contracts.data_cache_backend, why: a module retired with the data cache database, kept as a refused name of hydromodpy._lazy}
    - {text: hydromodpy.data.registry, why: a module retired with the data cache database, kept as a refused name of hydromodpy._lazy}
    - {text: hydromodpy.data.registry.backend, why: a module retired with the data cache database, kept as a refused name of hydromodpy._lazy}
