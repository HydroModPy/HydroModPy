# One row per site under hydromodpy/ that writes the state of the whole process:
# a global statement, matplotlib.use, a write of rcParams, rc_context,
# addHandler, removeHandler, catch_warnings, simplefilter, filterwarnings,
# signal.signal, os.chdir and sys.path.insert.
#
# The gate test_run_path.py walks the AST of the tree and
# refuses a site the table does not carry and a row no site matches, so a row
# leaves only with its code and the table only shrinks. A site is named by its
# file, its kind and the function that holds it (<module> at the top level).
#
# Classes. import, set once when the module is imported; process, set once per
# process by the command line or the main thread of a launch; cli, what only the
# command layer writes; trial_pipeline, the one global of rule 7; lock, written
# and given back while a lock of the module is held; once, a flag that keeps a
# repeated warning quiet; transitional, a row a later lot lifts, with the lot in
# lifted_by.

