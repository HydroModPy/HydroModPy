# The one network client of the tree, counted by the arbiter: the
# requests.Session() of core/io/fetch.py, made per call with trust_env off, so
# that the netrc, the proxies and the CA bundle of the environment are never
# read behind a download. A second site fails the gate.
network:
- file: hydromodpy/core/io/fetch.py
  client: requests-session
