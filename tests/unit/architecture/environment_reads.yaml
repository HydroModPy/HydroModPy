# One row per os.environ / os.getenv site in hydromodpy/, and one per network client.
#
# The scan is an AST walk of the working tree at gate time; the gate
# test_environment_reads.py refuses a site the table does not carry and a row
# no site matches, so rows leave only with the code that read them.
#
# Classes. machine, the one reader of an installation variable; process, once
# per process at import or at the start of a launched case; cli, what only the
# command layer composes; diagnostic, a switch of trace; child, the whole
# environment handed to a started process; transitional, a row a later lot
# lifts, with the lot in lifted_by.

