# Import rules inside hydromodpy/calibration, described in
# hydromodpy/calibration/README.md ("Import rules").
# Checked by test_package_layouts.py.

# Each part of hydromodpy/calibration lists the parts of hydromodpy/calibration
# it may import. A part may always import itself. "<init>" is the package
# facade, hydromodpy/calibration/__init__.py. A part is a subpackage or a
# module at the root of the package. What lies outside hydromodpy/calibration
# (core, schema, catchment, mesh, model, data, results, solver) is the
# business of layer_matrix.yaml; solver_access below narrows what
# layer_matrix.yaml lets calibration reach inside solver.
#
# Rows are written lowest first: a row names only rows written above it, so
# this table cannot allow a cycle.
allowed:
  targets: []
  criteria: []
  parameter_resolution: [targets]
  optim: [criteria]
  persistence: [optim]
  report: [persistence, optim]
  # optim only inside "if TYPE_CHECKING:", never at runtime
  # (test_evaluation_reads_optim_only_for_types).
  evaluation: [optim]
  # The calibration schema is cut in six modules, written lowest first.
  # optim and evaluation only from inside a validator, never at module level
  # (test_config_reads_the_upper_parts_only_inside_its_validators).
  config_terms: [optim]
  config_network: [config_terms, optim]
  config_outputs: [config_network, config_terms]
  config_objective: [config_network, config_terms, optim]
  config_phases: [config_terms, evaluation]
  # criteria, evaluation and optim only from inside a validator, never at
  # module level (same test).
  config:
    [
      config_objective,
      config_outputs,
      config_phases,
      config_terms,
      criteria,
      evaluation,
      optim,
    ]
  protocols: [config, config_network, config_objective, config_outputs, config_phases]
  observations: [config_network]
  metrics:
    [
      config,
      config_network,
      config_objective,
      config_outputs,
      config_terms,
      criteria,
      evaluation,
      observations,
      optim,
    ]
  runners:
    [
      config,
      config_objective,
      config_outputs,
      config_phases,
      config_terms,
      criteria,
      evaluation,
      metrics,
      optim,
      parameter_resolution,
      persistence,
      protocols,
      report,
    ]
  # The preflight is cut in four modules, written lowest first. The other
  # parts only from inside one of the checks, never at module level
  # (test_preflight_reads_the_other_parts_only_inside_its_checks).
  preflight_report: [protocols, runners]
  preflight_searches: [criteria, optim, runners]
  preflight_network:
    [
      criteria,
      metrics,
      optim,
      parameter_resolution,
      preflight_report,
      preflight_searches,
      runners,
    ]
  preflight:
    [
      criteria,
      metrics,
      observations,
      optim,
      parameter_resolution,
      preflight_network,
      preflight_report,
      preflight_searches,
      runners,
      targets,
    ]
  "<init>": []

# Rule 5: evaluation/registry.py names its two built-in evaluators
# (hydromodpy_pipeline -> runners.pipeline_evaluator, analytic_bowl ->
# evaluation.analytic_bowl) by a dotted path written as text, imported on the
# first lookup that asks for it. Both live below evaluation in the table
# above; the text path is how they join it without evaluation importing them
# at the top. Only this file may name a module of calibration that way.
text_paths:
  - hydromodpy/calibration/evaluation/registry.py

# Rule 4: the only modules of the solver layer calibration may import. A
# backend package (hydromodpy.solver.modflow6, .modflow_nwt, .modflow_common,
# .boussinesq) is never one of them, so a backend can be added or replaced
# without touching calibration.
solver_access:
  - hydromodpy.solver.base.*

# Rule 2: what another layer of hydromodpy may import from
# hydromodpy/calibration. None of these names a subtree: each is one
# module, exactly as calibration-README-cible.md "What other layers import"
# lists it. Everything else is private to hydromodpy/calibration.
public:
  - hydromodpy.calibration
  - hydromodpy.calibration.config
  - hydromodpy.calibration.targets
  - hydromodpy.calibration.parameter_resolution
  - hydromodpy.calibration.preflight
  - hydromodpy.calibration.preflight_report
  - hydromodpy.calibration.protocols
  - hydromodpy.calibration.protocols.registry
  - hydromodpy.calibration.report
  - hydromodpy.calibration.optim.parameters
  - hydromodpy.calibration.runners.cli_runner
  - hydromodpy.calibration.runners.document
  - hydromodpy.calibration.runners.staged_report
  - hydromodpy.calibration.runners.staged_runner
  - hydromodpy.calibration.runners.trial
  - hydromodpy.calibration.runners.programmatic_runner
  - hydromodpy.calibration.runners.promotion
  - hydromodpy.calibration.runners.session
  - hydromodpy.calibration.runners.recap
