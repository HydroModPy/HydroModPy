base_config = "step1_minimal.toml"
[simulation]
name = "nancon_step2_local"
[data]
types = ["hydrography", "hydrometry"]
[[data.hydrography.sources]]
source = "custom"
path = "nancon_stream_network.gpkg"
[[data.hydrometry.sources]]
source = "custom"
path = "hydrometry"
station_ids = ["NANCON"]
[display]
figures = [
    "watershed_id_card",
    "hydrographic_network_reference",
    "seepage_network_confusion_map",
    "downslope_distance_map",
]
[[export__append]]
variables = "hydrographic_network_reference"
