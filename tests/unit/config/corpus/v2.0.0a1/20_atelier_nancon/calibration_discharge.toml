base_config = "project.toml"
[workflow]
mode = "calibration"
[simulation]
name = "calib_discharge"
description = "Calibration Optuna de K et Sy vs KGE(debit)."
[simulation.time]
start_datetime = "2000-01-01"
end_datetime = "2002-12-31"
step_value = "1 month"
[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow_nwt"]
[domain.depth_model]
thickness = 30.0
[flow.param.Ss.field]
value = 1e-5
[calibration]
method = "optuna"
max_iter = 12
batch_size = 1
save_runs = "best_n"
save_best_n = 2
seed = 42
objective = "kge"
variable = "discharge"
use_cache = true
[calibration.parameters.K]
bounds = [1e-6, 1e-3]
[calibration.parameters.Sy]
bounds = [0.01, 0.30]
prior = "uniform"
