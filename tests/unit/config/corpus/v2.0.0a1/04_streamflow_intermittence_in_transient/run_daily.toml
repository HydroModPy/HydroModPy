base_config = "project.toml"
[simulation]
name = "nancon_intermittence_mf6_daily"
description = "Nancon catchment, daily transient 2000-2002, seasonal seepage intermittence."
[simulation.time]
step_value = "1 day"
[[data.recharge.sources]]
station_ids = ["NANCON_REA"]
[[data.runoff.sources]]
station_ids = ["NANCON_REA"]
[display]
figures__append = ["duration_curve", "recession"]
[display.overrides.seepage_map]
timestep = 1018
[display.overrides.cross_section]
timestep = 1018
