# Generated by hydromodpy.core.toml_io.io
# profile = 'expert'

export = []

[workflow]
mode = "simulation" # Workflow mode dispatched by `hmp run`.
verbosity = "normal" # How much the run prints on the console. The project debug log, `.hmp/logs/hydromodpy_debug.log`, records every DEBUG line whatever this says. `hmp run -q/-v/--debug` and the HMP_VERBOSITY environment variable both win over this field.
profile = false

[workspace]
project_root = "/home/proj" # Path to the project directory. Required in TOML configs.
root = "/home/proj" # Explicit shared data workspace root. When set, derives data_dir unless it is overridden. Result catalogs stay project-local by default.
catalog_path = "/home/proj/.hmp/index.duckdb" # Explicit path to the project index database. Defaults to <project_root>/.hmp/index.duckdb.
data_dir = "/home/proj/data" # Explicit path to the workspace data directory. Defaults to <root>/data.
runs_dir = "/home/proj/runs" # Explicit path to the directory holding one sub-directory per run. Defaults to <project_root>/runs.

[geographic]
source_mode = "standard" # Geographic runtime mode. 'standard' keeps the historical DEM/outlet/polygon workflow. 'synthetic' builds one analytical support from [geographic.synthetic].
dem_correc_type = "fill" # How the DEM is conditioned before the catchment is delineated. 'fill' (default) only raises cells: each closed depression is raised to its spill level, then a small gradient on the flats lets every cell drain. 'breach' mostly lowers cells: it carves a path through the barrier that closes a depression, after raising single-cell pits to their lowest neighbour, with no limit on length or depth and no fill afterwards (least-cost breaching, Lindsay 2016); it changes far fewer cells than 'fill' and can dig deep. 'capped_breach' lowers and raises: it breaches only within the limits of [geographic.capped_breach] (a maximum cumulative lowering and a maximum length, in metres), then fills every depression the limits refused (the hybrid of Lindsay 2016). The depth limit is a sum over the cells of a path, so it does not give the same landscape at every grid resolution. 'fill' is the default because it is the tool of the paper behind the network criterion (FillDepressions, Abherve et al. 2023), and the criterion itself fills the model top on the mesh by a priority flood: one conditioning rule from the DEM to the score.
domain_extent = "box" # Selects the DEM surface used for the domain. 'box' (default) keeps the full buffered rectangular support. 'watershed' / 'watershed_buff' select the catchment (optionally with a buffer ring) surface. Note: the MODFLOW 6 mesh still covers the buffered box (the buffer stays active for inter-basin exchange); out-of-watershed drainage is kept out of the catchment discharge by the DRN watershed-routing, not by an idomain mask. Experimental.
reuse_existing_outputs = false
write_intermediates = false

[geographic.catchment] # Catchment definition payload used when source_mode='standard'. Discriminated by 'catch_def' on the nested table: 'dem' | 'txt' | 'from_outlet_coord' | 'from_polyg_shp'.
dem_init_path = "/home/proj/dem.tif" # Path to the DEM raster used as input. For 'dem' and 'txt' modes: defines the model domain directly. For 'from_outlet_coord' and 'from_polyg_shp' modes: regional DEM used for flow analysis. May be left absent when [data.dem.sources] declares the DEM.
catch_def = "dem" # Catchment defined by the DEM raster extent.

[geographic.synthetic] # Synthetic geographic support used when source_mode='synthetic'. This analytical mode bypasses watershed delineation from external DEM files.
case_id = "flat20" # Identifier used by local case runners and outputs.

[geographic.synthetic.grid] # Synthetic grid definition (extent and cell size).
length_x = 100.0 # Total domain length along x (metres). Accepts inline units, e.g. '0.1 km'.
length_y = 1.0 # Total domain length along y (metres). Accepts inline units, e.g. '1 m'.
nx = 100 # Number of cells along x.
ny = 1 # Number of cells along y.
xmin = 0.0 # Lower x coordinate of the support extent.
ymin = 0.0 # Lower y coordinate of the support extent.
crs = "EPSG:2154" # Projected CRS attached to synthetic outputs.
nodata = -9999.0 # Nodata sentinel exported to raster artefacts.

[geographic.synthetic.topography] # Synthetic topography definition (shape, elevations, slope).
kind = "flat" # Analytical topography law: 'flat' keeps one constant elevation.
base_elevation = 20.0 # Constant surface elevation (m).

[geographic.river_network] # Optional DEM-derived river-network extraction settings. When disabled, no stream network is generated in geographic preprocessing.
enabled = false
threshold_mode = "area_km2" # Stream-initiation threshold selector. 'area_km2' uses contributing area in km^2. 'cells' uses contributing-cell count directly.
prune_short_streams = false
min_stream_length_m = 0.0 # Minimum stream length (metres) used by short-segment pruning. Accepts inline units (e.g. 0, 250, '250 m', '0.5 km').
compute_strahler_order = true
compute_stream_links = true
all_vertices = false

[geographic.enforce_lakes] # Optional lake hydro-enforcement of the routing DEM: carve the lake footprints so streams route into the lakes and drain to the outlet, without touching the model grid top.
enabled = false
slope = 0.003 # Ramp gradient (m per m of distance to the outlet). Small and positive so each lake slopes gently toward the outlet with no flat depression (a flat sink would make the breach crawl).
buffer_m = 15.0 # Buffer (metres) applied to each lake footprint to bridge inter-lake sills and knit the shoreline into the carve.
capture_radius_m = 0.0 # If > 0, run a SECOND delineation pass: any stream that dead-ends within this distance of a lake (a near-miss over a flat forebay) is carved to the lake and re-delineated, so its channel reaches the shoreline. 0 disables the capture pass (lake carve only).
capture_max_streams = 8 # Capture pass: cap on how many near-miss stream terminals are carved to lakes per pass (kept by decreasing flow accumulation).
capture_min_acc_fraction = 0.3 # Capture pass: keep only near-miss terminals whose flow accumulation is at least this fraction of the largest, so a tiny rivulet is not carved.

[geographic.dam_carve] # Optional dam structure-carve of the ground: lower the dam footprint to the valley floor, for the routing chain and the model top alike, so a cutoff wall sits at the dam on a raw DEM.
enabled = false
buffer_m = 40.0 # Half-width (metres) of the carved corridor around the dam trace. Make it a bit wider than one DEM/cell size so the whole dam body is brought to the valley floor.

[geographic.crossings] # Optional notch of the ground at the roads, railways and bridges that cross the generated channel tree: the embankment is lowered to the bed level read on both sides, and the catchment is delineated again on the notched ground.
enabled = false
kinds = ["road", "railway", "bridge"] # Structure kinds to notch. Weirs and dams are never notched.
notch_width = 10.0 # Width of the notch across the embankment, in metres. The channel pixel itself is always lowered, so a width below the cell size cuts one pixel. The width is applied along the embankment only, the run of channel pixels that stand above the bed line, never to the two pixels where the bed is read. Accepts inline units (e.g. 10, '10 m').
bed_reach = 50.0 # Distance along the channel, on each side of the crossing, where the bed level is read, in metres. The embankment is assumed narrower than twice this. The notch is the straight line between the two bed levels. A bed end that falls on the embankment of another crossing is read further along the channel, beyond it. Accepts inline units (e.g. 50, '50 m').
max_depth = 3.0 # Largest lowering of any pixel, in metres. A pixel that would be lowered more is lowered by this and counted as capped in the report: the embankment is then higher than the cap allows for, or the crossing sits on a ridge. Accepts inline units (e.g. 3, '3 m').
snap_radius = 30.0 # A point structure (a bridge of the ROE) farther than this from the channel tree is ignored, and so is a channel pixel farther than this from its crossing, in metres. A dam or a weir of the file, or a dam_carve line, within this distance of a crossing stops its notch. Accepts inline units (e.g. 30, '30 m').

[geographic.bed_regularization] # Optional least-change regularisation of the channel bed in the model top, on the pixels of the generated channel tree: the bed never rises downstream, crossing notches are gaps and declared weirs are drops.
enabled = false
min_slope = 0.0001 # Minimum drop of the fitted bed per metre along the channel (m/m), given to the flats the fit pools. The SFR default slope.

[domain]
zone_ids = [] # Zone identifiers Domain.set_zone is allowed to register. It is an allowlist, not a request: nothing here causes a zone to be built. 'catchment' and 'geology' are appended by the runtime because the binders write under those fixed names, and every support id is appended too, so what belongs here is a project's own zonations. Order is never read. Spatial-support declarations live under domain.supports.

[domain.supports] # Named spatial supports available to heterogeneous parameters. Each key is a support identifier referenced by field_spatial_id.

[domain.depth_model] # Vertical domain model configuration. Use 'constant_thickness', 'flat_substratum', or 'raster' with a [data.substratum] raster.
kind = "constant_thickness" # Depth-model kind discriminator. Use 'constant_thickness' to define bottom as top-thickness.
thickness = 50.0 # Constant aquifer thickness applied below topography (canonical metres). Accepts inline units, e.g. '0.2 km'.

[data]
types = [] # Ordered list of data-manager types explicitly requested in [data]. The launcher may append inferred types deduced from other sections (for example domain.zone_ids, flow.active_bc). Allowed values: 'crossings', 'dem', 'etp', 'geology', 'humidity', 'hydrography', 'hydrometry', 'intermittency', 'lake_abacus', 'lake_bathymetry', 'lake_geometry', 'lake_inflow', 'lake_levels', 'lake_outflow', 'lake_withdrawal', 'oceanic', 'piezometry', 'precipitation', 'radiation', 'recharge', 'runoff', 'soil_capacity', 'soil_moisture', 'substratum', 'temperature', 'water_quality', 'wind'.
inference_mode = "warn" # Policy applied when the planner infers types not explicitly listed in data.types. 'warn': keep inferred types and continue even if data.<type> is missing. 'strict': raise when an inferred type has no explicit data.<type> section (except geology, which can use its default typed config).

[flow]
runtime_backend = "local" # Optional nonlinear runtime backend hint used by the Boussinesq solver implementation. Other flow solvers may ignore this field.
surface_interaction_model = "auto" # Optional Boussinesq surface-interaction closure selector. 'regularized_partition' uses the Marcais-style q_ex = G_r(theta) R(balance) law; 'complementarity' uses the mixed PETSc q_ex-perp-(z_top-h) formulation; 'vi_obstacle' uses the experimental PETSc head-only VI obstacle formulation; 'auto' keeps the historical backend-dependent default.
vi_substeps_per_period = 1 # Fixed number of Backward-Euler substeps per stress period for the experimental PETSc VI obstacle runtime. Rate-based forcing values are kept unchanged on each substep.
vi_substep_on_failure = false
ts_vi_steps_per_period = 4 # Fixed PETSc TS Backward-Euler steps per stress period for the experimental TS VI obstacle runtime.
ts_vi_adapt = false
ts_vi_dt_min_fraction = 0.015625 # Minimum TS VI time-step as a fraction of the stress-period length.
ts_vi_dt_max_fraction = 0.25 # Maximum TS VI time-step as a fraction of the stress-period length.
ts_vi_type = "beuler" # PETSc TS type for the experimental TS VI obstacle runtime.
ts_vi_snes_type = "vinewtonrsls" # PETSc SNES type for the experimental TS VI obstacle runtime.
param_list = [] # Ordered list of flow-parameter identifiers used to build runtime parameters (for example ['K', 'Ss', 'Sy']).
active_sinks_sources = [] # Explicitly activated sink/source names for this flow run: 'recharge', 'wells', 'etp'. 'etp' means three things. Under MODFLOW-NWT the loaded ETP drives the EVT package. Under MODFLOW 6 it acts only in soil mode ([flow.sinks_sources.recharge.soil]), where it sends the ETP the soil left unmet to the EVT package; outside soil mode MODFLOW 6 ignores it and says so. Boussinesq rejects it at solver-contract validation. An empty list means no sink/source package is assembled by the solver.
active_bc = [] # Explicitly activated boundary-condition ids for this flow run. Allowed values are the canonical ids declared in the flow boundary-condition registry: 'ocean', 'stream', 'north_side', 'south_side', 'east_side', 'west_side', 'drainage', 'lake', 'reservoir'. 'lake'/'reservoir' build a MODFLOW 6 LAK advanced package and are only supported by the modflow6 backend. An empty list means no boundary-condition package is assembled by the solver.
flow_regime = "transient" # Global flow simulation regime used by solvers consuming [flow] (steady or transient).
first_period_steady = true

[flow.param] # Mapping of flow-parameter identifiers to native FieldParamConfig payloads.

[flow.ic.h] # Hydraulic-head initial condition payload.
description = "Initial condition 'h'" # Description of the initial condition
type = "top" # Initialize head at the top surface (full aquifer).

[flow.bc] # Mapping of flow boundary-condition payloads parsed from ``[flow.bc]``.

[flow.sinks_sources.wells] # Mapping of well ids to typed well payloads.

[flow.sinks_sources.lakes] # Mapping of lake ids to typed lake / reservoir payloads.

[flow.sinks_sources.sfr] # Mapping of stream-network ids to typed SFR payloads.

[flow.sinks_sources.flow_barriers] # Mapping of flow-barrier ids to typed HFB payloads (general addon, modflow6 backend only; declaring one activates it). A lake's dam cutoff wall is declared on the lake instead.

[transport]
param_list = [] # Inherited generic parameter list (excluded from transport serialization).
active_sinks_sources = [] # Ordered list of sink/source identifiers that are explicitly activated for this process. An empty list means no sink/source is active. Concrete process configs (e.g. FlowConfig) validate the allowed values.
active_bc = [] # Ordered list of boundary-condition identifiers that are explicitly activated for this process. An empty list means no boundary-condition package is assembled. Concrete process configs (e.g. FlowConfig) validate the allowed values.

[transport.param] # Inherited generic parameter map (excluded from transport serialization).

[transport.bc] # Inherited boundary-condition map (excluded from transport serialization).

[transport.sinks_sources] # Inherited sinks/sources map (excluded from transport serialization).

[transport.modpath.parameters] # Solver parameter block used by Modpath.
zone_partic = "domain" # Particle injection zone selector: 'domain', 'seepage_clip', or a raster path.
track_dir = "forward" # Particle tracking direction.
cell_div = 1 # Number of particles per axis in each cell.
zloc_div = false

[transport.mt3dms.parameters] # Solver parameter block used by Mt3dms.
spc_name = "NO3" # Name of transported species.
sconc_init = 0.0 # Initial concentration value (can be overridden at runtime).
sconc_input = 0.0 # Recharge concentration input value (can be overridden at runtime).
disp_long = 0.0 # Longitudinal dispersivity [L].
disp_transh = 0.0 # Horizontal transverse dispersivity ratio.
disp_transv = 0.0 # Vertical transverse dispersivity ratio.
diffu_coeff = 0.0 # Molecular diffusion coefficient in m2/s. The MODFLOW 6 GWT backend runs on the SI SECONDS clock, so this value is consumed per second (a per-day value is ~86400x too large).
scheme = "upstream" # Advection scheme for MODFLOW 6 GWT. upstream: robust but diffusive (default). central: least diffusive, may oscillate. TVD: accurate sharp fronts (Ogata-Banks).
rate_decay = 0.0 # Decay rate on the SI SECONDS clock used by the MODFLOW 6 GWT backend: 1/s for first-order (react_order=1), mass per volume per second for zero-order (react_order=0). A per-day value is ~86400x too large and annihilates the solute. Can be overridden at runtime.
plot_conc = true

[transport.modflow6gwt.parameters] # Solver parameter block used by Modflow6Transport.
spc_name = "NO3" # Name of transported species.
sconc_init = 0.0 # Initial concentration value (can be overridden at runtime).
sconc_input = 0.0 # Recharge concentration input value (can be overridden at runtime).
disp_long = 0.0 # Longitudinal dispersivity [L].
disp_transh = 0.0 # Horizontal transverse dispersivity ratio.
disp_transv = 0.0 # Vertical transverse dispersivity ratio.
diffu_coeff = 0.0 # Molecular diffusion coefficient in m2/s. The MODFLOW 6 GWT backend runs on the SI SECONDS clock, so this value is consumed per second (a per-day value is ~86400x too large).
scheme = "upstream" # Advection scheme for MODFLOW 6 GWT. upstream: robust but diffusive (default). central: least diffusive, may oscillate. TVD: accurate sharp fronts (Ogata-Banks).
rate_decay = 0.0 # Decay rate on the SI SECONDS clock used by the MODFLOW 6 GWT backend: 1/s for first-order (react_order=1), mass per volume per second for zero-order (react_order=0). A per-day value is ~86400x too large and annihilates the solute. Can be overridden at runtime.
plot_conc = true

[transport.modflow6prt.parameters] # Solver parameter block used by Modflow6Prt.
release_zone = "domain" # Particle release selector: 'domain', 'domain_nonriver', 'upstream', 'upstream_nonriver', 'river', 'outlet', or 'custom'.
upstream_top_quantile = 0.9 # Top-elevation quantile used by upstream release zones. A value of 0.90 selects cells in the highest 10 percent of active cell-top elevations.
outlet_bottom_quantile = 0.1 # Bottom-elevation quantile used by the 'outlet' release zone. A value of 0.10 selects cells in the lowest 10 percent of active cell-top elevations.
track_dir = "forward" # Particle tracking direction. MF6 PRT support is currently forward only.
local_z = 0.5 # Local vertical release coordinate within the cell.
extend_tracking = true
dry_tracking_method = "drop" # MF6 PRT behavior for dry-but-active cells.
exit_solve_tolerance = 1e-05 # PRT generalized Pollock exit solve tolerance. Matches the MF6 prt-prp.dfn default (1e-5), which works well for many problems.
write_track_csv = true
write_track_binary = true

[simulation]
name = "frozen_nwt" # Human-readable simulation name and the run's identity. When empty, derived from the TOML filename at load time (run_steady_nwt.toml -> steady_nwt); a programmatic run without a name gets a deterministic memorable slug.
tags = [] # Free-text tags attached at registration; editable later via 'hmp catalog tag'.
if_exists = "version" # Behavior when registering a simulation whose ``name`` already exists in this project. ``version`` (default) mints the next ``stem.vN`` and keeps every run addressable; ``replace`` trashes the predecessor (restorable, keeps its own name and version) and registers the new run under the next free ``stem.vN``; ``fail`` raises an error.
description = "" # Short free-text description of the simulation intent.

[[simulation.process]]
id = "flow_main" # User-facing identifier for the process. This id is required and must be unique within the simulation.
type = "flow" # Discriminator selecting the 'flow' process family.
solvers = ["modflow_nwt"] # Ordered list of active flow solver names. At least one solver is required for flow processes.

[simulation.results] # Results storage and export configuration loaded from [simulation.results]. Controls Catalog, derived variables, and automated exports.
keep_solver_files = false

[simulation.results.persistence] # Simulation-run persistence switch passed to the result catalog (DuckDB rows, Zarr fields, Parquet tables).
save_catalog = true
save_zarr = true
field_precision = "compact" # Precision of the time-varying field arrays of fields.zarr: heads, per-cell budget terms, derived fields, concentrations. 'compact' stores float32 with the mantissa rounded to nearest at 16 bits: each value moves by at most 2**-17 of itself (7.6e-6 relative, so at most 1 mm on a 130 m head and 7.6e-9 m3/s on a 1e-3 m3/s cell flux), and a daily run takes about a third of the disk. 'exact' keeps every value as computed, float64. Mesh geometry, topography, layer thickness, indices, coordinates and timestamps are never rounded.
save_parquet = true
compression = "zstd" # Codec DECLARED for Zarr field arrays and Parquet tables. The writers carry their own codec (zstd) and do not read this field, so changing it changes nothing today; it records the intent and is the field a writer would read once the choice is threaded through.
compression_level = 5 # Compression level DECLARED for those writers. Same as the codec: core/io/parquet.py and core/io/geoparquet.py hold level 5 and do not read this field. The default says 5 rather than 3 so the declaration at least matches the bytes actually written.

[simulation.results.derived] # Derived variable computation toggles.
watertable_elevation = false
watertable_depth = false
seepage_areas = false
release_flux = false
accumulation_flux = false
release_accumulation_flux = false
outflow_drain = false
concentration_seepage = false
mass_seepage = false
mass_accumulated = false

[simulation.results.budget] # Budget extraction configuration.
spatial_fields = false

[solver]
sink_fill = false
drain_bed_thickness_m = 1.0 # Metres. Thickness of the drain BED in the fallback conductance C = K * cell_area / bed_thickness, used when no drainage conductance is declared. A drain bed is the clogging layer at the bottom of a watercourse, decimetres to a metre; it is NOT the aquifer, and the layer thickness this used to borrow (30 m on the Nancon) has no physical relation to it. The value matters because it sets how much head the drain itself imposes to pass the recharge: dh = R * bed_thickness / K, independent of the cell size. On the Nancon at R = 439 mm/yr, 30 m gives 4.17 m of head at K = 1e-7 m/s and makes the drain the limiting resistance over two decades of a [1e-7, 1e-3] search; 1 m gives 13.9 cm and 0.1 m gives 1.4 cm. In this method the drain is a seepage face, so it must never limit: K and the recharge decide where water surfaces, not the boundary condition. Proportionality to K is preserved either way, so the K/R invariance the network criterion rests on is untouched.
drain_conductance_floor_m2_s = 1e-12 # m2/s. Floor applied to every DRN conductance, whether declared or derived from hk. It exists for degenerate cells only, a zero-thickness or zero-conductivity cell whose formula would divide by zero or emit a zero-conductance drain MODFLOW reads as absent. It is not a physical choice and moving it does not tune anything: a real conductance on a real cell is many orders of magnitude above it. Raise it only to make a degenerate mesh audible.
drain_band_depth_m = 0.0 # Metres. Depth D of the sub-cell discharge band every drain cell gets instead of a single elevation: the drain sits at top - D/2 and its conductance is multiplied by top_layer_thickness / D. The multiplier is the thickness and not the cell area because the conductance it scales is already Kv*A/b, so scaling by b/D gives Kv*A/D, which is CDRN exactly; scaling by A/D would give an m3/s where a conductance is m2/s, too high by A/b. The cell therefore starts discharging before the head reaches its mean elevation, and discharges harder the higher the head climbs into the band. This answers the one question the USGS documents about a model top, that the land inside a cell is not flat: UZF1 exposes the same depth as SURFDEP, 'the average undulation depth within a finite-difference cell', and MODFLOW 6 carries it into DRN as DDRN, with HDRN = land surface - DDRN/2 and CDRN = Kv*A/DDRN. MODFLOW 6 solves its DDRN band with a smooth (linear then cubic) curve; the option here is the piecewise equivalent of the same idea, applied identically by both MODFLOW backends, so a later switch to the native smooth form is a documented refinement and not a surprise. It does NOT move the topography: no elevation is raised, no DEM is rewritten, and every other package sees the surface it would have seen. The seepage criterion is the one reader that cannot: a banded cell discharges at top - D/2 and never climbs back to top, so the mask follows the band and the run persists D in its store for every figure drawn afterwards. It classifies no cell: every drain cell gets the same band, so nothing has to be sorted into artefact and real. Pick D the way Feinstein et al. 2020 (Groundwater 58:524-534, doi:10.1111/gwat.12931) do, from the standard deviation of the fine land-surface elevations inside a cell; they obtain 0.61 m. Mutually exclusive with solver.sink_fill, which answers the same question by removing drains instead. Default 0.0: one elevation per drain, unchanged from every earlier run.

[solver.backend] # Active flow backend selector (discriminated union).
backend = "modflow6" # Discriminator tag selecting the MODFLOW 6 flow backend.

[modflownwt.runtime.nwt] # NWT solver and executable settings.
version = "mfnwt" # MODFLOW executable/version identifier passed to FloPy.
listunit = 2 # Fortran unit number used for the MODFLOW list file.
verbose = false
headtol = 0.0001 # Head closure criterion for the NWT nonlinear solver.
fluxtol = 500.0 # Flux closure criterion for the NWT nonlinear solver.
maxiterout = 5000 # Maximum outer nonlinear iterations in the NWT solver.
thickfact = 1e-05 # NWT wetting/thickness factor controlling nonlinear updates.
linmeth = 1 # Linear solver choice for NWT (see MODFLOW-NWT documentation).
iprnwt = 1 # NWT print flag controlling iteration diagnostics in listing outputs.
ibotav = 1 # NWT option for averaging saturated thickness at the cell bottom.
options = "COMPLEX" # NWT nonlinear option keyword (for example SIMPLE or COMPLEX).
continue_run = false
backflag = 0 # NWT backtracking activation flag.
stoptol = 1e-10 # NWT backtracking stopping tolerance.

[modflownwt.runtime.dis] # DIS package settings.
itmuni = 0 # DIS time unit code (ITMUNI). Recorded, not obeyed: the launcher writes seconds because [simulation.time] already materializes every period length in seconds, so the run is in seconds whatever this says.

[modflownwt.runtime.bas] # BAS package settings.
hnoflo = -9999.0 # BAS no-flow head sentinel value (HNOFLO).

[modflownwt.runtime.upw] # UPW package settings.
iphdry = 1 # UPW dry-cell head output flag (IPHDRY).
hdry = -100.0 # UPW dry-cell head value (HDRY).
layvka = 1 # UPW flag controlling VKA interpretation per layer (LAYVKA).

[modflownwt.runtime.evt] # EVT package settings.
nevtop = 3 # EVT option code that defines how ET extinction depth is applied (NEVTOP).
ievt = 1 # EVT integer array selector used when NEVTOP requires layer indices (IEVT).
ipakcb = 1 # EVT cell-by-cell budget output flag (IPAKCB).

[modflownwt.runtime.oc] # OC package settings.
compact = true

[modflownwt.runtime.wel] # WEL package settings.
ipakcb = 1 # WEL cell-by-cell budget output flag (IPAKCB).

[modflownwt.runtime.lmt] # LMT package settings.
output_file_name = "mt3d_link.ftl" # LMT output filename used to couple MODFLOW to MT3DMS.
extension = "lmt8" # LMT package filename extension.
output_format = "unformatted" # LMT file format (typically 'formatted' or 'unformatted').

[modflownwt.process_specific] # Process-specific package controls (currently UPW/EVT knobs).
vka = 1.0 # Vertical hydraulic conductivity control passed to the UPW package (VKA).
exdp = 1.0 # Extinction depth (metres) used by the EVT package (EXDP). Accepts inline units, e.g. '1 m', '50 cm'.

[modflownwt.sgrid] # Spatial-grid payload split into `[...sgrid.planar]` and `[...sgrid.vertical]`.
grid_dual = "voronoi" # Applies only to a MODFLOW 6 run on a runtime gmsh mesh; ignored for structured grids, MODFLOW-NWT and Boussinesq (which keeps its own triangulation). 'voronoi' uses the PEBI dual (exact CVFD orthogonality, ~half the cells) and is the default; 'triangle' keeps the triangulation cells as the DISV grid for simplex comparison runs.

[modflownwt.sgrid.planar] # Planar discretization of the solver grid.
mode = "keep_native" # Planar solver-grid mode: keep the native domain support or resample to an explicit (ny, nx) target shape.
resampling = "bilinear" # Resampling rule applied when planar mode is 'resample_to_shape'.

[modflownwt.sgrid.vertical] # Vertical layering of the solver grid.
genmtd_lay = "constant" # Vertical-layering strategy.
nlay = 1 # Number of layers (required for constant/decay, ignored for list).
nodata = -9999.0 # No-data sentinel value.

[modflownwt.sgrid.top_sampling] # How the top of the solver grid is sampled from the DEM.
mode = "centroid" # Top-sampling strategy. 'centroid' samples the DEM at each cell generator, or resamples it to a structured grid (fast, the current behaviour, byte-identical default). 'zonal' reduces every DEM pixel inside a cell with per-class stats.
hillslope_stat = "median" # Zonal statistic over non-channel (hillslope) pixels inside a cell.
channel_stat = "min" # Zonal statistic over channel pixels inside a cell (thalweg-preserving; 'min' keeps the incised low).
channel_source = "streams_raster" # Where channel pixels come from when mode='zonal'. 'streams_raster' uses the delineated river-network raster reprojected onto the DEM grid; 'none' disables the channel class (every pixel is hillslope).
channel_buffer_px = 0 # Dilate the channel pixel mask by this many pixels before reducing, to capture a channel that grazes a cell without a pixel centre on it.
spike_guard_tol_m = 2.0 # Revert a hillslope cell's zonal value to the centroid sample when it deviates more than this many metres (guards nodata/edge spikes); channel cells are exempt since they are lowered on purpose. 0 disables the guard.
min_pixels = 3 # Minimum DEM pixels inside a cell to trust a hillslope zonal statistic; below this the cell falls back to the centroid sample. A channel cell uses its channel stat from a single thalweg pixel.
min_thickness_m = 0.1 # Minimum layer-0 thickness (m) kept after zonal top lowering, so a carved channel top never collides with the aquifer bottom.

[modflow6.runtime] # MODFLOW 6 runtime options.
mf6_executable_name = "mf6" # MODFLOW 6 executable name or absolute path.
ims_print_option = "NONE" # IMS PRINT_OPTION. 'SUMMARY' adds one line per time step to the listing with the outer and inner iteration counts, which is the only way to tell an expensive iteration from too many of them. Deliberately NOT tied to mf_verbose: that switch also sets print_input and print_flows on the whole model, and on a run with one drain per cell those print every boundary flux at every step. 'NONE' by default; 'SUMMARY' costs a line per step.
print_head = false
save_specific_discharge = true
save_saturation = true
mf6_runner = "subprocess" # MODFLOW 6 solve dispatch: 'subprocess' runs the mf6 executable, 'api' drives libmf6 via the optional modflowapi package. Both write the same simulation, so output extraction is identical.
mf6_ims_complexity = "COMPLEX" # IMS complexity preset for MODFLOW 6: SIMPLE, MODERATE, or COMPLEX.
mf_verbose = false
mf6_outer_dvclose = 0.0001 # IMS outer-iteration head-change convergence criterion.
mf6_inner_dvclose = 0.0001 # IMS inner-iteration head-change convergence criterion.
mf6_outer_maximum = 500 # Maximum number of IMS outer iterations.
mf6_inner_maximum = 500 # Maximum number of IMS inner iterations.
mf6_newton = true
mf6_newton_under_relaxation = true
mf6_ats = false
mf6_ats_dtmin_s = 60.0 # Minimum ATS time step in seconds (only used when mf6_ats is true).
mf6_rewet_wetfct = 0.1 # MF6 NPF rewet WETFCT factor.
mf6_rewet_iwetit = 1 # MF6 NPF rewet IWETIT interval.
mf6_rewet_ihdwet = 0 # MF6 NPF rewet IHDWET flag.
mf6_rewet_wetdry = 0.1 # MF6 NPF WETDRY threshold used when rewetting is active.

[modflow6.process_specific] # Process-specific controls for MODFLOW 6 flow packages.
vka = 1.0 # Uniform vertical anisotropy ratio kh/kv (dimensionless, > 0); k33 = k / vka. Default 1.0 is vertically isotropic. For spatial control declare a per-cell 'Kv' flow parameter instead, which is mutually exclusive with a non-unit vka and is a direct conductivity, never a mode-switched value. Vertical anisotropy is grid-aligned and needs no XT3D; a horizontal K22 field or an angle (not exposed here) would auto-activate XT3D.
evt_extinction_depth = 1.0 # Meters; extinction depth for the EVT sink used when recharge negatives are routed to EVT. The routed deficit tapers linearly from the cell top to this depth and stops below it, so a sustained climatic deficit can saturate near this value.
lak_forcing_mode = "auto" # How time-varying LAK forcings are written. 'inline' expands values into the LAK PERIOD block, emitting one row per stress period whenever the value changes. 'ts6' always routes non-constant forcings to external MF6 TS6 files. 'auto' keeps constant/short forcings inline and routes only genuinely long series (nper > ts6_min_periods) to TS6.
ts6_min_periods = 120 # Period count above which 'auto' mode offloads a non-constant LAK forcing to a TS6 file.

[modflow6.sgrid] # Solver-grid payload split into planar and vertical sections.
grid_dual = "voronoi" # Applies only to a MODFLOW 6 run on a runtime gmsh mesh; ignored for structured grids, MODFLOW-NWT and Boussinesq (which keeps its own triangulation). 'voronoi' uses the PEBI dual (exact CVFD orthogonality, ~half the cells) and is the default; 'triangle' keeps the triangulation cells as the DISV grid for simplex comparison runs.

[modflow6.sgrid.planar] # Planar discretization of the solver grid.
mode = "keep_native" # Planar solver-grid mode: keep the native domain support or resample to an explicit (ny, nx) target shape.
resampling = "bilinear" # Resampling rule applied when planar mode is 'resample_to_shape'.

[modflow6.sgrid.vertical] # Vertical layering of the solver grid.
genmtd_lay = "constant" # Vertical-layering strategy.
nlay = 1 # Number of layers (required for constant/decay, ignored for list).
nodata = -9999.0 # No-data sentinel value.

[modflow6.sgrid.top_sampling] # How the top of the solver grid is sampled from the DEM.
mode = "centroid" # Top-sampling strategy. 'centroid' samples the DEM at each cell generator, or resamples it to a structured grid (fast, the current behaviour, byte-identical default). 'zonal' reduces every DEM pixel inside a cell with per-class stats.
hillslope_stat = "median" # Zonal statistic over non-channel (hillslope) pixels inside a cell.
channel_stat = "min" # Zonal statistic over channel pixels inside a cell (thalweg-preserving; 'min' keeps the incised low).
channel_source = "streams_raster" # Where channel pixels come from when mode='zonal'. 'streams_raster' uses the delineated river-network raster reprojected onto the DEM grid; 'none' disables the channel class (every pixel is hillslope).
channel_buffer_px = 0 # Dilate the channel pixel mask by this many pixels before reducing, to capture a channel that grazes a cell without a pixel centre on it.
spike_guard_tol_m = 2.0 # Revert a hillslope cell's zonal value to the centroid sample when it deviates more than this many metres (guards nodata/edge spikes); channel cells are exempt since they are lowered on purpose. 0 disables the guard.
min_pixels = 3 # Minimum DEM pixels inside a cell to trust a hillslope zonal statistic; below this the cell falls back to the centroid sample. A channel cell uses its channel stat from a single thalweg pixel.
min_thickness_m = 0.1 # Minimum layer-0 thickness (m) kept after zonal top lowering, so a carved channel top never collides with the aquifer bottom.

[display]
enabled = true
backend = "auto" # Matplotlib backend. 'auto' selects Agg in headless mode and a GUI backend when ``show`` is enabled.
preset = "default" # Named theme applied before rendering any figure.
show = false
save = true
output_dir = "figures" # Name of the figures directory inside the run directory (<project>/runs/<run>/<output_dir>/). Declared as a name, not a path, so it stays anchored to the run it describes.
dpi = 150 # DPI used when saving raster figures.
cmap = "viridis" # Force ONE colormap onto every spatial figure. Writing it at all is the decision, not the value: each figure otherwise picks a scale suited to what it shows, reversed for a depth, diverging for a difference, discrete for an indicator, and this replaces all of them. Writing the default spelled out is therefore NOT a no-op, unlike everywhere else. Leave it out unless one scale for everything is what you want.
figures = [] # Names of registered figures to auto-render at the end of `hmp run` (and consumed by `hmp viz gallery`). Every name must exist in the figure registry; list them with `hmp viz list`. A figure whose requirements the run does not meet is skipped with an explicit reason. Empty list disables auto-rendering. Disable per-run via `hmp run --no-display` or for an entire Python Project via `Project(..., no_display=True)`.
on_error = "warn" # Behaviour when a figure that IS applicable fails while rendering. 'warn' logs and continues (default, keeps a long run alive); 'raise' propagates, which is what example and CI configs want so a broken figure cannot pass unnoticed.

[display.overrides] # Per-figure options, keyed by figure name (e.g. ``{'piezometric_map': {'cmap': 'cividis', 'vmin': 0}}``). A key the figure does not take is refused at load, with the list of the keys it takes. A figure that draws one instant takes `time`.

[persistence]
save_catalog = true
save_zarr = true
field_precision = "compact" # Precision of the time-varying field arrays of fields.zarr: heads, per-cell budget terms, derived fields, concentrations. 'compact' stores float32 with the mantissa rounded to nearest at 16 bits: each value moves by at most 2**-17 of itself (7.6e-6 relative, so at most 1 mm on a 130 m head and 7.6e-9 m3/s on a 1e-3 m3/s cell flux), and a daily run takes about a third of the disk. 'exact' keeps every value as computed, float64. Mesh geometry, topography, layer thickness, indices, coordinates and timestamps are never rounded.
save_parquet = true
compression = "zstd" # Codec DECLARED for Zarr field arrays and Parquet tables. The writers carry their own codec (zstd) and do not read this field, so changing it changes nothing today; it records the intent and is the field a writer would read once the choice is threaded through.
compression_level = 5 # Compression level DECLARED for those writers. Same as the codec: core/io/parquet.py and core/io/geoparquet.py hold level 5 and do not read this field. The default says 5 rather than 3 so the declaration at least matches the bytes actually written.

[observation]
points = [] # Observation points sampled once the run has produced its fields.
variables = ["head"] # Variables sampled at every point that does not name its own. Virtual fields (watertable_depth, seepage_mask ...) are accepted.
