export = []

[workflow]
mode = "simulation"

[site]
name = "island"

[geographic]
source_mode = "synthetic"

[geographic.synthetic]
case_id = "island"

[geographic.synthetic.grid]
length_x = 610.0
length_y = 610.0
nx = 31
ny = 31

[geographic.synthetic.topography]
kind = "radial_island"
base_elevation = -1.0
island_radius = 200.0
crest_elevation = 12.0

[domain.depth_model]
kind = "flat_substratum"
substratum_elevation = -5.0

[domain.layers]
nlay = 1

[data]
types = ["oceanic", "recharge", "piezometry"]
inference_mode = "warn"

[[data.oceanic.sources]]
source = "constant"
value = 0.0

[[data.piezometry.sources]]
source_unit = "m"
default_crs = "EPSG:2154"
source = "custom"
path = "piezometry"

[[data.recharge.sources]]
source = "synthetic"
values = [1.0]

[flow]
flow_regime = "steady"
param_list = ["K"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 2e-05

[flow.bc.ocean]
id = "ocean"
value = 0.0
description = "Dirichlet boundary condition 'ocean' on top"
units = "m"
kind = "dirichlet"
data_value = false
application_domain = "top"

[flow.bc.drainage]
id = "drainage"
value = 0.0
description = "Drain boundary condition on top"
units = "m2/s"
kind = "drain"
data_value = false
application_domain = "top"

[flow.ic]

[flow.sinks_sources.recharge]
first_clim = "mean"

[transport]

[simulation]
name = "calage"

[simulation.time]
start_datetime = 2003-01-01T00:00:00
end_datetime = 2003-01-02T00:00:00
step_value = 2
step_unit = "day"
coverage_policy = "ignore"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[simulation.results]
keep_solver_files = false

[simulation.results.persistence]
field_precision = "exact"

[solver]

[modflownwt]

[modflow6]

[display]
enabled = false

[observation]
