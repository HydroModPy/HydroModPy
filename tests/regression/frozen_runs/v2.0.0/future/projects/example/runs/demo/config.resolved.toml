edition = "2.0"
export = [
    { variables = "discharge", nodata = -9999.0 },
]

[workflow]
mode = "simulation"
verbosity = "normal"
profile = false

[workspace]
products_cap_mb = 5000

[geographic]
source_mode = "synthetic"
crs_project = "EPSG:2154"
dem_correc_type = "fill"
domain_extent = "box"
write_intermediates = false
terrain_engine = "whitebox_workflows"

[geographic.synthetic]
case_id = "example_synthetic"

[geographic.synthetic.grid]
length_x = 1000.0
length_y = 1000.0
nx = 20
ny = 20
xmin = 0.0
ymin = 0.0
crs = "EPSG:2154"
nodata = -9999.0

[geographic.synthetic.topography]
kind = "linear"
base_elevation = 20.0
right_to_left_amplitude = 5.0

[geographic.river_network]
enabled = false
threshold_mode = "area_km2"
prune_short_streams = false
min_stream_length_m = 0.0
compute_strahler_order = true
compute_stream_links = true
all_vertices = false

[geographic.enforce_lakes]
enabled = false

[geographic.crossings]
enabled = false
kinds = [
    "road",
    "railway",
    "bridge",
]
notch_width = 10.0
bed_reach = 50.0
max_depth = 3.0
snap_radius = 30.0

[geographic.bed_regularization]
enabled = false
min_slope = 0.0001

[domain]
zone_ids = []

[domain.supports]

[domain.depth_model]
kind = "constant_thickness"
thickness = 50.0

[domain.layers]
genmtd_lay = "constant"
nlay = 1
pinch_out = "pass_through"
nodata = -9999.0

[data]
types = []
inference_mode = "warn"

[flow]
flow_regime = "steady"
first_period_steady = true
param_list = [
    "K",
    "Sy",
]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 0.0001

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = 0.12

[flow.bc.drainage]
enabled = true
id = "drainage"
value = 0.0
description = "Drain boundary condition on top"
units = "m2/s"
kind = "drain"
data_value = false
application_domain = "top"

[flow.ic.h]
description = "Initial condition 'h'"
kind = "top"

[flow.sinks_sources.wells]

[flow.sinks_sources.lakes]

[flow.sinks_sources.sfr]

[flow.sinks_sources.flow_barriers]

[flow.sinks_sources.recharge]
enabled = true
values = 0.8
factor = 1.0
first_clim = "mean"
units = "mm/day"
negative_to_evt = true
spatial_mode = "auto"
interpolation_method = "nearest"

[transport]

[simulation]
name = "demo"
tags = []
if_exists = "version"
description = "Scaffolded synthetic steady-flow run under a uniform recharge."

[simulation.time]
start_datetime = 2000-01-01 00:00:00
end_datetime = 2000-12-31 00:00:00
step_value = 1
step_unit = "year"
substeps_per_period = 1
coverage_policy = "error"
window = "all"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = [
    "modflow_nwt",
]

[simulation.results]
keep_solver_files = false
keep_face_flows = false
keep_per_cell_budget = true

[simulation.results.persistence]
save_catalog = true
save_zarr = true
field_precision = "compact"
save_parquet = true
compression = "zstd"
compression_level = 5

[solver]
backend = "modflow_nwt"
sink_fill = false
drain_bed_thickness_m = 1.0
drain_conductance_floor_m2_s = 1e-12
drain_band_depth_m = 0.0

[solver.modflow_nwt.runtime.nwt]
version = "mfnwt"
listunit = 2
verbose = false
headtol = 0.0001
fluxtol = 0.005787037037037037
maxiterout = 5000
thickfact = 1e-05
linmeth = 2
iprnwt = 1
ibotav = 1
options = "MODERATE"
continue_run = false
backflag = 0
stoptol = 1e-10

[solver.modflow_nwt.runtime.dis]
itmuni = 0

[solver.modflow_nwt.runtime.bas]
hnoflo = -9999.0

[solver.modflow_nwt.runtime.upw]
iphdry = 1
hdry = -100.0
layvka = 1

[solver.modflow_nwt.runtime.evt]
nevtop = 3
ievt = 1
ipakcb = 1

[solver.modflow_nwt.runtime.oc]
compact = true

[solver.modflow_nwt.runtime.wel]
ipakcb = 1

[solver.modflow_nwt.runtime.lmt]
output_file_name = "mt3d_link.ftl"
extension = "lmt8"
output_format = "unformatted"

[solver.modflow_nwt.process_specific]
vka = 1.0
exdp = 1.0

[solver.modflow_nwt.sgrid.top_sampling]
mode = "centroid"
hillslope_stat = "median"
channel_stat = "min"
channel_source = "streams_raster"
channel_buffer_px = 0
spike_guard_tol_m = 2.0
min_pixels = 3
min_thickness_m = 0.1

[display]
enabled = true
dpi = 40
theme = "default"
on_error = "warn"

[[display.figure]]
observed = false
scores = false
stack = false
share = false
cumulative = false
preset = "water_budget"
when = "end"
engine = [
    "static",
]
formats = [
    "png",
]

[display.presets]

[observation]
points = []
variables = [
    "head",
]

[resolved_at_build.mesh]
pixel = 50.0
cell_size = 50.0
