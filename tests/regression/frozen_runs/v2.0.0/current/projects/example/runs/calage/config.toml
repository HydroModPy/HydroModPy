export = []

[workflow]
mode = "simulation"

[geographic]
source_mode = "synthetic"
crs_project = "EPSG:2154"

[geographic.synthetic]
case_id = "example_synthetic"

[geographic.synthetic.grid]
length_x = 1000.0
length_y = 1000.0
nx = 20
ny = 20

[geographic.synthetic.topography]
kind = "linear"
base_elevation = 20.0
right_to_left_amplitude = 5.0

[domain.depth_model]
kind = "constant_thickness"
thickness = 50.0

[data]
types = []

[flow]
flow_regime = "steady"
param_list = [
    "K",
    "Sy",
]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"
value = 0.0001

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"
value = 0.12

[flow.bc.drainage]
id = "drainage"
value = 0.0
description = "Drain boundary condition on top"
units = "m2/s"
kind = "drain"
data_value = false
application_domain = "top"

[flow.ic]

[flow.sinks_sources.recharge]
values = 0.8
units = "mm/day"

[transport]

[simulation]
name = "calage"
description = "K on three values, scored on one head of the demo."

[simulation.time]
start_datetime = 2000-01-01 00:00:00
end_datetime = 2000-12-31 00:00:00
step_value = 366
step_unit = "day"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = [
    "modflow_nwt",
]

[solver]
backend = "modflow_nwt"

[display]
enabled = false
dpi = 40
on_error = "warn"

[[display.figure]]
preset = "water_budget"
formats = [
    "png",
]

[observation]
