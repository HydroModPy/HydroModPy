# Reduced MODFLOW 6 / GWT example with embedded catchment meshing.
#
# This is the end-to-end process_simulation path:
# geographic setup -> mesh_catchment -> runtime Gmsh mesh -> MF6 GWF -> MF6 GWT.

base_config = "config_mf6_mesh_catchment_common.toml"

workflow = "simulation"

[simulation]
name = "Example 12 launcher fast MODFLOW 6 embedded mesh"
run_id = "example12_fast_mf6_mesh_catchment"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modflow6gwt"]

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-03-31 00:00:00"
step_value = "10 day"
coverage_policy = "warn"

[analysis.capability_gallery]
enabled = true
case_slug = "modflow6_gmsh_mesh_catchment"
output_dir = "../../capability_gallery/launcher_simulation/modflow6_gmsh_mesh_catchment"
assets = [
  "flow_state_triptych.png",
  "recharge_discharge_cumulative.png",
  "watertable_elevation.png",
  "watertable_depth.png",
  "flow_support_overview.png",
]

[data]
types = ["recharge"]

[[data.recharge.sources]]
source = "synthetic"
values = [0.2, 6.0, 1.0, 0.0, 4.5, 8.0, 0.5, 0.0, 3.5]
freq = "10D"
runoff_ratio = 0.1

[flow.ic]
type = "top"

[flow.param.K.field]
value = "1e-5 m/s"

[flow.param.Sy.field]
value = "0.12 -"

[mesh_catchment.hydraulic_properties.storage_coefficient]
default_value = 0.08

[modflow6.tgrid]
firstpersteady = false

[transport.modflow6gwt.parameters]
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2
