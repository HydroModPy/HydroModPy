# Shared example12 comparison case tuned to stay demonstrative without the
# very dry, strongly nonlinear collapse of the extreme showcase.
#
# Compared with the baseline extensive case, this setup:
# - keeps a full hydrological year,
# - uses a stronger but always non-negative recharge seasonality,
# - lowers K and Sy moderately,
# - keeps drainage active without pushing the basin into an extreme dry-out.

base_config = "project.toml"

workflow = "simulation"

[simulation]
name = "Example 12 moderate annual flow-only comparison"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-12-31 00:00:00"
step_value = "1 month"
coverage_policy = "warn"

[flow.sinks_sources.wells.W1.forcing]
path_file = "../../../../../examples/data/wells/standard_wells_2003.csv"

[flow.sinks_sources.wells.W2]
x_rel = 0.70
y_rel = 0.70

[flow.sinks_sources.wells.W2.forcing]
path_file = "../../../../../examples/data/wells/standard_wells_2003.csv"

[flow.param.K.field]
kind = "homogeneous"
value = "2.5e-5 m/s"

[flow.param.Ss.field]
kind = "homogeneous"
value = "1e-10 m-1"

[flow.param.Sy.field]
kind = "homogeneous"
value = "0.012 -"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "1.0e-5 m2/s"

[data]
types = ["recharge"]

[[data.recharge.sources]]
source = "synthetic"
values = [3.4, 3.2, 2.7, 2.1, 1.5, 0.8, 0.2, 0.1, 0.2, 0.7, 1.8, 3.0]
freq = "MS"
runoff_ratio = 0.06

[display]
enabled = true
show = false
save = true
dpi = 300
