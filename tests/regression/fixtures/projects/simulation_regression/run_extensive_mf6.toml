# Canonical MODFLOW 6 / GWT launcher baseline for example12.
base_config = "config_extensive_common.toml"


[workflow]
mode = "simulation"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "transport_main"
kind = "transport"
solvers = ["modflow6"]

[transport.modflow6]
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[domain.layers]
genmtd_lay = "decay"
nlay = 10
lay_decay = 1.2
