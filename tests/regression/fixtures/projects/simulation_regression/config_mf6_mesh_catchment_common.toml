# Shared MODFLOW 6 example profile with embedded catchment meshing.
#
# Relative paths are written from the project root. The regression helpers
# stage the project and link `inputs/` to the shared example data.

base_config = "hydromodpy.toml"


[workflow]
mode = "mesh"

[geographic.catchment]
buff_area = "30%"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[mesh]
engine = "voronoi"
cell_size = 136.0
river_cell_size = 136.0
river_band = 610.0
outside_factor = 1.5
transition_distance = 680.0

[mesh.families]
watershed_boundary = "face"

[flow]

# This mesh run pumps nothing: drop the wells the base file declares.
[flow.sinks_sources]
wells__delete = true

[flow.bc.ocean]
enabled = false

[display]
enabled = true
