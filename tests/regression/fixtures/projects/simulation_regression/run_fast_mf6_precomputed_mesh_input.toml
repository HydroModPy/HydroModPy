# Reduced MODFLOW 6 / GWT example reusing one committed triangular mesh.
#
# This keeps the same `process_simulation` launcher as the regular structured
# MF6 example. The only difference is the mesh source: geometry comes from
# `[mesh.triangle] path` instead of `[mesh.regular]`.

base_config = "config_fast_common.toml"


[workflow]
mode = "simulation"

[mesh]
engine = "voronoi"

[mesh.triangle]
path = "mesh/mesh_catchment.msh"

[mesh.voronoi]
seeds = "triangulation"

[simulation]
name = "example12_fast_mf6_precomputed_mesh"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "transport_main"
kind = "transport"
solvers = ["modflow6"]

[transport.modflow6gwt.parameters]
sconc_init = 0.1
sconc_input = 0.05
# MF6 GWT clock is SECONDS: diffu_coeff in m2/s, rate_decay in 1/s (506-day half-life).
diffu_coeff = 1e-10
react_order = 1
rate_decay = 1.585489599e-08

[domain.layers]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2
