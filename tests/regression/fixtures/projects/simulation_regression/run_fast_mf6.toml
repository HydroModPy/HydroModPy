# Reduced MODFLOW 6 / GWT regression config.
base_config = "config_fast_common.toml"


[workflow]
mode = "simulation"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[[simulation.process]]
id = "transport_main"
type = "transport"
solvers = ["modflow6"]

# MF6 GWT runs on the SI SECONDS clock: diffu_coeff is m2/s and rate_decay is
# 1/s. rate_decay below is a 506-day half-life (ln2 / 1.585e-8 s^-1).
[transport.modflow6gwt.parameters]
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 1e-10
react_order = 1
rate_decay = 1.585489599e-08

[simulation.results]

[simulation.results.derived]
accumulation_flux = true
outflow_drain = true
concentration_seepage = true
mass_seepage = true

[simulation.results.budget]
spatial_fields = true

[modflow6.sgrid.planar]
mode = "resample_to_shape"
nx = 60
ny = 60

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2
