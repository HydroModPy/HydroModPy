# Reduced MODFLOW-NWT / MODPATH / MT3DMS regression config.
base_config = "config_fast_common.toml"


[workflow]
mode = "simulation"

[[simulation.process]]
id = "flow_main"
kind = "flow"
solvers = ["modflow_nwt"]

[[simulation.process]]
id = "transport_main"
kind = "transport"
solvers = ["mt3dms"]

[transport.mt3dms.parameters]
spc_name = "NO3"
sconc_init = 0.1
sconc_input = 0.05
diffu_coeff = 8.64e-06
react_order = 1
rate_decay = 0.00136986301369863

[simulation.results]
keep_solver_files = true

[modflownwt.runtime]

[modflownwt.runtime.dis]
itmuni = 1
[mesh.regular]
shape = [60, 60]

[domain.layers]
genmtd_lay = "decay"
nlay = 2
lay_decay = 1.2
