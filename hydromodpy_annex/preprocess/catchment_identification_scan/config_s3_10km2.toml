[catchment_identification_scan]
# Link to the launcher script used for this case.
launcher_script = "run_catchment_identification_case.py"

# DEM input (must be projected in meters).
dem_path = "../../../examples/data/dem/DEM_armorican_massif.tif"

# Output folder for GeoPackage, CSV and intermediate rasters/vectors.
output_dir = "~/HydroModPy/catchment_identification_scan/s3_10km2"

# Minimum accumulation area used as threshold to select outlets and basins.
accumulation_area_km2 = 2.0

# Spread the selection across the whole regional DEM and keep about one outlet
# candidate per large tile so the final set stays close to 100 basins.
outlet_selection_mode = "scan_global"
scan_tile_size_km = 38.0
scan_max_outlets_per_tile = 1
scan_min_outlet_spacing_km = 6.0
scan_max_total_outlets = 10

# Basin selection strategy:
# - "headwater_target": keep headwater-like basins near target area and non-overlapping
basin_selection_mode = "headwater_target"

# Keep Strahler stream orders from 1 up to this value.
headwater_max_strahler_order = 3

# Strict minimum basin size ratio (relative to target) for selection.
# Together with target_area_tolerance_ratio=1.00, this yields a 5-20 km2 window.
headwater_min_target_ratio = 0.50
target_basin_area_km2 = 10.0
target_area_tolerance_ratio = 1.00

# Max overlap ratio between two retained basins:
# overlap_area / min(area_i, area_j)
max_basin_overlap_ratio = 0.05

# DEM correction strategy: "fill" or "breach".
dem_correction = "breach"

# Optional snapping distance in map units (meters). Use 0 to disable snapping.
snap_dist = 0

# Output naming.
gpkg_name = "watersheds_s3_10km2.gpkg"
basins_layer = "bassins_s3_10km2"
outlets_layer = "exutoires_s3_10km2"
outlets_csv_name = "exutoires_s3_10km2.csv"

# Diagnostic figures saved under output_dir/figures_dir_name.
save_diagnostic_figures = true
figures_dir_name = "figures"

# Keep or remove intermediate files after run.
keep_intermediate = true
