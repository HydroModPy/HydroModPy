[mesh_distribution]
# Chemin vers le dossier bundle a relire.
# Ici, on pointe directement vers un bundle deja exporte dans C:/results/HydromodPy.
bundle_dir = "C:/results/HydromodPy/mesh_catchment_full_mnt_100basins_1000km2_outlet_5/results_stable/mesh/gmsh/mesh_catchment_outlet_5_bundle"

# Chemin optionnel du PNG de synthese a ecrire.
figure_output_path = "C:/results/HydromodPy/mesh_catchment_full_mnt_100basins_1000km2_outlet_5/results_stable/mesh/gmsh/distribution_mesh_overview.png"

# Chemin optionnel du resume JSON a ecrire.
summary_output_path = "C:/results/HydromodPy/mesh_catchment_full_mnt_100basins_1000km2_outlet_5/results_stable/mesh/gmsh/distribution_mesh_overview.json"

# Ouvre ou non une fenetre matplotlib interactive a la fin de l'execution.
show_window = true

[mesh_distribution.plot]
# Champ utilise pour colorer les cellules du panneau structurel.
# Valeurs admises :
#   "area_m2"
#   "geology_code"
#   "geology_key"
#   "hydraulic_conductivity_m_s"
#   "storage_coefficient"
#   "z_top_centroid"
#   "z_top_mean"
color_field = "geology_key"

# Nom de palette matplotlib applique au champ `color_field`.
color_map = "tab20"

# Dimensions de la figure sous la forme [largeur, hauteur] en pouces.
figure_size = [16.0, 8.0]

# Resolution de sortie de la figure en DPI.
dpi = 170

# Titre explicite du panneau principal.
title = "Structure du maillage et geologie"

# Active ou non le panneau topographique situe a droite de la figure.
show_topography_panel = true

# Champ cellule utilise pour le repli du panneau topographique quand
# les altitudes nodales ne suffisent pas.
# Valeurs admises :
#   "z_top_centroid"
#   "z_top_mean"
topography_field = "z_top_mean"

# Nom de palette matplotlib du panneau topographique.
topography_cmap = "terrain"

# Titre explicite du panneau topographique.
topography_title = "Vue topographique type MNT"

# Affiche ou masque les aretes du maillage dans les panneaux.
show_mesh_edges = true

# Couleur matplotlib des aretes du maillage.
mesh_edge_color = "0.30"

# Epaisseur des aretes du maillage en points.
mesh_edge_linewidth = 0.65

# Affiche ou masque les aretes de bord du domaine.
show_boundaries = true

# Affiche ou masque les interfaces entre unites geologiques.
show_geology_interfaces = true

# Affiche ou masque les aretes identifiees comme rivieres.
show_river_edges = true

# Ajoute ou non les identifiants de cellules au centroide de chaque maille.
annotate_cell_ids = false
