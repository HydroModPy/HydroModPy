# Pre-commit: runs ruff automatically at every `git commit`.
#
# One-time setup per clone:
#   pip install -e ".[dev]"      # installs ruff + pre-commit
#   pre-commit install           # wires the hook into .git/hooks/
#
# Manual run on the whole repo:
#   pre-commit run --all-files
#
# The ruff rev equals the ruff pin of the dev extra and of main-ci.yml, so the
# hook, the CI and a local install format alike. Move the three together.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # 1. Lint - auto-fix what can be fixed (imports, simple rewrites…).
      - id: ruff-check
        args: [--fix]
      # 2. Format - apply ruff's formatter (black-compatible).
      - id: ruff-format

  # Small, uncontroversial hygiene hooks. Remove any you don't want.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The frozen runs, documents and replay run are compared by digest, so nothing edits them.
      - id: trailing-whitespace
        exclude: ^tests/regression/frozen_(runs|documents|replay)/v
      - id: end-of-file-fixer
        exclude: ^tests/regression/frozen_(runs|documents|replay)/v
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Secret scanning. Same engine as the CI gitleaks job, but on staged diff.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

