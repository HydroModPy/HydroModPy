# ======================================================================
# HydroModPy Configuration
# Profile: user | Modules: workspace, geographic, domain
# Auto-generated from Pydantic models.
# Edit values below. Comments describe each parameter.
# ======================================================================


# ----------------------------------------------------------------------
# Workspace configuration for project-based workspace structure.
# ----------------------------------------------------------------------

[workspace]
# Path to the project directory.
# Auto-derived from TOML location when absent.
# Type: path | REQUIRED
project_root = "."

# Root directory for all outputs (hydromodpy.duckdb, simulations/<uuid>.zarr/).
# Defaults to project_root when not set.
# Use this to redirect heavy outputs to a separate disk.
# Type: path (optional) | Optional
# output_root = ""


# ----------------------------------------------------------------------
# Geographic configuration for watershed delineation.
# ----------------------------------------------------------------------

[geographic]
# Geographic runtime mode.
# 'standard' keeps the historical DEM/outlet/polygon workflow.
# 'synthetic' builds one analytical support from [geographic.synthetic].
# Type: Literal['standard', 'synthetic'] | one of: "standard", "synthetic" | Default: "standard"
source_mode = "standard"

# Catchment definition mode used when source_mode='standard'.
# 'dem' = model domain defined directly from a DEM raster (dem_init_path required).
# 'txt' = model domain from an XYZ text file (dem_init_path, cell_size required).
# 'from_outlet_coord' = watershed from outlet coordinates (dem_init_path, x_outlet, y_outlet, snap_dist, buff_area required).
# 'from_polyg_shp' = watershed from a polygon shapefile (dem_init_path, polyg_shp_path, buff_area required).
# Type: Literal (optional) | Optional
catch_def = "from_outlet_coord"

# Path to the DEM raster used as input.
# For 'dem' and 'txt' modes: defines the model domain directly.
# For 'from_outlet_coord' and 'from_polyg_shp' modes: regional DEM used for flow analysis.
# Type: path (optional) | Optional
dem_init_path = "../../data/dem/DEM_armorican_massif.tif"

# Grid cell size in metres used to rasterise the XYZ point cloud.
# Required for 'txt' mode.
# Type: float (optional) | > 0 | Optional
cell_size = 1.0

# X coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: float (optional) | Optional
x_outlet = 389285.91

# Y coordinate of the watershed outlet in the projected CRS.
# Required for 'from_outlet_coord' mode.
# Type: float (optional) | Optional
y_outlet = 6816518.749

# Maximum snapping distance to move the outlet to the nearest stream cell.
# Accepts SI-friendly values (for example 50, '50 m', '0.05 km').
# Required for 'from_outlet_coord' mode.
# Type: UnionType[float, str, NoneType] | Optional
snap_dist = "150 m"

# Buffer around the watershed polygon.
# Numeric values keep legacy behavior (percentage of sqrt(area [km^2])).
# String values are interpreted as explicit distances (for example '500 m', '2 km').
# Required for 'from_outlet_coord' and 'from_polyg_shp' modes.
# Type: UnionType[str, float, NoneType] | Optional
buff_area = "10%"

# Path to the watershed polygon shapefile.
# Required for 'from_polyg_shp' mode.
# Type: path (optional) | Optional
# polyg_shp_path = ""

# Target projected CRS for all outputs (e.g.
# 'EPSG:2154').
# If not set, derived from the input DEM.
# Type: string (optional) | Optional
crs_project = "EPSG:2154"

# DEM depression correction method.
# 'breach' (recommended) preserves natural flow paths.
# 'fill' raises sinks to their pour point.
# Type: Literal['breach', 'fill'] | one of: "breach", "fill" | Default: "breach"
dem_correc_type = "breach"

# Path to a raster representing the aquifer bottom elevation.
# Must share the same grid as the model domain.
# Type: path (optional) | Optional
# bottom_path = ""


# Synthetic geographic support used when source_mode='synthetic'.
# This analytical mode bypasses watershed delineation from external DEM files.

[geographic.synthetic]
# Identifier used by local case runners and outputs.
# Type: string | Default: "flat20"
case_id = "flat20"


[geographic.synthetic.grid]
# Total domain length along x.
# Accepts values such as 100, '100 m', or '0.1 km'.
# Type: float | Default: 100.0
length_x = 100.0

# Total domain length along y.
# Accepts values such as 1, '1 m', or '0.001 km'.
# Type: float | Default: 1.0
length_y = 1.0

# Number of cells along x.
# Type: int | >= 1 | Default: 100
nx = 100

# Number of cells along y.
# Type: int | >= 1 | Default: 1
ny = 1


[geographic.synthetic.topography]
# Analytical topography law.
# 'flat' keeps one constant elevation.
# 'linear' increases from right to left with a linear profile.
# 'radial_island' builds one circular emerged island surrounded by submerged ocean cells.
# Type: Literal['flat', 'linear', 'radial_island'] | one of: "flat", "linear", "radial_island" | Default: "flat"
kind = "flat"

# Reference elevation (m).
# For 'flat' this is the constant surface elevation.
# For 'linear' this is the elevation on the right boundary.
# For 'radial_island' this is the submerged ocean-floor elevation.
# Type: float | Default: 20.0
base_elevation = 20.0


# Optional DEM-derived river-network extraction settings.
# When disabled, no stream network is generated in geographic preprocessing.

[geographic.river_network]
# Enable DEM-based river-network extraction from flow accumulation during geographic preprocessing.
# Type: bool | Default: false
enabled = false

# Stream-initiation threshold selector.
# 'area_km2' uses contributing area in km^2.
# 'cells' uses contributing-cell count directly.
# Type: Literal['area_km2', 'cells'] | one of: "area_km2", "cells" | Default: "area_km2"
threshold_mode = "area_km2"

# Contributing area threshold (km^2), required when threshold_mode='area_km2'.
# Type: float (optional) | Optional
# threshold_area_km2 = 0.0

# Contributing-cell threshold, required when threshold_mode='cells'.
# Type: float (optional) | Optional
# threshold_cells = 0.0

# If true, remove short stream segments after extraction.
# Type: bool | Default: false
prune_short_streams = false

# Minimum stream length used by short-segment pruning.
# Accepts SI-friendly values (for example 0, 250, '250 m', '0.5 km').
# Type: UnionType[float, str] | Default: 0.0
min_stream_length_m = 0.0

# Compute Strahler order raster from extracted streams.
# Type: bool | Default: true
compute_strahler_order = true

# Compute stream-link identifier raster from extracted streams.
# Type: bool | Default: true
compute_stream_links = true

# Forwarded to Whitebox raster_streams_to_vector.
# False keeps a lighter vector geometry.
# Type: bool | Default: false
all_vertices = false


# ----------------------------------------------------------------------
# Domain configuration.
# ----------------------------------------------------------------------

[domain]
# Ordered list of zone identifiers loaded in the domain registry.
# Keep this list for actual runtime zones (for example 'catchment', 'geology', or custom zonations).
# Spatial-support declarations live under domain.supports.
# Type: list[str] | REQUIRED
zone_ids = ["geology"]

# Named spatial supports available to heterogeneous parameters.
# Each key is a support identifier referenced by field_spatial_id.
# Type: dict[str, Annotated] | REQUIRED
supports = {}


# Vertical domain model configuration.
# Use 'constant_thickness' or 'flat_substratum'.

[domain.depth_model]
# Depth-model type selector.
# Use 'constant_thickness' to define bottom as top-thickness.
# Type: Literal['constant_thickness'] | one of: "constant_thickness" | Default: "constant_thickness"
type = "constant_thickness"

# Constant aquifer thickness (m) applied below topography.
# Type: float | > 0.0 | Default: 50.0
thickness = 30.0


# ----------------------------------------------------------------------
# Data managers configuration
# ----------------------------------------------------------------------

[data]
types = ["geology", "hydrography", "intermittency", "hydrometry", "recharge"]

[data.geology]
id = "field_geology"

[[data.geology.sources]]
source = "brgm_1m"

[[data.hydrography.sources]]
source = "bdtopage"
rasterize_field = "FID"

[[data.hydrometry.sources]]
source = "custom"
path = "../../data/hydrometry"
station_ids = []
extent = "watershed"

[[data.intermittency.sources]]
source = "custom"
path = "../../data/intermittency"

[data.recharge]
date_start = "2000-01-01"
date_end = "2002-12-31"

[[data.recharge.sources]]
source = "custom"
path = "../../data/recharge"
station_ids = ["EX04"]


# ----------------------------------------------------------------------
# Flow-process configuration
# ----------------------------------------------------------------------

[flow]
flow_regime = "transient"
param_list = ["K", "Sy", "Ss"]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"

[flow.param.K.field_homogeneous]
value = 5e-05

# No vertical K profile in legacy example (single layer, uniform K).
# [flow.param.K.field_vertical_profile]
# mode = "exponential"
# characteristic_depth = "15.0 m"

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = 0.05

# No vertical Sy profile in legacy example (single layer, uniform Sy).
# [flow.param.Sy.field_vertical_profile]
# mode = "exponential"
# characteristic_depth = "20.0 m"

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = 1e-05

[flow.ic]
type = "top"
value = 1.0
unit = "m"

[flow.bc.cauchy.drainage]
application_domain = "top"
type = "cauchy"
value = 0.0
unit = "m2/s"
data_value = false

[flow.sinks_sources.recharge]
first_clim = "first"
negative_to_evt = false


# ----------------------------------------------------------------------
# Transport-process configuration
# ----------------------------------------------------------------------

[transport.modpath.parameters]
zone_partic = "domain"
track_dir = "backward"
cell_div = 1
zloc_div = false


# ----------------------------------------------------------------------
# Expert-level MODFLOW configuration organized by concern.
# ----------------------------------------------------------------------

# MODFLOW runtime package options (NWT/DIS/BAS/UPW/EVT/OC/WEL/LMT).

[modflownwt.runtime]
# MODFLOW executable/version identifier passed to FloPy.
# Type: string | Default: "mfnwt"
mf_version = "mfnwt"

# Fortran unit number used for the MODFLOW list file.
# Type: int | Default: 2
mf_listunit = 2

# Enable verbose FloPy logging for model setup.
# Type: bool | Default: false
mf_verbose = false

# Head closure criterion for the NWT nonlinear solver.
# Type: float | Default: 0.0001
nwt_headtol = 0.0001

# Flux closure criterion for the NWT nonlinear solver.
# When ITMUNI=0 with PERLEN in seconds, this value is in m3/s.
# Legacy (m/day system) used 500 m3/day = 500/86400 m3/s.
# Type: float | Default: 500.0
nwt_fluxtol = 0.006

# Maximum outer nonlinear iterations in the NWT solver.
# Type: int | Default: 5000
nwt_maxiterout = 5000

# NWT wetting/thickness factor controlling nonlinear updates.
# Type: float | Default: 1e-05
nwt_thickfact = 1e-05

# Linear solver choice for NWT (see MODFLOW-NWT documentation).
# Type: int | Default: 1
nwt_linmeth = 1

# NWT print flag controlling iteration diagnostics in listing outputs.
# Type: int | Default: 1
nwt_iprnwt = 1

# NWT option for averaging saturated thickness at the cell bottom.
# Type: int | Default: 1
nwt_ibotav = 1

# NWT nonlinear option keyword (for example SIMPLE or COMPLEX).
# Type: string | Default: "COMPLEX"
nwt_options = "COMPLEX"

# If true, continue NWT iterations on partially converged stress periods.
# Type: bool | Default: false
nwt_continue = false

# NWT backtracking activation flag.
# Type: int | Default: 0
nwt_backflag = 0

# NWT backtracking stopping tolerance.
# Type: float | Default: 1e-10
nwt_stoptol = 1e-10

# DIS time unit code used by MODFLOW (ITMUNI).
# Type: int | Default: 0
dis_itmuni = 0

# BAS no-flow head sentinel value (HNOFLO).
# Type: float | Default: -9999.0
bas_hnoflo = -9999.0

# UPW dry-cell head output flag (IPHDRY).
# Type: int | Default: 1
upw_iphdry = 1

# UPW dry-cell head value (HDRY).
# Type: float | Default: -100.0
upw_hdry = -100.0

# UPW flag controlling VKA interpretation per layer (LAYVKA).
# Type: int | Default: 1
upw_layvka = 1

# EVT option code that defines how ET extinction depth is applied (NEVTOP).
# Type: int | Default: 3
evt_nevtop = 3

# EVT integer array selector used when NEVTOP requires layer indices (IEVT).
# Type: int | Default: 1
evt_ievt = 1

# EVT cell-by-cell budget output flag (IPAKCB).
# Type: int | Default: 1
evt_ipakcb = 1

# Enable compact budget format in OC outputs.
# Type: bool | Default: true
oc_compact = true

# WEL cell-by-cell budget output flag (IPAKCB).
# Type: int | Default: 1
wel_ipakcb = 1

# LMT output filename used to couple MODFLOW to MT3DMS.
# Type: string | Default: "mt3d_link.ftl"
lmt_output_file_name = "mt3d_link.ftl"

# LMT package filename extension.
# Type: string | Default: "lmt8"
lmt_extension = "lmt8"

# LMT file format (typically 'formatted' or 'unformatted').
# Type: string | Default: "unformatted"
lmt_output_format = "unformatted"


# Process-specific package controls (currently UPW/EVT knobs).

[modflownwt.process_specific]
# Vertical hydraulic conductivity control passed to the UPW package (VKA).
# Type: float | Default: 1.0
vka = 1.0

# Extinction depth [L] used by the EVT package (EXDP).
# Type: float | Default: 1.0
# exdp = 1.0


# Spatial-grid payload split into `[...sgrid.planar]` and `[...sgrid.vertical]`.

# Planar discretization of the solver grid.

[modflownwt.sgrid.planar]
# Planar solver-grid mode: keep the native domain support or resample to an explicit (ny, nx) target shape.
# Type: Literal['keep_native', 'resample_to_shape'] | one of: "keep_native", "resample_to_shape" | Default: "keep_native"
mode = "keep_native"

# Target number of columns when planar mode is 'resample_to_shape'.
# Type: int (optional) | >= 1 | Optional
# nx = 1

# Target number of rows when planar mode is 'resample_to_shape'.
# Type: int (optional) | >= 1 | Optional
# ny = 1

# Resampling rule applied when planar mode is 'resample_to_shape'.
# Type: Literal['bilinear', 'average', 'nearest'] | one of: "bilinear", "average", "nearest" | Default: "bilinear"
resampling = "bilinear"


# Vertical layering of the solver grid.

[modflownwt.sgrid.vertical]
# Vertical-layering strategy.
# Type: Literal['constant', 'decay', 'list'] | one of: "constant", "decay", "list" | Default: "constant"
genmtd_lay = "constant"

# Number of layers (required for constant/decay, ignored for list).
# Type: int (optional) | Default: 1
nlay = 1

# Decay exponent (>1) for decay layering.
# Type: float (optional) | Optional
# lay_decay = 1.5

# Explicit layer fractions when genmtd_lay='list' (must sum to 1).
# Type: list (optional) | Optional
# lay_proportions = []

# No-data sentinel value.
# Type: float | Default: -9999.0
nodata = -9999.0


# Optional temporal discretization payload as one validated `TMeshConfigModel` model.
# In launcher mode, stress periods are driven by [simulation.time]; this section is mirrored for compatibility and mainly keeps `firstpersteady`.

[modflownwt.tgrid]
# Time unit used to interpret lenper values.
# In launcher mode stress periods come from [simulation.time], so this field is mirrored only for compatibility.
# Type: string | Default: "d"
# itmuni = "d"

# Flow regime used to derive the steady/transient stress-period flags.
# In launcher mode this field is generally derived from [flow].flow_regime.
# Type: Literal['steady', 'transient'] | one of: "steady", "transient" | Default: "transient"
# flow_regime = "transient"

# Temporal generation method.
# In launcher mode stress periods come from [simulation.time], so this field is mirrored only for compatibility.
# Type: Literal['synthetic_regular', 'from_chron'] | one of: "synthetic_regular", "from_chron" | Default: "synthetic_regular"
# genmtd = "synthetic_regular"

# Stress-period count.
# In launcher mode this is mirrored from [simulation.time] and is not the authoritative source.
# Type: int | Default: 1
# nper = 1

# Stress-period length(s) interpreted with itmuni.
# Scalar means one regular step length repeated nper times; list means one explicit value per stress period.
# In launcher mode this is mirrored from [simulation.time] and is not the authoritative source.
# Type: UnionType[float, int, list, list, NoneType] | Default: 1
# lenper = 1

# Chronicle file path used when genmtd='from_chron'.
# In launcher mode this field is generally not used.
# Type: string (optional) | Optional
# chron_path = ""

# Date format string used to parse the chronicle file.
# Type: string | Default: "%Y-%m-%d %H:%M:%S"
# chron_dateformat = "%Y-%m-%d %H:%M:%S"

# Column separator used in the chronicle file.
# Type: string | Default: "	"
# chron_colsep = "	"

# Name of the time/date column in the chronicle file.
# Type: string | Default: "Date"
# chron_time_col = "Date"

# Lower datetime bound used by the temporal mesh.
# In launcher mode this field is mirrored from [simulation.time] and is not the authoritative source.
# Type: Any (optional) | Optional
# start_datetime = ""

# Upper datetime bound used by the temporal mesh.
# In launcher mode this field is mirrored from [simulation.time] and is not the authoritative source.
# Type: Any (optional) | Optional
# end_datetime = ""

# Whether the first stress period is treated as steady-state.
# Type: bool | Default: true
firstpersteady = true

# Time-step multiplier per stress period (scalar or list).
# In launcher mode this field is currently forced to 1.0 and generally not intended for manual editing.
# Type: UnionType[int, float, list, list] | Default: 1
# tsmult = 1

# Number of time steps per stress period (scalar or list).
# In launcher mode this field is currently forced to 1 and generally not intended for manual editing.
# Type: UnionType[int, list] | Default: 1
# ntsp = 1

# No-data sentinel value for temporal data.
# Type: float | Default: -9999.0
# temporal_nodata = -9999.0


# ----------------------------------------------------------------------
# Validated ``[display]`` section used by launcher plotting suites.
# ----------------------------------------------------------------------

[display]
# Master switch for all optional plotting suites.
# Type: bool | Default: true
enabled = true

# Show interactive figures/windows when rendering is enabled.
# Type: bool | Default: true
show = true

# Save figures/animations to disk when rendering is enabled.
# Type: bool | Default: false
save = false


# Display flags for flow plots.

[display.flow]
# Master switch for the flow plotting group.
# Type: bool | Default: true
enabled = true

# Render the flow cross-section plot.
# Type: bool | Default: true
cross_section = true

# Render the streamflow comparison plot.
# Type: bool | Default: true
streamflow = true

# Render the piezometry plot.
# Type: bool | Default: true
piezometry = true

# Render water-table depth and elevation maps.
