# Compare MODFLOW 6 and MODFLOW-NWT on different mesh families.
#
# MODFLOW 6 reuses the committed triangular Gmsh mesh while MODFLOW-NWT keeps
# its regular structured `sgrid`. Domain-level map reductions are used because
# point/cell identity is no longer shared across both variants.

[method_comparison]
comparison_id = "example12_mf6_vs_nwt_different_meshes"
output_root = "method_comparison/example12_mf6_vs_nwt_different_meshes"
run_variants = true
continue_on_error = false
reference_variant = "mf6_precomputed_gmsh"

[[method_comparison.variant]]
id = "mf6_precomputed_gmsh"
label = "MODFLOW 6 on committed triangular mesh"
solver = "modflow6"
mesh_mode = "mesh_input"
mesh_label = "gmsh_precomputed"
simulation_config = "run_fast_mf6_precomputed_mesh_input.toml"

[[method_comparison.variant]]
id = "nwt_structured_60x60"
label = "MODFLOW-NWT on 60x60 structured grid"
solver = "modflownwt"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_fast_nwt.toml"

[[method_comparison.observable]]
name = "mean_head_domain"
variable = "watertable_elevation"
support = "map"
time = "last"
reducer = "mean"
unit = "m"

[[method_comparison.observable]]
name = "max_depth_domain"
variable = "watertable_depth"
support = "map"
time = "last"
reducer = "max"
unit = "m"
