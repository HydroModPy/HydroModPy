# Shared MODFLOW 6 example profile with embedded catchment meshing.
#
# This file keeps all relative paths anchored in
# `examples/projects/launcher_simulation/` so process_simulation examples can
# inherit it safely while still using the standard simulation launcher.

base_config = "project.toml"

workflow = "mesh"

[geographic]
buff_area = "30%"

[geographic.river_network]
enabled = true
threshold_mode = "area_km2"
threshold_area_km2 = 1.0
prune_short_streams = false
compute_strahler_order = true
compute_stream_links = true
all_vertices = true

[mesh_catchment]
constraints_mode = "geology_rivers"
output_layout = "flat"
figures_enabled = true
figure_dpi = 300
figure_regional_dpi = 220

[mesh_catchment.watershed_boundary]
enabled = true
boundary_refinement_distance = 500.0

[mesh_catchment.watershed_boundary.smoothing]
enabled = true
distance = 200.0
river_buffer_distance = 100.0
outer_bias_distance = 10.0

[mesh_catchment.watershed_boundary.outside_coarsening]
enabled = true
size_factor = 1.5
transition_distance = 680.0
grid_resolution = 680.0

[mesh_catchment.watershed_boundary.geology_conformity]
mode = "buffered_watershed_envelope"
buffer_distance = 100.0

[mesh_catchment.geology]
id = "field_geology"
cell_samples_per_axis = 8

[mesh_catchment.geology.source]
path = "../../../examples/data/geology/GEO1M.shp"
kind = "vector"
code_field = "CODE_LEG"
reference_raster_path = "../../../examples/data/dem/regional_dem_naizin.tif"

[mesh_catchment.hydraulic_properties.conductivity]
values_source = "csv"
values_csv_file = "../../../examples/data/geology/geology_K_dummy_demo.csv"
csv_value_column = "K_value"

[mesh_catchment.hydraulic_properties.storage_coefficient]
default_value = 0.02

[mesh_catchment.zone_meshing]
global_size = 136.0
min_size = 100.0
max_size = 200.0
min_polygon_area = 1.0
refine_interfaces = true
interface_size = 136.0
interface_distance = 610.0
interface_sampling = 96

[mesh_catchment.zone_meshing.refinement_policy]
enabled = true
mode = "grid_local_budget"

[mesh_catchment.zone_meshing.refinement_policy.grid]
neighborhood_rings = 1
enable_exact_gap_check = false
max_exact_gap_candidates = 128

[mesh_catchment.zone_meshing.refinement_policy.hotspot]
radius = 610.0
max_curve_count = 180
max_family_count = 2
min_gap = 80.0
max_node_degree = 4
short_segment_length = 100.0
max_short_segment_count = 12

[mesh_catchment.zone_meshing.refinement_policy.families.river]
enabled = true
priority = 300

[mesh_catchment.zone_meshing.refinement_policy.families.geology_interface]
enabled = true
priority = 200

[mesh_catchment.zone_meshing.refinement_policy.families.watershed_boundary]
enabled = true
priority = 100

[flow]
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]

[flow.sinks_sources.wells.W1.forcing]
path_file = "../../../examples/data/wells/normal_wells_2003.csv"

[flow.sinks_sources.wells.W2]
x_rel = 0.33
y_rel = 0.33

[flow.sinks_sources.wells.W2.forcing]
path_file = "../../../examples/data/wells/normal_wells_2003.csv"

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
display = true
matching_streams = false
native_mesh_npz = true
native_mesh_csv = true
native_mesh_vtu = false
native_mesh_png = true

[postprocess.flow.timeseries]
enabled = true

[postprocess.transport]
enabled = true
display_particles = false
display_transport = false

[postprocess.transport.timeseries]
enabled = false

[display]
enabled = true
show = false
save = true

[display.flow]
enabled = true
state_triptych = true
recharge_discharge_cumulative = true
watertable_map = true
cross_section = false
streamflow = false
piezometry = false
