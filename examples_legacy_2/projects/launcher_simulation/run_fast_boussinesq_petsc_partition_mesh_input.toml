# Reduced pure-flow Boussinesq example using the Linux-only PETSc backend with
# the regularized partition surface-interaction law.
#
# This inherits the same embedded catchment-meshing workflow as the standard
# fast Boussinesq example, but overrides the nonlinear runtime backend to use
# PETSc SNES on the head-only regularized partition formulation.
base_config = "run_fast_boussinesq_mesh_input.toml"

workflow = "simulation"

[simulation]
name = "Example 12 launcher fast boussinesq PETSc partition"

[flow]
runtime_backend = "petsc"
surface_interaction_model = "regularized_partition"
