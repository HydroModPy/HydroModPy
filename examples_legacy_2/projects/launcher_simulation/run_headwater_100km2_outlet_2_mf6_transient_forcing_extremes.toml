# 3-year MF6 replay on the committed headwater 100 km2 mesh with stronger
# drought and rewetting phases in the recharge chronology.

base_config = "config_headwater_100km2_mf6_transient_common.toml"

workflow = "simulation"

[simulation]
name = "Headwater 100 km2 MF6 forcing-extremes reused mesh"
run_id = "headwater_100km2_outlet_2_mf6_transient_forcing_extremes"

[capability_gallery]
enabled = true
case_slug = "headwater_100km2_outlet_2_mf6_transient_forcing_extremes"
output_dir = "../../capability_gallery/launcher_simulation/headwater_100km2_outlet_2_mf6_transient_forcing_extremes"
assets = [
  "flow_state_triptych.png",
  "recharge_discharge_cumulative.png",
  "watertable_elevation.png",
  "watertable_depth.png",
  "flow_support_overview.png",
]

[[data.recharge.sources]]
source = "synthetic"
values = [
  3.2, 3.0, 2.4, 1.6, 0.8, 0.1, -0.8, -1.2, -0.4, 0.6, 1.9, 2.8,
  1.4, 1.1, 0.7, 0.2, -0.5, -1.0, -1.5, -1.8, -0.9, 0.0, 1.0, 1.7,
  3.6, 3.2, 2.6, 1.9, 1.0, 0.3, -0.4, -0.9, -0.2, 0.9, 2.3, 3.1,
]
freq = "MS"
runoff_ratio = 0.20

[flow.param.K.field]
id = "K"
kind = "homogeneous"
unit = "m/s"

[flow.param.K.field_homogeneous]
value = 2.5e-5

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = 0.10

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = 5e-6
