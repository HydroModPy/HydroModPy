# Multi-method moderate annual comparison on example12.
#
# The three variants are intentionally chosen to separate two effects:
# - solver effect on the same 60x60 structured grid (MF6 vs NWT),
# - mesh effect for the same solver (MF6 structured vs MF6 triangular).

[method_comparison]
comparison_id = "ex12_multi_method_moderate"
output_root = "method_comparison/ex12_multi_method_moderate"
anchors_file = "method_comparison_points.toml"
run_variants = true
continue_on_error = false
reference_variant = "mf6_mod_s60"

[method_comparison.fine_raster]
enabled = true
resolution = 15.0
extent_mode = "intersection"
interpolation = "linear"
write_geotiff = true

[[method_comparison.variant]]
id = "mf6_mod_s60"
label = "MF6 annual moderate on 60x60 structured grid"
solver = "modflow6"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_demonstrative_annual_moderate_mf6_structured.toml"

[[method_comparison.variant]]
id = "nwt_mod_s60"
label = "NWT annual moderate on 60x60 structured grid"
solver = "modflownwt"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_demonstrative_annual_moderate_nwt.toml"

[[method_comparison.variant]]
id = "mf6_mod_tri"
label = "MF6 annual moderate on committed triangular mesh"
solver = "modflow6"
mesh_mode = "mesh_input"
mesh_label = "gmsh_precomputed"
simulation_config = "run_demonstrative_annual_moderate_mf6_precomputed_mesh_input.toml"

[[method_comparison.variant]]
id = "bouss_mod_tri"
label = "Boussinesq annual moderate on committed triangular mesh"
solver = "boussinesq"
mesh_mode = "mesh_input"
mesh_label = "gmsh_precomputed"
simulation_config = "run_demonstrative_annual_moderate_boussinesq_precomputed_mesh_input.toml"

[[method_comparison.observable]]
name = "head_outlet_lowland"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.outlet_lowland"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_mid_basin_response"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.mid_basin_response"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_upstream_ridge"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.upstream_ridge"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
anchor_id = "example12.outlet"
time = "all"
unit = "m3/s"

[[method_comparison.observable]]
name = "head_map_last"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "depth_map_last"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "outflow_drain_map_last"
variable = "outflow_drain"
support = "map"
time = "last"
unit = "m/day"

[[method_comparison.observable]]
name = "surface_excess_flux_series"
variable = "surface_excess_flux"
variants = ["bouss_mod_tri"]
support = "cell_mask"
time = "all"
reducer = "sum"
unit = "m3/s"

[[method_comparison.observable]]
name = "surface_excess_map_last"
variable = "surface_excess_rate"
variants = ["bouss_mod_tri"]
support = "map"
time = "last"
unit = "m/day"
