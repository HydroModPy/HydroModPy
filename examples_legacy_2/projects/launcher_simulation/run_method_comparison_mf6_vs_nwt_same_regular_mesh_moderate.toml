# Moderate annual comparison of MF6 and NWT on the exact same 60x60 grid.
#
# This case keeps the more readable annual-forcing setup while removing the
# mesh-family difference from the comparison.

[method_comparison]
comparison_id = "ex12_mf6_nwt_moderate_same_s60"
output_root = "method_comparison/ex12_mf6_nwt_moderate_same_s60"
anchors_file = "method_comparison_points.toml"
run_variants = true
continue_on_error = false
reference_variant = "mf6_mod_s60"

[[method_comparison.variant]]
id = "mf6_mod_s60"
label = "MF6 annual moderate on 60x60 structured grid"
solver = "modflow6"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_demonstrative_annual_moderate_mf6_structured.toml"

[[method_comparison.variant]]
id = "nwt_mod_s60"
label = "NWT annual moderate on 60x60 structured grid"
solver = "modflownwt"
mesh_mode = "structured"
mesh_label = "sgrid_60x60"
simulation_config = "run_demonstrative_annual_moderate_nwt.toml"

[[method_comparison.observable]]
name = "head_outlet_lowland"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.outlet_lowland"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_mid_basin_response"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.mid_basin_response"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "head_upstream_ridge"
variable = "watertable_elevation"
support = "point"
anchor_id = "example12.upstream_ridge"
time = "all"
unit = "m"

[[method_comparison.observable]]
name = "outlet_flux_series"
variable = "outlet_flux"
support = "outlet"
anchor_id = "example12.outlet"
time = "all"
unit = "m3/s"

[[method_comparison.observable]]
name = "head_map_last"
variable = "watertable_elevation"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "depth_map_last"
variable = "watertable_depth"
support = "map"
time = "last"
unit = "m"

[[method_comparison.observable]]
name = "outflow_drain_map_last"
variable = "outflow_drain"
support = "map"
time = "last"
unit = "m/day"
