# Higher-temporal-resolution replay of the heterogeneous cycling Boussinesq case.
#
# The geometry, forcing amplitudes and hydraulic heterogeneity stay unchanged,
# but the stress-period step is reduced from one month to ten days so the
# recharge / dry-down dynamics are easier to inspect in time-series figures.

base_config = "run_headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous.toml"

[workspace]
project_root = "./results_reused_real_meshes/headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous_10day"

[simulation]
name = "Headwater 100 km2 Boussinesq transient cycling recharge heterogeneous 10-day"
run_id = "headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous_10day"

[simulation.time]
end_datetime = "2004-01-05 00:00:00"
step_value = "10 day"
