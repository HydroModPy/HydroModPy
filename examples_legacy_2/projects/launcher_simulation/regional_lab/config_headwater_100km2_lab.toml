# First regional-lab example on the committed headwater 100 km2 real case.

[regional_lab]
lab_id = "headwater_100km2_lab"
output_root = "outputs/headwater_100km2_lab"
execute = false
continue_on_error = true
validate_config_paths = true
resume_from_report = true
skip_completed_cases = true

[regional_lab.catalog]
path = "site_catalog.csv"
format = "csv"
site_id_field = "site_id"
site_label_field = "site_label"
cluster_id_field = "cluster_id"
cluster_label_field = "cluster_label"
cluster_family_field = "cluster_family"
cluster_scale_field = "cluster_scale"
region_field = "region_id"
source_selection_field = "source_selection_id"
status_field = "site_status"
maturity_field = "maturity"
tags_field = "tags"
enabled_field = "enabled"
required_fields = ["source_selection_id", "site_status", "maturity"]
path_fields = [
  "simulation_reference_config",
  "backend_comparison_config",
  "transient_backend_comparison_config",
]
tag_separator = ";"

[regional_lab.selection]
tags = ["mesh_ready"]

[[regional_lab.cluster_rule]]
id = "headwater_100km2_rule"
field_equals = { source_selection_id = "scan_headwater_100km2" }
set_cluster_id = "headwater_100km2"
set_cluster_label = "Headwater 100 km2"
set_cluster_family = "headwater"
set_cluster_scale = "100km2"
cluster_tags = ["regional_headwater"]

[[regional_lab.cluster_rule]]
id = "s3_100km2_rule"
field_equals = { source_selection_id = "scan_s3_100km2" }
set_cluster_id = "s3_100km2"
set_cluster_label = "Strahler 3 100 km2"
set_cluster_family = "s3"
set_cluster_scale = "100km2"
cluster_tags = ["regional_screening"]

[[regional_lab.cluster_rule]]
id = "s3_10km2_rule"
field_equals = { source_selection_id = "scan_s3_10km2" }
set_cluster_id = "s3_10km2"
set_cluster_label = "Strahler 3 10 km2"
set_cluster_family = "s3"
set_cluster_scale = "10km2"
cluster_tags = ["regional_screening"]

[[regional_lab.cluster_rule]]
id = "regional_1000km2_rule"
field_equals = { source_selection_id = "scan_1000km2" }
set_cluster_id = "regional_1000km2"
set_cluster_label = "Regional 1000 km2"
set_cluster_family = "regional"
set_cluster_scale = "1000km2"
cluster_tags = ["regional_screening"]

[[regional_lab.recipe]]
id = "mf6_reference"
label = "MF6 reference replay"
launcher = "simulation"
families = ["headwater"]
scales = ["100km2"]
required_fields = ["simulation_reference_config"]
config_path_template = "{simulation_reference_config}"

[[regional_lab.recipe]]
id = "backend_compare"
label = "Backend comparison"
launcher = "method-comparison"
families = ["headwater"]
scales = ["100km2"]
required_fields = ["backend_comparison_config"]
config_path_template = "{backend_comparison_config}"

[[regional_lab.recipe]]
id = "transient_backend_compare"
label = "Transient backend comparison"
launcher = "method-comparison"
families = ["headwater"]
scales = ["100km2"]
required_fields = ["transient_backend_comparison_config"]
config_path_template = "{transient_backend_comparison_config}"
