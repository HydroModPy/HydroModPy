# PETSc mixed-complementarity replay of the heterogeneous transient cycling
# headwater case.

base_config = "run_headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous.toml"

workflow = "simulation"

[simulation]
name = "Headwater 100 km2 Boussinesq PETSc mixed transient cycling recharge heterogeneous"
run_id = "headwater_100km2_outlet_2_boussinesq_petsc_transient_cycling_recharge_heterogeneous"

[flow]
runtime_backend = "petsc"
surface_interaction_model = "complementarity"
