# Shared example12 comparison case tuned to produce clearer transient contrasts.
#
# Compared with the baseline extensive case, this setup:
# - keeps a full hydrological year,
# - increases seasonal recharge contrast,
# - lowers K and Sy to amplify head variations,
# - increases drainage conductance to favor seepage/overflow signatures.

base_config = "project.toml"

workflow = "simulation"

[simulation]
name = "Example 12 demonstrative annual flow-only comparison"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-12-31 00:00:00"
step_value = "1 month"
coverage_policy = "warn"

[flow.sinks_sources.wells.W1.forcing]
path_file = "../../../examples/data/wells/standard_wells_2003.csv"

[flow.sinks_sources.wells.W2]
x_rel = 0.70
y_rel = 0.70

[flow.sinks_sources.wells.W2.forcing]
path_file = "../../../examples/data/wells/standard_wells_2003.csv"

[flow.param.K.field]
kind = "homogeneous"

[flow.param.K.field_homogeneous]
value = "1.5e-5 m/s"

[flow.param.Ss.field]
kind = "homogeneous"

[flow.param.Ss.field_homogeneous]
value = "1e-10 m-1"

[flow.param.Sy.field]
kind = "homogeneous"

[flow.param.Sy.field_homogeneous]
value = "0.008 -"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "2.0e-5 m2/s"

[data]
types = ["recharge"]

[[data.recharge.sources]]
source = "synthetic"
values = [5.0, 4.8, 4.2, 3.2, 2.2, 1.0, -1.5, -2.5, -1.8, 0.4, 2.8, 4.6]
freq = "MS"
runoff_ratio = 0.04

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
native_mesh_npz = true
native_mesh_csv = true
native_mesh_vtu = false
native_mesh_png = true

[postprocess.flow.timeseries]
enabled = true

[display]
enabled = true
show = false
save = true
dpi = 300

[display.flow]
enabled = true
state_triptych = true
recharge_discharge_cumulative = true
watertable_map = true
cross_section = false
streamflow = false
piezometry = false
