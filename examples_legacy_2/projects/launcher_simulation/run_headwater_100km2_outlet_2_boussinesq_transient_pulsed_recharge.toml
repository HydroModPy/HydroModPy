# Transient Boussinesq replay on the committed headwater 100 km2 outlet-2 mesh.
#
# This keeps the historical real mesh and drives one short pulsed-recharge
# chronology to exercise temporal storage and surface-threshold activation on a
# true basin geometry without the full 3-year MF6 scenario cost.

base_config = "run_headwater_100km2_outlet_2_boussinesq_mesh_input.toml"

workflow = "simulation"

[workspace]
project_root = "./results_reused_real_meshes/headwater_100km2_outlet_2_boussinesq_transient_pulsed_recharge"

[flow]
flow_regime = "transient"
param_list = ["Sy"]
runtime_backend = "scipy_sparse"
runtime_max_iterations = 80
runtime_tol_residual_inf = 1.0e-7

[flow.param.Sy.field]
id = "Sy"
kind = "homogeneous"
unit = "-"

[flow.param.Sy.field_homogeneous]
value = 0.10

[flow.ic]
type = "top"

[simulation]
name = "Headwater 100 km2 Boussinesq transient pulsed recharge reused mesh"
run_id = "headwater_100km2_outlet_2_boussinesq_transient_pulsed_recharge"

[simulation.time]
start_datetime = "2003-01-01 00:00:00"
end_datetime = "2003-08-31 00:00:00"
step_value = "1 month"
coverage_policy = "warn"

[data]
types = ["recharge"]

[[data.recharge.sources]]
source = "synthetic"
values = [0.0, 6.0, 0.0, 6.0, 0.0, 6.0, 0.0, 0.0]
freq = "MS"
runoff_ratio = 0.10
