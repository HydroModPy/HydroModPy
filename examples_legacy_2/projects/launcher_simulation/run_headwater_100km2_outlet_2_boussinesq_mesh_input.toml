# Repo-relative replay of the historical headwater 100 km2 outlet-2 real case.
#
# This config reuses the committed triangular mesh bundle from `examples/mesh_gallery`
# instead of rebuilding the catchment mesh. It is intended as the clean restart
# point for testing Boussinesq runtimes on one real basin geometry.

workflow = "simulation"

[workspace]
project_root = "./results_reused_real_meshes/headwater_100km2_outlet_2"

[geographic]
catch_def = "from_outlet_coord"
dem_init_path = "../../../examples/data/dem/DEM_armorican_massif.tif"
x_outlet = 407925.0
y_outlet = 6808275.0
snap_dist = "50 m"
buff_area = "30%"
crs_project = "EPSG:2154"

[domain]

[domain.depth_model]
type = "constant_thickness"
thickness = "50.0 m"

[data]
types = []

[mesh_input]
mesh_path = "../../mesh_gallery/100km2/mesh_headwater_100km2_outlet_2_geology_rivers_buffer30/bundle/mesh_2d.msh"
bundle_dir = "../../mesh_gallery/100km2/mesh_headwater_100km2_outlet_2_geology_rivers_buffer30/bundle"

[flow]
flow_regime = "steady"
runtime_backend = "scipy_sparse"
active_sinks_sources = ["recharge"]
active_bc = ["drainage"]
runtime_max_iterations = 80
runtime_tol_residual_inf = 1.0e-7

[flow.ic]
type = "top"

[flow.bc.cauchy.drainage]
application_domain = "top"
value = "1.0e-6 m2/s"

[flow.sinks_sources.recharge]
values = 1.0e-8
first_clim = "mean"
negative_to_evt = false

[simulation]
name = "Headwater 100 km2 outlet 2 boussinesq reused mesh"
run_id = "headwater_100km2_outlet_2_boussinesq_reused_mesh"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["boussinesq"]

[postprocess]
enabled = true

[postprocess.flow]
enabled = true
display = true

[display]
enabled = true
show = false
save = true
dpi = 300

[display.flow]
enabled = true
boussinesq_state = true
boussinesq_diagnostics = true
boussinesq_mass_balance = true
boussinesq_probes = true
boussinesq_edge_flux = true
