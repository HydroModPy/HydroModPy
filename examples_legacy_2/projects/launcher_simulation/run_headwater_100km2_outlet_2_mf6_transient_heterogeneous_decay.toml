# Flagship 3-year MF6 replay on the committed headwater 100 km2 mesh with
# lateral heterogeneity and exponential depth decay.

base_config = "config_headwater_100km2_mf6_transient_common.toml"

workflow = "simulation"

[simulation]
name = "Headwater 100 km2 MF6 heterogeneous-decay reused mesh"
run_id = "headwater_100km2_outlet_2_mf6_transient_heterogeneous_decay"

[capability_gallery]
enabled = true
case_slug = "headwater_100km2_outlet_2_mf6_transient_heterogeneous_decay"
output_dir = "../../capability_gallery/launcher_simulation/headwater_100km2_outlet_2_mf6_transient_heterogeneous_decay"
assets = [
  "flow_state_triptych.png",
  "recharge_discharge_cumulative.png",
  "watertable_elevation.png",
  "watertable_depth.png",
  "flow_support_overview.png",
]

[domain.supports.field_hydrofacies]
provider = "generated_rings"
coordinate_mode = "relative"
radii = [0.28, 0.62]
labels = ["weathered_core", "fractured_transition", "tight_margin"]
default_cell_samples_per_axis = 8

[[data.recharge.sources]]
source = "synthetic"
values = [
  2.4, 2.2, 1.8, 1.2, 0.7, 0.2, -0.3, -0.5, 0.1, 0.9, 1.8, 2.3,
  2.1, 1.9, 1.5, 1.0, 0.4, 0.0, -0.6, -0.8, -0.1, 0.7, 1.6, 2.0,
  2.7, 2.4, 1.9, 1.3, 0.8, 0.3, -0.2, -0.4, 0.2, 1.1, 2.0, 2.6,
]
freq = "MS"
runoff_ratio = 0.12

[flow.param.K.field]
id = "K"
kind = "heterogeneous"
unit = "m/s"

[flow.param.K.field_heterogeneous]
values_source = "inline"
values = { weathered_core = 8.0e-5, fractured_transition = 2.5e-5, tight_margin = 6.0e-6 }
field_spatial_id = "field_hydrofacies"

[flow.param.K.field_vertical_profile]
mode = "exponential"
characteristic_depth = "18.0 m"
min_factor = 1e-3

[flow.param.Sy.field]
id = "Sy"
kind = "heterogeneous"
unit = "-"

[flow.param.Sy.field_heterogeneous]
values_source = "inline"
values = { weathered_core = 0.16, fractured_transition = 0.10, tight_margin = 0.05 }
field_spatial_id = "field_hydrofacies"

[flow.param.Sy.field_vertical_profile]
mode = "exponential"
characteristic_depth = "28.0 m"
min_factor = 5e-2

[flow.param.Ss.field]
id = "Ss"
kind = "homogeneous"
unit = "m-1"

[flow.param.Ss.field_homogeneous]
value = 5e-6
