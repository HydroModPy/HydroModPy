# Demonstrative annual MODFLOW-NWT run on a regular structured example12 grid.

base_config = "config_demonstrative_annual_common.toml"

workflow = "simulation"

[workspace]
project_root = "./results_reused_real_meshes/example12_demonstrative_nwt"

[simulation]
name = "Example 12 demonstrative annual NWT on 60x60 structured grid"
run_id = "example12_demonstrative_annual_nwt"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflownwt"]

[modflownwt.runtime]
dis_itmuni = 1

[modflownwt.sgrid.planar]
mode = "resample_to_shape"
nx = 60
ny = 60

[modflownwt.sgrid.vertical]
genmtd_lay = "decay"
nlay = 6
lay_decay = 1.2
