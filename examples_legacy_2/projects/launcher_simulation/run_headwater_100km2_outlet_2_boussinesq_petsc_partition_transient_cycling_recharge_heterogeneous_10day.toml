# PETSc head-only regularized-partition replay of the heterogeneous 10-day
# cycling headwater case.

base_config = "run_headwater_100km2_outlet_2_boussinesq_transient_cycling_recharge_heterogeneous_10day.toml"

workflow = "simulation"

[simulation]
name = "Headwater 100 km2 Boussinesq PETSc partition transient cycling recharge heterogeneous 10-day"
run_id = "headwater_100km2_outlet_2_boussinesq_petsc_partition_transient_cycling_recharge_heterogeneous_10day"

[flow]
runtime_backend = "petsc"
surface_interaction_model = "regularized_partition"
