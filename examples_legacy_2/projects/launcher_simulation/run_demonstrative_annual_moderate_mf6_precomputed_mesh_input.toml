# Moderate annual MF6 run on the committed triangular example12 mesh.

base_config = "config_demonstrative_annual_moderate_common.toml"

workflow = "simulation"

[workspace]
project_root = "./results_reused_real_meshes/ex12_demo_mod_mf6"

[mesh_input]
mesh_path = "results_stable/mesh/mesh_catchment.msh"
bundle_dir = "results_stable/mesh/mesh_catchment_bundle"

[simulation]
name = "Example 12 moderate annual MF6 on committed triangular mesh"
run_id = "ex12_demo_mod_mf6_tri"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 6
lay_decay = 1.2
