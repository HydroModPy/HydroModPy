[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromodpy"
version = "1.0.0"
description = "A Python toolbox for deploying catchment-scale shallow groundwater models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "EPL-2.0"
authors = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@gmail.com" },
    { name = "Jean-Raynald de Dreuzy", email = "jean-raynald.de-dreuzy@univ-rennes.fr" },
]
maintainers = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@gmail.com" },
    { name = "Bastien Boivin", email = "bastien.boivin@proton.me" },
]
keywords = [
    "hydrology",
    "hydrogeology",
    "groundwater",
    "modflow",
    "watershed",
    "modeling",
    "catchment",
    "machine-learning",
    "ml-friendly-storage",
    "queryable-results",
    "reproducible-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "colormap>=1.3.0,<2",
    "contextily>=1.7.0,<2",
    "flopy>=3.10.0,<4",
    "geopandas>=1.1.3,<2",
    "gmsh>=4.15.2,<5",
    "h5py>=3.16.0,<4",
    "imageio>=2.37.3,<3",
    "matplotlib>=3.10.8,<4",
    "matplotlib-scalebar>=0.9.0,<1",
    "meshio>=5.3.5,<6",
    "netCDF4>=1.7.4,<2",
    "numpy>=2.4.4,<3",
    "pandas>=2.3.3,<3",
    "plotly>=6.7.0,<7",
    "pint>=0.25.3,<1",
    "pydantic-pint>=0.4,<1",
    "pyproj>=3.7.2,<4",
    "pysheds>=0.5,<1",
    "rasterio>=1.5.0,<2",
    "rioxarray>=0.22.0,<1",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.17.1,<2",
    "cma>=4.4.4,<5",
    "optuna>=4.8.0,<5",
    "selenium>=4.43.0,<5",
    "ultraplot>=2.2.0,<3",
    "vedo>=2026.6.1,<2027",
    "whitebox-workflows>=1.3.5,<2",
    "xarray>=2026.4.0,<2027",
    "xugrid>=0.15.2,<1",
    "pydantic>=2.13.3,<3",
    "duckdb>=1.5.2,<2",
    "dask>=2026.3.0,<2027",
    "sqlalchemy>=2.0.49,<3",
    "tqdm>=4.67.3,<5",
    "zarr>=3.1.6,<4",
    "zstandard>=0.25.0,<1",
    "tomlkit>=0.14.0,<1",
    "tomli-w>=1.2.0,<2",
    "pandera>=0.31.1,<1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pytest-timeout", "coverage[toml]>=7.0", "pyyaml"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",
    "nbconvert",
    "nbformat",
    "jupyter-client",
    "sphinx-gallery",
    "sphinx-autobuild",
    "readthedocs-sphinx-ext",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-tabs",
    "sphinx-multiversion",
    "sphinxcontrib-plantuml",
    "autodoc-pydantic>=2.0",
]
ide = [
    "ipykernel",
    "ipython",
    "jupyterlab>=4.0",
    "pyside6",
    "spyder>=6.0",
    "spyder-kernels",
]
viewer3d = ["pyvista"]
dev = [
    "ruff>=0.15",
    "pre-commit>=4.0",
]

[project.scripts]
hmp = "hydromodpy.cli:main"
hydromodpy = "hydromodpy.cli:main"

[project.entry-points."hydromodpy.solver"]
flow_modflownwt = "hydromodpy.solver.modflow_nwt.adapters.flow:ModflowNwtFlowAdapter"
flow_modflow6 = "hydromodpy.solver.modflow6.adapters.flow:Modflow6FlowAdapter"
flow_boussinesq = "hydromodpy.solver.boussinesq.adapters.flow:BoussinesqFlowAdapter"

[project.urls]
Homepage = "https://hydromodpy-docs.readthedocs.io/en/latest/"
Documentation = "https://hydromodpy-docs.readthedocs.io/en/latest/"
Repository = "https://github.com/HydroModPy/HydroModPy"
Issues = "https://github.com/HydroModPy/HydroModPy/issues"
"Google Group" = "https://groups.google.com/g/hydromodpy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hydromodpy*"]

[tool.setuptools.package-data]
hydromodpy = ["py.typed"]
"hydromodpy.physics.hydrology.pyhelp" = ["*.FOR"]
"hydromodpy.data.common.administrative" = ["*.gpkg"]

[tool.coverage.run]
source = [
    "hydromodpy.core",
    "hydromodpy.spatial",
    "hydromodpy.physics",
    "hydromodpy.data",
    "hydromodpy.results",
    "hydromodpy.simulation",
    "hydromodpy.solver",
    "hydromodpy.analysis",
]
parallel = true
omit = [
    "hydromodpy/**/cases/*",
    "hydromodpy/**/examples/*",
    "examples/*",
    "examples_legacy/*",
    "validation_cases/*",
    "hydromodpy_annex/*",
    "docs/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff - unified linter + formatter (replaces black, isort, flake8, pyupgrade…)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

extend-exclude = [
    "examples_legacy_2",
    "hydromodpy.egg-info",
    "docs",              # Sphinx conf + doc examples aren't production code
    "bin",
    ".venv",
    "build",
    "dist",
    "*.ipynb",           # skip notebooks (stray scratch files like Test_delete.ipynb)
]

[tool.ruff.lint]
# Classic starter set - the six rule groups most Python projects enable.
# Extend later (C4, SIM, NPY, RUF, D, ANN…) once the core is clean.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports/variables, undefined names…)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernize syntax for your target Python)
    "B",     # flake8-bugbear (likely-bug patterns)
    "TID251", # flake8-tidy-imports banned-api (block stdlib logging.getLogger)
]

ignore = [
    "E501",  # line too long - the formatter handles it
    "B008",  # function call in default arg (common with pydantic Field(...))
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files commonly re-export symbols and set up paths.
"__init__.py" = ["F401", "E402", "TID251"]
# Logging subsystem is the canonical wrapper around stdlib `logging.getLogger`.
"hydromodpy/core/logging/**" = ["TID251"]
# Tests can use idiomatic pytest patterns: bare pytest.raises(Exception),
# zip without strict=, kept assignments for readability, etc.
"tests/**/*.py" = ["E402", "F401", "B011", "B017", "B905", "F841"]
# tools/ scripts do `sys.path.insert(0, REPO_ROOT)` before imports - legit pattern.
"tools/**" = ["E402", "F401", "B007", "B905", "F841"]
# Annex: legacy/peripheral code, minimal linting.
"hydromodpy_annex/**" = ["E402", "F401", "B006", "B007"]
# Demo / validation scripts: lenient, they're not production code.
"hydromodpy/**/cases/**" = ["E402", "F401", "B007"]
"hydromodpy/**/examples/**" = ["E402", "F401", "B007"]
"validation_cases/**" = ["E402", "F401", "B007", "B905"]
"examples/**" = ["E402", "F401", "B007"]
# CLI shells can do argparse-style late imports.
"hydromodpy/cli/**" = ["E402"]
# Pydantic `model_rebuild(_types_namespace=...)` pattern: forward refs are
# resolved at runtime via an explicit namespace dict, so ruff can't see them
# with static analysis. Known-good, silencing F821 in these files.
"hydromodpy/data/data_managers_config.py" = ["F821"]
"hydromodpy/master_config/hydromodpy_config.py" = ["F821"]
# Legacy MODFLOW-NWT subtree: uses `sys.path` manipulation and double-docstring
# license headers that technically break import ordering. Not worth rewriting.
"hydromodpy/solver/modflow_nwt/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["hydromodpy", "hydromodpy_annex"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Force every module-level logger to go through hydromodpy.core.logging.get_logger
# so that the LogManager hierarchy ("hydromodpy.<sub>") stays consistent.
# Allowed only inside core/logging/ (the wrapper) and in __init__.py re-exports.
"logging.getLogger".msg = "Use `from hydromodpy.core.logging import get_logger` instead."

[tool.ruff.lint.flake8-type-checking]
# Tell ruff that pydantic's BaseModel is inspected at runtime, so forward
# references to annotated types (e.g. `"HydrographyConfig | None"`) inside
# pydantic models must be resolvable - avoids a wave of false-positive F821s
# when the real import sits under `if TYPE_CHECKING:`.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.format]
# Mirrors black's defaults: double quotes, 4-space indent, trailing commas.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Also format code blocks inside docstrings (``>>>`` examples etc.).
docstring-code-format = true
docstring-code-line-length = 80

[tool.mypy]
# Baseline non-blocking type-check. Tighten incrementally as the codebase
# grows type coverage. The CI gate runs with continue-on-error so failures
# surface as annotations without blocking merges.
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [
    "hydromodpy_annex/",
    "_archive/",
    "examples/projects/",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "flopy.*",
    "rasterio.*",
    "shapely.*",
    "geopandas.*",
    "pyproj.*",
    "rioxarray.*",
    "xarray.*",
    "xugrid.*",
    "pysheds.*",
    "whitebox_workflows.*",
    "vedo.*",
    "ultraplot.*",
    "pyvista.*",
    "gmsh.*",
    "cma.*",
    "optuna.*",
    "selenium.*",
    "duckdb.*",
    "zarr.*",
    "dask.*",
    "tomlkit.*",
    "tomli_w.*",
    "matplotlib_scalebar.*",
    "colormap.*",
    "contextily.*",
    "imageio.*",
]
ignore_missing_imports = true
