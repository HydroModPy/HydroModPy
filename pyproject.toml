[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromodpy"
version = "2.0.0"
description = "A Python toolbox for deploying catchment-scale shallow groundwater models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "EPL-2.0"
authors = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@inrae.fr" },
    { name = "Jean-Raynald de Dreuzy", email = "jean-raynald.de-dreuzy@univ-rennes.fr" },
]
maintainers = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@inrae.fr" },
    { name = "Bastien Boivin", email = "bastien.boivin@proton.me" },
]
keywords = [
    "hydrology",
    "hydrogeology",
    "groundwater",
    "modflow",
    "watershed",
    "modeling",
    "catchment",
    "queryable-results",
]
# Linux x86_64 is the supported platform. macOS and Windows are best effort until
# their CI is green. whitebox-workflows 1.3.5 ships wheels for manylinux_2_35
# x86_64, macOS arm64 and win_amd64 only.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "contextily>=1.7.0,<2",
    "flopy>=3.10.0,<4",
    "geopandas>=1.1.3,<2",
    "h5py>=3.16.0,<4",
    "imageio>=2.37.3,<3",
    "matplotlib>=3.10.8,<4",
    "meshio>=5.3.5,<6",
    "netCDF4>=1.7.4,<2",
    "numpy>=2.4.4,<3",
    "packaging>=23",
    # Stays below 3: the stored-session read-back returns NaN where it returned
    # None (tests/regression/frozen_runs), measured on pandas 3.1.0 on 2026-11-03.
    "pandas>=2.3.3,<3",
    # 13.0.0 is the first version with the 2026 security fixes.
    "Pillow>=13.0.0,<14",
    # Optuna 5 changes the TPE defaults (constant liar), so a calibration result moves.
    "optuna>=4.8.0,<5",
    # Plotly 7 embeds slider frames differently: only one image is left in the HTML.
    "plotly>=6.7.0,<7",
    "pint>=0.25.3,<1",
    "pydantic-pint>=0.6,<1",
    "py7zr>=1.0,<2",
    "pyarrow>=23.0.1,<27",
    "pyproj>=3.7.2,<4",
    "rasterio>=1.4.0,<2",
    "requests>=2.32.5,<3",
    "rioxarray>=0.19,<1",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.17.1,<2",
    "shapely>=2.1,<3",
    "threadpoolctl>=3.1,<4",
    "whitebox-workflows==1.3.5",
    "xarray>=2026.4.0,<2027",
    "xugrid>=0.15.2,<1",
    "pydantic>=2.13.3,<3",
    # DuckDB 2 refuses to reopen a deleted index path this process still holds.
    "duckdb>=1.5.2,<2",
    "dask>=2026.3.0,<2027",
    "rich>=13.9.4,<16",
    "zarr>=3.1.6,<4",
    "zstandard>=0.25.0,<1",
    "tomlkit>=0.14.0,<1",
    "tomli-w>=1.2.0,<2",
    "universal_pathlib>=0.2,<1",
    "pandera>=0.31.1,<1",
    "platformdirs>=4,<5",
    "filelock>=3.13,<5",
    "argcomplete>=3.5,<4",
]

[project.optional-dependencies]
calibration = ["cma>=4.4.4,<5", "cmaes>=0.12.0,<1"]
mesh = ["gmsh>=4.15.2,<5"]
metrics = ["psutil"]
mf6api = [
    "modflowapi>=0.2",
    "xmipy>=1.5",
]
viz = [
    "datashader>=0.16,<1",
    "lttb>=0.3,<1",
]
fair = [
    "pystac>=1.10,<2",
    "stac-validator>=3.5,<5",
    "rocrate>=0.10,<1",
]
# Every functional extra. The test, docs, ide and dev extras are for contributors.
all = ["hydromodpy[calibration,mesh,mf6api,viz,fair,metrics]"]
test = ["pytest<9.2", "pytest-xdist", "pytest-timeout", "pytest-cov", "coverage[toml]>=7.0", "pyyaml", "jsonschema>=4.0", "pyinstrument>=5.0,<6", "hypothesis>=6.100,<7"]
performance = ["pytest-benchmark>=5.0,<6", "uuid-utils>=0.10,<1", "polars>=1.0,<2"]
profiling = ["pyinstrument>=5.0,<6"]
docs = [
    "sphinx>=9.0,<9.1",
    "myst-parser>=5.1,<6",
    "sphinx-autobuild",
    "pydata-sphinx-theme==0.23.0",
    "sphinx-design>=0.7",
    "sphinx-copybutton",
    "sphinx-polyversion>=1.0",
    "sphinxcontrib-plantuml",
    "sphinxcontrib-bibtex",
    "sphinx-favicon>=1.1",
    "sphinx-sitemap",
    "sphinx-last-updated-by-git",
    "sphinxext-opengraph",
    "sphinxext-rediraffe",
    "pagefind[bin]>=1.5",
    "sphinx-lint",
    "doc8",
]
ide = [
    "ipykernel",
    "ipython",
    "jupyterlab>=4.0",
    "pyside6",
    "spyder>=6.0",
    "spyder-kernels",
]
dev = [
    "ruff>=0.15",
    "pre-commit>=4.0",
]

[project.scripts]
hmp = "hydromodpy.cli.main:main"
hydromodpy = "hydromodpy.cli.main:main"

# Eight entry-point groups are the out-of-tree plugin surface. Each is read by
# one instance of hydromodpy.core.plugin_registry.PluginRegistry, and the
# in-tree classes are declared once, in the same module, so a plugin never
# carries two names. An entry-point name must equal the id its class declares,
# and a name this build already ships is refused.
#
# "hydromodpy.solver" and "hydromodpy.solver.extractor" are read by
# hydromodpy.solver.base.registry.solvers and .extractors. A backend is named
# <process_type>_<name>, for example flow_modflow6, and its adapter class
# declares the attributes the solver port lists.
#
# "hydromodpy.data.source" is read by hydromodpy.data.source.registry.data_sources.
# A source is named <section>_<source_id>, for example hydrography_osm.
#
# "hydromodpy.export.format" is read by
# hydromodpy.results.exporters.registry.export_formats. It names an export
# format or run view, for example stac or prov.
#
# "hydromodpy.terrain.engine" is read by
# hydromodpy.catchment.terrain.registry.terrain_engines. It is what
# [geographic] terrain_engine names, so a flow-routing engine is substituted
# from outside without a patch to this package.
#
# "hydromodpy.mesh.engine" is read by hydromodpy.mesh.registry.mesh_engines. It
# is what [mesh] engine names, so a mesh engine (catchment, regular, triangle
# and voronoi ship in-tree) is substituted the same way.
#
# "hydromodpy.calibration.evaluator" and "hydromodpy.calibration.forward_model"
# are read by hydromodpy.calibration.evaluation.registry.evaluators and by
# hydromodpy.calibration.evaluation.forward_registry.forward_models. The first
# turns a parameter sample into a cost and is named by [calibration] evaluator;
# the second answers the observables [calibration.outputs] declares and is named
# by [calibration] forward_model, so a foreign model is scored by the criteria
# of the document and brings none of its own.

[project.entry-points."hydromodpy.export.format"]
stac = "hydromodpy_annex.export.stac:StacItemView"
prov = "hydromodpy_annex.export.prov:ProvView"

[project.urls]
Homepage = "https://docs.hydromodpy.fr/"
Documentation = "https://docs.hydromodpy.fr/"
Repository = "https://github.com/HydroModPy/HydroModPy"
Issues = "https://github.com/HydroModPy/HydroModPy/issues"
"Google Group" = "https://groups.google.com/g/hydromodpy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hydromodpy*"]
exclude = ["hydromodpy_annex*"]

[tool.setuptools.package-data]
hydromodpy = ["py.typed"]
# The process descriptions ship inside the wheel: a shim reads them with
# importlib.resources to learn what it can invoke, without importing anything.
"hydromodpy.schema.processes" = ["*.json"]
# The example catalog ships in the wheel so `hmp example list` answers offline
# and can only promise what the installed version knows about.
"hydromodpy.project.examples" = ["catalog.toml"]
"hydromodpy.data.registry.migrations" = ["*.sql"]
# The register of known issues is read by results/validity_rules.py to label a run.
"hydromodpy.results" = ["*.toml"]
# The JSON Schemas of the stored formats, generated from the results models.
"hydromodpy.schema.results" = ["*.json"]
# The SLURM job templates of `hmp campaign array`, read by importlib.resources.
"hydromodpy.project.launch.templates" = ["*.sh"]
"hydromodpy.catchment.administrative" = ["*.gpkg"]
# The curated CF v85 standard-name list is read at runtime by cf_validation.py.
"hydromodpy.results.zarr_store.data" = ["*.txt"]

[tool.coverage.run]
source = [
    "hydromodpy.core",
    "hydromodpy.schema",
    "hydromodpy.config",
    "hydromodpy.catchment",
    "hydromodpy.mesh",
    "hydromodpy.model",
    "hydromodpy.data",
    "hydromodpy.results",
    "hydromodpy.solver",
    "hydromodpy.calibration",
    "hydromodpy.display",
    "hydromodpy.workflow",
    "hydromodpy.project",
    "hydromodpy.cli",
]
parallel = true
omit = [
    "examples/*",
    "validation_cases/*",
    "hydromodpy_annex/*",
    "docs/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    ":\\s*\\.\\.\\.\\s*$",
]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff - unified linter + formatter (replaces black, isort, flake8, pyupgrade…)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

extend-exclude = [
    "hydromodpy.egg-info",
    "docs",              # Sphinx conf + doc examples aren't production code
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Classic starter set - the six rule groups most Python projects enable.
# Extend later (C4, SIM, NPY, RUF, D, ANN…) once the core is clean.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports/variables, undefined names…)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernize syntax for your target Python)
    "B",     # flake8-bugbear (likely-bug patterns)
    "TID251", # flake8-tidy-imports banned-api (block stdlib logging.getLogger)
    "SLF001", # private member access; enforced in hydromodpy/data and display only, see per-file-ignores
]

ignore = [
    "E501",  # line too long - the formatter handles it
    "B008",  # function call in default arg (common with pydantic Field(...))
]

[tool.ruff.lint.per-file-ignores]
# No module of hydromodpy/data or hydromodpy/display reads a private attribute
# of another. The rest of the repository is not held to it yet.
"!hydromodpy/{data,display}/**" = ["SLF001"]
# Package __init__ files commonly re-export symbols and set up paths.
"__init__.py" = ["F401", "E402", "TID251"]
# Logging subsystem is the canonical wrapper around stdlib `logging.getLogger`.
"hydromodpy/core/logging.py" = ["TID251"]
# core/console/progress is imported by core/logging (console handler); importing
# get_logger back would be circular.
"hydromodpy/core/console/progress.py" = ["TID251"]
# core/console/ndjson is imported by core/console/progress, itself imported by
# core/logging; same circularity as core/console/progress.py above.
"hydromodpy/core/console/ndjson.py" = ["TID251"]
# Tests can use idiomatic pytest patterns: bare pytest.raises(Exception),
# zip without strict=, kept assignments for readability, etc.
"tests/**/*.py" = ["E402", "F401", "B011", "B017", "B905", "F841"]
# tools/ scripts may set repo-root import precedence before imports.
"tools/**" = ["E402", "F401", "B007", "B905", "F841"]
# evaluation/ metric scripts do the same repo-root sys.path bootstrap.
"evaluation/**" = ["E402"]
# validity_frame is a separate installable package with its own pyproject;
# its str+Enum classes are kept as declared because StrEnum would change
# what str() renders, and with it every f-string and log line there.
"validity_frame/**" = ["UP042"]
# Annex: legacy/peripheral code, minimal linting.
"hydromodpy_annex/**" = ["E402", "F401", "B006", "B007"]
# Demo / validation scripts: lenient, they're not production code.
"hydromodpy/**/examples/**" = ["E402", "F401", "B007"]
"validation_cases/**" = ["E402", "F401", "B007", "B905"]
"examples/**" = ["E402", "F401", "B007"]
# CLI shells can do argparse-style late imports.
"hydromodpy/cli/**" = ["E402"]
# Pydantic `model_rebuild(_types_namespace=...)` pattern: forward refs are
# resolved at runtime via an explicit namespace dict, so ruff can't see them
# with static analysis. Known-good, silencing F821 in this file.
"hydromodpy/config/hydromodpy_config.py" = ["F821"]
# MODFLOW-NWT solver subtree: import ordering and double-docstring license
# headers are handled separately from this release cleanup.
"hydromodpy/solver/modflow_nwt/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["hydromodpy", "hydromodpy_annex"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Force every module-level logger to go through hydromodpy.core.logging.get_logger
# so that the LogManager hierarchy ("hydromodpy.<sub>") stays consistent.
# Allowed only inside core/logging.py (the wrapper) and in __init__.py re-exports.
"logging.getLogger".msg = "Use `from hydromodpy.core.logging import get_logger` instead."

[tool.ruff.lint.flake8-type-checking]
# Tell ruff that pydantic's BaseModel is inspected at runtime, so forward
# references to annotated types (e.g. `"HydrographyConfig | None"`) inside
# pydantic models must be resolvable - avoids a wave of false-positive F821s
# when the real import sits under `if TYPE_CHECKING:`.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]

[tool.ruff.format]
# Mirrors black's defaults: double quotes, 4-space indent, trailing commas.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Also format code blocks inside docstrings (``>>>`` examples etc.).
docstring-code-format = true
docstring-code-line-length = 80
# User-managed project scripts: kept in sync with mypy's exclude list above
# so users own the layout of their own examples without auto-reformatting.
exclude = ["examples/projects/**"]

[tool.mypy]
# Baseline non-blocking type-check. Tighten incrementally as the codebase
# grows type coverage. The main CI gate keeps mypy advisory so failures are
# visible without blocking merges.
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = [
    "hydromodpy_annex/",
    "examples/projects/",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "flopy.*",
    "rasterio.*",
    "shapely.*",
    "geopandas.*",
    "pyproj.*",
    "rioxarray.*",
    "xarray.*",
    "xugrid.*",
    "whitebox_workflows.*",
    "vedo.*",
    "ultraplot.*",
    "gmsh.*",
    "cma.*",
    "optuna.*",
    "duckdb.*",
    "zarr.*",
    "dask.*",
    "tomlkit.*",
    "tomli_w.*",
    "matplotlib_scalebar.*",
    "colormap.*",
    "contextily.*",
    "imageio.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Strict gate on the foundational layers. Other layers stay advisory and
# tighten progressively as type debt is paid down.
[[tool.mypy.overrides]]
module = [
    "hydromodpy.core.*",
    "hydromodpy.schema.*",
    "hydromodpy.config.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
