[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromodpy"
version = "0.1.1"
description = "A Python toolbox for deploying catchment-scale shallow groundwater models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LGPL-3.0-or-later"}
authors = [
    {name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com"},
    {name = "Ronan Abhervé", email = "ronan.abherve@gmail.com"},
    {name = "Jean-Raynald de Dreuzy", email = "jean-raynald.de-dreuzy@univ-rennes.fr"},
]
maintainers = [
    {name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com"},
    {name = "Ronan Abhervé", email = "ronan.abherve@gmail.com"},
    {name = "Bastien Boivin", email = "bastien.boivin@proton.me"},
]
keywords = [
    "hydrology",
    "hydrogeology",
    "groundwater",
    "modflow",
    "watershed",
    "modeling",
    "catchment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "colormap>=1.3.0",
    "contextily>=1.6.0",
    "deepdish>=0.3.7",
    "flopy>=3.9.0",
    "geopandas>=1.1.0",
    "imageio>=2.37.0",
    "ipykernel>=6.29.0",
    "ipython>=9.4.0",
    "matplotlib>=3.10.0",
    "matplotlib-scalebar>=0.9.0",
    "netCDF4>=1.7.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
    "pyshp>=2.3.0",
    "rasterio>=1.4.0",
    "rioxarray>=0.19.0",
    "selenium>=4.34.0",
    "vedo>=2025.5.0",
    "whitebox>=2.3.0",
    "xarray>=2025.6.0",
]

[project.urls]
Homepage = "https://hydromod.readthedocs.io/"
Documentation = "https://hydromod.readthedocs.io/"
Repository = "https://gitlab.com/Alex-Gauvain/HydroModPy"
Issues = "https://gitlab.com/Alex-Gauvain/HydroModPy/-/issues"
"Google Group" = "https://groups.google.com/g/hydromodpy"

[tool.setuptools]
packages = ["hydromodpy", "hydromodpy.watershed", "hydromodpy.modeling", "hydromodpy.modeling.gr4j", "hydromodpy.display", "hydromodpy.tools", "hydromodpy.pyhelp"]
include-package-data = true

[tool.setuptools.package-data]
hydromodpy = ["../bin/**/*"]
