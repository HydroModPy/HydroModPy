[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromodpy"
version = "0.3.5"
description = "A Python toolbox for deploying catchment-scale shallow groundwater models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "EPL-2.0"
authors = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@gmail.com" },
    { name = "Jean-Raynald de Dreuzy", email = "jean-raynald.de-dreuzy@univ-rennes.fr" },
]
maintainers = [
    { name = "Alexandre Gauvain", email = "alexandre.gauvain.ag@gmail.com" },
    { name = "Ronan Abherve", email = "ronan.abherve@gmail.com" },
    { name = "Bastien Boivin", email = "bastien.boivin@proton.me" },
]
keywords = [
    "hydrology",
    "hydrogeology",
    "groundwater",
    "modflow",
    "watershed",
    "modeling",
    "catchment",
]
classifiers = [
    "Development Status :: 4 - Beta", 
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "colormap",
    "contextily",
    "flopy",
    "geopandas",
    "gmsh",
    "h5py",
    "imageio",
    "matplotlib",
    "matplotlib-scalebar",
    "meshio",
    "netCDF4",
    "numpy>=2.0",
    "pandas",
    "plotly",
    "pint",
    "pydantic-pint",
    "pyproj",
    "pysheds",
    "rasterio",
    "rioxarray",
    "scikit-learn",
    "scipy",
    "cma",
    "selenium",
    "ultraplot",
    "vedo",
    "whitebox-workflows",
    "xarray",
    "pydantic>=2.0",
    "duckdb",
    "dask",
    "sqlalchemy>=2.0",
    "tqdm",
    "zarr>=3.0",
    "pytest",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pytest-timeout", "coverage[toml]>=7.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",
    "nbconvert",
    "nbformat",
    "jupyter-client",
    "sphinx-gallery",
    "sphinx-autobuild",
    "readthedocs-sphinx-ext",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-tabs",
    "sphinx-multiversion",
    "sphinxcontrib-plantuml",
    "autodoc-pydantic>=2.0",
]
ide = [
    "ipykernel",
    "ipython",
    "jupyterlab>=4.0",
    "pyside6",
    "spyder>=6.0",
    "spyder-kernels",
]
ugrid = ["xugrid"]
viewer3d = ["pyvista"]

[project.scripts]
hmp = "hydromodpy.__main__:main"
hydromodpy = "hydromodpy.__main__:main"

[project.urls]
Homepage = "https://hydromodpy-docs.readthedocs.io/en/latest/"
Documentation = "https://hydromodpy-docs.readthedocs.io/en/latest/"
Repository = "https://github.com/HydroModPy/HydroModPy"
Issues = "https://github.com/HydroModPy/HydroModPy/issues"
"Google Group" = "https://groups.google.com/g/hydromodpy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hydromodpy*"]

[tool.setuptools.package-data]
hydromodpy = ["../bin/**/*"]
"hydromodpy.process.hydrology.pyhelp" = ["*.FOR"]
"hydromodpy.analysis.calibration.devkit" = ["templates/case/*.tmpl"]
"hydromodpy.data.common.administrative" = ["*.gpkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "regression: non-regression tests based on reference datasets",
    "validation: scientific or benchmark validation tests against a reference solution",
    "analytical: validation test compared to an analytical reference solution",
    "normal: deprecated alias for the fast regression tier",
    "extensive: extended regression checks for deeper validation",
    "steady: steady-state validation or regression case",
    "transient: transient validation or regression case",
    "fast: quick-running validation, integration, or fast-tier regression cases",
    "slow: long-running validation, integration, or regression tests",
    "petsc: tests that exercise the Linux PETSc-backed Boussinesq runtime",
    "nwt: MODFLOW-NWT / MODPATH / MT3DMS test case",
    "mf6: MODFLOW 6 / GWT test case",
    "integration: tests that call external services or systems",
    "coverage: long-running coverage tests",
]

[tool.coverage.run]
source = [
    "hydromodpy.core",
    "hydromodpy.spatial",
    "hydromodpy.process",
    "hydromodpy.data",
    "hydromodpy.results",
    "hydromodpy.simulation",
    "hydromodpy.solver",
    "hydromodpy.analysis",
]
parallel = true
omit = [
    "hydromodpy/**/cases/*",
    "hydromodpy/**/examples/*",
    "hydromodpy/calibration_legacy/*",
    "hydromodpy/calibration2/*",
    "examples/*",
    "examples_legacy/*",
    "validation_cases/*",
    "hydromodpy_annex/*",
    "docs/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
