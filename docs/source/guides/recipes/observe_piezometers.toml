# Step 4 with four piezometers read at every run.
#
#   hmp run observe_piezometers.toml
#
# The run samples each point when it finishes. The series are stored with the
# run, under the stations obs:PZ1 to obs:PZ4.

base_config = "step4_transient.toml"

[simulation]
name = "nancon_piezometers"

[observation]
variables = ["head", "watertable_depth"]

[[observation.points]]
id = "PZ1"
x = 388352.0
y = 6818548.0

[[observation.points]]
id = "PZ2"
x = 390752.0
y = 6821548.0

[[observation.points]]
id = "PZ3"
x = 393902.0
y = 6820428.0

[[observation.points]]
id = "PZ4"
x = 394272.0
y = 6819822.0
