# A steady run on a catchment of the Belgian Ardennes, with no French service.
#
# The DEM is a Copernicus GLO-30 tile cut and reprojected to ETRS89 / UTM 31N
# (EPSG:25831), saved as data/dem/dem_ardennes_25831.tif in the workspace.
# Nothing is downloaded: BD Topage, Hub'Eau, SIM2 and BRGM are not asked.
#
#   hmp run outside_france.toml

[workflow]
mode = "simulation"

[workspace]
project_root = "."

[simulation]
name = "ardennes_steady"

[[simulation.process]]
id = "flow_main"
type = "flow"
solvers = ["modflow6"]

[geographic]
# The CRS of the project. Every file and every coordinate below is in it.
crs_project = "EPSG:25831"

# The catchment is cut out of the DEM, upslope of the outlet point.
[geographic.catchment]
catch_def = "from_outlet_coord"
dem_init_path = "dem_ardennes_25831.tif"
x_outlet = 673044.6
y_outlet = 5578859.6
snap_dist = "90 m"
buff_area = "10%"

[domain.depth_model]
kind = "constant_thickness"
thickness = "30.0 m"

[flow]
flow_regime = "steady"
param_list = ["K", "Sy"]
active_sinks_sources = ["recharge"]
# Any cell drains at the ground surface: the excess leaves as seepage.
active_bc = ["drainage"]

[flow.param.K.field]
kind = "homogeneous"
unit = "m/s"
value = 5e-5

[flow.param.Sy.field]
kind = "homogeneous"
unit = "-"
value = 0.05

# mm/d. Your own estimate: no service gives it here.
[flow.sinks_sources.recharge]
values = 0.9

[display]
on_error = "raise"
figures = ["watershed_id_card", "watertable_depth_map", "seepage_map", "water_budget"]

[[export]]
variables = "watershed"

[[export]]
variables = ["watertable_depth", "seepage_mask"]
time = "last"
