# Recipe 1 of 4: one parameter, one gauge, a first scan.
#
# The shape almost every calibration starts from. One conductivity is tried on
# a regular grid and each run is scored against one gauged discharge. A grid
# does not search: it maps the cost, so you see its shape before you spend a
# search on it.
#
# Save this file beside project.toml in
# examples/projects/04_streamflow_intermittence_in_transient/, then:
#
#   hmp calibrate calibration_single_gauge.toml --check   nothing solves
#   hmp calibrate calibration_single_gauge.toml           7 monthly runs of 2000-2002
#
# For another site, point base_config at your own project file and change the
# station name and the dates.

# The model comes from the project: catchment, data, solver, time window.
# This file only adds the search.
base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "recipe_single_gauge"

[calibration]
# Seven values of K, evenly spaced in log space between the two bounds. A
# grid ends when its last point is solved.
method = "grid"
method_options = { points_per_dim = 7 }
# The best run is replayed with its figures and exports.
rerun_best_with_outputs = true

# The name is one that `hmp config targets project.toml` lists. A conductivity
# is searched in log space without a word from you: only the range is yours.
# Three decades is a wide prior for a fractured basement aquifer; narrow it
# when a pumping test or a regional map says more.
[calibration.parameters.K]
bounds = [1e-6, 1e-3]

# The record of station NANCON that project.toml loads, on the simulated months.
[calibration.outputs.hydrograph]
support = "point"
variable = "discharge"
observes = "NANCON"

# NSE on the log of the discharge: the recessions weigh as much as the peaks.
[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["hydrograph"]

# 2000 is spin-up: simulated, not scored. A date means the same span at any
# time step.
[calibration.scoring_window]
start = "2001-01-01"
