# Recipe 3 of 4: a published method, named instead of written out.
#
# K from the extent of the mapped stream network in steady state, then Sy from
# the gauged discharge in transient, K frozen. Abherve et al. (2023),
# doi:10.5194/hess-27-3221-2023.
#
# Save this file beside project.toml in
# examples/projects/04_streamflow_intermittence_in_transient/, then:
#
#   hmp calibrate calibration_matching_hydrographic_network.toml --list-phases
#   hmp calibrate calibration_matching_hydrographic_network.toml --expand
#   hmp calibrate calibration_matching_hydrographic_network.toml
#
# --expand prints the two stages the name stands for, as TOML.

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "recipe_protocol"

[calibration]
# The best trial of each stage is replayed with its figures and exports.
rerun_best_with_outputs = true

# What belongs to the site: the two ranges and the mapped network.
[calibration.parameters.K]
bounds = [1e-7, 1e-3]

[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

# The map stage one is scored on. It is a target, never an input of the model.
# The gauge needs no output: the protocol reads the station of [data.hydrometry].
[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"

# The name writes both stages. Every other key is optional and shown here
# with the value it changes; `hmp calibrate --check` lists each departure
# from the paper and from the recipe.
[calibration.protocol]
name = "matching_hydrographic_network"
# Stage one: a root search on the signed gap between the two networks.
# "auto" counts the evaluations it needs before the first solve.
steady_max_iter = "auto"
# Stage two: each trial is a 36-month run, about one minute here.
transient_max_iter = 30
# Five per cent on Sy.
transient_tolerance = 0.05

# Stage two scores from one year after the start of the run by default. A
# window written here replaces that start.
[calibration.protocol.scoring_window]
start = "2001-01-01"
end = "2002-12-31"
