# Recipe 2 of 4: two targets weighted against each other.
#
# K and Sy move together, and each run is scored at once on the gauged
# discharge and on the mapped stream network. The weights say what the
# calibration is for: read them as shares of the cost.
#
# Save this file beside project.toml in
# examples/projects/04_streamflow_intermittence_in_transient/, then:
#
#   hmp calibrate calibration_multi_objective.toml --check
#   hmp calibrate calibration_multi_objective.toml        40 monthly runs
#
# For another site, point base_config at your own project file and change the
# station, the map and the dates.

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "recipe_multi_objective"

[calibration]
# Two parameters and a cost with plateaus: an adaptive sampler. It stops on
# its budget, and the seed makes a re-run propose the same trials.
method = "optuna"
max_iter = 40
seed = 42
rerun_best_with_outputs = true
# Keep the raw and normalised cost of every block for every trial, so the
# weighting can be checked after the fact.
persist_iteration_detail = "full"

[calibration.parameters.K]
bounds = [1e-6, 1e-3]

# The lower bound is not the physical floor: the solve slows down as Sy goes
# to zero, and the observed recessions already exclude that region.
[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

[calibration.outputs.hydrograph]
support = "point"
variable = "discharge"
observes = "NANCON"

# The simulated network of October 2002, the driest month of the record,
# against the map of permanent streams.
[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"
time = "2002-10-15"

# The weights are divided by their sum, so 0.7 and 0.3 are shares.
[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["hydrograph"]
weight = 0.7

# A network gap is in metres. normalize_cost divides it by the validity
# length of the output, so it adds to an NSE as a pure number and the share
# means a share. On an efficiency score the key is refused: it has no unit.
[[calibration.objective_blocks]]
name = "network"
metric = "distance_gap"
uses_outputs = ["seepage_network"]
weight = 0.3
normalize_cost = true

# 2000 is spin-up: both targets are read from 2001 on.
[calibration.scoring_window]
start = "2001-01-01"
