# Step 4 with the files a GIS colleague opens, written when the run finishes.
#
#   hmp run hand_off_to_gis.toml
#
# Files land in share/for_gis/: a relative folder is read from share/.

base_config = "step4_transient.toml"

# Step 4 writes its own list. This one replaces it.
export__delete = true

[simulation]
name = "nancon_hand_off"

# The catchment, the mapped network and the cells of the simulated active
# network in October 2002: GeoPackage, in the CRS of the project.
[[export]]
variables = ["watershed", "hydrographic_network_reference"]
folder = "for_gis"

[[export]]
variables = "simulated_active_network"
time = "2002-10-15"
format = "geopackage"
folder = "for_gis"

# The water table and the seepage cells in April and October 2002: one GeoTIFF
# per variable and date.
[[export]]
variables = ["watertable_depth", "seepage_mask"]
time = ["2002-04-15", "2002-10-15"]
format = "geotiff"
folder = "for_gis"

# The same water table reprojected to WGS 84, for a web map.
[[export]]
variables = "watertable_depth"
time = "2002-10-15"
format = "geotiff"
crs = "EPSG:4326"
folder = "for_gis"
file = "watertable_depth_wgs84.tif"
