# Guide "Add a lake or a reservoir": one lake on the transient model of
# example 04, with a weir, a gate, its forcings, a carved bed and a gauged
# level. Example 04 ships no lake: this file loads, and it runs once the files
# it names exist, next to it (lake/lac0.gpkg, lake/lac0.csv,
# lake/lac0_bathymetry.tif, and the station folders lake_inflow and lake_levels).
#
#   hmp run guide_lake.toml

base_config = "step4_transient.toml"

[simulation]
name = "nancon_guide_lake"

[flow]
active_bc = ["drainage", "lake"]

[flow.sinks_sources.lakes.lac0]
bedleak = 1e-6
stageinit = "101.0 m"

[[flow.sinks_sources.lakes.lac0.outlets]]
couttype = "WEIR"
invert = "104.0 m"
width = "5.0 m"

[[flow.sinks_sources.lakes.lac0.outlets]]
couttype = "SPECIFIED"
rate = "-0.02 m^3/s"

[flow.sinks_sources.lakes.lac0.rainfall]
kind = "constant"
value = 2.0e-8
units = "m/s"

[flow.sinks_sources.lakes.lac0.withdrawal]
kind = "seasonal"
units = "m3/s"
by_season = { DJF = 0.01, MAM = 0.03, JJA = 0.05, SON = 0.02 }

[flow.sinks_sources.lakes.lac0.bed_reconstruction]
dynamic_area = true

[data]
types = ["hydrography", "hydrometry", "recharge", "runoff", "lake_bathymetry", "lake_levels"]

[[data.lake_geometry.sources]]
source = "custom"
path = "lake/lac0.gpkg"

[[data.lake_abacus.sources]]
source = "custom"
path = "lake/lac0.csv"
lake_id = "lac0"

[[data.lake_inflow.sources]]
source = "custom"
path = "lake_inflow"
station_ids = ["lac0"]

[[data.lake_bathymetry.sources]]
source = "custom"
path = "lake/lac0_bathymetry.tif"

[[data.lake_levels.sources]]
source = "custom"
path = "lake_levels"
station_ids = ["lac0"]

[modflow6.sgrid.vertical]
nlay = 2

[display]
figures = ["lake_stage_sim_obs", "lake_volume_sim_obs", "lake_abacus_comparison"]

[[export__append]]
variables = ["stage", "volume", "gwf_exchange"]
file = "lake_series.csv"
