# Guide "Add a pumping well": one well near the middle of the Nancon catchment,
# steady state. The position and the rate describe no real borehole.
# Save this file in the folder of example 04, next to step1_minimal.toml.
#
#   hmp run guide_wells.toml

base_config = "step1_minimal.toml"

[simulation]
name = "nancon_guide_wells"

# A list written here replaces the inherited one: recharge is written again.
[flow]
active_sinks_sources = ["recharge", "wells"]

# 0.0116 m3/s pumped out, about 1000 m3/day. Negative pumps, positive injects.
[flow.sinks_sources.wells.W1]
flux = -0.0116
description = "About 1000 m3/day"

[flow.sinks_sources.wells.W1.location]
kind = "absolute_xy"
x = 391460.0
y = 6821060.0

# The well marker of the map is drawn from the per-cell well flux.
[simulation.results.budget]
spatial_fields = true

[display]
figures = ["watertable_depth_map", "cross_section", "water_budget"]

[display.overrides.watertable_depth_map]
overlays = ["watershed", "wells", "outlet"]

# West to east through the well.
[display.overrides.cross_section]
orientation = "we"
through = [391460.0, 6821060.0]
