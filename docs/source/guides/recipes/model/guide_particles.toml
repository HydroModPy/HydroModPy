# Guide "Track particles": 300 particles released over the domain at the
# start of step 4, followed forward with MODFLOW 6 PRT for a hundred years.
# Save this file in the folder of example 04.
#
#   hmp run guide_particles.toml

base_config = "step4_transient.toml"

[simulation]
name = "nancon_guide_particles"

[[simulation.process__append]]
id = "prt_main"
type = "transport"
solvers = ["modflow6_prt"]

# The porosity completes the file; it is not a measure of the Nancon aquifer.
[transport.modflow6prt.parameters]
release_zone = "domain"
max_particles = 300
porosity = 0.05
release_times_days = [0.0]
stop_time_days = 36500.0
track_time_step_days = 180.0

[display]
figures = ["particle_tracks", "residence_time_distribution"]

[display.overrides.particle_tracks]
max_tracks = 300
