# Guide "Set the depth of the aquifer and its layers": 60 m of aquifer under
# the ground, four layers that thicken with depth, K that falls with depth.
# The numbers complete the file; they do not describe the Nancon aquifer.
# Save this file in the folder of example 04.
#
#   hmp run guide_depth.toml

base_config = "step1_minimal.toml"

[simulation]
name = "nancon_guide_depth"

[domain.depth_model]
kind = "constant_thickness"
thickness = "60 m"

[modflow6.sgrid.vertical]
genmtd_lay = "decay"
nlay = 4
lay_decay = 2.0

# K of step 1 at the surface, times exp(-d / 20 m), never below 5 %.
[flow.param.K.field_vertical_profile]
mode = "exponential"
characteristic_depth = "20 m"
min_factor = 0.05

[display]
figures = ["cross_section", "parameter_section", "watertable_depth_map"]

[display.overrides.cross_section]
orientation = "sn"

[display.overrides.parameter_section]
orientation = "sn"
