# Guide "Model solute transport and particles": a solute brought by the
# recharge at a concentration of 50, MODFLOW 6 GWT on the flow of step 4.
# Save this file in the folder of example 04.
#
#   hmp run guide_solute.toml

base_config = "step4_transient.toml"

[simulation]
name = "nancon_guide_solute"

[[simulation.process__append]]
id = "gwt_main"
type = "transport"
solvers = ["modflow6"]

[transport.modflow6gwt.parameters]
spc_name = "NO3"
sconc_init = 0.0
sconc_input = 50.0
porosity = 0.05

[display]
figures = ["concentration_map"]
