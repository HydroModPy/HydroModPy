# Recipe 4 of 4: the two stages of recipe 3, written out.
#
# No protocol line: every stage, criterion and regime is spelled out. Start
# from it when a stage needs to say more than the protocol does. Here stage
# two scores the gauge and keeps an eye on the network, which the named
# protocol does not offer.
#
# Save this file beside project.toml in
# examples/projects/04_streamflow_intermittence_in_transient/, then:
#
#   hmp calibrate calibration_staged_by_hand.toml --list-phases
#   hmp calibrate calibration_staged_by_hand.toml

base_config = "project.toml"

[workflow]
mode = "calibration"

[simulation]
name = "recipe_staged_by_hand"

[calibration]
rerun_best_with_outputs = true
persist_iteration_detail = "full"

[calibration.parameters.K]
bounds = [1e-7, 1e-3]

[calibration.parameters.Sy]
bounds = [5e-3, 0.35]

# --- What is compared -------------------------------------------------------

[calibration.outputs.seepage_network]
support = "network"
stream_geometry_path = "nancon_stream_network.gpkg"

[calibration.outputs.hydrograph]
support = "point"
variable = "discharge"
observes = "NANCON"

# --- How it is scored ---------------------------------------------------------

# Eq. 1 of the method, in metres: zero when the simulated network reaches as
# far as the mapped one.
[[calibration.objective_blocks]]
name = "network_extension"
metric = "distance_gap"
uses_outputs = ["seepage_network"]

# The same gap divided by the validity length of the output: a pure number,
# so it adds to the efficiency below as a share.
[[calibration.objective_blocks]]
name = "network_share"
metric = "distance_gap"
uses_outputs = ["seepage_network"]
normalize_cost = true

[[calibration.objective_blocks]]
name = "hydrograph"
metric = "nse_log"
uses_outputs = ["hydrograph"]

# --- Stage one: K against the map, steady state ---------------------------------
#
# regime = "steady" collapses the time window to one period. A steady solve
# carries no storage, so this stage is blind to Sy, which is what makes K
# identifiable without a gauge.
[[calibration.phases]]
name = "steady_conductivity"
description = "K from the mapped network, steady state over the record."
parameters = ["K"]
regime = "steady"
objective_blocks = ["network_extension"]
# A root search on one log parameter. Unwritten, a signed criterion on one
# log parameter would choose it all the same.
method = "bisection"
# The coarse log sweep run before the bisection checks that the gap changes
# sign once. Zero gives the pure bisection of the paper.
method_options = { sweep_points = 7 }

# --- Stage two: Sy against the gauge and the map, transient -----------------------
#
# K is frozen at the value stage one found. The share table sets this stage's
# own balance between two blocks: 0.8 * (1 - NSE_log) + 0.2 * gap / validity
# length.
[[calibration.phases]]
name = "transient_storage"
description = "Sy from the gauge and the network, K frozen, monthly transient."
parameters = ["Sy"]
regime = "transient"
objective_blocks = { hydrograph = 0.8, network_share = 0.2 }
depends_on = "steady_conductivity"
# No method: the hydrograph block is not signed, so the stage gets the
# simplex. --list-phases prints the choice and why.
max_iter = 30
tolerance = 0.05

# 2000 is spin-up. The window holds every block of the stage: the network
# state read, the last month, is stamped at the end of 2002, inside it.
[calibration.phases.scoring_window]
start = "2001-01-01"
