# The catchments of about 20 km2 in a 25 km box around the Nançon, found from the DEM alone.
# It is the second route of the guide "Select catchments in a region", with the DEM read
# from the data folder of the workspace instead of downloaded. The figure of that guide
# is drawn from this file. Save it in the folder of example 04 and start it with
# `hmp run site_selection_area.toml`.

[workflow]
mode = "site_selection"

[site_selection]
selection_id = "nancon_area"
output_root = "nancon_area"

[site_selection.strategy]
principle = "criteria_crossing"
profile = "area_only"
primary_axes = ["area"]

[site_selection.territory]
mode = "bbox"
bbox = [375000.0, 6805000.0, 400000.0, 6830000.0]

[site_selection.input]
mode = "dem_area_light"

[site_selection.dem]
path = "../../data/dem/DEM_armorican_massif.tif"

[site_selection.dem_area_light]
target_area_km2 = 20.0
min_area_km2 = 10.0
max_area_km2 = 30.0
n_basins = 5
max_candidates_before_delineation = 20

[site_selection.criteria.area]
mode = "hard_reject"
hard_min_area_km2 = 10.0
hard_max_area_km2 = 30.0

[site_selection.output]
write_report_html = true
