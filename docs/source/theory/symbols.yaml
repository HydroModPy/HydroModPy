# The symbols of the theory pages. One entry per meaning.
#
# docs/source/_ext/hmp_notation.py renders the notation tables from this file:
# a page shows the entries that list it under `pages`, and theory/notation
# shows every group. The build fails when one symbol carries two meanings,
# unless the two ids are declared under `collisions` and share no page.
#
# Fields: id, symbol (LaTeX, without dollars), meaning, unit, set_by, group,
# pages. Text is reStructuredText inline markup. A page name is relative to
# theory/, unless it starts with a slash.

groups:
  space: Space, time and heads
  domain: The domain and its layers
  ground: Properties of the ground
  fluxes: Fluxes
  cells: Cells and their balance
  solve: The nonlinear solve
  mesh: The mesh
  transfer: From a zone map to the cells
  boussinesq: The Boussinesq solver
  forcing: Forcing and time
  soil: The soil reservoir
  exits: The exits of the aquifer
  descent: The descent and the distance between networks
  scores: Scores

collisions: []

symbols:
  # ------------------------------------------------------------ space
  - id: xy
    symbol: x, y
    meaning: horizontal coordinates
    unit: m
    set_by: "the grid, :doc:`/theory/mesh`"
    group: space
    pages: [notation]
  - id: elevation
    symbol: z
    meaning: elevation, positive up
    unit: m
    set_by: ""
    group: space
    pages: [notation]
  - id: depth
    symbol: d
    meaning: depth below the model top, the variable of the depth factor of a property
    unit: m
    set_by: ""
    group: space
    pages: [notation, groundwater-flow]
  - id: time
    symbol: t
    meaning: time; on the soil page, the day
    unit: s
    set_by: ":toml:`start_datetime|simulation.time.start_datetime` and :toml:`end_datetime|simulation.time.end_datetime` bound the run"
    group: space
    pages: [notation, soil-reservoir]
  - id: period
    symbol: \Delta t
    meaning: length of a stress period, the stretch of time that gets one forcing value
    unit: s
    set_by: ":toml:`step_value|simulation.time.step_value`"
    group: space
    pages: [notation, groundwater-flow, solvers, boussinesq, forcing, time-alignment]
  - id: step
    symbol: \delta t
    meaning: "solver time step, :math:`\\delta t = \\Delta t / n_\\mathrm{sub}`"
    unit: s
    set_by: derived
    group: space
    pages: [notation, groundwater-flow, solvers]
  - id: nsub
    symbol: n_\mathrm{sub}
    meaning: number of solver time steps in a stress period
    unit: "-"
    set_by: ":toml:`substeps_per_period|simulation.time.substeps_per_period`"
    group: space
    pages: [notation, groundwater-flow, solvers]
  - id: head
    symbol: h
    meaning: hydraulic head, measured from a fixed datum
    unit: m
    set_by: solved, not set
    group: space
    pages: [notation, groundwater-flow, exits/head-boundaries, exits/drains-and-et, exits/lakes, exits/simulated-network]
  - id: head0
    symbol: h_0
    meaning: head at the start of the run
    unit: m
    set_by: ":toml:`type|flow.ic.h.type`"
    group: space
    pages: [notation, groundwater-flow]
  - id: ztop
    symbol: z_\mathrm{top}
    meaning: model top, the land surface
    unit: m
    set_by: ":toml:`data.dem`"
    group: space
    pages: [notation, groundwater-flow, solvers, exits/routing-on-the-mesh, exits/drains-and-et, exits/streams-and-mover, exits/simulated-network]
  - id: computational-top
    symbol: z'_\mathrm{top}
    meaning: "computational top MODFLOW 6 reads, :math:`z'_\\mathrm{top} = z_\\mathrm{top} + \\max H_1 - H_1`"
    unit: m
    set_by: derived
    group: space
    pages: [notation, solvers]
  - id: zbot
    symbol: z_\mathrm{bot}
    meaning: bottom of the aquifer
    unit: m
    set_by: ":toml:`kind|domain.depth_model.kind`"
    group: space
    pages: [notation, groundwater-flow]
  - id: thickness
    symbol: H
    meaning: "aquifer thickness, :math:`H = z_\\mathrm{top} - z_\\mathrm{bot}`"
    unit: m
    set_by: ":toml:`kind|domain.depth_model.kind`"
    group: space
    pages: [notation, groundwater-flow, solvers]
  - id: top-layer-thickness
    symbol: H_1
    meaning: thickness of the top layer under the ground
    unit: m
    set_by: ":toml:`nlay|modflow6.sgrid.vertical.nlay`"
    group: space
    pages: [notation, solvers]
  - id: satthick
    symbol: B
    meaning: "saturated thickness, :math:`B(h) = \\min\\bigl(\\max(h - z_\\mathrm{bot}, 0), H\\bigr)`"
    unit: m
    set_by: state, not a field
    group: space
    pages: [notation, groundwater-flow, downslope-distance]
  - id: satthick-mean
    symbol: \bar B
    meaning: saturated thickness averaged by area over the catchment (``d_sat_m``)
    unit: m
    set_by: derived
    group: space
    pages: [notation, downslope-distance]
  - id: area-catchment
    symbol: A
    meaning: catchment area
    unit: m²
    set_by: ":toml:`geographic.catchment`"
    group: space
    pages: [notation, forcing, exits/lakes]
  - id: length-flow
    symbol: L_h
    meaning: horizontal length of a flow path, from a divide to the stream that drains it
    unit: m
    set_by: derived
    group: space
    pages: [groundwater-flow]

