    set_by: "derived from the pour point"
    group: descent
    pages: [downslope-distance]
  - id: scored-catchment
    symbol: \Omega_o
    meaning: "the catchment scored: the cells whose descent reaches :math:`o`"
    unit: "-"
    set_by: "derived"
    group: descent
    pages: [downslope-distance]
  - id: water-bodies
    symbol: \mathcal{E}
    meaning: "water bodies: lake cells and other cells whose surface water is an input"
    unit: "-"
    set_by: "derived"
    group: descent
    pages: [downslope-distance]
  - id: weight
    symbol: \mu(n)
    meaning: "weight of a cell in a mean: 1, or its area"
    unit: "1 or m²"
    set_by: ":toml:`weighting|calibration.outputs.<name>.weighting`"
    group: descent
    pages: [downslope-distance]
  - id: unreachable
    symbol: f_{so}, f_{os}
    meaning: "share of a support whose descent never meets its target (``frac_unreachable_so``, ``frac_unreachable_os``)"
    unit: "-"
    set_by: "bound on :math:`f_{so}`: :toml:`max_unreachable_fraction|calibration.outputs.<name>.max_unreachable_fraction`"
    group: descent
    pages: [downslope-distance]
  - id: position-accuracy
    symbol: \sigma_o
    meaning: "positional accuracy of the mapped network"
    unit: "m"
    set_by: ":toml:`observed_position_accuracy|calibration.outputs.<name>.observed_position_accuracy`"
    group: descent
    pages: [downslope-distance]
  - id: snap-radius
    symbol: r_s
    meaning: "largest distance between a stream head and the cell it lands on"
    unit: "m"
    set_by: ":toml:`heads_snap_radius|calibration.outputs.<name>.heads_snap_radius`"
    group: descent
    pages: [downslope-distance]
  - id: head-area
    symbol: A_{d,\min}
    meaning: "drained area a cell needs before a head may land on it"
    unit: "km²"
    set_by: ":toml:`heads_min_drained_area_km2|calibration.outputs.<name>.heads_min_drained_area_km2`"
    group: descent
    pages: [downslope-distance]

  # ------------------------------------------------------------ scores
  - id: rmse
    symbol: \mathrm{RMSE}
    meaning: root-mean-square error
    unit: that of the series
    set_by: "``rmse``"
    group: scores
    pages: [notation]
  - id: mae
    symbol: \mathrm{MAE}
    meaning: mean absolute error
    unit: that of the series
    set_by: "``mae``"
    group: scores
    pages: [notation]
  - id: nse
    symbol: \mathrm{NSE}
    meaning: Nash-Sutcliffe efficiency
    unit: "-"
    set_by: "``nse``"
    group: scores
    pages: [notation]
  - id: kge
    symbol: \mathrm{KGE}
    meaning: Kling-Gupta efficiency
    unit: "-"
    set_by: "``kge``"
    group: scores
    pages: [notation]
  - id: nselog
    symbol: \mathrm{NSE}_{\log}
