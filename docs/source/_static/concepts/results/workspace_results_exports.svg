<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Run directory, index and reading paths</title>
  <desc id="desc">Diagram showing that a run directory on disk is the source of truth, that the DuckDB index is rebuilt from it, and which API reads each artefact.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#314d63"/>
    </marker>
    <style>
      .bg { fill: #f7f7f3; }
      .frame { fill: #ffffff; stroke: #b9c1bd; stroke-width: 2; rx: 18; }
      .store { fill: #eaf2fb; stroke: #5d7d9c; stroke-width: 2; rx: 16; }
      .index { fill: #e7f0dc; stroke: #6f8b5d; stroke-width: 2; rx: 16; }
      .api { fill: #fff3e2; stroke: #b78642; stroke-width: 2; rx: 16; }
      .export { fill: #f1e7ef; stroke: #8c6c8a; stroke-width: 2; rx: 16; }
      .title { font: 700 26px Georgia, serif; fill: #22313a; }
      .label { font: 700 17px Georgia, serif; fill: #22313a; }
      .small { font: 13px Georgia, serif; fill: #43515a; }
      .mono { font: 13px Consolas, monospace; fill: #2e3d47; }
      .arrow { stroke: #314d63; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .rule { font: italic 15px Georgia, serif; fill: #43515a; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text x="48" y="52" class="title">Disk is the truth, the index is rebuilt from it</text>

  <rect x="48" y="80" width="452" height="452" class="frame"/>
  <text x="76" y="116" class="mono">runs/&lt;name&gt;/</text>
  <text x="76" y="140" class="small">one directory per run, named after the run</text>

  <rect x="76" y="160" width="396" height="64" class="store"/>
  <text x="98" y="188" class="mono">fields.zarr/</text>
  <text x="98" y="210" class="small">head, mesh, forcings, derived arrays</text>

  <rect x="76" y="238" width="396" height="64" class="store"/>
  <text x="98" y="266" class="mono">tables.parquet/</text>
  <text x="98" y="288" class="small">metrics, parameters, budgets, timeseries</text>

  <rect x="76" y="316" width="396" height="64" class="store"/>
  <text x="98" y="344" class="mono">config.toml  provenance.json</text>
  <text x="98" y="366" class="small">frozen configuration, versions, solver binary</text>

  <rect x="76" y="394" width="396" height="64" class="store"/>
  <text x="98" y="422" class="mono">manifest.json</text>
  <text x="98" y="444" class="small">seal written last; absent means unfinished</text>

  <rect x="76" y="472" width="396" height="44" class="store"/>
  <text x="98" y="500" class="mono">figures/  annotations.json</text>

  <rect x="560" y="80" width="272" height="118" class="index"/>
  <text x="584" y="116" class="mono">.hmp/index.duckdb</text>
  <text x="584" y="142" class="small">query index: list, filter, rank</text>
  <text x="584" y="166" class="small">disposable, never the truth</text>

  <path class="arrow" d="M500,136 C528,136 532,136 554,136"/>
  <text x="560" y="230" class="mono">hmp catalog reindex</text>
  <text x="560" y="252" class="small">rebuilds every row from manifest.json</text>
  <text x="560" y="272" class="small">and from sessions/*/session.json</text>
  <path class="arrow" d="M696,204 L696,222"/>

  <rect x="560" y="300" width="272" height="106" class="api"/>
  <text x="584" y="334" class="label">Read</text>
  <text x="584" y="360" class="mono">hmp.read(run, var)</text>
  <text x="584" y="384" class="mono">pandas.read_parquet(...)</text>

  <rect x="560" y="428" width="272" height="112" class="api"/>
  <text x="584" y="462" class="label">Rebuilt at read time</text>
  <text x="584" y="488" class="small">watertable_elevation, watertable_depth,</text>
  <text x="584" y="510" class="small">seepage_mask, outflow_drain</text>
  <text x="584" y="530" class="small">computed on the fly, never stored</text>

  <rect x="888" y="300" width="264" height="106" class="export"/>
  <text x="912" y="334" class="label">share/</text>
  <text x="912" y="360" class="small">CSV, NetCDF, GeoTIFF, VTU,</text>
  <text x="912" y="384" class="small">GeoPackage, reports, .hmp packages</text>

  <path class="arrow" d="M836,352 C858,352 866,352 882,352"/>
  <path class="arrow" d="M474,268 C516,268 524,320 554,340"/>

  <text x="48" y="580" class="rule">Rule of thumb: read the run directory directly when in doubt. The index only answers "which runs exist".</text>
</svg>
