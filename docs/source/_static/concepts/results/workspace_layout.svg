<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HydroModPy workspace layout</title>
  <desc id="desc">Diagram showing a workspace holding a shared data cache and projects, and one project holding its runs, sessions, share and internal directories.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344b5b"/>
    </marker>
    <style>
      .bg { fill: #f7f8f4; }
      .workspace { fill: #ffffff; stroke: #7d8c83; stroke-width: 3; rx: 24; }
      .project { fill: #ffffff; stroke: #7d8c83; stroke-width: 2; rx: 20; }
      .folder { fill: #e9f1dc; stroke: #70885d; stroke-width: 2; rx: 16; }
      .authored { fill: #eaf2fb; stroke: #5d7d9c; stroke-width: 2; rx: 16; }
      .run { fill: #fff1dd; stroke: #b5843e; stroke-width: 2; rx: 16; }
      .internal { fill: #f1e8f1; stroke: #846b86; stroke-width: 2; rx: 16; }
      .title { font: 700 26px Georgia, serif; fill: #22313a; }
      .label { font: 700 17px Georgia, serif; fill: #22313a; }
      .small { font: 13px Georgia, serif; fill: #43515a; }
      .mono { font: 13px Consolas, monospace; fill: #2e3d47; }
      .arrow { stroke: #344b5b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .rule { font: italic 15px Georgia, serif; fill: #43515a; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text x="48" y="52" class="title">Workspace holds inputs, the project holds its runs</text>

  <rect x="48" y="76" width="336" height="452" class="workspace"/>
  <text x="76" y="112" class="mono">&lt;workspace&gt;/</text>
  <text x="76" y="136" class="small">shared area for cached input data</text>

  <rect x="76" y="158" width="280" height="88" class="authored"/>
  <text x="98" y="186" class="mono">workspace.toml</text>
  <text x="98" y="210" class="small">name, contact, licence,</text>
  <text x="98" y="230" class="small">geographic scope, conventions</text>

  <rect x="76" y="264" width="280" height="112" class="folder"/>
  <text x="98" y="292" class="mono">data/</text>
  <text x="98" y="316" class="small">one folder per variable, plus</text>
  <text x="98" y="336" class="mono">cache.duckdb</text>
  <text x="98" y="358" class="small">shared by every project</text>

  <rect x="76" y="394" width="280" height="76" class="folder"/>
  <text x="98" y="422" class="mono">projects/&lt;name&gt;/</text>
  <text x="98" y="446" class="small">one folder per project</text>

  <path class="arrow" d="M360,432 C400,432 404,300 440,300"/>

  <rect x="452" y="76" width="700" height="452" class="project"/>
  <text x="480" y="112" class="mono">&lt;project&gt;/</text>
  <text x="480" y="136" class="small">everything a project owns, results included</text>

  <rect x="480" y="158" width="316" height="88" class="authored"/>
  <text x="502" y="186" class="mono">project.toml</text>
  <text x="502" y="210" class="small">shared settings, and the marker</text>
  <text x="502" y="230" class="small">that anchors the project root</text>

  <rect x="816" y="158" width="312" height="88" class="authored"/>
  <text x="838" y="186" class="mono">run_*.toml   configs/</text>
  <text x="838" y="210" class="small">run configs, inheriting from</text>
  <text x="838" y="230" class="mono">base_config = "project.toml"</text>

  <rect x="480" y="264" width="316" height="112" class="run"/>
  <text x="502" y="292" class="mono">runs/&lt;name&gt;/</text>
  <text x="502" y="316" class="small">one directory per run: fields.zarr,</text>
  <text x="502" y="336" class="small">tables.parquet, config.toml,</text>
  <text x="502" y="356" class="small">manifest.json, provenance.json</text>

  <rect x="816" y="264" width="312" height="112" class="run"/>
  <text x="838" y="292" class="mono">sessions/&lt;name&gt;/</text>
  <text x="838" y="316" class="small">calibration and spin-up sessions:</text>
  <text x="838" y="336" class="mono">session.json   trials.jsonl</text>

  <rect x="480" y="394" width="316" height="94" class="internal"/>
  <text x="502" y="422" class="mono">share/</text>
  <text x="502" y="446" class="small">on-demand exports, HTML reports,</text>
  <text x="502" y="466" class="small">portable .hmp packages</text>

  <rect x="816" y="394" width="312" height="94" class="internal"/>
  <text x="838" y="422" class="mono">.hmp/</text>
  <text x="838" y="446" class="small">disposable internals: index.duckdb,</text>
  <text x="838" y="466" class="small">logs, checkpoints, scratch, trash</text>

  <text x="48" y="576" class="rule">Rule of thumb: edit the TOMLs, treat data/ and .hmp/ as regenerable, and read runs/ directly. Only runs/ and sessions/ hold results.</text>
</svg>
