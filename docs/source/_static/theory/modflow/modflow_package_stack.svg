<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HydroModPy to MODFLOW package stack</title>
  <desc id="desc">Diagram showing how HydroModPy flow concepts are translated into common MODFLOW package families and outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344b5b"/>
    </marker>
    <style>
      .bg { fill: #f7f8f4; }
      .input { fill: #e8f0de; stroke: #71885e; stroke-width: 2; rx: 16; }
      .adapter { fill: #ffffff; stroke: #9aa7a1; stroke-width: 2; rx: 18; }
      .pkg { fill: #eaf2fb; stroke: #5c7f9e; stroke-width: 2; rx: 16; }
      .out { fill: #fff0dd; stroke: #b5843e; stroke-width: 2; rx: 16; }
      .title { font: 700 26px Georgia, serif; fill: #22313a; }
      .label { font: 700 17px Georgia, serif; fill: #22313a; }
      .small { font: 14px Georgia, serif; fill: #43515a; }
      .mono { font: 13px Consolas, monospace; fill: #2e3d47; }
      .arrow { stroke: #344b5b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620"/>
  <text x="48" y="56" class="title">From HydroModPy flow contract to MODFLOW packages</text>

  <rect x="58" y="112" width="260" height="392" class="input"/>
  <text x="88" y="148" class="label">HydroModPy flow contract</text>
  <text x="88" y="184" class="mono">[simulation.time]</text>
  <text x="88" y="220" class="mono">mesh / active cells</text>
  <text x="88" y="256" class="mono">initial heads</text>
  <text x="88" y="292" class="mono">K, Sy, Ss, vka</text>
  <text x="88" y="328" class="mono">recharge, etp</text>
  <text x="88" y="364" class="mono">drainage, CHD, wells</text>
  <text x="88" y="400" class="mono">solver runtime knobs</text>
  <text x="88" y="452" class="small">Solver-agnostic intent</text>

  <path class="arrow" d="M330,310 C384,310 396,310 448,310"/>

  <rect x="460" y="234" width="250" height="152" class="adapter"/>
  <text x="490" y="270" class="label">Backend adapter</text>
  <text x="490" y="304" class="small">unit conversion</text>
  <text x="490" y="330" class="small">cell mapping</text>
  <text x="490" y="356" class="small">stress-period assembly</text>

  <path class="arrow" d="M722,310 C760,310 762,158 800,158"/>
  <path class="arrow" d="M722,310 C760,310 762,244 800,244"/>
  <path class="arrow" d="M722,310 C760,310 762,330 800,330"/>
  <path class="arrow" d="M722,310 C760,310 762,416 800,416"/>
  <path class="arrow" d="M722,310 C760,310 762,502 800,502"/>

  <rect x="812" y="112" width="170" height="72" class="pkg"/>
  <text x="840" y="142" class="label">Time</text>
  <text x="840" y="166" class="mono">TDIS / DIS</text>

  <rect x="812" y="198" width="170" height="72" class="pkg"/>
  <text x="840" y="228" class="label">Geometry</text>
  <text x="840" y="252" class="mono">DISV / DIS</text>

  <rect x="812" y="284" width="170" height="72" class="pkg"/>
  <text x="840" y="314" class="label">Properties</text>
  <text x="840" y="338" class="mono">NPF / UPW</text>

  <rect x="812" y="370" width="170" height="72" class="pkg"/>
  <text x="840" y="400" class="label">Storage</text>
  <text x="840" y="424" class="mono">STO / UPW</text>

  <rect x="812" y="456" width="170" height="72" class="pkg"/>
  <text x="840" y="486" class="label">Stresses</text>
  <text x="840" y="510" class="mono">RCH EVT DRN CHD</text>

  <path class="arrow" d="M992,320 C1028,320 1034,320 1070,320"/>

  <rect x="1080" y="238" width="90" height="164" class="out"/>
  <text x="1098" y="276" class="label">OC</text>
  <text x="1098" y="310" class="small">head</text>
  <text x="1098" y="338" class="small">budget</text>
  <text x="1098" y="366" class="small">derived</text>
</svg>
