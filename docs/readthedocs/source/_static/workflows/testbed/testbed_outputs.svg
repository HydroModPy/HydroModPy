<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">HydroModPy testbed evidence output tree</title>
  <desc id="desc">A testbed output directory contains generated child configurations, plan, cases, metrics, manifest, and report files read in evidence order.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4858"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .folder { fill: #eef4f8; stroke: #3d5a80; stroke-width: 1.4; rx: 7; }
      .file { fill: #f9fbfd; stroke: #78909c; stroke-width: 1.2; rx: 5; }
      .step { fill: #f6fbf8; stroke: #2d6a4f; stroke-width: 1.6; rx: 8; }
      .title { font: 700 20px Arial, sans-serif; fill: #102a43; }
      .label { font: 700 15px Arial, sans-serif; fill: #102a43; }
      .small { font: 13px Arial, sans-serif; fill: #334e68; }
      .mono { font: 13px Consolas, "Courier New", monospace; fill: #243b53; }
      .arrow { stroke: #2f4858; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="960" height="440"/>
  <text class="title" x="36" y="42">Testbed outputs are evidence, not hidden runtime state</text>
  <text class="small" x="36" y="66">Read generated configs first, then status tables, then metrics, then the manifest and report.</text>

  <rect class="panel" x="34" y="94" width="410" height="306" rx="12"/>
  <text class="label" x="58" y="126">Output folder</text>

  <rect class="folder" x="62" y="150" width="320" height="36" rx="7"/>
  <text class="mono" x="82" y="173">outputs/&lt;testbed_id&gt;/</text>

  <rect class="folder" x="88" y="204" width="292" height="34" rx="7"/>
  <text class="mono" x="108" y="226">_generated_configs/</text>

  <rect class="file" x="116" y="252" width="238" height="28" rx="5"/>
  <text class="mono" x="134" y="272">coarse.toml, low_k.toml</text>

  <rect class="file" x="88" y="296" width="292" height="28" rx="5"/>
  <text class="mono" x="108" y="316">testbed_cases.csv</text>

  <rect class="file" x="88" y="334" width="292" height="28" rx="5"/>
  <text class="mono" x="108" y="354">testbed_metrics.csv</text>

  <rect class="file" x="88" y="372" width="292" height="28" rx="5"/>
  <text class="mono" x="108" y="392">testbed_manifest.json, report.md</text>

  <rect class="panel" x="498" y="94" width="428" height="306" rx="12"/>
  <text class="label" x="522" y="126">Recommended reading order</text>

  <rect class="step" x="530" y="154" width="326" height="46" rx="8"/>
  <text class="label" x="552" y="183">1. Generated configs</text>
  <text class="small" x="552" y="198">Exact variant payloads after overlay merge</text>

  <rect class="step" x="530" y="222" width="326" height="46" rx="8"/>
  <text class="label" x="552" y="251">2. Cases CSV</text>
  <text class="small" x="552" y="266">Status, child config path, child artifacts</text>

  <rect class="step" x="530" y="290" width="326" height="46" rx="8"/>
  <text class="label" x="552" y="319">3. Metrics CSV</text>
  <text class="small" x="552" y="334">Configured indicators or flattened scalar values</text>

  <rect class="step" x="530" y="358" width="326" height="46" rx="8"/>
  <text class="label" x="552" y="387">4. Manifest and report</text>
  <text class="small" x="552" y="402">Machine contract plus compact human summary</text>

  <path class="arrow" d="M382 222 C442 222 458 174 520 174"/>
  <path class="arrow" d="M382 310 C442 310 458 245 520 245"/>
  <path class="arrow" d="M382 348 C442 348 458 313 520 313"/>
  <path class="arrow" d="M382 386 C442 386 458 381 520 381"/>
</svg>
